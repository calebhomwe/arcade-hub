name: audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # puppeteer's postinstall downloads the Chrome build it is pinned to
      - run: npm ci

      - run: npm run audit
