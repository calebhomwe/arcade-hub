<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241552">
<title>Block Blast</title>
<style>
:root{--bg1:#2c1a66;--bg2:#0e0a2a;--ink:#fff;--muted:rgba(255,255,255,.62);--panel:rgba(255,255,255,.08);--cell:rgba(255,255,255,.075);--accent:#ffd23f;--accent2:#ff7ab8;--bs:min(calc(100vw - 24px),calc(100vh - 372px),460px);--pz-accent:#ff7a59;--pz-accent2:#ffc247}
@supports (height:100dvh){:root{--bs:min(calc(100vw - 24px),calc(100dvh - 372px),460px)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--pz-text,system-ui,-apple-system,'Segoe UI',sans-serif);color:var(--ink);background:radial-gradient(120% 70% at 50% -8%,var(--bg1),var(--bg2) 78%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
/* top bar */
#top{width:min(100%,480px);display:flex;align-items:center;gap:8px;min-height:48px;padding-right:52px}
#back{display:inline-flex;align-items:center;min-height:44px;padding:0 12px 0 4px;color:var(--muted);text-decoration:none;font:700 15px/1 var(--pz-display,sans-serif)}
#modeName{flex:1;text-align:center;font:600 16px/1.1 var(--pz-display,sans-serif);color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .pz-chip{--pz-chip-core:var(--bg2)}
/* hud */
#hud{width:var(--bs);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:66px}
.scorebox small{display:block;font:700 13px/1 var(--pz-display,sans-serif);letter-spacing:.14em;color:var(--muted)}
.scorebox b{display:block;font:700 44px/1 var(--pz-display,sans-serif);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.25);transform-origin:left bottom}
.scorebox b.bump{animation:bump .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
#best{font:700 15px/1 var(--pz-display,sans-serif);color:var(--accent);display:flex;align-items:center;gap:6px;white-space:nowrap}
#best svg{width:18px;height:18px}
#goal{display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:14px;background:var(--panel);font:700 15px/1.1 var(--pz-display,sans-serif);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15)}
#goal.on{display:flex}
#goal .gi{display:inline-flex;width:22px;height:22px}
#goal.bump{animation:bump .3s ease}
#goal small{font:700 13px/1 var(--pz-text,sans-serif);color:var(--muted)}
#meter{display:flex;gap:5px;align-items:center}
#meter i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);transition:transform .25s,background .25s}
#meter i.on{background:radial-gradient(circle at 35% 30%,#ffd9a0,#ff7a3d 60%,#d63b1f);box-shadow:0 0 10px rgba(255,122,61,.7);transform:scale(1.1)}
#meter.full i{animation:throb .8s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.35)}}
/* board */
#stage{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:20px}
#stage.shakeit{will-change:transform}
#praise{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font:700 44px/1 var(--pz-display,sans-serif);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.28),0 0 24px var(--accent);opacity:0;z-index:5}
#praise.go{animation:praise 1s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes praise{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.25) rotate(2deg)}32%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.05)}}
/* tray */
#tray{width:var(--bs);height:116px;display:flex;gap:10px;flex:none;touch-action:none}
.slot{flex:1;min-width:0;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);display:grid;place-items:center;position:relative;touch-action:none;cursor:grab;transition:opacity .2s,transform .2s}
.slot canvas{display:block;pointer-events:none}
.slot.used{opacity:.14;pointer-events:none}
.slot.lift canvas{opacity:.25}
.slot.fresh{animation:slotin .42s cubic-bezier(.2,1.5,.35,1) backwards}
.slot:nth-child(2){animation-delay:.07s}.slot:nth-child(3){animation-delay:.14s}
.slot.hintit{box-shadow:inset 0 0 0 3px var(--accent),0 0 18px var(--accent);animation:pulse 1s ease-in-out infinite}
.slot.sel{box-shadow:inset 0 0 0 3px var(--accent)}
@keyframes slotin{from{transform:translateY(46px) scale(.7);opacity:0}}
@keyframes pulse{50%{transform:scale(1.05)}}
.slot:focus-visible,#board:focus-visible,.tool:focus-visible,.mbtn:focus-visible,.node:focus-visible,.wtab:focus-visible,#back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:none;will-change:transform;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
#ghost.back{transition:transform .18s cubic-bezier(.3,1.4,.5,1),opacity .18s}
/* tools */
#tools{width:var(--bs);display:flex;gap:8px;flex:none}
.tool{flex:1;min-height:52px;border:0;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 3px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:700 13px/1 var(--pz-display,sans-serif);position:relative;touch-action:manipulation}
.tool svg{width:22px;height:22px}
.tool:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.tool[disabled]{opacity:.38}
.tool .n{position:absolute;top:-6px;right:-3px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent);color:#26170a;display:grid;place-items:center;font:700 13px/1 var(--pz-display,sans-serif);box-shadow:0 2px 0 rgba(0,0,0,.25)}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));text-align:center;background:radial-gradient(120% 80% at 50% 0,var(--bg1),var(--bg2));overflow:auto}
.ov.on{display:flex}
.ov.dim{background:rgba(8,5,26,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px}
#logo .row{display:flex;gap:6px}
#logo i{font-style:normal;width:clamp(44px,14vw,60px);height:clamp(44px,14vw,60px);border-radius:16px;display:grid;place-items:center;font:700 clamp(26px,8vw,36px)/1 var(--pz-display,sans-serif);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:bob 2.6s ease-in-out infinite;position:relative}
#logo i::after{content:'';position:absolute;left:12%;right:12%;top:8%;height:36%;border-radius:12px 12px 20px 20px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.05))}
@keyframes bob{50%{transform:translateY(-6px)}}
.tag{font:600 17px/1.3 var(--pz-display,sans-serif);color:var(--muted);max-width:340px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
.mbtn{border:0;cursor:pointer;min-height:72px;border-radius:24px;padding:10px 18px;display:flex;align-items:center;gap:14px;text-align:left;color:#26170a;background:linear-gradient(180deg,var(--m1),var(--m2));box-shadow:0 6px 0 rgba(0,0,0,.28),0 14px 24px rgba(0,0,0,.3);touch-action:manipulation;position:relative;overflow:hidden}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.mbtn svg{flex:none;width:38px;height:38px}
.mbtn b{display:block;font:700 22px/1.05 var(--pz-display,sans-serif)}
.mbtn small{display:block;font:800 14px/1.25 var(--pz-text,sans-serif);opacity:.72;margin-top:3px}
.mbtn.adv{--m1:#ffe27a;--m2:#ffb13d}.mbtn.cls{--m1:#9ff0c2;--m2:#3fcf88}.mbtn.day{--m1:#b7d3ff;--m2:#6f9bff}
.mbtn .badge{position:absolute;top:8px;right:10px;padding:3px 8px;border-radius:999px;background:#ff4d6d;color:#fff;font:700 12px/1 var(--pz-display,sans-serif)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sbtn{border:0;cursor:pointer;min-height:48px;padding:0 20px;border-radius:999px;font:700 16px/1 var(--pz-display,sans-serif);color:var(--ink);background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.sbtn:active{transform:translateY(2px)}
.sbtn.prime{color:#26170a;background:linear-gradient(180deg,#ffe27a,#ffb13d);box-shadow:0 5px 0 rgba(0,0,0,.28)}
/* level select */
#levels h2{font:700 30px/1 var(--pz-display,sans-serif)}
.wtabs{display:flex;gap:8px}
.wtab{border:0;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.12);font:700 15px/1 var(--pz-display,sans-serif);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
.wtab.on{background:#fff;color:#2b1a63}
.wtab.lock{opacity:.55}
.wcard{width:min(360px,100%);border-radius:26px;padding:16px 14px 18px;background:linear-gradient(160deg,var(--w1),var(--w2));box-shadow:0 12px 30px rgba(0,0,0,.35);color:#1d1240}
.wcard h3{font:700 22px/1 var(--pz-display,sans-serif)}
.wcard p{font:800 14px/1.3 var(--pz-text,sans-serif);opacity:.7;margin:3px 0 12px}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.node{border:0;cursor:pointer;aspect-ratio:1;min-height:52px;border-radius:50%;background:#fff;color:#2b1a63;font:700 22px/1 var(--pz-display,sans-serif);position:relative;box-shadow:0 5px 0 rgba(0,0,0,.22);touch-action:manipulation}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node.lock{background:rgba(255,255,255,.4);color:rgba(43,26,99,.5);box-shadow:none;cursor:default}
.node.cur{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 4px #ffd23f,0 5px 0 rgba(0,0,0,.22)}
.node.boss{background:linear-gradient(180deg,#ffd6e0,#ff8fab)}
.node .st{position:absolute;left:0;right:0;bottom:-16px;font:700 13px/1 var(--pz-display,sans-serif);letter-spacing:1px;color:#ffb300;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.node .st.z{color:rgba(0,0,0,.25)}
.stars3{display:flex;gap:6px;justify-content:center;margin:2px 0 6px}
.stars3 svg{width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.stars3 svg.pop{animation:starpop .6s cubic-bezier(.2,1.7,.3,1) backwards}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}}
/* card */
.card{width:min(340px,100%);border-radius:28px;padding:22px 20px 20px;background:linear-gradient(180deg,#fffaf0,#ffeccf);color:#3a2115;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 3px var(--accent)}
.card h2{font:700 34px/1.05 var(--pz-display,sans-serif);color:#e8552f}
.card .big{font:700 52px/1 var(--pz-display,sans-serif);color:#3a2115;font-variant-numeric:tabular-nums}
.card p{font:800 15px/1.4 var(--pz-text,sans-serif);color:#6b4a3a;margin:6px 0}
.card .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.card .stats div{background:rgba(58,33,21,.08);border-radius:14px;padding:8px 4px}
.card .stats b{display:block;font:700 22px/1 var(--pz-display,sans-serif)}
.card .stats small{font:800 12px/1.2 var(--pz-text,sans-serif);color:#6b4a3a}
.card .xp{font:700 16px/1 var(--pz-display,sans-serif);color:#e8552f;margin:4px 0 12px}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .btns .sbtn{color:#3a2115;background:rgba(58,33,21,.1);box-shadow:none}
.card .btns .sbtn.prime{color:#fff;background:linear-gradient(180deg,#ffb648,#ff7a59);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.newbest{display:inline-block;padding:4px 12px;border-radius:999px;background:#ff4d6d;color:#fff;font:700 14px/1 var(--pz-display,sans-serif);animation:pulse .9s ease-in-out infinite}
/* coach */
#coach{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:20;width:min(360px,calc(100vw - 24px));display:none;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:#fff8e6;color:#3a2115;font:800 16px/1.3 var(--pz-text,sans-serif);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 3px var(--accent)}
#coach.on{display:flex}
#coach button{flex:none;min-height:44px;min-width:60px;border:0;border-radius:12px;background:rgba(58,33,21,.12);font:700 15px/1 var(--pz-display,sans-serif);color:#3a2115;cursor:pointer}
#finger{position:fixed;left:0;top:0;width:54px;height:54px;z-index:25;pointer-events:none;display:none}
#finger.on{display:block}
#finger svg{width:100%;height:100%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
#codesOn{position:fixed;left:12px;top:60px;z-index:31;background:#ffd23f;color:#26170a;font:700 12px/1 var(--pz-display,sans-serif);letter-spacing:.14em;padding:6px 10px;border-radius:999px}
#codesOn[hidden]{display:none}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trophies div{text-align:center;padding:8px 2px;border-radius:14px;background:var(--pz-sheet2,#f3ead9);font:800 12px/1.15 var(--pz-text,sans-serif);color:#6f6a86;box-shadow:inset 0 0 0 1.5px var(--pz-line,rgba(0,0,0,.1))}
.trophies div span{display:block;font-size:24px;margin-bottom:3px;filter:grayscale(1);opacity:.4}
.trophies div.got{color:#3a2115}
.trophies div.got span{filter:none;opacity:1}
.bgdrift{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgdrift i{position:absolute;width:38px;height:38px;border-radius:11px;opacity:.28;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-14vh) rotate(200deg)}}
.ov>*:not(.bgdrift){position:relative;z-index:1}
[hidden]{display:none!important}
@media (max-height:640px){#hud{min-height:56px}.scorebox b{font-size:36px}#tray{height:96px}#logo i{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){#logo i,.node.cur,.slot.hintit,#meter.full i,.newbest,.bgdrift i,.slot.fresh,#praise.go,.scorebox b.bump{animation:none!important}#praise.go{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a id="back" href="../index.html" aria-label="Back to the arcade hub">‹ Hub</a><div id="modeName">Block Blast</div></div>
  <div id="hud">
    <div class="scorebox"><small>SCORE</small><b id="score">0</b></div>
    <div id="right">
      <div id="best"></div>
      <div id="goal" aria-live="polite"></div>
      <div id="meter" role="img" aria-label="Bomb meter"></div>
    </div>
  </div>
  <div id="stage"><canvas id="board" role="img" aria-label="Block Blast board, 8 by 8" tabindex="0"></canvas><div id="praise" aria-hidden="true"></div></div>
  <div id="tray" aria-label="Your three blocks"></div>
  <div id="tools">
    <button class="tool" id="btnUndo" aria-label="Undo the last block"><span id="icoUndo"></span>Undo<span class="n" id="nUndo">3</span></button>
    <button class="tool" id="btnSwap" aria-label="Swap for three new blocks"><span id="icoSwap"></span>Swap<span class="n" id="nSwap">2</span></button>
    <button class="tool" id="btnHint" aria-label="Show a good move"><span id="icoHint"></span>Hint</button>
    <button class="tool" id="btnMenu" aria-label="Menu"><span id="icoMenu"></span>Menu</button>
  </div>
</div>
<canvas id="ghost" aria-hidden="true"></canvas>
<div id="finger" aria-hidden="true"></div>
<div id="coach" role="status"><span id="coachTxt"></span><button id="coachBtn">Skip</button></div>
<div id="codesOn" hidden>CODES ON</div>
<div id="live" style="position:absolute;left:-9999px" aria-live="polite"></div>

<div class="ov on" id="title" role="dialog" aria-label="Block Blast">
  <div class="bgdrift" id="drift"></div>
  <div id="logo"></div>
  <div class="tag">Drag blocks onto the board. Fill a row or a column to blast it.</div>
  <div class="menu">
    <button class="mbtn adv" id="mAdv"><span id="icoAdv"></span><span><b>Adventure</b><small id="sAdv">24 levels · earn stars</small></span></button>
    <button class="mbtn cls" id="mCls"><span id="icoCls"></span><span><b>Classic</b><small id="sCls">Play as long as you can</small></span></button>
    <button class="mbtn day" id="mDay"><span id="icoDay"></span><span><b>Daily blocks</b><small id="sDay">Same blocks for everyone today</small></span><span class="badge" id="dayBadge" hidden>NEW</span></button>
  </div>
  <div class="row2" id="titleChip"></div>
</div>

<div class="ov" id="levels" role="dialog" aria-label="Adventure levels">
  <div class="bgdrift"></div>
  <h2>Adventure</h2>
  <div class="wtabs" id="wtabs" role="tablist"></div>
  <div class="wcard" id="wcard"></div>
  <div class="row2"><span id="starTotal" style="font:700 16px var(--pz-display,sans-serif);color:var(--muted)"></span><button class="sbtn" id="lvBack">‹ Back</button></div>
</div>

<div class="ov dim" id="pre" role="dialog" aria-label="Level goal"></div>
<div class="ov dim" id="result" role="dialog" aria-label="Result"></div>

<script src="kit/pz.js"></script>
<script src="kit/bb-core.js"></script>
<script>
(function () {
'use strict';
const BB = window.BBCore, PZ = window.PZ, SDK = window.ArcadeSDK || null, N = BB.N;
const $ = id => document.getElementById(id);
const LS = PZ.store, RM = PZ.RM;
const scene = (sc, extra) => { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} };
const cheated = () => !!(SDK && SDK.cheated);
const say = t => { const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };

/* ------------------------------------------------------------ themes: the "looks" you unlock by playing */
const THEMES = [
  { id: 'jelly', name: 'Jelly Night', level: 1, colors: ['#2c1a66', '#ff6b9a', '#ffd23f'], bg: ['#2c1a66', '#0e0a2a'], ink: '#ffffff', muted: 'rgba(255,255,255,.62)', panel: 'rgba(255,255,255,.08)', cell: 'rgba(255,255,255,.075)', accent: '#ffd23f', style: 'jelly', tint: '#241552',
    blocks: ['#ff6b9a', '#ff9a4d', '#ffd23f', '#5ee08a', '#4cc9f0', '#8b7bff', '#ff6b6b', '#c77dff'] },
  { id: 'candy', name: 'Candy Shop', level: 2, colors: ['#ffe3ee', '#ff8fb1', '#8fd3ff'], bg: ['#ffe9f2', '#ffc9de'], ink: '#4a1f45', muted: 'rgba(74,31,69,.62)', panel: 'rgba(255,255,255,.62)', cell: 'rgba(74,31,69,.08)', accent: '#e8408a', style: 'jelly', tint: '#ffd6e6',
    blocks: ['#ff8fb1', '#ffb37a', '#ffd95e', '#7fe0a8', '#7cc8ff', '#b39dff', '#ff9a9a', '#e59cff'] },
  { id: 'ocean', name: 'Ocean Deep', level: 4, colors: ['#053b52', '#4ee0b8', '#ff7a6b'], bg: ['#0a6a86', '#031f30'], ink: '#eafcff', muted: 'rgba(234,252,255,.66)', panel: 'rgba(255,255,255,.09)', cell: 'rgba(255,255,255,.08)', accent: '#7ff0e2', style: 'jelly', tint: '#083c52',
    blocks: ['#ff7a6b', '#ffb347', '#ffe066', '#4ee0b8', '#4dc3ff', '#7c8cff', '#ff8fab', '#9be7ff'] },

  const st = BB.starsFor(def, movesLeft), was = adv.stars[def.i]; adv.stars[def.i] = Math.max(was, st); if (!cheated()) { saveAdv(); LS.set('blockblast_clears', lifeClears); }
  const xp = 25 + st * 12 + (was ? 0 : 20); prof.count('advwin'); if (st === 3) prof.count('star3'); if (!cheated()) prof.addXp(xp, def.name, true);
  if (def.n === BB.PER_WORLD - 1) awardBadge('w' + (def.w + 1)); if (totalStars() >= 30) awardBadge('star10');
  PZ.snd.play('win'); PZ.fx.confetti(60); scene('over', { score, level: def.i + 1, stars: st });
  const nextOk = def.i + 1 < BB.LEVELS && (BB.levelDef(def.i + 1).w === def.w || worldOpen(def.w + 1));
  showCard('<h2>Level clear!</h2><div class="stars3" id="st3"></div><p>' + def.name + ' · ' + (movesLeft) + ' blocks to spare</p><div class="stats"><div><b>' + score + '</b><small>score</small></div><div><b>' + linesDone + '</b><small>lines</small></div><div><b>' + placed + '</b><small>blocks</small></div></div><div class="xp">+' + xp + ' XP' + (was ? '' : ' · first clear bonus') + '</div>' +
    '<div class="btns"><button class="sbtn" data-a="menu">Levels</button><button class="sbtn" data-a="again">Replay</button>' + (nextOk ? '<button class="sbtn prime" data-a="next">Next level</button>' : '') + '</div>', a => {
      if (a === 'next') startLevel(def.i + 1); else if (a === 'again') startLevel(def.i); else openLevels();
    });
  const box = $('st3'); for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.innerHTML = ICON.star(k < st); const sv = sp.firstChild; if (k < st) { sv.classList.add('pop'); sv.style.animationDelay = (0.25 + k * 0.28) + 's'; setTimeout(() => PZ.snd.play('merge', 4 + k * 2), 250 + k * 280); } box.appendChild(sv); }
  if (!was && !cheated() && def.i + 1 < BB.LEVELS) setTimeout(() => PZ.toast('<i>🔓</i><span>Level ' + (def.i + 2) + ' unlocked</span>'), 900);
}
function failLevel(why) {
  if (over) return; over = true; playing = false; PZ.snd.play('lose'); scene('over', { score, level: def.i + 1, stars: 0 });
  const cur = def.type === 'lines' ? linesDone : def.type === 'gems' ? gemsGot : score;
  if (!cheated()) prof.addXp(8, 'good try', true);
  showCard('<h2>So close!</h2><p>' + why + '.</p><div class="big">' + Math.min(cur, def.goal) + '<span style="font-size:26px"> / ' + def.goal + ' ' + (def.type === 'lines' ? 'lines' : def.type === 'gems' ? 'gems' : 'points') + '</span></div><p>Tip: ' + (def.type === 'gems' ? 'gems sit inside blocks. Clear the line that holds one.' : def.type === 'lines' ? 'Line up two or more rows before you finish them.' : 'Clear two lines at once for big points.') + '</p><div class="btns"><button class="sbtn" data-a="menu">Levels</button>' + (history.length && undoLeft > 0 ? '<button class="sbtn" data-a="undo">Undo move</button>' : '') + '<button class="sbtn prime" data-a="again">Try again</button></div>', a => {
    if (a === 'again') startLevel(def.i); else if (a === 'undo') { undo(); show(null); over = false; playing = true; } else openLevels();
  });
}
function undo() {
  if (!history.length || undoLeft <= 0 || (over && !$('result').classList.contains('on'))) return;
  const s = history.pop(); undoLeft--; restore(s); over = false; playing = true; fxClear = []; fxPlace = []; hintMove = null; PZ.snd.play('tap');
  shown = score; updateHud(); renderTray(); kick(); scene('play', { score });
}
$('btnUndo').addEventListener('click', () => { if (!playing && !over) return; undo(); });
$('btnSwap').addEventListener('click', () => { if (!playing || over || swapLeft <= 0 || pausedByUI) return; history.push(snap()); swapLeft--; tray = makeTray(false); PZ.snd.play('unlock'); clearHint(); updateHud(); renderTray(); afterMove(); });
$('btnHint').addEventListener('click', () => { if (playing && !over) { const t = showHint(); say(t); } });
$('btnMenu').addEventListener('click', () => { PZ.snd.play('tap'); if (SDK && SDK.showMenu) { try { SDK.showMenu(); return; } catch (e) {} } toTitle(); });

/* ------------------------------------------------------------ hint */
function clearHint() { hintMove = null; document.querySelectorAll('.slot.hintit').forEach(s => s.classList.remove('hintit')); }
function showHint() {
  if (!playing || over) return 'Press Play first.';
  const want = adv_active() && def.type === 'gems' ? (res => { let g = 0; for (const i of res.cleared) if (gems[i]) g++; return g * 35; }) : (adv_active() ? (res => res.lines * 30) : null);
  const b = BB.bestMove(grid, tray, want); if (!b) return 'Nothing fits. Try Undo or Swap.';
  clearHint(); hintMove = { i: b.i, r: b.r, c: b.c }; const sl = document.querySelectorAll('.slot')[b.i]; if (sl) sl.classList.add('hintit'); kick(); PZ.snd.play('pick');
  setTimeout(() => { if (hintMove && hintMove.i === b.i) clearHint(); }, 6000);
  return 'Try block ' + (b.i + 1) + ' at row ' + (b.r + 1) + ', column ' + (b.c + 1) + (b.lines ? ': it clears ' + b.lines + (b.lines > 1 ? ' lines.' : ' line.') : ': it keeps the board open.') + ' Drag it to the glowing outline.';
}

/* ------------------------------------------------------------ badges */
function awardBadge(id) {
  const b = BADGES.find(x => x[0] === id); if (!b || ach.includes(id) || cheated()) return; ach.push(id); LS.set('blockblast_ach', ach);
  setTimeout(() => { PZ.toast('<i>' + b[1] + '</i><span><b>Trophy!</b> ' + b[2] + ' · ' + b[3] + '</span>'); PZ.snd.play('coin'); }, 500);
  try { SDK && SDK.profile && SDK.profile.achievement('bb-' + id, { title: b[2], desc: b[3], tier: 'silver' }); } catch (e) {}
}

/* ------------------------------------------------------------ screens */
function show(id) { ['title', 'levels', 'pre', 'result'].forEach(k => $(k).classList.toggle('on', k === id)); }
function showCard(html, cb) {
  const r = $('result'); r.innerHTML = '<div class="card">' + html + '</div>'; show('result');
  r.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { PZ.snd.play('tap'); cb(b.dataset.a); }));
  const f = r.querySelector('.prime'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
}
function drift(el) { el.innerHTML = ''; if (RM()) return; for (let i = 0; i < 9; i++) { const d = document.createElement('i'); d.style.left = (i * 11.5 + (i % 3) * 3) + '%'; d.style.background = THEMES[0].blocks[i % 8]; d.style.animationDuration = (14 + (i * 3) % 9) + 's'; d.style.animationDelay = (-i * 2.3) + 's'; d.style.width = d.style.height = (26 + (i % 4) * 9) + 'px'; el.appendChild(d); } }
function buildLogo() {
  const w = ['BLOCK', 'BLAST'], el = $('logo'); el.innerHTML = '';
  w.forEach((word, wi) => { const row = document.createElement('div'); row.className = 'row'; [...word].forEach((ch, k) => { const i = document.createElement('i'); i.textContent = ch; const col = THEMES[0].blocks[(wi * 5 + k * 3 + 1) % 8]; i.style.background = 'linear-gradient(180deg,' + shade(col, .22) + ',' + col + ' 60%,' + shade(col, -.15) + ')'; i.style.boxShadow = '0 6px 0 ' + shade(col, -.42) + ',0 12px 18px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.3)'; i.style.animationDelay = (-(wi * 5 + k) * 0.22) + 's'; row.appendChild(i); }); el.appendChild(row); });
}
function toTitle() {
  playing = false; over = false; scene('title'); refreshTitle(); show('title'); try { $('mCls').focus({ preventScroll: true }); } catch (e) {}
}
function refreshTitle() {
  $('sAdv').textContent = totalStars() ? 'Level ' + Math.min(BB.LEVELS, firstOpenLevel() + 1) + ' · ' + totalStars() + '/' + BB.LEVELS * 3 + ' stars' : '24 levels · win stars';
  const b = LS.get('blockblast_best', 0) | 0; $('sCls').textContent = b ? 'Best ' + b + ' · play as long as you can' : 'Play as long as you can';
  const db = LS.get('blockblast_daily_' + todayKey(), 0) | 0; $('sDay').textContent = db ? "Today's best " + db : 'Same blocks for everyone today'; $('dayBadge').hidden = !!db;
  const tc = $('titleChip'); if (!tc.firstChild) { prof.chip(tc); const h = document.createElement('button'); h.className = 'sbtn'; h.textContent = 'How to play'; h.addEventListener('click', () => { PZ.snd.play('tap'); newRun('classic', null, { tutorial: true }); }); tc.appendChild(h); }
}
function firstOpenLevel() { for (let i = 0; i < BB.LEVELS; i++) if (!adv.stars[i]) return i; return BB.LEVELS - 1; }
function openLevels(w) {
  scene('title'); if (w == null) w = BB.levelDef(firstOpenLevel()).w; show('levels'); renderLevels(w);
}
function renderLevels(w) {
  const tabs = $('wtabs'); tabs.innerHTML = '';
  BB.WORLDS.forEach((W, k) => { const b = document.createElement('button'); b.className = 'wtab' + (k === w ? ' on' : '') + (worldOpen(k) ? '' : ' lock'); b.textContent = (worldOpen(k) ? '' : '🔒 ') + (k + 1); b.setAttribute('role', 'tab'); b.setAttribute('aria-label', W.name + (worldOpen(k) ? '' : ', locked'));
    b.addEventListener('click', () => { PZ.snd.play(worldOpen(k) ? 'tap' : 'error'); if (worldOpen(k)) renderLevels(k); else PZ.toast('<i>🔒</i><span>Earn <b>' + ((k === 1 ? 10 : 28) - totalStars()) + ' more stars</b> to open ' + W.name + '</span>'); }); tabs.appendChild(b); });
  const W = BB.WORLDS[w], card = $('wcard'); card.style.setProperty('--w1', W.sky[0]); card.style.setProperty('--w2', W.sky[1]);
  let h = '<h3>' + W.name + '</h3><p>' + W.sub + '</p><div class="nodes">';
  for (let n = 0; n < BB.PER_WORLD; n++) {
    const i = w * BB.PER_WORLD + n, ok = worldOpen(w) && unlockedLevel(i), st = adv.stars[i], cur = ok && !st && i === firstOpenLevel();
    h += '<button class="node' + (ok ? '' : ' lock') + (cur ? ' cur' : '') + (n === BB.PER_WORLD - 1 ? ' boss' : '') + '" data-i="' + i + '" aria-label="Level ' + (n + 1) + (ok ? (st ? ', ' + st + ' stars' : ', new') : ', locked') + '">' + (ok ? (n + 1) : '🔒') + (ok ? '<span class="st' + (st ? '' : ' z') + '">' + (st ? '★'.repeat(st) : '☆☆☆') + '</span>' : '') + '</button>';
  }
  card.innerHTML = h + '</div>';
  card.querySelectorAll('.node').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; if (b.classList.contains('lock')) { PZ.snd.play('error'); return; } PZ.snd.play('tap'); preLevel(i); }));
  $('starTotal').textContent = totalStars() + ' / ' + BB.LEVELS * 3 + ' stars';
}
function preLevel(i) {
  const d = BB.levelDef(i), what = d.type === 'lines' ? 'Clear <b>' + d.goal + ' lines</b>' : d.type === 'gems' ? 'Collect <b>' + d.goal + ' gems</b>' : 'Score <b>' + d.goal + ' points</b>';
  const ic = d.type === 'gems' ? ICON.gem : d.type === 'lines' ? ICON.line : ICON.trophy;
  const r = $('pre'); r.innerHTML = '<div class="card"><h2>' + d.name + (d.boss ? ' · Boss' : '') + '</h2><div style="width:64px;height:64px;margin:6px auto;background:rgba(58,33,21,.12);border-radius:20px;display:grid;place-items:center"><div style="width:40px;height:40px">' + ic.replace('stroke="#fff"', 'stroke="#3a2115"') + '</div></div><p style="font-size:18px">' + what + ' using <b>' + d.moves + ' blocks</b>.</p>' +
    (d.type === 'gems' ? '<p>Gems hide inside blocks. Clear the row or column to collect them.</p>' : '') + '<p>' + ICON.star(true).replace('<svg', '<svg style="width:22px;height:22px;vertical-align:-5px"') + ' Finish with blocks to spare for more stars.</p><div class="btns"><button class="sbtn" data-a="back">Back</button><button class="sbtn prime" data-a="go">Play</button></div></div>';
  show('pre'); r.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { PZ.snd.play('tap'); if (b.dataset.a === 'go') startLevel(i); else openLevels(d.w); }));
}
function startLevel(i) { newRun('adventure', BB.levelDef(i)); if (!adv.tutdone && i === 0) { adv.tutdone = 1; } }
$('mAdv').addEventListener('click', () => { PZ.snd.play('tap'); openLevels(); });
$('mCls').addEventListener('click', () => { PZ.snd.play('tap'); newRun('classic'); });
$('mDay').addEventListener('click', () => { PZ.snd.play('tap'); newRun('daily'); });
$('lvBack').addEventListener('click', () => { PZ.snd.play('tap'); toTitle(); });

/* ------------------------------------------------------------ first-run coach: learn by doing */
let tut = 0, tutSeen = LS.get('blockblast_tut', 0) === 1 || LS.get('blockblast_tut', '') === '1';
function coach(t, b) { $('coachTxt').textContent = t; $('coachBtn').textContent = b || 'Skip'; $('coach').classList.add('on'); }
function endTut() { tut = 0; $('coach').classList.remove('on'); fingerOff(); tutSeen = true; LS.set('blockblast_tut', 1); }
$('coachBtn').addEventListener('click', endTut);
function startTut(soft) {
  tut = 1;
  if (!soft) { coach('Drag the two-square block into the gap in the bottom row.'); requestAnimationFrame(() => setTimeout(fingerDemo, 400)); }
  else { tut = 1; coach('Drag a block from the bottom onto the board.'); }
}
function tutPlaced() { if (tut === 1) { tut = 2; fingerOff(); setTimeout(() => { coach('Nice! A full row or column blasts away. Chain clears for combos.', 'Got it'); }, 600); } else if (tut === 2) endTut(); }
function fingerDemo() {
  if (tut !== 1 || !tray) return; const slot = document.querySelectorAll('.slot')[0]; if (!slot) return;
  const sr = slot.getBoundingClientRect(), br = cv.getBoundingClientRect(), x0 = sr.left + sr.width / 2 - 27, y0 = sr.top + sr.height / 2 - 27, x1 = br.left + 4.0 * cssCS - 27, y1 = br.top + 7.5 * cssCS - 27 - cssCS * 0.9;
  const f = $('finger'); f.classList.add('on'); if (RM()) { f.style.transform = 'translate(' + x1 + 'px,' + y1 + 'px)'; return; }
  f._a = f.animate([{ transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)', opacity: 0 }, { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(.85)', opacity: 1, offset: 0.12 }, { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.85)', opacity: 1, offset: 0.7 }, { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(1)', opacity: 0 }], { duration: 1900, iterations: Infinity, easing: 'ease-in-out' });
}
function fingerOff() { const f = $('finger'); if (f._a) { f._a.cancel(); f._a = null; } f.classList.remove('on'); }

/* ------------------------------------------------------------ arcade SDK, codes */
const CODES = { BOMBSQUAD: 'Bomb squad: a bomb joins your tray right now', TINYBLOCKS: 'Tiny blocks: every new block is 3 squares or fewer', FRESHTRAY: 'Fresh tray: swap your blocks for three new ones', MOREUNDO: 'More undo: ten undos and swaps' };
function code(c) {
  if (!CODES[c]) return { ok: false }; $('codesOn').hidden = false;
  if (c === 'TINYBLOCKS') tinyBlocks = true;
  if (playing && !over) {
    if (c === 'BOMBSQUAD') { const i = tray.findIndex(p => !p.used && !p.bomb); if (i >= 0) tray[i] = { shape: [[1]], ci: 0, used: false, bomb: true }; }
    if (c === 'FRESHTRAY') tray = makeTray(false);
    if (c === 'MOREUNDO') { undoLeft = 10; swapLeft = 10; }
    renderTray(); updateHud(); kick();
  }
  return { ok: true, message: CODES[c] };
}
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: () => { if (mode === 'adventure' && def) newRun('adventure', def); else newRun(mode || 'classic'); }, onExit: toTitle, onTutorial: () => newRun('classic', null, { tutorial: true }), onHint: () => showHint(), onCheat: code });

/* ------------------------------------------------------------ boot */
buildLogo(); drift($('drift')); drift(document.querySelector('#levels .bgdrift'));
grid = new Array(N * N).fill(0); gems = new Array(N * N).fill(0); tray = null; score = 0; shown = 0; combo = 0; miss = 0; movesLeft = 99; history = []; undoLeft = 3; swapLeft = 2; blast = 0; over = false; playing = false; runMaxCombo = 0; runLines = 0; runMulti = 0; bombsUsed = 0; placed = 0; linesDone = 0; gemsGot = 0;
prof.chip($('top')); ready = true; applyTheme(prof.theme()); layout(); updateHud(); toTitle();
// tiny hooks for the test harness
window.__bb = { newRun, get state() { return { mode, score, over, playing, movesLeft, linesDone, gemsGot, grid: grid.slice(), tray, combo, level: prof.level() }; }, place: placeAt, hint: showHint, levels: openLevels, prof, BB };
})();
