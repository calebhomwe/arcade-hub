<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1200px 800px at 50% -10%, #312e81 0%, #0f0f23 45%, #07070f 100%);
  min-height: 100vh; color: #e5e7eb; display: flex; flex-direction: column; align-items: center;
  padding: 16px 8px 24px; overflow-x: hidden; user-select: none; touch-action: manipulation;
}
h1 {
  font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 900; letter-spacing: -0.02em;
  background: linear-gradient(90deg, #f472b6, #fb923c, #facc15, #4ade80, #38bdf8, #a78bfa);
  -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 4px;
}
.subtitle { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; }

#gameWrap { position: relative; width: min(92vw, 480px); display: flex; flex-direction: column; align-items: center; gap: 10px; }

#scoreBoard { display: flex; gap: 20px; justify-content: center; width: 100%; }
.scoreBox { background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 8px 16px; text-align: center; min-width: 70px; }
.scoreBox .label { font-size: 0.75rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
.scoreBox .value { font-size: 1.4rem; font-weight: 900; color: #e5e7eb; font-variant-numeric: tabular-nums; min-width: 2ch; }
.scoreBox .value.combo { color: #facc15; }
.scoreBox.small { padding: 8px 10px; min-width: 44px; }
.scoreBox .value.blast { color: #f43f5e; }
#metaStats { font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-align: center; min-height: 14px; }

#gridCanvas { display: block; border-radius: 12px; box-shadow: 0 0 0 2px rgba(167,139,250,0.35), 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(56,189,248,0.18); touch-action: none; }

#piecesArea { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.pieceSlot { width: 90px; height: 90px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; position: relative; }
.pieceSlot:hover { border-color: rgba(167,139,250,0.5); box-shadow: 0 0 16px rgba(167,139,250,0.2); }
.pieceSlot.selected { border-color: #facc15; border-style: solid; box-shadow: 0 0 20px rgba(250,204,21,0.4); background: rgba(250,204,21,0.08); }
.pieceSlot.used { opacity: 0.2; pointer-events: none; }
.pieceSlot canvas { display: block; }

#status { font-size: 0.85rem; font-weight: 700; text-align: center; color: #cbd5e1; min-height: 20px; }
#comboText { font-size: 0.75rem; font-weight: 700; color: #facc15; min-height: 18px; text-align: center; animation: bbFade 1.5s ease; }
@keyframes bbFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes bbPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bbBump { 0%, 100% { transform: none; text-shadow: none; } 30% { transform: scale(1.35); text-shadow: 0 0 14px rgba(250, 204, 21, 0.8); } }
@keyframes bbBreathe { 0%, 100% { box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); } 50% { box-shadow: 0 0 30px rgba(250, 204, 21, 0.75); } }
.pieceSlot { transition: opacity 0.35s ease; }
.pieceSlot.fresh { animation: bbPop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
.pieceSlot.fresh:nth-child(2) { animation-delay: 0.07s; }
.pieceSlot.fresh:nth-child(3) { animation-delay: 0.14s; }
.pieceSlot.selected { animation: bbBreathe 0.9s ease-in-out infinite; }
.scoreBox .value.bump { animation: bbBump 0.35s ease; }

.btn {
  min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
  background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  color: #e5e7eb; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  transition: all 0.15s; white-space: nowrap; font-family: inherit;
}
.btn:hover { border-color: rgba(167,139,250,0.5); box-shadow: 0 0 14px rgba(167,139,250,0.2); }
.btn:active { transform: scale(0.94); }
.btn:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
.btn.primary { background: linear-gradient(90deg, #4ade80, #38bdf8); color: #0f0f23; border-color: transparent; box-shadow: 0 6px 20px rgba(56,189,248,0.3); }

#controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.back { margin-top: 8px; color: #94a3b8; text-decoration: none; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; }
.back:hover { color: #a78bfa; }

.pieceSlot:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
#gridCanvas:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }
.coach { display: flex; align-items: center; gap: 10px; background: #facc15; color: #1c1917; font-weight: 800; font-size: 0.85rem; border-radius: 12px; padding: 6px 8px 6px 14px; max-width: 100%; animation: coachPulse 1.4s ease-in-out infinite; }
.coach.hidden, .ov.hidden, .codes.hidden { display: none; }
.coach button { border: none; border-radius: 9px; background: rgba(0,0,0,.18); color: #1c1917; font-weight: 900; font-size: 0.8rem; min-height: 40px; min-width: 52px; cursor: pointer; font-family: inherit; }
@keyframes coachPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.55); } 50% { box-shadow: 0 0 0 8px rgba(250,204,21,0); } }
.ov { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(7,7,15,.84); backdrop-filter: blur(5px); }
.ov h2 { font-size: clamp(2rem, 9vw, 3rem); font-weight: 900; background: linear-gradient(90deg, #f472b6, #fb923c, #facc15, #4ade80, #38bdf8, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ov p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; max-width: 380px; }
.ov .btn.primary { font-size: 1.1rem; padding: 10px 40px; }
.seg { display: flex; gap: 6px; }
.seg .btn.on { border-color: #facc15; color: #facc15; }
.codes { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(15,23,42,.9); color: #facc15; font-size: 0.75rem; font-weight: 900; letter-spacing: 0.15em; padding: 5px 10px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .coach, .pieceSlot.fresh, .pieceSlot.selected, .scoreBox .value.bump, #comboText { animation: none; } body.kit-shake { animation: none !important; } }
</style>
</head>
<body>
<h1>🧊 BLOCK BLAST</h1>
<p class="subtitle">Place blocks, clear lines, blast combos</p>

<div id="gameWrap">
  <div id="scoreBoard">
    <div class="scoreBox"><div class="label">Score</div><div class="value" id="scoreVal">0</div></div>
    <div class="scoreBox"><div class="label">Best</div><div class="value" id="bestVal">0</div></div>
    <div class="scoreBox"><div class="label">Combo</div><div class="value combo" id="comboVal">0</div></div>
    <div class="scoreBox small"><div class="label">Blast</div><div class="value blast" id="blastVal">0/5</div></div>
  </div>
  <canvas id="gridCanvas" role="img" aria-label="Block Blast 8x8 grid"></canvas>
  <div id="comboText"></div>
  <div id="piecesArea"></div>
  <div class="coach hidden" id="coach"><span id="coachTxt"></span><button id="coachBtn">Skip</button></div>
  <div id="status" aria-live="polite">Select a block, then tap the grid</div>
  <div id="controls">
    <button class="btn" id="btnUndo">↩ Undo</button>
    <button class="btn" id="btnHint">💡 Hint</button>
    <button class="btn primary" id="btnReset">🔄 New Game</button>
  </div>
  <div id="metaStats"></div>
</div>

<a class="back" href="../index.html">← Back to Arcade Hub</a>
<div class="codes hidden" id="codesOn">CODES ON</div>
<div class="ov hidden" id="start" role="dialog" aria-label="Block Blast">
  <h2>🧊 BLOCK BLAST</h2>
  <p>Drop the three blocks onto the 8×8 grid. Fill a whole row or column to blast it away. The game ends when no block fits.</p>
  <div class="seg" role="group" aria-label="Mode"><button class="btn" data-m="classic">Classic</button><button class="btn" data-m="daily">Daily blocks</button></div>
  <button class="btn primary" id="playBtn">▶ Play</button>
  <p id="startBest" style="font-size:0.85rem;color:#94a3b8"></p>
</div>

<script src="kit/juicekit.js"></script>
<script>

// ==================== ARCADE STANDARD ====================
const SDK = window.ArcadeSDK || null;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function scene(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
function cheated() { return !!(SDK && SDK.cheated); }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
let mode = 'classic'; try { mode = localStorage.getItem('blockblast_mode') || 'classic'; } catch (e) {}
function bestKey() { return mode === 'daily' ? 'blockblast_daily_' + today() : 'blockblast_best'; }
// Daily blocks: a seeded generator, so everyone gets the same blocks in the same order today.
let rngState = 0;
function seedRng(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } rngState = h >>> 0; }
function R() { if (mode !== 'daily') return Math.random(); rngState = (rngState + 0x6D2B79F5) >>> 0; let t = rngState; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
let tinyBlocks = false;

// ==================== POLYFILL ====================

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    else if (!Array.isArray(r)) r = [0,0,0,0];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
    return this;
  };
}

// ==================== SOUND ENGINE ====================

let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) {}
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function resumeAudio() { if (muted) return; const c = ensureAudio(); if (c && c.state === 'suspended') c.resume(); }
document.addEventListener('click', resumeAudio, {once:true});
document.addEventListener('touchstart', resumeAudio, {once:true});

const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){try{muted=localStorage.getItem('gamesMuted')==='1'}catch(e){}if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function layer(freq, dur, type, vol, slide, delay) {
  try {
    muted = localStorage.getItem('gamesMuted') === '1';
    if (muted) return;
    const c = ensureAudio(); if (c.state === 'suspended') c.resume(); const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.07, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
let comboTimer = null;
function showCombo(txt, ms) {
  const el = document.getElementById('comboText');
  el.textContent = txt;
  if (comboTimer) clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { el.textContent = ''; comboTimer = null; }, ms);
}
function sfxPlace() { sfx('pop'); layer(160, 0.07, 'sine', 0.06, 90); }
function sfxClear() { sfx('coin'); layer(880, 0.09, 'triangle', 0.05, 1320); }
function sfxCombo(n) {
  sfx('levelup');
  [523, 659, 784, 1047].slice(0, Math.min(4, n || 3)).forEach((f, i) => layer(f, 0.12, 'triangle', 0.06, f * 1.5, i * 0.06));
}
function sfxGameOver() { sfx('lose'); layer(220, 0.4, 'sawtooth', 0.08, 70); layer(160, 0.5, 'square', 0.05, 55, 0.15); }
function sfxSelect() { sfx('tap'); layer(980, 0.04, 'triangle', 0.04); }
function sfxUndo() { sfx('whoosh'); layer(500, 0.14, 'sine', 0.05, 180); }
// ==================== BLOCK SHAPES ====================

const SHAPES = [
  [[1]],                                          // 1x1
  [[1,1]],                                        // 1x2
  [[1],[1]],                                      // 2x1
  [[1,1,1]],                                      // 1x3
  [[1],[1],[1]],                                  // 3x1
  [[1,1],[1,1]],                                  // 2x2
  [[1,1,1],[0,1,0]],                              // T
  [[1,0],[1,0],[1,1]],                            // L
  [[0,1],[0,1],[1,1]],                            // J
  [[1,1,0],[0,1,1]],                              // S
  [[0,1,1],[1,1,0]],                              // Z
  [[1,1,1,1]],                                    // 1x4
  [[1],[1],[1],[1]],                              // 4x1
  [[1,1,1],[1,0,0]],                              // big L
  [[1,1,1],[0,0,1]],                              // big J
  [[1,0],[1,1],[1,0]],                            // plus
  [[1,1],[1,0],[1,0]],                            // short L
  [[1,1],[0,1],[0,1]],                            // short J
  [[1,1,1],[0,1,0],[0,1,0]],                      // long T
  [[1,0,0],[1,1,1],[0,0,1]],                      // zigzag big
];

const COLORS = ['#f472b6','#fb923c','#facc15','#4ade80','#38bdf8','#a78bfa','#f87171','#c084fc','#fb7185','#34d399','#60a5fa','#e879f9'];

// ==================== GAME STATE ====================

const GRID = 8;
let grid = [];
let pieces = [];
let selectedPiece = -1;
let score = 0;
let bestScore = parseInt(localStorage.getItem(bestKey()) || '0');
let prevBest = 0;
let comboCount = 0;
let moveHistory = [];
let gameOver = false;
let clearingCells = [];
let clearingColors = {};
let clearAnim = 0;
let particles = [];
let shakeAmount = 0;
let animFrame = null;
let _animLastT = null, _fxLastT = null;
let blastCharge = 0, bombsPlaced = 0;
const BLAST_MAX = 5, BOMB_COLOR = '#f43f5e';
let clearStreak = 0;
let runClears = 0;
let runMaxCombo = 0;
let bestStreakEver = parseInt(localStorage.getItem('blockblast_streak') || '0');
let lifetimeClears = parseInt(localStorage.getItem('blockblast_clears') || '0');
let sparks = parseInt(localStorage.getItem('blockblast_sparks') || '0');
let quadEver = false;
let ach = [];
try { ach = JSON.parse(localStorage.getItem('blockblast_ach') || '[]') || []; } catch (e) { ach = []; }

// ==================== CANVAS ====================

const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let cellSize = 0, gridPadding = 0;
let hoverCell = null;
let cellGradCache = {};

function resizeGrid() {
  const maxWidth = Math.min(document.getElementById('gameWrap').clientWidth - 16, 440);
  const size = Math.floor(maxWidth * dpr);
  canvas.width = size; canvas.height = size;
  canvas.style.width = maxWidth + 'px'; canvas.style.height = maxWidth + 'px';
  cellSize = Math.floor(size / GRID);
  gridPadding = Math.floor((size - cellSize * GRID) / 2);
  cellGradCache = {};
}
resizeGrid();
window.addEventListener('resize', () => { resizeGrid(); drawGrid(); drawPieces(); });

// ==================== GAME LOGIC ====================

function initGrid(quiet) {
  if (mode === 'daily') seedRng('blockblast-' + today());
  bestScore = parseInt(localStorage.getItem(bestKey()) || '0');
  grid = new Array(GRID * GRID).fill(0);
  pieces = generatePieces();
  selectedPiece = -1;
  score = 0;
  comboCount = 0;
  prevBest = bestScore;
  moveHistory = [];
  gameOver = false;
  clearingCells = [];
  clearingColors = {};
  clearAnim = 0;
  particles = [];
  shakeAmount = 0;
  hoverCell = null;
  blastCharge = 0;
  bombsPlaced = 0;
  clearStreak = 0;
  runClears = 0;
  runMaxCombo = 0;
  updateUI();
  drawGrid();
  drawPieces();
  if (quiet !== true) scene('play');
}

function shapeCells(s) { return s.flat().reduce((a, b) => a + b, 0); }
function pickShape() {
  const early = moveHistory.length < 8;
  const fill = grid.filter(Boolean).length / (GRID * GRID);
  const maxCells = tinyBlocks ? 3 : early ? 5 : (fill > 0.42 ? 6 : (fill > 0.28 ? 9 : 12));
  for (let t = 0; t < (tinyBlocks ? 40 : 8); t++) {
    const s = SHAPES[Math.floor(R() * SHAPES.length)];
    if (shapeCells(s) <= maxCells) return s;
  }
  return [[1]];
}
function fitsSomewhere(shape) {
  for (let r = 0; r <= GRID - shape.length; r++)
    for (let c = 0; c <= GRID - shape[0].length; c++)
      if (canPlace(grid, shape, r, c)) return true;
  return false;
}
function generatePieces() {
  const p = [];
  for (let i = 0; i < 3; i++) {
    const colorIdx = Math.floor(R() * COLORS.length);
    p.push({ shape: pickShape().map(r => [...r]), color: COLORS[colorIdx], used: false });
  }
  if (blastCharge >= BLAST_MAX) {
    p[1] = { shape: [[1]], color: BOMB_COLOR, used: false, bomb: true };
    blastCharge -= BLAST_MAX;
    sfx('levelup');
  }
  if (R() < 0.12) p[2].star = true;
  if (!hasAnyMoves(grid, p)) {
    const SMALLS = SHAPES.filter(s => shapeCells(s) <= 3);
    for (let t = 0; t < 12 && !hasAnyMoves(grid, p); t++) {
      const i = Math.floor(R() * 3);
      if (p[i].bomb) continue;
      const cand = SMALLS[Math.floor(R() * SMALLS.length)];
      if (cand && fitsSomewhere(cand)) p[i] = { shape: cand.map(r => [...r]), color: p[i].color, used: false, star: p[i].star };
    }
  }
  return p;
}

function canPlace(grid, shape, row, col) {
  const h = shape.length, w = shape[0].length;
  if (row + h > GRID || col + w > GRID) return false;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (shape[r][c] && grid[(row + r) * GRID + (col + c)]) return false;
    }
  }
  return true;
}

function placePiece(grid, shape, colorIdx, row, col) {
  const h = shape.length, w = shape[0].length;
  const newGrid = grid.slice();
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (shape[r][c]) newGrid[(row + r) * GRID + (col + c)] = colorIdx + 1;
    }
  }
  return newGrid;
}

function findFullLines(grid) {
  const fullRows = [];
  const fullCols = [];
  for (let r = 0; r < GRID; r++) {
    let full = true;
    for (let c = 0; c < GRID; c++) { if (!grid[r * GRID + c]) { full = false; break; } }
    if (full) fullRows.push(r);
  }
  for (let c = 0; c < GRID; c++) {
    let full = true;
    for (let r = 0; r < GRID; r++) { if (!grid[r * GRID + c]) { full = false; break; } }
    if (full) fullCols.push(c);
  }
  return { rows: fullRows, cols: fullCols };
}

function clearLines(grid, rows, cols) {
  const newGrid = grid.slice();
  for (const r of rows) for (let c = 0; c < GRID; c++) newGrid[r * GRID + c] = 0;
  for (const c of cols) for (let r = 0; r < GRID; r++) newGrid[r * GRID + c] = 0;
  return newGrid;
}

function hasAnyMoves(grid, pieces) {
  for (const piece of pieces) {
    if (piece.used) continue;
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (canPlace(grid, piece.shape, r, c)) return true;
      }
    }
  }
  return false;
}

function placePieceAt(pieceIdx, row, col) {
  if (gameOver || pieceIdx < 0 || pieceIdx >= pieces.length) return;
  if (pieces[pieceIdx].used) return;
  if (!canPlace(grid, pieces[pieceIdx].shape, row, col)) return;

  moveHistory.push({ grid: grid.slice(), pieces: pieces.map(p => ({...p, shape: p.shape.map(r=>[...r])})), score, comboCount, rng: rngState, blastCharge });
  tutPlaced();

  const colorIdx = COLORS.indexOf(pieces[pieceIdx].color);
  grid = placePiece(grid, pieces[pieceIdx].shape, colorIdx, row, col);
  pieces[pieceIdx].used = true;

  if (pieces[pieceIdx].bomb) {
    if (grid[row * GRID + col] === 0) grid[row * GRID + col] = 7;
    const bombCells = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const rr = row + dr, cc = col + dc;
        if (rr < 0 || rr >= GRID || cc < 0 || cc >= GRID) continue;

// ==================== DRAWING ====================

function getCellColor(idx) {
  if (!grid[idx]) return 'transparent';
  return COLORS[grid[idx] - 1];
}

function cellGradient(idx, color, x, y, s) {
  let e = cellGradCache[idx];
  if (!e || e[0] !== color) {
    const g = ctx.createLinearGradient(x, y, x + s, y + s);
    g.addColorStop(0, color);
    g.addColorStop(1, color + 'cc');
    cellGradCache[idx] = [color, g];
    return g;
  }
  return e[1];
}

const blockTileCache = {};
function blockTile(color, s, blockSize) {
  const key = color + '|' + s;
  let t = blockTileCache[key];
  if (t) return t;
  let nkeys = 0; for (const k in blockTileCache) nkeys++;
  if (nkeys > 48) for (const k in blockTileCache) delete blockTileCache[k];
  t = document.createElement('canvas');
  t.width = Math.ceil(s * 2); t.height = Math.ceil(s * 2);
  const c = t.getContext('2d');
  c.scale(2, 2);
  const g = c.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, color);
  g.addColorStop(1, color + 'cc');
  c.fillStyle = g;
  c.beginPath();
  c.roundRect(0, 0, s, s, Math.max(2, blockSize * 0.15));
  c.fill();
  c.fillStyle = 'rgba(255,255,255,0.15)';
  c.beginPath();
  c.roundRect(s * 0.15, s * 0.1, s * 0.7, s * 0.35, Math.max(1, blockSize * 0.08));
  c.fill();
  return blockTileCache[key] = t;
}

function drawGrid() {
  const _fxNow = performance.now();
  const _fxDt = _fxLastT === null ? (1 / 60) : Math.min(0.05, (_fxNow - _fxLastT) / 1000);
  _fxLastT = _fxNow;
  const fxS = _fxDt * 60;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Screen shake
  let sx = 0, sy = 0;
  if (RM) shakeAmount = 0;
  if (shakeAmount > 0.01) {
    sx = (Math.random() - 0.5) * shakeAmount * cellSize * 0.3;
    sy = (Math.random() - 0.5) * shakeAmount * cellSize * 0.3;
    shakeAmount *= Math.pow(0.82, fxS);
  }
  ctx.save();
  ctx.translate(sx, sy);

  // Grid background
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(gridPadding, gridPadding, cellSize * GRID, cellSize * GRID);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= GRID; r++) {
    ctx.beginPath();
    ctx.moveTo(gridPadding, gridPadding + r * cellSize);
    ctx.lineTo(gridPadding + GRID * cellSize, gridPadding + r * cellSize);
    ctx.stroke();
  }
  for (let c = 0; c <= GRID; c++) {
    ctx.beginPath();
    ctx.moveTo(gridPadding + c * cellSize, gridPadding);
    ctx.lineTo(gridPadding + c * cellSize, gridPadding + GRID * cellSize);
    ctx.stroke();
  }

  // Cells
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const idx = r * GRID + c;
      let color = getCellColor(idx);
      let alpha = 1;
      let scale = 1;
      if (clearingCells.includes(idx) && clearAnim > 0) {
        if (color === 'transparent') color = COLORS[(clearingColors[idx] || 1) - 1] || '#facc15';
        alpha = clearAnim;
        scale = clearAnim;
      }
      if (color === 'transparent') continue;
      const x = gridPadding + c * cellSize + 1;
      const y = gridPadding + r * cellSize + 1;
      const s = cellSize - 2;

      ctx.save();
      if (scale !== 1) {
        const cx = x + s/2, cy = y + s/2;
        ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
      }
      ctx.globalAlpha = alpha;

      // Cell with gradient
      ctx.fillStyle = cellGradient(idx, color, x, y, s);
      ctx.beginPath();
      ctx.roundRect(x, y, s, s, Math.max(2, cellSize * 0.15));
      ctx.fill();

      // Inner highlight
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.roundRect(x + s*0.15, y + s*0.1, s*0.7, s*0.35, Math.max(1, cellSize * 0.08));
      ctx.fill();

      ctx.restore();
    }
  }

  // Hover preview
  if (selectedPiece >= 0 && hoverCell && !gameOver) {
    const piece = pieces[selectedPiece];
    if (piece && !piece.used) {
      const shape = piece.shape;
      const h = shape.length, w = shape[0].length;
      const valid = canPlace(grid, shape, hoverCell.row, hoverCell.col);
      ctx.globalAlpha = 0.5;
      for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
          if (!shape[r][c]) continue;
          const x = gridPadding + (hoverCell.col + c) * cellSize + 1;
          const y = gridPadding + (hoverCell.row + r) * cellSize + 1;
          const s = cellSize - 2;
          ctx.fillStyle = valid ? piece.color : '#ef4444';
          ctx.beginPath();
          ctx.roundRect(x, y, s, s, Math.max(2, cellSize * 0.15));
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  // Game over overlay
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(gridPadding, gridPadding, cellSize * GRID, cellSize * GRID);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${cellSize * 0.5}px system-ui`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 18;
    ctx.fillText('GAME OVER', gridPadding + cellSize * GRID / 2, gridPadding + cellSize * GRID / 2 - cellSize * 0.1);
    ctx.shadowBlur = 0;
    ctx.font = `${cellSize * 0.25}px system-ui`;
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Tap the grid for a new game', gridPadding + cellSize * GRID / 2, gridPadding + cellSize * GRID / 2 + cellSize * 0.5);
  }

  // Particles
  let pw = 0;
  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    pt.x += pt.vx * fxS; pt.y += pt.vy * fxS; pt.vy += 0.2 * fxS; pt.life -= 0.02 * fxS;
    if (pt.life <= 0) continue;
    particles[pw++] = pt;
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
    ctx.fill();
  }
  particles.length = pw;
  ctx.globalAlpha = 1;

  if (clearAnim > 0 && clearingCells.length && !RM) {
    ctx.globalAlpha = clearAnim * 0.22;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(gridPadding, gridPadding, cellSize * GRID, cellSize * GRID);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

let traySig = '';
function drawPieces() {
  const area = document.getElementById('piecesArea');
  area.innerHTML = '';
  const sig = pieces.map(p => (p.color || '') + p.shape.length + p.shape[0].length + (p.bomb ? 'b' : '') + (p.star ? 's' : '')).join('|');
  const fresh = sig !== traySig;
  traySig = sig;

  for (let i = 0; i < pieces.length; i++) {
    const piece = pieces[i];
    const slot = document.createElement('div');
    slot.className = 'pieceSlot' + (i === selectedPiece ? ' selected' : '') + (piece.used ? ' used' : '') + (fresh ? ' fresh' : '');
    slot.dataset.index = i;
    slot.tabIndex = piece.used ? -1 : 0; slot.setAttribute('role', 'button'); slot.setAttribute('aria-label', 'Block ' + (i + 1) + (piece.bomb ? ', bomb' : '') + (piece.used ? ', used' : '') + (i === selectedPiece ? ', selected' : ''));

    const pc = document.createElement('canvas');
    const pctx = pc.getContext('2d');
    const size = 80 * dpr;
    pc.width = size; pc.height = size;
    pc.style.width = '80px'; pc.style.height = '80px';

    const shape = piece.shape;
    const h = shape.length, w = shape[0].length;
    const blockSize = Math.floor(size / Math.max(h, w, 3.5));
    const ox = (size - w * blockSize) / 2;
    const oy = (size - h * blockSize) / 2;

    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        if (!shape[r][c]) continue;
        const x = ox + c * blockSize + 1;
        const y = oy + r * blockSize + 1;
        const s = blockSize - 2;
        pctx.drawImage(blockTile(piece.color, s, blockSize), x, y, s, s);
      }
    }

    if (piece.bomb) {
      pctx.fillStyle = '#fff';
      pctx.font = 'bold ' + 16 * dpr + 'px system-ui';
      pctx.textAlign = 'center';
      pctx.fillText('💣', size / 2, size / 2 + 6);
    }

    if (piece.star && !piece.bomb) {
      pctx.font = 'bold ' + 13 * dpr + 'px system-ui';
      pctx.textAlign = 'center';
      pctx.fillText('✨', 14 * dpr, 15 * dpr);
    }

    slot.appendChild(pc);
    slot.addEventListener('click', () => {
      if (gameOver || piece.used) return;
      selectedPiece = (selectedPiece === i) ? -1 : i;
      sfxSelect();
      drawPieces();
      drawGrid();
      tutPicked();
    });
    slot.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); slot.click(); if (selectedPiece === i) { if (!hoverCell) hoverCell = { row: 0, col: 0 }; drawGrid(); canvas.focus(); } } });
    area.appendChild(slot);
  }
}

function getGridCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const col = Math.floor((x - gridPadding) / cellSize);
  const row = Math.floor((y - gridPadding) / cellSize);
  if (col < 0 || col >= GRID || row < 0 || row >= GRID) return null;
  return { row, col };
}

canvas.addEventListener('click', (e) => {
  if (e.detail === 0) return;
  if (gameOver) { Kit.click(); initGrid(); return; }
  const cell = getGridCell(e);
  if (!cell) { hoverCell = null; drawGrid(); return; }
  if (selectedPiece < 0) return;
  placePieceAt(selectedPiece, cell.row, cell.col);
});

canvas.addEventListener('mousemove', (e) => {
  if (gameOver || selectedPiece < 0) { hoverCell = null; return; }
  const cell = getGridCell(e);
  if (!cell) { hoverCell = null; drawGrid(); return; }
  if (!hoverCell || hoverCell.row !== cell.row || hoverCell.col !== cell.col) {
    hoverCell = cell;
    drawGrid();
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameOver || selectedPiece < 0) { hoverCell = null; return; }

  if (!hoverCell || hoverCell.row !== cell.row || hoverCell.col !== cell.col) {
    hoverCell = cell;
    drawGrid();
  }
}, { passive: false });

canvas.addEventListener('touchstart', (e) => {

  const cell = getGridCell(e.touches[0]);

function animLoop() {
  const _now = performance.now();
  const _dt = _animLastT === null ? (1 / 60) : Math.min(0.05, (_now - _animLastT) / 1000);
  _animLastT = _now;
  if (clearAnim > 0) {
    clearAnim -= 0.06 * (_dt * 60);
    if (clearAnim <= 0) { clearingCells = []; clearingColors = {}; clearAnim = 0; }
  }
  drawGrid();
  if (clearAnim > 0 || particles.length > 0 || shakeAmount > 0.01) {
    animFrame = requestAnimationFrame(animLoop);
  } else {
    animFrame = null;
    _animLastT = null;
  }
}

const origDrawGrid = drawGrid;
drawGrid = function() {
  origDrawGrid();
  if ((clearAnim > 0 || particles.length > 0 || shakeAmount > 0.01) && !animFrame) {
    animFrame = requestAnimationFrame(animLoop);
  }
};

// Hint: tries every block in every spot and keeps the move that clears the most and leaves the fewest holes.
function evalGrid(g) {

const CODES = { BOMBSQUAD: 'Bomb squad: a bomb joins your tray right now', TINYBLOCKS: 'Tiny blocks: every new block is 3 squares or fewer', FRESHTRAY: 'Fresh tray: swap your blocks for three new ones' };
