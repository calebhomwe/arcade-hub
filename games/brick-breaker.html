  setTimeout(() => { if (state !== 'dead') return; meta.showResult({ res, title: 'Level ' + level + ' failed', subtitle: remaining + ' bricks left', scoreLabel: 'POINTS', big: score, stars: 0, againLabel: 'TRY AGAIN', onAgain: () => startLevel(level, false), onMenu: openMap, menuLabel: 'Levels' }); }, 700);
}
function winLevel() {

  if (!cheated()) { const before = starsOf(level); if (st > before) { stars[level - 1] = st; lsSet('brick-stars', JSON.stringify(stars)); const d = st - before; meta.add('starsTotal', d); meta.add('starsDay', d); } if (score > best) { best = score; lsSet('brickBest', best); } }
  meta.add('levels', 1); if (lostLives === 0) meta.add('flawless', 1); meta.max('bricksRun', brokenRun);
  snd('win'); snd('cheer', { volume: 0.5 }); FX.haptic(30); shake.add(0.3);
  for (let i = 0; i < 3; i++) setTimeout(() => parts.emit(rnd(80, W - 80), rnd(160, 320), { n: 30, colors: ['#ffe066', '#ff8a5c', '#7fd6ff', '#9be36b', '#fff'], speed: [80, 320], life: 1.1, size: [3, 7], gravity: 260, shape: 'star' }), i * 180);
  const res = endRunMeta(true, st); scene('over', { score, level });
  const nl = level + 1;
  setTimeout(() => { if (state !== 'clear') return; meta.showResult({ res, title: 'Level ' + level + ' cleared!', subtitle: WORLDS[levelDef(level).world].name, scoreLabel: 'POINTS', big: score, stars: st, againLabel: 'NEXT LEVEL', onAgain: () => startLevel(nl, false), extra: [{ label: 'Replay', fn: () => startLevel(level, false) }], onMenu: openMap, menuLabel: 'Levels' }); }, 1300);
}

/* ---------------------------------------------------------------- bricks and power-ups */
function damage(b, amt, viaBall) {
  if (!b.alive || b.type === 'x') return false; b.hp -= amt; b.hit = 1;
  if (b.hp > 0) { snd('hit', { volume: 0.4, rate: 0.85 }); parts.emit(b.x + b.w / 2, b.y + b.h / 2, { n: 4, colors: ['#e8e0d0', '#b8b0a0'], speed: [30, 120], life: 0.4, size: [1.5, 3], gravity: 200, shape: 'square' }); return false; }
  b.alive = false; remaining--; brokenRun++; meta.add('bricks', 1); combo = viaBall ? combo + 1 : combo; maxComboRun = Math.max(maxComboRun, combo); meta.max('combo', combo);
  const mult = Math.min(8, Math.max(1, combo)); setScore(10 * mult);
  const pal = WORLDS[levelDef(level).world].pal[b.col], cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  snd('pop', { volume: 0.45, rate: 0.9 + Math.min(combo, 10) * 0.05 }); FX.haptic(6);
  parts.emit(cx, cy, { n: 9, colors: [pal[0], pal[1], pal[2], '#fff'], speed: [50, 220], life: 0.7, size: [2, 5], gravity: 420, shape: 'square' });
  if (combo >= 3 && combo % 3 === 0) pops.add(cx, cy - 10, 'x' + mult, { color: '#ffe38a', size: 18 + Math.min(mult, 8) });
  if (b.type === 'b') { explode(b); }
  if (b.type === 'p' || Math.random() < 0.11) { const keys2 = ['M', 'W', 'L', 'S', 'F', 'M', 'W', 'F', 'L', 'H']; let k = keys2[(Math.random() * keys2.length) | 0]; if (k === 'H' && (lives >= 3 || Math.random() < 0.6)) k = 'W'; drops.push({ x: cx, y: cy, k, vy: 130 }); }

}
function explode(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2; shake.add(0.35); snd('explode', { volume: 0.5 }); parts.emit(cx, cy, { n: 26, colors: ['#ffe08a', '#ff8a2a', '#ff4a1a', '#fff'], speed: [80, 320], life: 0.7, size: [3, 7], gravity: 100 }); parts.emit(cx, cy, { n: 1, colors: ['#fff'], speed: [0, 0], life: 0.35, size: [10, 10], gravity: 0, shape: 'ring', grow: 200 });
  for (const o of bricks) if (o.alive && o !== b && Math.abs(o.x + o.w / 2 - cx) < BW * 1.2 && Math.abs(o.y + o.h / 2 - cy) < BH * 1.8) damage(o, 1, false);

function power(k) {

  pops.add(paddle.x + paddle.w / 2, PY - 24, POW[k].name + '!', { color: '#fff', size: 22 });

  if (k === 'H') { lives = Math.min(3, lives + 1); paintHud(); }
  paintHud();

/* ---------------------------------------------------------------- update */
function update(dt) {
  t += dt; const real = dt; dt = timeFx.step(dt); shake.update(real); parts.update(real); pops.update(real); padSpring.update(real);
  for (const b of bricks) if (b.hit > 0) b.hit = Math.max(0, b.hit - real * 6);

  { const tw = padWidth(); paddle.vis += (tw - paddle.w) * Math.min(1, real * 10); paddle.w += (tw - paddle.w) * Math.min(1, real * 10); }

  for (let i = bullets.length - 1; i >= 0; i--) { const bl = bullets[i]; bl.y -= 640 * dt; let hit = false; for (const b of bricks) if (b.alive && bl.x > b.x && bl.x < b.x + b.w && bl.y < b.y + b.h && bl.y > b.y - 6) { hit = true; damage(b, 1, false); break; } if (hit || bl.y < -10) bullets.splice(i, 1); }
  // drops

    const sp0 = Math.hypot(b.vx, b.vy), n = Math.max(1, Math.min(10, Math.ceil(sp0 * dt / 5))), h = dt / n, fire = paddle.fire > 0;
    for (let s = 0; s < n; s++) {
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); snd('tap', { volume: 0.3 }); } if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); snd('tap', { volume: 0.3 }); }
      if (b.y < b.r + 4) { b.y = b.r + 4; b.vy = Math.abs(b.vy); snd('tap', { volume: 0.3 }); }
      if (floorShield && b.vy > 0 && b.y > H - b.r - 4) { b.y = H - b.r - 4; b.vy = -Math.abs(b.vy); }

        snd('tap', { volume: 0.4, rate: 1.2 }); parts.emit(b.x, PY, { n: 5, colors: ['#fff6c8', skinNow().glow], speed: [40, 140], angle: [3.5, 5.9], life: 0.4, size: [2, 4], gravity: 60 });
      }

        else { const broke = damage(br, fire ? 3 : 1, true); if (!(fire && broke)) { if (Math.abs(ox) > Math.abs(oy)) { b.vx = Math.sign(ox || 1) * Math.abs(b.vx); b.x += Math.sign(ox || 1) * 1.5; } else { b.vy = Math.sign(oy || 1) * Math.abs(b.vy); b.y += Math.sign(oy || 1) * 1.5; } } }
        if (state !== 'play') return;
      }

    }
    if (fire && Math.random() < 0.7) parts.emit(b.x, b.y, { n: 1, colors: ['#ffb02a', '#ff5a1c', '#ffe08a'], speed: [10, 50], life: 0.4, size: [3, 6], gravity: -20 });
    else if (skinNow().trail && Math.random() < 0.5) parts.emit(b.x, b.y, skinNow().trail === 'flame' ? { n: 1, colors: ['#ffb02a', '#ff5a1c'], speed: [10, 40], life: 0.4, size: [2, 5], gravity: -10 } : { n: 1, colors: ['#fff6c0', '#ffe066'], speed: [5, 30], life: 0.6, size: [1.5, 3.5], gravity: 10, shape: 'star' });
  }
  for (let i = balls.length - 1; i >= 0; i--) if (balls[i].dead) balls.splice(i, 1);

}

/* ---------------------------------------------------------------- draw */
function draw() {
  const d = levelDef(state === 'title' ? Math.min(lastNext, LEVELS) : level), B = brickSprites(d.world); ctx.save(); shake.apply(ctx, W, H);
  ctx.drawImage(wallFor(d.world), 0, 0, W, H);
  // torch flames
  for (const [fx, fy] of [[10, H * 0.3], [W - 10, H * 0.62]]) { const fl = 1 + Math.sin(t * 9 + fx) * 0.15; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(fx, fy, 1, fx, fy, 30 * fl); g.addColorStop(0, 'rgba(255,240,180,.95)'); g.addColorStop(0.4, WORLDS[d.world].torch + 'aa'); g.addColorStop(1, WORLDS[d.world].torch + '00'); ctx.fillStyle = g; ctx.fillRect(fx - 34, fy - 34, 68, 68); ctx.restore(); }
  const yOff = state === 'title' ? 150 : 0;
  for (const b of bricks) {
    if (!b.alive) continue; const wob = b.hit > 0 ? Math.sin(b.hit * 12) * 1.6 * b.hit : 0;
    const spr = b.type === 'x' ? B.x : b.type === 'p' ? B.p : b.type === 'b' ? B.b : b.hp >= 3 ? B.hp3[b.col] : b.hp === 2 ? B.hp2[b.col] : B.n[b.col];
    ctx.drawImage(spr, b.x - 2 + wob, b.y + yOff - 2 + (b.hit > 0 ? b.hit * 1.5 : 0), BW + 4, BH + 4);
    if (b.type === 'n' && b.max > 1 && b.hp < b.max) ctx.drawImage(B.crack[b.max - b.hp - 1 > 0 ? 1 : 0], b.x - 2, b.y + yOff - 2, BW + 4, BH + 4);
    if (b.hit > 0.5) { ctx.fillStyle = 'rgba(255,255,255,' + (b.hit - 0.5) * 0.9 + ')'; rrect(ctx, b.x, b.y + yOff, b.w, b.h, 5); ctx.fill(); }
  }

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(255,90,80,.95)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; for (const bl of bullets) { ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(bl.x, bl.y + 16); ctx.stroke(); } ctx.restore();
  const sk = skinNow();
  if (state !== 'title') { const sq = FX.squash(padSpring.x * 0.25); ctx.save(); ctx.translate(paddle.x + paddle.w / 2, PY + 8); ctx.scale(sq.sx, sq.sy); ctx.translate(-(paddle.x + paddle.w / 2), -(PY + 8)); drawPaddle(ctx, sk, paddle.x, PY, paddle.w, 16, paddle.laser > 0); ctx.restore(); }
  for (const b of balls) {
    if (b.trail.length > 3) for (let i = 0; i < b.trail.length - 2; i += 2) { const k = i / b.trail.length; ctx.globalAlpha = k * 0.4; ctx.fillStyle = paddle.fire > 0 ? '#ff8a2a' : sk.glow; ctx.beginPath(); ctx.arc(b.trail[i], b.trail[i + 1], b.r * (0.3 + k * 0.6), 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1; drawBall(ctx, sk, b.x, b.y, b.r, paddle.fire > 0);
  }
  if (floorShield) { ctx.fillStyle = 'rgba(255,224,112,.5)'; ctx.fillRect(0, H - 6, W, 6); }

}
let last = 0;
function loop(now) { requestAnimationFrame(loop); if (document.hidden) { last = 0; return; } const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now; update(dt); draw(); }

/* ---------------------------------------------------------------- level map */
function openMap() {
  state = state === 'play' ? 'title' : state; meta.closeLayer(); const el = $('worlds'); el.innerHTML = ''; const nl = nextLevel();
  WORLDS.forEach((w, wi) => {
    const box = document.createElement('div'); box.className = 'world'; let got = 0; for (let i = 1; i <= 5; i++) got += starsOf(wi * 5 + i);
    box.innerHTML = '<h3><span>' + w.name + '</span><span>★ ' + got + ' / 15</span></h3><div class="row"></div>'; const row = box.querySelector('.row');
    for (let i = 1; i <= 5; i++) { const n = wi * 5 + i, ok = unlocked(n), s = starsOf(n), b = document.createElement('button'); b.type = 'button'; b.className = 'lv' + (ok ? '' : ' locked') + (n === nl ? ' next' : ''); b.innerHTML = (ok ? n : '🔒') + '<small>' + (ok ? '★'.repeat(s) + '<span style="opacity:.3">' + '★'.repeat(3 - s) + '</span>' : '') + '</small>'; b.setAttribute('aria-label', 'Level ' + n + (ok ? ', ' + s + ' stars' : ', locked')); if (ok) b.addEventListener('click', e => { e.stopPropagation(); snd('tap'); startLevel(n, false); }); row.appendChild(b); }
    el.appendChild(box);
  });
  $('title').classList.add('hidden'); $('map').classList.remove('hidden'); $('mute').classList.add('hidden'); ['hud', 'lives', 'ready'].forEach(i => $(i).classList.add('hidden')); state = 'map'; setBack(false);
}
function closeMap() { $('map').classList.add('hidden'); $('mute').classList.remove('hidden'); }
$('mapBtn').addEventListener('click', e => { e.stopPropagation(); openMap(); });
$('mapX').addEventListener('click', e => { e.stopPropagation(); showTitle(); });

/* ---------------------------------------------------------------- input: drag anywhere moves the paddle (relative), tap launches */
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (SDK && SDK.paused) return; if (e.target.closest('button,a,.hm,#metaHost,#map')) return;
  if (state === 'title') { startLevel(lastNext, false); return; }
  if (state !== 'play' && state !== 'ready') return;
  drag = { x: e.clientX, px: paddle.x, moved: false, id: e.pointerId }; try { stage.setPointerCapture(e.pointerId); } catch (x) {}
});
stage.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; const dx = (e.clientX - drag.x) / SC; if (Math.abs(dx) > 4) drag.moved = true; paddle.x = clamp(drag.px + dx * 1.25, 0, W - paddle.w); });
const endDrag = e => { if (!drag) return; const wasTap = !drag.moved; drag = null; if (wasTap && (state === 'ready' || (state === 'play' && serving))) launch(); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', () => { drag = null; });
addEventListener('keydown', e => {
  if (SDK && SDK.paused) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = 1; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = 1;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); if (state === 'title') startLevel(lastNext, false); else launch(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = 0; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = 0; });
$('playBtn').addEventListener('click', e => { e.stopPropagation(); startLevel(lastNext, false); });
addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
addEventListener('orientationchange', () => setTimeout(fit, 250));

/* ---------------------------------------------------------------- codes, hints, SDK */
const CODES = { FLOORSHIELD: 'Floor shield: the ball bounces off the bottom, so you never lose one', BIGPADDLE: 'Big paddle: the wide paddle all the time', MULTIBALL: 'Multi-ball: every serve launches three balls' };
function code(c) { if (!CODES[c]) return { ok: false }; $('codes').classList.remove('hidden'); if (c === 'FLOORSHIELD') floorShield = true; if (c === 'BIGPADDLE') bigPaddle = true; if (c === 'MULTIBALL') multiServe = true; return { ok: true, message: CODES[c] }; }
function hint() {
  if (state !== 'play' && state !== 'ready') return 'Press Play. Drag anywhere to slide the paddle and tap to launch the ball.';
  if (serving) return 'Tap to launch. Slide the paddle first: the ball leaves from the middle of it.';
  const p = drops.find(q => q.y < PY); if (p) return 'Catch the falling ' + POW[p.k].name.toLowerCase() + ' power-up on the ' + (p.x < W / 2 ? 'left' : 'right') + '.';
  const live = bricks.filter(b => b.alive && b.type !== 'x'); if (!live.length) return 'Level clear!';
  const cx = live.reduce((a, b) => a + b.x + b.w / 2, 0) / live.length, side = cx < W * 0.42 ? 'left' : cx > W * 0.58 ? 'right' : '';
  return (side ? 'Most bricks left are on the ' + side + ': hit the ball with the ' + side + ' edge of the paddle to send it that way.' : 'Bricks are spread out: hit the ball near the middle of the paddle for a steep, straight shot.') + ' Silver rims take two hits, gold rims three, and steel never breaks. Keep every ball for three stars.';
}
if (SDK) SDK.init({ pauseButton: 'br', pauseKeys: 'p+esc', onRestart: () => startLevel(level, false), onExit: showTitle, onTutorial: () => startLevel(1, true), onHint: hint, onCheat: code });

const mh = meta.mountBar($('metaHost'));
fit(); showTitle(); requestAnimationFrame(loop);

})();
