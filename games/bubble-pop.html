<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a7d9a">
<title>Bubble Pop</title>
<link rel="stylesheet" href="kit/kidskit.css">
<style>
body.kk{background:#0e4a6b}
/* ---------- under the sea in the late afternoon: sun shafts through the water, caustics, a sandy floor, parallax fish ---------- */
#sea{position:fixed;inset:0;overflow:hidden;--w1:#39b9cc;--w2:#1b83a0;--w3:#0b4a6d;--beam:255,236,170;--sand1:#e8c98b;--sand2:#a77a44}
#sea.w1{--w1:#2fb0b4;--w2:#167a8f;--w3:#0a3a5c;--beam:255,214,150;--sand1:#f0c890;--sand2:#b0764a}
#sea.w2{--w1:#1f78a8;--w2:#0e4374;--w3:#061a3c;--beam:170,215,255;--sand1:#5b6a7a;--sand2:#2a3140}
#sea .water{position:absolute;inset:0;background:radial-gradient(ellipse 80% 45% at 70% 0,rgba(var(--beam),.55) 0,transparent 70%),linear-gradient(180deg,var(--w1) 0,var(--w2) 45%,var(--w3) 100%)}
#sea .surface{position:absolute;left:-5%;right:-5%;top:0;height:64px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.0));filter:blur(1px)}
#sea .beams{position:absolute;inset:-10% -20% 20% -20%;transform-origin:70% 0;animation:sway 12s ease-in-out infinite}
#sea .beams i{position:absolute;top:0;height:100%;background:linear-gradient(180deg,rgba(var(--beam),.42),rgba(var(--beam),0) 80%);transform:skewX(-14deg)}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
#sea .caus{position:absolute;inset:-200px 0 0 -200px;opacity:.28;background-size:256px 256px;animation:caus 14s linear infinite;mix-blend-mode:soft-light}
@keyframes caus{to{transform:translate(256px,256px)}}
#sea .far{position:absolute;opacity:.45;width:60px;height:60px;filter:blur(1.5px) brightness(.8);animation:swimL 40s linear infinite}
@keyframes swimL{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 120px))}}
#sea .floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(20,30,20,.35) 40%),linear-gradient(180deg,var(--sand1),var(--sand2));border-top-left-radius:50% 22px;border-top-right-radius:50% 22px}
#sea .floor::before{content:'';position:absolute;inset:0;background:url(assets/kids/tex/soil.jpg) center/220px;opacity:.28;mix-blend-mode:multiply;border-radius:inherit}
#sea .prop{position:absolute;bottom:calc(3% + var(--y,0px));transform-origin:50% 100%;filter:drop-shadow(-8px 6px 5px rgba(0,20,30,.5))}
#sea .prop.sw{animation:sway2 5s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#sea .mote{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);animation:mote 9s linear infinite}
@keyframes mote{from{transform:translateY(20px);opacity:0}15%{opacity:.8}to{transform:translateY(-70vh);opacity:0}}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;z-index:10;touch-action:none;display:none}
canvas#cv.on{display:block}
/* ---------- HUD ---------- */
#hud{position:fixed;left:var(--kk-l);right:var(--kk-r);top:calc(var(--kk-top) + 56px);z-index:25;display:none;flex-direction:column;gap:8px;pointer-events:none}
#hud.on{display:flex}
#hud .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
#goal{position:relative;height:30px;border-radius:15px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,20,30,.4));border:1.5px solid rgba(233,181,68,.8);box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 3px 8px rgba(0,20,30,.4)}
#goal i{position:absolute;left:2px;top:2px;bottom:2px;border-radius:13px;width:0;background:linear-gradient(180deg,#ffeaa6,#e9b544 55%,#c98a1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .2s ease-out}
#goal img{position:absolute;top:-8px;width:44px;height:44px;margin-left:-22px;filter:grayscale(1) brightness(.75);opacity:.7}
#goal img.got{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));opacity:1;animation:kkBump .5s}
#time{min-width:96px}#time.low{background:linear-gradient(180deg,#8a2a1c,#5a150c);border-color:#ffb0a0}#time.low b{animation:kkBump .5s infinite}
#tank b{min-width:52px;text-align:left}
#combo{display:none}#combo.on{display:inline-flex}
#codes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kk-bot) + 4px);z-index:30;background:#ffd23f;color:#6b3b00;font-weight:700;font-size:14px;padding:3px 12px;border-radius:12px;letter-spacing:1px;display:none}
#ready{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;pointer-events:none}
#ready.on{display:flex}
#ready .card{border-radius:22px;padding:14px 26px 12px;text-align:center;border:8px solid transparent;background:linear-gradient(180deg,rgba(255,247,226,.8),rgba(240,218,168,.72)),url(assets/kids/tex/paper.jpg) center/300px padding-box,url(assets/kids/tex/wood-dark.jpg) center/300px border-box;box-shadow:0 20px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(217,164,65,.9);animation:kkPanel .4s cubic-bezier(.2,1.3,.4,1)}
#ready h2{margin:0;font-size:34px;color:var(--kk-ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}
#ready .g{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;font-weight:700;color:#a84f10}
#ready .g img{width:64px;height:64px;filter:drop-shadow(0 4px 3px rgba(60,30,0,.35))}
#ready .w{font-size:18px;font-weight:600;color:var(--kk-ink2);margin-top:2px}
.flyer{position:fixed;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:60;pointer-events:none;will-change:transform,opacity}
#titleHero{position:relative;width:min(84vw,320px);height:220px;margin:8px 0 4px}
#titleHero .bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.0) 22%),radial-gradient(circle at 50% 50%,rgba(210,245,255,.05) 55%,rgba(180,235,255,.35) 82%,rgba(255,255,255,.85) 100%);box-shadow:inset -8px -10px 18px rgba(255,255,255,.22),inset 6px 8px 14px rgba(120,200,255,.25),0 6px 14px rgba(0,30,50,.25);animation:kkBob 3s ease-in-out infinite}
#titleHero .bub img{position:absolute;left:19%;top:19%;width:62%;height:62%}
@media (prefers-reduced-motion:reduce){#sea .beams,#sea .caus,#sea .far,#sea .prop.sw,#sea .mote,#titleHero .bub{animation:none}}
</style>
</head>
<body class="kk">
<div id="sea" class="w0">
  <div class="water"></div>
  <div class="beams"><i style="left:8%;width:70px"></i><i style="left:30%;width:120px;opacity:.7"></i><i style="left:52%;width:60px"></i><i style="left:70%;width:150px;opacity:.8"></i><i style="left:92%;width:80px;opacity:.6"></i></div>
  <div class="caus" id="caus"></div>
  <div class="surface"></div>
  <img class="far" src="assets/kids/fx/tropical-fish.webp" alt="" style="top:38%;animation-duration:46s">
  <img class="far" src="assets/kids/fx/dolphin.webp" alt="" style="top:56%;width:84px;height:84px;animation-duration:64s;animation-delay:-30s">
  <img class="far" src="assets/kids/fx/tropical-fish.webp" alt="" style="top:70%;width:44px;height:44px;animation-duration:38s;animation-delay:-14s">
  <div class="mote" style="left:12%;bottom:8%"></div><div class="mote" style="left:38%;bottom:12%;animation-delay:-3s"></div><div class="mote" style="left:66%;bottom:10%;animation-delay:-6s"></div><div class="mote" style="left:86%;bottom:14%;animation-delay:-1.5s"></div>
  <div class="floor" id="floor"></div>
</div>
<canvas id="cv"></canvas>
<div id="hud"><div class="row"><div id="lvchip" class="kk-chip"></div><div id="time" class="kk-chip"></div><div id="tank" class="kk-chip"></div></div><div id="goal"><i></i></div></div>
<div id="ready"><div class="card"><h2 id="rdT"></h2><div class="g"><img id="rdI" src="assets/kids/fx/tropical-fish.webp" alt=""><span id="rdN"></span></div><div class="w" id="rdW"></div></div></div>
<div id="codes">CODES ON</div>
<script src="kit/kidskit.js"></script>
<script>
(function () {
'use strict';
var KKs = window.KK, SDK = window.ArcadeSDK || null, h = KKs.h, img = KKs.img;
var $ = function (id) { return document.getElementById(id); };
var IMG = function (n) { return KKs.imgUrl(n); };

/* ======================= creatures, skins, worlds ======================= */
function A(id, name, w) { return { id: id, img: id, name: name, w: w }; }
var ANIMALS = [A('tropical-fish', 'Fish', 0), A('blowfish', 'Puffer fish', 0), A('crab', 'Crab', 0), A('turtle', 'Turtle', 0), A('dolphin', 'Dolphin', 0), A('seal', 'Seal', 0),
  A('octopus', 'Octopus', 1), A('squid', 'Squid', 1), A('shrimp', 'Shrimp', 1), A('lobster', 'Lobster', 1), A('oyster', 'Oyster', 1),
  A('spouting-whale', 'Whale', 2), A('shark', 'Shark', 2), A('jellyfish', 'Jellyfish', 2), A('penguin', 'Penguin', 2), A('otter', 'Otter', 2)];
var SKINS = [
  { id: 'glass', img: 'bubbles', name: 'Glass', need: 0, tint: [200, 240, 255] }, { id: 'rainbow', img: 'rainbow', name: 'Rainbow', need: 5, tint: [255, 255, 255], irid: true },
  { id: 'gold', img: 'glowing-star', name: 'Gold', need: 10, tint: [255, 214, 110] }, { id: 'pearl', img: 'gem-stone', name: 'Pearl', need: 16, tint: [255, 192, 222] },
  { id: 'galaxy', img: 'ringed-planet', name: 'Galaxy', need: 24, tint: [170, 150, 255], stars: true }];
var PRIZES = [{ id: 'p1', img: 'seedling', name: 'Sprout', need: 3 }, { id: 'p2', img: 'trophy', name: 'Trophy', need: 20 }, { id: 'p3', img: 'crown', name: 'Crown', need: 36 }];
var ALBUM = SKINS.concat(PRIZES);
var P = KKs.profile('bubble_kk', { album: ALBUM, dailyGoal: 3, dailyBonus: 3 });
if (!P.d.found) P.d.found = {};
var WORLDS = ['Sunny Shallows', 'Coral Reef', 'Deep Blue']; var NLEV = 15;

/* ======================= levels ======================= */
//<levels>
function levelCfg(n) {
  var w = Math.floor((n - 1) / 5), time = n <= 3 ? 40 : 45, rate = 0.9 + n * 0.11, speed = 105 + n * 9;
  var pool = Math.min(16, 3 + Math.floor(n * 0.9)), species = n % 2 === 0;       // even levels: free one kind of animal
  return { n: n, world: w, boss: n % 5 === 0, time: time, rate: rate, speed: speed, dmin: Math.round(76 - n * 1.4), dmax: Math.round(102 - n * 1.6), pool: pool, species: species,
    clock: n >= 2 ? 0.05 : 0, rainbow: n >= 4 ? 0.045 : 0, big: n >= 6 ? 0.09 : 0, maxB: Math.min(16, 6 + n) };
}
function goalsFor(c) {
  var E = c.time * c.rate, base = c.species ? E * 0.42 : E * 0.95, fr = c.species ? [0.36, 0.55, 0.75] : [0.3, 0.45, 0.6];
  var a = Math.max(3, Math.round(base * fr[0])), b = Math.max(a + 1, Math.round(base * fr[1])), d = Math.max(b + 1, Math.round(base * fr[2]));
  return [a, b, d];
}
//</levels>
var LV = []; for (var i = 1; i <= NLEV; i++) { var lc = levelCfg(i); lc.goals = goalsFor(lc); LV.push(lc); }

/* ======================= sprites: a glass bubble drawn once per size and skin ======================= */
var cv = $('cv'), cx = cv.getContext('2d'), DPR = 1, VW = 390, VH = 664;
var spriteCache = {}, animalImgs = {};
function animalImg(id) { if (!animalImgs[id]) { var i = new Image(); i.src = IMG(id); animalImgs[id] = i; } return animalImgs[id]; }
function skinOf() { var id = P.eqp('skin', 'glass'); return SKINS.filter(function (s) { return s.id === id; })[0] || SKINS[0]; }
function bubbleSprite(r, skin, kind) {
  var key = skin.id + ':' + Math.round(r) + ':' + kind; if (spriteCache[key]) return spriteCache[key];
  var R = Math.round(r * DPR), S = R * 2 + 8, c = document.createElement('canvas'); c.width = c.height = S; var g = c.getContext('2d'), m = S / 2, t = skin.tint;
  var tint = kind === 'gold' ? [255, 214, 110] : kind === 'clock' ? [190, 240, 190] : kind === 'rainbow' ? [255, 255, 255] : t;
  var body = g.createRadialGradient(m, m, R * 0.5, m, m, R);
  body.addColorStop(0, 'rgba(' + tint + ',0.03)'); body.addColorStop(.7, 'rgba(' + tint + ',0.10)'); body.addColorStop(.9, 'rgba(' + tint + ',0.32)'); body.addColorStop(1, 'rgba(255,255,255,0.78)');
  g.fillStyle = body; g.beginPath(); g.arc(m, m, R, 0, 6.283); g.fill();
  if (skin.irid || kind === 'rainbow') {   // soap-film colours
    var fr = g.createLinearGradient(m - R, m - R, m + R, m + R); fr.addColorStop(0, 'rgba(255,120,200,.42)'); fr.addColorStop(.3, 'rgba(120,200,255,.32)'); fr.addColorStop(.6, 'rgba(255,240,120,.3)'); fr.addColorStop(1, 'rgba(160,255,190,.4)');
    g.strokeStyle = fr; g.lineWidth = R * 0.22; g.beginPath(); g.arc(m, m, R * 0.86, 0, 6.283); g.stroke();
  }
  if (skin.stars) { g.fillStyle = 'rgba(255,255,255,.85)'; for (var k = 0; k < 9; k++) { var a = k * 2.4, d = R * (0.3 + (k % 4) * 0.15); g.beginPath(); g.arc(m + Math.cos(a) * d, m + Math.sin(a) * d, Math.max(1, R * 0.03 * (1 + k % 2)), 0, 6.283); g.fill(); } }
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = Math.max(1.5, R * 0.035); g.beginPath(); g.arc(m, m, R - 1.5, 0, 6.283); g.stroke();
  var crs = g.createLinearGradient(m + R * 0.2, m + R * 0.4, m + R * 0.7, m + R * 0.9); crs.addColorStop(0, 'rgba(120,220,255,0)'); crs.addColorStop(.6, 'rgba(160,230,255,.5)'); crs.addColorStop(1, 'rgba(255,240,170,.6)');   // bottom refraction
  g.strokeStyle = crs; g.lineWidth = R * 0.09; g.beginPath(); g.arc(m, m, R * 0.86, 0.35, 1.5); g.stroke();
  g.save(); g.translate(m - R * 0.38, m - R * 0.42); g.rotate(-0.6); var hl = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.34); hl.addColorStop(0, 'rgba(255,255,255,.95)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = hl; g.beginPath(); g.ellipse(0, 0, R * 0.32, R * 0.15, 0, 0, 6.283); g.fill(); g.restore();
  g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(m + R * 0.44, m + R * 0.4, R * 0.07, 0, 6.283); g.fill();
  return (spriteCache[key] = c);
}

/* ======================= state ======================= */
var state = 'title', cur = 1, cfg = null, bubbles = [], parts = 0, raf = 0, lastTs = 0, timeLeft = 0, spawnT = 0, freed = 0, counted = 0, points = 0, combo = 0, lastPop = 0, goalStars = 0, tickSec = -1, target = null, pool = [];
var cheats = { slow: false, big: false, nobig: false }, cheated = false, tut = null, newFound = [], pressed = false, hintTxt = 'Tap the bubbles to set the animals free!';
var chLv = KKs.ui.chip('sparkles', ''), chTime = KKs.ui.chip('alarm-clock', 0), chTank = KKs.ui.chip('tropical-fish', '0');
$('lvchip').replaceWith(chLv.el); chLv.el.id = 'lvchip'; $('time').replaceWith(chTime.el); chTime.el.id = 'time'; $('tank').replaceWith(chTank.el); chTank.el.id = 'tank';
function gs(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); VW = window.innerWidth; VH = window.innerHeight; cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); spriteCache = {}; }
window.addEventListener('resize', function () { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });

/* ---------- the sea scenery ---------- */
function causticTexture() {   // a soft web of light, made once from a few crossing waves
  try {
    var S = 128, c = document.createElement('canvas'); c.width = c.height = S; var g = c.getContext('2d'), d = g.createImageData(S, S);
    for (var y = 0; y < S; y++) for (var x = 0; x < S; x++) { var u = x / S * 6.283, v = y / S * 6.283, a = Math.sin(u * 2 + Math.sin(v * 3) * 1.3) + Math.sin(v * 2 + Math.sin(u * 3 + 1) * 1.3) + Math.sin((u + v) * 3), w = Math.max(0, 1 - Math.abs(a) * 1.3), i = (y * S + x) * 4; d.data[i] = 255; d.data[i + 1] = 255; d.data[i + 2] = 255; d.data[i + 3] = Math.round(w * w * 255); }
    g.putImageData(d, 0, 0); $('caus').style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
  } catch (e) {}
}
var PROPS = [[['coral', 6, 60, 0], ['spiral-shell', 44, 40, 0], ['seedling', 78, 52, 1], ['coral', 88, 46, 0]], [['coral', 8, 74, 0], ['seedling', 30, 56, 1], ['coral', 64, 66, 0], ['spiral-shell', 90, 40, 0], ['seedling', 46, 50, 1]], [['coral', 10, 70, 0], ['anchor', 56, 60, 0], ['seedling', 84, 58, 1], ['spiral-shell', 34, 40, 0]]];
function setWorld(w) {
  $('sea').className = 'w' + w; document.querySelector('meta[name=theme-color]').content = ['#1b83a0', '#167a8f', '#0e4374'][w]; document.body.style.background = ['#0e4a6b', '#0a3a5c', '#061a3c'][w];
  var f = $('floor'); f.innerHTML = '';
  PROPS[w].forEach(function (p) { var e = h('img', { src: IMG(p[0]), alt: '', class: 'prop' + (p[3] ? ' sw' : '') }); e.style.cssText = 'left:' + p[1] + '%;width:' + p[2] + 'px;height:' + p[2] + 'px;bottom:calc(100% - ' + (p[2] * 0.72) + 'px);position:absolute;margin-left:-' + (p[2] / 2) + 'px'; if (w === 2) e.style.filter = 'hue-rotate(-30deg) brightness(.75) drop-shadow(-8px 6px 5px rgba(0,10,30,.6))'; f.appendChild(e); });
}

/* ======================= screens ======================= */
function clearUI() { document.querySelectorAll('.kk-title,.kk-map,.kk-album,.kk-scrim,.kk-coach,.kk-finger').forEach(function (e) { e.remove(); }); }
function heroEl() {
  var wrap = h('div', { id: 'titleHero' }), defs = [['tropical-fish', 0, 24, 120], ['dolphin', 92, 84, 150], ['turtle', 176, 30, 110]];
  defs.forEach(function (d, i) { var b = h('div', { class: 'bub' }, [img(d[0])]); b.style.cssText = 'left:' + d[1] + 'px;top:' + d[2] + 'px;width:' + d[3] + 'px;height:' + d[3] + 'px;animation-delay:' + (-i * .9) + 's'; wrap.appendChild(b); });
  var b2 = h('div', { class: 'bub' }, [img('octopus')]); b2.style.cssText = 'left:16px;top:108px;width:92px;height:92px;animation-delay:-2s'; wrap.appendChild(b2);
  var b3 = h('div', { class: 'bub' }, [img('crab')]); b3.style.cssText = 'left:214px;top:130px;width:84px;height:84px;animation-delay:-1.2s'; wrap.appendChild(b3);
  return wrap;
}
function foundCount() { return Object.keys(P.d.found).length; }
function showTitle() {
  stopLoop(); clearUI(); state = 'title'; cv.classList.remove('on'); $('hud').classList.remove('on'); $('ready').classList.remove('on'); $('codes').style.display = 'none';
  var nxt = P.next(NLEV), fresh = P.cleared() === 0; setWorld(LV[nxt - 1].world);
  KKs.ui.title(document.body, { title: 'Bubble Pop', tagline: fresh ? 'Set the animals free!' : WORLDS[LV[nxt - 1].world] + ' - level ' + nxt, heroEl: heroEl(), profile: P,
    playLabel: fresh ? 'Play' : 'Level ' + nxt, onPlay: function () { startLevel(nxt); }, onMap: showMap, onAlbum: showAlbum, albumLabel: 'Aquarium', albumPic: 'tropical-fish', onHelp: showHelp, dot: (P.d.seen.albumN || 0) < foundCount() + P.unlockedIds().length ? '!' : '' });
  gs('title', { score: P.d.hi || 0 });
}
function showMap() { KKs.ui.map(document.body, { profile: P, title: 'Levels', levels: LV.map(function (l) { return { n: l.n, boss: l.boss, banner: (l.n - 1) % 5 === 0 ? WORLDS[l.world] : null }; }), onPick: function (n) { startLevel(n); } }); }
function showAlbum() {
  P.d.seen.albumN = foundCount() + P.unlockedIds().length; P.save();
  var secs = [{ title: 'Aquarium', items: ANIMALS, isOpen: function (it) { return !!P.d.found[it.id]; }, lockHint: 'Set this one free to find it!', caption: true }, { title: 'Bubble looks', slot: 'skin', def: 'glass', items: SKINS }, { title: 'Prizes', items: PRIZES }];
  KKs.ui.album(document.body, { profile: P, title: 'Aquarium', sections: secs, onEquip: function () { spriteCache = {}; }, onClose: function () { if (state === 'title') showTitle(); } });
  var t = document.querySelector('.kk-title'); if (t) t.remove();
}
function showHelp() { KKs.ui.help({ steps: [{ pic: 'bubbles', text: 'Tap a bubble to pop it.' }, { pic: 'tropical-fish', text: 'Set the animal free!' }, { pic: 'star', text: 'Free lots to win stars.' }] }); }

/* ======================= playing ======================= */
function startLevel(n, opts) {
  clearUI(); cur = Math.max(1, Math.min(NLEV, n | 0)); cfg = LV[cur - 1]; state = 'ready'; bubbles = []; freed = 0; counted = 0; points = 0; combo = 0; goalStars = 0; tickSec = -1; spawnT = 0.4;
  cheated = !!(SDK && SDK.cheated) || cheats.slow || cheats.big || cheats.nobig; newFound = [];
  timeLeft = cfg.time; pool = ANIMALS.filter(function (a) { return a.w <= cfg.world; }).slice(0, cfg.pool); if (pool.length < 3) pool = ANIMALS.slice(0, 3);
