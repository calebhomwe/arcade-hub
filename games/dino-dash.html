<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<div id="stage">
  <canvas id="cv"></canvas>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const SDK = window.ArcadeSDK || null;
function scene(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
const cheated = () => !!(SDK && SDK.cheated);
const RM = FX.rm();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
const rd = k => { const v = +lsGet(k); return Number.isFinite(v) && v > 0 ? v : 0; };
let topLevel = false; try { topLevel = window.parent === window; } catch (e) {}
const setBack = on => { if (topLevel) $('back').classList.toggle('hidden', !on); };

/* ---------------------------------------------------------------- world */
const W = 420; let H = 760, GY = 520, SC = 1, CSSW = 390, CSSH = 760, Q = 2;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const assets = {}, sky = Art.Sky();
function fit() {
  const vv = window.visualViewport, vw = Math.max(240, vv ? vv.width : innerWidth), vh = Math.max(320, vv ? vv.height : innerHeight);
  const A = Math.min(2.15, Math.max(1.5, vh / vw));
  CSSW = Math.floor(Math.min(vw, vh / A)); CSSH = Math.floor(CSSW * A);
  stage.style.width = CSSW + 'px'; stage.style.height = CSSH + 'px';
  SC = CSSW / W; H = Math.round(W * A); GY = Math.round(H * 0.66);
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(CSSW * d); cv.height = Math.round(CSSH * d);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  const q = Math.min(2, Math.max(1, d * SC));
  if (Math.abs(q - Q) > 0.3 || !assets.far || assets.gy !== GY) { Q = q; buildAssets(); }
}

/* ---------------------------------------------------------------- state */
const DW = 44, DH = 58, DDH = 30, DX = 78;   // dino hitbox width, standing / ducking height, x
let state = 'title', score = 0, t = 0, dist = 0, cleared = 0, bonesRun = 0, lastMile = 0, lastMedal = 0, medalShown = 0, jumpsRun = 0, flash = 0;
let dino = { y: 0, vy: 0, grounded: true, jumps: 0, duck: 0, held: false, pop: 0, ang: 0 };
let obs = [], bones = [], shields = [], magnets = [], spawnT = 1.4, boneT = 4, shieldT = 8, magT = 12;
let shield = 0, invuln = 0, magnetT = 0, ironhide = false, slowmo = false, magnetCode = false, runT = 0, groundX = 0, farX = 0, midX = 0, treeX = 0, tuftX = 0, cloudsX = 0;
let bestDist = rd('dinoBest'), totalYards = rd('dinoYards'), runs = rd('dinoRuns'), totalBones = rd('dinoBones'), totalMedals = rd('dinoMedals');
let muted = lsGet('dinoMute') === '1', tutSeen = lsGet('dinoTut') === '1', touchY = null;
const shake = new FX.Shake({ maxOffset: 14, maxAngle: 0.02 }), timeFx = new FX.Time(), landSpring = new FX.Spring(300, 14), parts = new FX.Particles(200), pops = new FX.Pops(14);
const MIN_REACT = 0.58, PHASE_DIST = 250;
const spd = () => 285 + Math.min(dist * 0.075, 300);

/* ---------------------------------------------------------------- dinos: nine skins from one drawing routine */
const SKINS = [
  { id: 'rexy', name: 'Rexy', cost: 0, body: ['#a4d96a', '#5fa84a', '#2f6a2c'], belly: '#eaf3b4', spike: '#f08a34', eye: '#f6d33c' },
  { id: 'bluey', name: 'Bluey', cost: 30, body: ['#8ad0f2', '#3f9ad6', '#1f5c98'], belly: '#e2f4ff', spike: '#f4b93a', eye: '#fff' },
  { id: 'rosie', name: 'Rosie', cost: 70, body: ['#ffb6cf', '#ea6f9c', '#b03a68'], belly: '#ffe8f0', spike: '#8a5ad0', eye: '#fff', acc: 'bow' },
  { id: 'sunny', name: 'Bandit', cost: 120, body: ['#ffd27a', '#f29a2c', '#b5581a'], belly: '#fff0c8', spike: '#7a4a2a', eye: '#fff', acc: 'bandana' },
  { id: 'explorer', name: 'Explorer', cost: 190, body: ['#a4d96a', '#5fa84a', '#2f6a2c'], belly: '#eaf3b4', spike: '#f08a34', eye: '#f6d33c', acc: 'safari' },
  { id: 'lava', name: 'Lava', cost: 270, body: ['#e0603c', '#a8281c', '#5a0f0c'], belly: '#ffb070', spike: '#ffd23c', eye: '#ffe066', trail: 'ember' },
  { id: 'fossil', name: 'Fossil', cost: 360, body: ['#f4ecd8', '#cdbf9a', '#8f8058'], belly: '#fff8e6', spike: '#a89670', eye: '#3a2a18', acc: 'ribs' },
  { id: 'golden', name: 'Golden', cost: 0, req: { stat: 'best', v: 1000, text: 'Run 1,000 m for the Golden dino' }, body: ['#fff2a8', '#f2c230', '#a8720a'], belly: '#fff8d0', spike: '#fff', eye: '#7a4a08', trail: 'sparkle' },
  { id: 'crystal', name: 'Crystal', cost: 0, req: { stat: 'best', v: 1500, text: 'Run 1,500 m for the Crystal dino' }, body: ['#c8f4ff', '#7ab6f0', '#5a4ad0'], belly: '#f0fbff', spike: '#e6a8ff', eye: '#fff', trail: 'sparkle', acc: 'gem' },
];
function drawDino(c, sk, x, gy, s, pose, tm, sqx, sqy) {
  c.save(); c.translate(x, gy); c.scale(s * sqx, s * sqy);
  const ph = tm * 17, run = pose === 'run', duck = pose === 'duck', jump = pose === 'jump';
  const by = duck ? -21 : -34, bp = Math.sin(tm * 9);
  // ground shadow
  if (pose !== 'jump') { c.fillStyle = 'rgba(30,15,5,.3)'; c.beginPath(); c.ellipse(2, 1, 30, 5, 0, 0, 6.283); c.fill(); }
  // tail (behind)
  let g = c.createLinearGradient(-44, by, -10, by); g.addColorStop(0, sk.body[2]); g.addColorStop(1, sk.body[1]);
  c.fillStyle = g; c.beginPath(); c.moveTo(-14, by - 8); c.quadraticCurveTo(-32, by - 9 + Math.sin(tm * 8) * 3, -50, by - 4 + Math.sin(tm * 8 + 1) * 5 - (duck ? 0 : 6)); c.quadraticCurveTo(-30, by + 6, -12, by + 12); c.closePath(); c.fill();
  // far-side leg then near-side leg
  for (let i = 1; i >= 0; i--) {
    const f = ph + i * Math.PI, fx = jump ? 4 + i * 5 : Math.sin(f) * 10, lift = jump ? 12 : run ? Math.max(0, Math.cos(f)) * 10 : duck ? Math.max(0, Math.cos(f)) * 5 : 0, hipx = -3 + i * 6, hipy = by + 6;
    c.strokeStyle = i ? sk.body[1] : sk.body[2]; c.lineCap = 'round'; c.lineWidth = 9;
    c.beginPath(); c.moveTo(hipx, hipy); c.quadraticCurveTo(hipx + fx * 0.4 + 5, hipy + 12, hipx + fx, -lift - 2); c.stroke();
    c.fillStyle = i ? sk.body[2] : '#1f3a1c'; c.globalAlpha = 0.85; c.beginPath(); c.ellipse(hipx + fx + 4, -lift - 1.5, 8, 3.6, 0, 0, 6.283); c.fill(); c.globalAlpha = 1;
    c.fillStyle = 'rgba(255,240,200,.9)'; c.beginPath(); c.arc(hipx + fx + 10, -lift - 1.5, 1.4, 0, 6.283); c.fill();
  }
  // back spikes
  c.fillStyle = sk.spike; for (let i = 0; i < 6; i++) { const sx = -16 + i * 6.4, sy = by - 15 + Math.abs(i - 2.5) * 0.9; c.beginPath(); c.moveTo(sx - 3.4, sy + 1); c.lineTo(sx + 0.6, sy - 9 - (i === 2 || i === 3 ? 2 : 0)); c.lineTo(sx + 3.6, sy + 1); c.closePath(); c.fill(); }
  if (sk.trail === 'ember') { c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(255,170,40,.55)'; for (let i = 0; i < 6; i++) { const sx = -16 + i * 6.4; c.beginPath(); c.arc(sx, by - 17, 5, 0, 6.283); c.fill(); } c.restore(); }
  // torso
  g = c.createRadialGradient(6, by - 9, 3, 0, by, 27); g.addColorStop(0, sk.body[0]); g.addColorStop(0.55, sk.body[1]); g.addColorStop(1, sk.body[2]);
  c.fillStyle = g; c.beginPath(); c.ellipse(0, by, 25, 16.5, -0.1, 0, 6.283); c.fill();
  c.save(); c.beginPath(); c.ellipse(0, by, 25, 16.5, -0.1, 0, 6.283); c.clip();
  c.fillStyle = sk.belly; c.beginPath(); c.ellipse(7, by + 11, 22, 8.5, -0.1, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 1; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-6 + i * 8, by + 5); c.lineTo(-4 + i * 8, by + 16); c.stroke(); }
  c.fillStyle = 'rgba(255,240,190,.32)'; c.beginPath(); c.ellipse(8, by - 12, 13, 3.6, -0.3, 0, 6.283); c.fill();
  if (sk.acc === 'ribs') { c.strokeStyle = 'rgba(90,70,40,.55)'; c.lineWidth = 2; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(-10 + i * 7, by - 2, 9 - i * 0.5, 0.25, 2.7); c.stroke(); } }
  c.restore();
  // neck + head (bobs with the stride)
  const hy = by - 20 + (run ? Math.sin(ph * 2) * 1.6 : 0) + (duck ? 3 : 0);
  g = c.createLinearGradient(0, hy - 10, 0, hy + 14); g.addColorStop(0, sk.body[0]); g.addColorStop(1, sk.body[1]);
  c.fillStyle = g; c.beginPath(); c.moveTo(10, by - 8); c.quadraticCurveTo(20, hy + 8, 24, hy - 4); c.lineTo(30, hy + 8); c.quadraticCurveTo(22, by + 4, 16, by + 8); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(30, hy - 4, 15, 12, 0.08, 0, 6.283); c.fill();
  c.beginPath(); c.ellipse(41, hy + 0.5, 11.5, 7.2, 0.06, 0, 6.283); c.fill();
  c.fillStyle = sk.belly; c.beginPath(); c.ellipse(40, hy + 5.5, 10, 3.6, 0.05, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(40,10,0,.6)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(31, hy + 4.4); c.quadraticCurveTo(42, hy + 6.8, 51, hy + 3.2); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(40, hy + 4.6); c.lineTo(42, hy + 8); c.lineTo(44, hy + 4.8); c.closePath(); c.moveTo(46, hy + 4.4); c.lineTo(47.6, hy + 7.4); c.lineTo(49.2, hy + 4.2); c.closePath(); c.fill();
  c.fillStyle = 'rgba(40,10,0,.6)'; c.beginPath(); c.arc(50, hy - 2.4, 1.3, 0, 6.283); c.fill();
  c.fillStyle = sk.eye === '#fff' ? '#fffdf4' : sk.eye; c.strokeStyle = 'rgba(30,20,0,.6)'; c.lineWidth = 1; c.beginPath(); c.arc(34, hy - 7, 5.2, 0, 6.283); c.fill(); c.stroke();
  c.fillStyle = '#1b1208'; c.beginPath(); c.ellipse(35.4, hy - 6.8, 1.6, 3.4, 0, 0, 6.283); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(36.2, hy - 8.4, 1, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(30,20,0,.55)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(29, hy - 11); c.quadraticCurveTo(34, hy - 14, 39, hy - 10.6); c.stroke();
  // tiny arm
  c.strokeStyle = sk.body[1]; c.lineWidth = 3.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(16, by + 2); c.lineTo(23, by + 6 + Math.sin(ph) * 1.5); c.stroke();
  c.strokeStyle = 'rgba(255,225,160,.65)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(0, by, 24.4, 16, -0.1, -1.35, -0.3); c.stroke();

  grab(bones, (b, by) => { bonesRun++; meta.add('bones', 1); $('bcount').textContent = bonesRun; const c = $('bones'); if (!RM) { c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); } snd('coin', { volume: 0.5, rate: 1 + Math.min(bonesRun, 10) * 0.04 }); pops.add(b.x, by - 16, '+1', { color: '#fff1c0', size: 22 }); parts.emit(b.x, by, { n: 8, colors: ['#fff6d8', '#ffe08a', '#e8c48a'], speed: [50, 160], life: 0.5, size: [2, 4.5], gravity: 60, shape: 'star' }); FX.haptic(7); }, 26);
  grab(shields, (b, by) => { if (shield < 2) shield++; snd('powerup'); pops.add(b.x, by - 18, 'Shield!', { color: '#ffd35a', size: 22 }); parts.emit(b.x, by, { n: 12, colors: ['#ffd35a', '#ff9a3c', '#fff'], speed: [60, 190], life: 0.6, size: [2, 5], gravity: 20, shape: 'star' }); paintPower(); }, 28);
  grab(magnets, (b, by) => { magnetT = 7; snd('powerup', { rate: 1.2 }); pops.add(b.x, by - 18, 'Magnet!', { color: '#9be8ff', size: 22 }); parts.emit(b.x, by, { n: 12, colors: ['#9be8ff', '#fff'], speed: [60, 190], life: 0.6, size: [3, 6], gravity: 0, shape: 'ring' }); paintPower(); }, 28);
  if (magnetT > 0) { magnetT -= dt; if (Math.floor(magnetT * 2) !== Math.floor((magnetT + dt) * 2)) paintPower(); }
}
const mode2 = false;

/* ---------------------------------------------------------------- draw */
function tile(img, ox, y, h) { const iw = W * 2; let x = -Math.floor(ox % iw); if (x > 0) x -= iw; for (; x < W; x += iw) ctx.drawImage(img, x, y, iw + 1, h); }
function draw() {
  ctx.save(); shake.apply(ctx, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40);
  const ph = sky.draw(ctx, W, GY, dist / PHASE_DIST, t), star = ph.star;
  for (let i = 0; i < 5; i++) { const c = assets.clouds[i], w = c.width / Q, cx = ((i * 190 - cloudsX * (0.5 + i * 0.16)) % (W + 240) + W + 240) % (W + 240) - 120, cy = 60 + ((i * 97) % 5) * 46 + i * 8; ctx.globalAlpha = 0.9 - i * 0.05 - star * 0.6; if (ctx.globalAlpha > 0.02) ctx.drawImage(c, cx - w / 2, cy, w, c.height / Q); }
  ctx.globalAlpha = 1;

  // the run-way: ground first, then everything that stands on it
  const gh = H - GY + 14, gx0 = -Math.floor(groundX % W); for (let gx = gx0; gx < W; gx += W) ctx.drawImage(assets.ground, gx, GY - 2, W + 1, gh);
  const tn = sky.tint(ph); if (tn) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tn; ctx.fillRect(0, GY - 260, W, H - GY + 260); ctx.restore(); }
  // shadows under obstacles, then obstacles

      const f = assets.ptero[((o.fr | 0) % 4 + 4) % 4], oy = GY - o.y - o.h; ctx.drawImage(f, o.x - 55 + 8, oy - 20, 110, 64); continue;
    }
    if (OB[o.type].k) { const im = assets.cactus[OB[o.type].k], w = im.width / Q, h = im.height / Q; ctx.drawImage(im, o.x - w / 2, GY - h + 3, w, h); }
    else if (o.type === 'rock') ctx.drawImage(assets.rock, o.x - 30, GY - 42, 60, 46);
    else ctx.drawImage(assets.log, o.x - 46, GY - 30, 92, 34);
  }
  for (const b of bones) { const y = GY - b.y + Math.sin(t * 3 + b.ph) * 4; ctx.save(); ctx.translate(b.x, y); ctx.rotate(Math.sin(t * 2 + b.ph) * 0.2); ctx.drawImage(assets.bone, -20, -20, 40, 40); ctx.restore(); }
  for (const b of shields) ctx.drawImage(assets.amber, b.x - 22, GY - b.y - 22 + Math.sin(t * 3) * 4, 44, 44);
  for (const b of magnets) ctx.drawImage(assets.magnet, b.x - 22, GY - b.y - 22 + Math.sin(t * 3 + 1) * 4, 44, 44);
  // dino
  const sk = skinNow(), pose = state === 'dead' ? 'jump' : !dino.grounded ? 'jump' : ((dino.duck > 0 || dino.held) ? 'duck' : (state === 'run' || state === 'play' || state === 'title' || state === 'ready') ? 'run' : 'idle');
  const sq = FX.squash(landSpring.x + (dino.pop > 0 ? 0 : 0)); ctx.save(); if (invuln > 0 && state === 'play') ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 40);
  if (state === 'dead') { ctx.translate(DX, GY + dino.y - 30); ctx.rotate(dino.ang); ctx.translate(-DX, -(GY + dino.y - 30)); }
  const slow = state === 'title' || state === 'ready' ? 0.55 : 1;
  drawDino(ctx, sk, DX, GY + dino.y, 1.16, pose, t * slow * (dino.grounded ? 1 : 0.3), sq.sx, sq.sy);
  if (shield > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(255,205,90,' + (invuln > 0 ? 0.3 : 0.75) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(DX + 8, GY + dino.y - 32, 40 + Math.sin(t * 6) * 2, 0, 6.283); ctx.stroke(); ctx.fillStyle = 'rgba(255,190,70,.12)'; ctx.fill(); }
  if (magnetT > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(120,220,255,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(DX + 8, GY + dino.y - 32, 48 + Math.sin(t * 8) * 3, 0, 6.283); ctx.stroke(); }
  ctx.restore();
  // foreground tufts in front of the dino, a little faster than the ground
  const tx0 = -Math.floor(tuftX % W); for (let x = tx0; x < W; x += W) ctx.drawImage(assets.tufts, x, GY - 14, W + 1, 44);
  if (tn) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tn; ctx.globalAlpha = 0.55; ctx.fillRect(0, GY - 160, W, 190); ctx.restore(); }

}
let last = 0;
function loop(now) { requestAnimationFrame(loop); if (document.hidden) { last = 0; return; } const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now; update(dt); draw(); }

/* ---------------------------------------------------------------- input: tap = jump, hold DUCK or swipe down = duck */
stage.addEventListener('pointerdown', e => {
  if (SDK && SDK.paused) return; if (e.target.closest('button,a,.hm,#metaHost')) return;
  touchY = e.clientY;
  if (state === 'title') getReady(false); else if (state === 'ready') go(); else if (state === 'play') jump();
});
stage.addEventListener('pointermove', e => { if (touchY === null || state !== 'play') return; if (e.clientY - touchY > 30) { duckOn(500); touchY = null; } });
addEventListener('pointerup', () => { touchY = null; });
const duckBtn = $('duck');
duckBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); if (state !== 'play') { if (state === 'ready') go(); return; } dino.held = true; duckBtn.classList.add('on'); if (!dino.grounded) duckOn(0); try { duckBtn.setPointerCapture(e.pointerId); } catch (x) {} });
const duckOff = () => { dino.held = false; duckBtn.classList.remove('on'); };
duckBtn.addEventListener('pointerup', duckOff); duckBtn.addEventListener('pointercancel', duckOff); duckBtn.addEventListener('lostpointercapture', duckOff);
addEventListener('keydown', e => {

addEventListener('keyup', e => { if (e.key === 'ArrowDown' || e.key === 's') dino.held = false; });
$('playBtn').addEventListener('click', e => { e.stopPropagation(); getReady(false); });

/* ---------------------------------------------------------------- codes, hints, SDK */
const CODES = { IRONHIDE: 'Iron hide: obstacles bounce off you', BONEMAGNET: 'Bone magnet stays on for the whole run', SLOWMO: 'Slow motion: the canyon runs at 60% speed' };
function code(c) { if (!CODES[c]) return { ok: false }; $('codes').classList.remove('hidden'); if (c === 'IRONHIDE') ironhide = true; if (c === 'BONEMAGNET') magnetCode = true; if (c === 'SLOWMO') slowmo = true; return { ok: true, message: CODES[c] }; }

if (SDK) SDK.init({ pauseButton: 'br', onRestart: () => getReady(false), onExit: showTitle, onTutorial: () => getReady(true), onHint: hint, onCheat: code });
