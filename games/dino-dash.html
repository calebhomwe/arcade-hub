<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dino Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% -20%,#164e63,#0f0f23 60%,#07070f);display:flex;align-items:flex-start;justify-content:center;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none}
.back{position:fixed;top:12px;left:14px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:800;z-index:10}
.wrap{position:relative;margin-top:clamp(60px,16vh,150px)}
canvas{display:block;max-width:100vw;max-height:100dvh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);touch-action:none}
.mute{position:fixed;top:12px;right:14px;z-index:10;width:44px;height:44px;border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.hud{position:absolute;top:12px;right:66px;color:#fff;font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:5;pointer-events:none;text-align:right}
.hud small{display:block;font-size:12px;font-weight:700;opacity:.8}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.hud.pop{animation:pop .22s ease-out}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.74);backdrop-filter:blur(4px);border-radius:14px;z-index:6;text-align:center}
.ov h1{font-size:44px;font-weight:900;color:#fff;letter-spacing:-1px}
.ov h1 span{color:#4ade80}
.ov .sub{color:#cbd5e1;font-size:15px;line-height:1.5;padding:0 26px}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#4ade80,#38bdf8);color:#06281c;font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;box-shadow:0 8px 24px rgba(74,222,128,.35)}
.btn:active{transform:scale(.94)}
.stat{color:#e2e8f0;font-size:17px;font-weight:700}
.best{color:#4ade80;font-weight:800}
.nb{color:#facc15;font-size:14px;font-weight:900;letter-spacing:2px}
.hidden{display:none}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button class="mute" id="muteBtn">🔊</button>
<div class="wrap">
  <div class="hud" id="hud">0<small>BEST 0</small></div>
  <canvas id="cv" width="420" height="260"></canvas>
  <div class="ov" id="start">
    <h1>Dino <span>Dash</span></h1>
    <div class="sub">Tap or Space to jump (twice for double jump). Swipe down or press ↓ to duck!</div>
    <button class="btn" id="playBtn">▶ Play</button>
  </div>
  <div class="ov hidden" id="over">
    <h1>Game Over</h1>
    <div class="stat">Distance: <b id="finScore">0</b></div>
    <div class="stat">Cleared: <b id="finCleared">0</b></div>
    <div class="stat">Bones: <b id="finBones">0</b> · total <b id="finBonesT">0</b></div>
    <div class="stat">Medals: <b id="finMedals">0</b> · total <b id="finMedalsT">0</b></div>
    <div class="stat">Lifetime: <b id="finLife">0</b> m · <b id="finRuns">0</b> runs</div>
    <div class="stat">Best: <b class="best" id="finBest">0</b></div>
    <div class="nb hidden" id="newBest">★ NEW BEST ★</div>
    <button class="btn" id="againBtn">Play Again</button>
  </div>
  <div class="ov hidden" id="pause">
    <h1>Paused</h1>
    <div class="sub">Tap or press P to resume</div>
  </div>
</div>
<script src="kit/juicekit.js"></script>
<script>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=420,H=260,GY=212;
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
const dayG=ctx.createLinearGradient(0,0,0,H);dayG.addColorStop(0,'#38bdf8');dayG.addColorStop(1,'#d6f3ff');
const nightG=ctx.createLinearGradient(0,0,0,H);nightG.addColorStop(0,'#0b1226');nightG.addColorStop(1,'#24304f');
function rd(k){const v=+localStorage.getItem(k);return Number.isFinite(v)&&v>0?v:0;}
let state='ready',dist=0,best=rd('dinoBest'),t=0,spawnT=1,shake=0,flash=0,lastMile=0,lastFd=-1,lastBv=-1,nightMix=0,runT=0,cleared=0,dirty=true;
let dino={x:56,y:GY-44,w:38,h:44,vy:0,grounded:true,jumps:0,duck:0,pop:0};
let shield=0,invuln=0,featherT=7;
const feathers=[];
let bonesRun=0,totalBones=+localStorage.getItem('dinoBones')||0,boneT=4;
let lastMedal=0,medalsRun=0,totalMedals=+localStorage.getItem('dinoMedals')||0,totalYards=+localStorage.getItem('dinoYards')||0,runs=+localStorage.getItem('dinoRuns')||0;
let magnetT=0,magT=9;const magnets=[];
const bones=[];
let obs=[];
const parts=[],texts=[],MAXP=200,MAXT=32;
function spawnPart(x,y,vx,vy,life,c){let p=null;
for(let i=0;i<parts.length;i++){if(parts[i].life<=0){p=parts[i];break;}}
if(!p){if(parts.length>=MAXP)return;p={};parts.push(p);}
p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.c=c;}
function spawnText(x,y,txt,c){let x2=null;
for(let i=0;i<texts.length;i++){if(texts[i].life<=0){x2=texts[i];break;}}
if(!x2){if(texts.length>=MAXT)return;x2={};texts.push(x2);}
x2.x=x;x2.y=y;x2.txt=txt;x2.c=c||'#fff';x2.life=1;}
function fxAlive(a){for(let i=0;i<a.length;i++)if(a[i].life>0)return true;return false;}
let muted=localStorage.getItem('dinoMute')==='1';
const stars=[];for(let i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*160,r:.6+Math.random()*1.4});
const clouds=[{x:60,y:40,s:1,pf:.22},{x:230,y:70,s:.72,pf:.32},{x:350,y:28,s:.85,pf:.16}];
let AC;
function initAudio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.resume)AC.resume();}
function tone(f,d,type,v,dl){if(!AC)return;const t0=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.18,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function snd(n){if(muted)return;if(n==='jump')sfx('jump');else if(n==='mile')sfx('levelup');else if(n==='near')sfx('whoosh');else if(n==='land')sfx('pop');else if(n==='die')sfx('lose');}
function ftext(x,y,txt,c){spawnText(x,y,txt,c);}
function dust(x,y,n){for(let i=0;i<n;i++){spawnPart(x+Math.random()*16-8,y-2,(Math.random()-.5)*90,-30-Math.random()*70,.7+Math.random()*.4,'rgba(214,182,140,.9)');}}
function burst(x,y,n,c){for(let i=0;i<n;i++){const an=Math.random()*Math.PI*2,sp=60+Math.random()*220;spawnPart(x,y,Math.cos(an)*sp,Math.sin(an)*sp-60,1,c);}}
function refreshMute(){document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();initAudio();muted=!muted;localStorage.setItem('dinoMute',muted?'1':'0');refreshMute();});
refreshMute();
const hudEl=document.getElementById('hud'),hudTxt=hudEl.firstChild,hudBestEl=hudEl.querySelector('small');
hudBestEl.textContent='BEST '+Math.floor(best);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function spd(){return 300+Math.min(dist*.045,340);}
function jump(){
if(dino.grounded){dino.vy=-560;dino.grounded=false;dino.jumps=1;snd('jump');tone(420,0.09,'square',0.05);dino.pop=1;dust(dino.x+12,GY,6);}
else if(dino.jumps<2){dino.vy=-470;dino.jumps=2;snd('jump');tone(640,0.1,'square',0.05);dino.pop=1;burst(dino.x+dino.w/2,dino.y+dino.h,6,'#a7f3d0');}
}
function duck(){if(dino.grounded)dino.duck=.45;else dino.vy=Math.max(dino.vy,420);}
function startGame(){Kit.click();state='play';dist=0;obs=[];for(const p of parts)p.life=0;for(const x of texts)x.life=0;spawnT=1;flash=0;lastMile=0;lastFd=-1;lastBv=-1;cleared=0;shield=0;invuln=0;featherT=7;feathers.length=0;bonesRun=0;boneT=4;bones.length=0;lastMedal=0;medalsRun=0;magnetT=0;magT=9;magnets.length=0;dino={x:56,y:GY-44,w:38,h:44,vy:0,grounded:true,jumps:0,duck:0,pop:0};}
function die(){if(state!=='play')return;state='over';snd('die');shake=10;flash=1;burst(dino.x+dino.w/2,dino.y+dino.h/2,24,'#34d399');
 const nb=dist>best;if(nb){best=dist;localStorage.setItem('dinoBest',best);}
document.getElementById('finScore').textContent=Math.floor(dist);
document.getElementById('finBest').textContent=Math.floor(best);
document.getElementById('finCleared').textContent=cleared;
document.getElementById('finBones').textContent=bonesRun;
document.getElementById('finBonesT').textContent=totalBones;
totalYards+=Math.floor(dist);runs++;try{localStorage.setItem('dinoYards',totalYards);localStorage.setItem('dinoRuns',runs);}catch(err){}
document.getElementById('finMedals').textContent=medalsRun;
document.getElementById('finMedalsT').textContent=totalMedals;
document.getElementById('finLife').textContent=Math.floor(totalYards);
document.getElementById('finRuns').textContent=runs;
document.getElementById('newBest').classList[nb?'remove':'add']('hidden');
if(nb)Kit.win('NEW BEST!',Math.floor(dist)+'m — legend status');else Kit.lose('WIPEOUT!',Math.floor(dist)+'m · best '+Math.floor(best)+'m');
setTimeout(()=>document.getElementById('over').classList.remove('hidden'),450);}
function update(dt){
 t+=dt;if(shake>0)shake-=dt*30;if(flash>0)flash-=dt*2.4;if(dino.pop>0)dino.pop-=dt*6;
for(let i=0;i<parts.length;i++){const p=parts[i];if(p.life<=0)continue;p.life-=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}
for(let i=0;i<texts.length;i++){const x=texts[i];if(x.life<=0)continue;x.life-=dt*1.1;x.y-=42*dt;}
const nt=Math.floor(dist/400)%2===1?1:0;
nightMix+=(nt-nightMix)*Math.min(1,dt*1.5);
if(state==='play'){
const s=spd();dist+=s*dt*.016;
const mile=Math.floor(dist/100);if(mile>lastMile){lastMile=mile;snd('mile');hudEl.classList.remove('pop');void hudEl.offsetWidth;hudEl.classList.add('pop');Kit.text(window.innerWidth/2,110,(mile*100)+'m!','#4ade80',24);}
const medal=Math.floor(dist/500);if(medal>lastMedal){lastMedal=medal;medalsRun++;totalMedals++;try{localStorage.setItem('dinoMedals',totalMedals);}catch(err){}sfx('win');ftext(dino.x+44,dino.y-30,'MEDAL!','#fde047');burst(dino.x+dino.w/2,dino.y,10,'#fde047');}
const ducking=dino.duck>0&&dino.grounded;
dino.h=ducking?24:44;if(dino.grounded)dino.y=GY-dino.h;
if(!dino.grounded){dino.vy+=1700*dt;dino.y+=dino.vy*dt;if(dino.y>=GY-dino.h){const iv=dino.vy;dino.y=GY-dino.h;dino.vy=0;dino.grounded=true;dino.jumps=0;dino.pop=1;dust(dino.x+dino.w/2,GY,5);if(iv>300)snd('land');if(iv>700)shake=Math.max(shake,4);}}
if(dino.duck>0)dino.duck-=dt;
if(invuln>0)invuln-=dt;
if(dino.grounded){runT-=dt;if(runT<=0){runT=.24;dust(dino.x+6,GY,2);}}
spawnT-=dt*s/300;
if(spawnT<=0){
spawnT=.85+Math.random()*.85-Math.min(dist*.00012,.25);spawnT=Math.max(spawnT,.8);
if(dist>120&&Math.random()<.32){obs.push({type:'bird',x:W+20,y:GY-52-(Math.random()<.5?26:0),w:36,h:18});}
else{const h=30+Math.random()*32;obs.push({type:'cactus',x:W+20,w:16+Math.random()*12,h:h});}
}
for(const o of obs)o.x-=s*dt;
for(const c of clouds)c.x-=s*dt*c.pf;
let wI=0;for(let i=0;i<obs.length;i++){if(obs[i].x>-60)obs[wI++]=obs[i];}obs.length=wI;
const px=dino.x+7,py=dino.y+6,pw=dino.w-14,ph=dino.h-6;
for(const o of obs){
let ow=o.w,oh=o.h,oy=o.type==='cactus'?GY-o.h:o.y,ox=o.x;
if(px<ox+ow-4&&px+pw>ox+4&&py<oy+oh-4&&py+ph>oy+4){
if(invuln>0){}
else if(shield>0){shield--;invuln=1.2;shake=Math.max(shake,5);sfx('boom');burst(dino.x+dino.w/2,dino.y+dino.h/2,16,'#fde047');ftext(dino.x+44,dino.y-16,'SHIELD SAVED YOU!','#fde047');}
else die();
}
if(px<ox+ow&&px+pw>ox){const g=(py>=oy+oh)?py-(oy+oh):(oy>=py+ph)?oy-(py+ph):0;if(g>0)o.mg=Math.min(o.mg===undefined?999:o.mg,g);}
if(!o.passed&&ox+ow<px){o.passed=true;cleared++;tone(220,0.06,'sawtooth',0.035);if(o.mg!==undefined&&o.mg<16){dist+=10;ftext(dino.x+44,dino.y-14,'CLOSE! +10','#fbbf24');snd('near');}}
}
featherT-=dt*s/300;
if(featherT<=0){featherT=7+Math.random()*4;feathers.push({x:W+20,y:GY-66-Math.random()*16});}
for(let i=0;i<feathers.length;i++){const f=feathers[i];f.x-=s*dt;
if(px<f.x+16&&px+pw>f.x-16&&py<f.y+16&&py+ph>f.y-16&&shield<2){shield++;sfx('levelup');ftext(dino.x+44,dino.y-14,'SHIELD '+shield,'#fde047');burst(dino.x+dino.w/2,dino.y+dino.h/2,8,'#fde047');f.x=-999;}}
let fI=0;for(let i=0;i<feathers.length;i++){if(feathers[i].x>-40)feathers[fI++]=feathers[i];}feathers.length=fI;
boneT-=dt*s/300;
if(boneT<=0){boneT=2.8+Math.random()*2.6;bones.push({x:W+20,y:GY-26-Math.random()*58});}
for(let i=0;i<bones.length;i++){const b=bones[i];b.x-=s*dt;
if(magnetT>0&&b.x>0&&b.x<280){const ddx=dino.x+8-b.x,ddy=dino.y+dino.h/2-b.y;const dd=Math.sqrt(ddx*ddx+ddy*ddy);if(dd<140){b.x+=ddx*dt*6;b.y+=ddy*dt*6;}}
if(px<b.x+14&&px+pw>b.x-14&&py<b.y+14&&py+ph>b.y-14){bonesRun++;totalBones++;if(magnetT>0)totalBones++;try{localStorage.setItem('dinoBones',totalBones);}catch(err){}sfx('coin');ftext(b.x,b.y-16,'+🦴','#fff');burst(b.x,b.y,5,'#fef3c7');b.x=-999;}}
let bI=0;for(let i=0;i<bones.length;i++){if(bones[i].x>-40)bones[bI++]=bones[i];}bones.length=bI;
if(magnetT>0)magnetT-=dt;
magT-=dt*s/300;
if(magT<=0){magT=13+Math.random()*9;magnets.push({x:W+20,y:GY-70-Math.random()*30});}
for(let i=0;i<magnets.length;i++){const m=magnets[i];m.x-=s*dt;
if(px<m.x+14&&px+pw>m.x-14&&py<m.y+14&&py+ph>m.y-14){magnetT=6;sfx('levelup');ftext(dino.x+44,dino.y-14,'MAGNET!','#22d3ee');burst(m.x,m.y,8,'#22d3ee');m.x=-999;}}
let mI=0;for(let i=0;i<magnets.length;i++){if(magnets[i].x>-40)magnets[mI++]=magnets[i];}magnets.length=mI;
const fd=Math.floor(dist);if(fd!==lastFd){lastFd=fd;hudTxt.nodeValue=fd;const bv=Math.floor(Math.max(best,fd));if(bv!==lastBv){lastBv=bv;hudBestEl.textContent='BEST '+bv;}}
}
}
function draw(){
const night=Math.floor(dist/400)%2===1;
if(night){ctx.fillStyle=nightG;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e2e8f0';for(const st of stars){ctx.globalAlpha=.4+Math.sin(t*3+st.x)*.3;ctx.fillRect(st.x,st.y,st.r*2,st.r*2);}ctx.globalAlpha=1;
ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(W-70,52,20,0,7);ctx.fill();
}else{ctx.fillStyle=dayG;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(W-70,52,24,0,7);ctx.fill();
ctx.fillStyle='rgba(253,224,71,.35)';ctx.beginPath();ctx.arc(W-70,52,38,0,7);ctx.fill();
}
ctx.fillStyle=night?'rgba(226,232,240,.14)':'rgba(255,255,255,.8)';
for(const c of clouds){const xx=(((c.x%(W+140))+(W+140))%(W+140))-70;
ctx.beginPath();ctx.ellipse(xx,c.y,26*c.s,10*c.s,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(xx+20*c.s,c.y-8*c.s,18*c.s,9*c.s,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(xx-20*c.s,c.y-5*c.s,15*c.s,8*c.s,0,0,7);ctx.fill();}
ctx.fillStyle='rgba(255,255,255,.25)';
ctx.fillRect(0,GY-2,W,2);
ctx.fillStyle=night?'#1a2740':'#d9a06b';ctx.fillRect(0,GY,W,H-GY);
ctx.fillStyle=night?'rgba(255,255,255,.1)':'rgba(120,60,20,.18)';
for(let i=0;i<9;i++){const sx=((i*60-(t*spd()*.6))%(W+60)+W+60)%(W+60)-60;ctx.fillRect(sx,GY+14,30,5);}
for(const o of obs){
if(o.type==='cactus'){
ctx.fillStyle='#16a34a';
rr(o.x,GY-o.h,o.w,o.h,5);ctx.fill();
rr(o.x-o.w*.5,GY-o.h+o.h*.35,o.w*.5,10,4);ctx.fill();
rr(o.x+o.w,GY-o.h+o.h*.55,o.w*.5,10,4);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(o.x+3,GY-o.h+2,3,o.h-4);
}else{
const fl=Math.sin(t*14)*4;
ctx.fillStyle='#64748b';
ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2-3,0,0,7);ctx.fill();
ctx.fillStyle='#94a3b8';
ctx.beginPath();ctx.ellipse(o.x+o.w/2-fl,o.y+o.h/2,8,6,fl*.3,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x+o.w-6,o.y+5,3,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(o.x+o.w-5,o.y+5,1.5,0,7);ctx.fill();
ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(o.x+o.w-2,o.y+8);ctx.lineTo(o.x+o.w+7,o.y+10);ctx.lineTo(o.x+o.w-2,o.y+13);ctx.closePath();ctx.fill();
}
}
ctx.fillStyle='#fde047';
for(const f of feathers){ctx.beginPath();ctx.ellipse(f.x,f.y,9,3.4,-.6,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(f.x,f.y-5,3.2,6,0,0,7);ctx.fill();}
ctx.fillStyle='#fef3c7';
for(const b of bones){ctx.fillRect(b.x-6,b.y-2.5,12,5);ctx.beginPath();ctx.arc(b.x-6,b.y-2.5,4,0,7);ctx.arc(b.x+6,b.y-2.5,4,0,7);ctx.fill();}
for(const m of magnets){ctx.strokeStyle='#ef4444';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(m.x,m.y,8,Math.PI,0);ctx.stroke();ctx.strokeStyle='#e2e8f0';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(m.x-8,m.y);ctx.lineTo(m.x-8,m.y+6);ctx.moveTo(m.x+8,m.y);ctx.lineTo(m.x+8,m.y+6);ctx.stroke();ctx.lineCap='butt';}
const d=dino;
ctx.save();ctx.translate(d.x,d.y+d.h);
const ip=(state==='ready'?Math.sin(t*3)*2:0),pp=Math.max(0,d.pop);
ctx.translate(0,ip);ctx.scale(1+pp*.18,1-pp*.15);
const lp=Math.sin(t*24)*3;
ctx.fillStyle='#1f2937';
ctx.fillRect(6,-10+Math.max(0,lp),6,10-Math.max(0,lp));
ctx.fillRect(16,-10+Math.max(0,-lp),6,10-Math.max(0,-lp));
ctx.fillStyle='#34d399';
if(d.h<30){
rr(2,-20,44,20,8);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(38,-13,3.4,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(39,-13,1.7,0,7);ctx.fill();
ctx.fillStyle='#34d399';ctx.beginPath();ctx.moveTo(2,-16);ctx.lineTo(12,-4);ctx.lineTo(26,-16);ctx.closePath();ctx.fill();
}else{
ctx.beginPath();ctx.moveTo(-4,-d.h+10);ctx.lineTo(-18,-d.h+4);ctx.lineTo(-4,-d.h+2);ctx.closePath();ctx.fill();
rr(-4,-d.h+8,36,d.h-4,7);ctx.fill();
rr(20,-d.h-4,17,19,5);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(31,-d.h+4,3.2,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(32,-d.h+4,1.6,0,7);ctx.fill();
}
ctx.restore();
if(shield>0){ctx.strokeStyle=invuln>0?'rgba(100,116,139,.5)':'rgba(253,224,71,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(dino.x+dino.w/2,dino.y+dino.h/2,32+Math.sin(t*6)*2,0,7);ctx.stroke();}
if(magnetT>0){ctx.strokeStyle='rgba(34,211,238,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dino.x+dino.w/2,dino.y+dino.h/2,26+Math.sin(t*8)*2,0,7);ctx.stroke();}
for(let i=0;i<parts.length;i++){const p=parts[i];if(p.life<=0)continue;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.4,0,7);ctx.fill();}
ctx.globalAlpha=1;
ctx.font='900 16px system-ui,sans-serif';ctx.textAlign='center';
for(let i=0;i<texts.length;i++){const x=texts[i];if(x.life<=0)continue;ctx.globalAlpha=Math.max(x.life,0);ctx.fillStyle=x.c;ctx.fillText(x.txt,x.x,x.y);}
ctx.globalAlpha=1;ctx.textAlign='left';
if(flash>0){ctx.globalAlpha=Math.min(flash,1)*.5;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
function active(){return state==='ready'||state==='play'||shake>0||flash>0||fxAlive(parts)||fxAlive(texts);}
let last=performance.now();
function loop(now){
requestAnimationFrame(loop);
if(document.hidden)return;
const dt=Math.min((now-last)/1000,.05);last=now;
if(state==='paused')return;
if(!active()){if(dirty){dirty=false;draw();}return;}
update(dt);
ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
draw();ctx.restore();
}
requestAnimationFrame(loop);
function setPaused(on){if(on&&state==='play'){state='paused';document.getElementById('pause').classList.remove('hidden');}else if(!on&&state==='paused'){state='play';document.getElementById('pause').classList.add('hidden');last=performance.now();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();setPaused(false);});
let touchStartY=null;
window.addEventListener('pointerdown',e=>{if(e.target.closest('.ov'))return;initAudio();touchStartY=e.clientY;if(state==='ready'){document.getElementById('start').classList.add('hidden');startGame();jump();}else if(state==='play'){jump();}});
window.addEventListener('pointermove',e=>{
if(touchStartY===null||state!=='play')return;
if(e.clientY-touchStartY>34){duck();touchStartY=null;}
});
window.addEventListener('pointerup',()=>{touchStartY=null;});
window.addEventListener('keydown',e=>{
initAudio();
if(state==='ready'&&(e.key===' '||e.key==='ArrowUp')){document.getElementById('start').classList.add('hidden');startGame();jump();}
else if(state==='play'){if(e.key===' '||e.key==='ArrowUp')jump();if(e.key==='ArrowDown')duck();}
if(e.key==='p'||e.key==='Escape'){if(state==='play')setPaused(true);else if(state==='paused')setPaused(false);}
});
document.getElementById('playBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();document.getElementById('start').classList.add('hidden');startGame();});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();document.getElementById('over').classList.add('hidden');startGame();});
</script>
</body>
</html>
