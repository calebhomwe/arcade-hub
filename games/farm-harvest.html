<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<meta name="description" content="Farm Harvest: plant, water and harvest seven crops, fill orders for the delivery truck, hire helpers and grow your farm.">
<title>Farm Harvest</title>
<link rel="stylesheet" href="kit/ik.css">
<style>
.hv-actions{display:flex;gap:8px;margin-bottom:8px}
.hv-actions .ik-btn{flex:1;min-width:0;padding:6px 6px;font-size:15px}
.hv-actions .ik-btn small{display:block;font:700 14px var(--ik-ui);opacity:.9}
.hv-crops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hv-crop{position:relative;border:1px solid var(--ik-paperline);border-radius:14px;color:var(--ik-paperink);background:linear-gradient(rgba(255,248,226,.55),rgba(232,208,150,.55)),url(assets/idle/tex/paper.jpg);background-size:auto,220px;box-shadow:0 2px 0 #8d6d34,inset 0 1px 0 rgba(255,255,255,.8);padding:6px 4px 8px;text-align:center;font:800 15px/1.15 var(--ik-ui);min-height:132px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hv-crop .im{height:62px;width:100%;display:grid;place-items:center}
.hv-crop small{display:block;font:600 14px/1.2 var(--ik-ui);color:var(--ik-paperdim)}
.hv-crop.sel{outline:3px solid #f2c14e;outline-offset:1px;box-shadow:0 0 0 2px #06101f,0 0 16px rgba(242,193,78,.7)}
.hv-crop.locked{filter:saturate(.4) brightness(.8);cursor:default}
.hv-crop.locked .im .spr{filter:brightness(0) opacity(.45)}
.hv-crop .lk{position:absolute;top:4px;right:6px;font:800 13px var(--ik-ui);background:#13284a;color:#ffe08a;border-radius:8px;padding:1px 6px}
.hv-need{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.hv-item{display:flex;align-items:center;gap:2px;padding:1px 8px 1px 2px;border-radius:12px;background:rgba(2,8,20,.55);border:1px solid rgba(0,0,0,.4);font:800 14px var(--ik-ui);color:#fff}
.hv-item.ok{background:linear-gradient(#5cc03d,#2f8a22);border-color:#1f5f17}
.hv-item .im{width:30px;height:30px;display:grid;place-items:center}
.hv-rw{display:flex;gap:10px;font:800 15px var(--ik-ui);color:var(--ik-paperink);align-items:center}
.hv-rw span{display:inline-flex;align-items:center;gap:3px}
.hv-stock{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(120,86,30,.25)}
.hv-stock:last-child{border:0}
.hv-stock .n{flex:1;font:800 16px var(--ik-ui);color:var(--ik-paperink)}
.hv-stock .n small{display:block;font:600 14px var(--ik-ui);color:var(--ik-paperdim)}
.hv-stock .ik-btn{min-width:70px;min-height:44px;padding:4px 8px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="fx"></canvas>
<script src="assets/idle/harvest.js"></script>
<script src="kit/ik-core.js"></script>
<script src="kit/ik-iso.js"></script>
<script src="kit/ik-idle.js"></script>
<script>
(function () {
'use strict';
var IK = window.IK, $ = IK.$, fmt = IK.fmt, esc = IK.esc, h = IK.h;
var A = new IK.Atlas('assets/idle/harvest.webp', window.IK_ATLAS.harvest);
IK.ico.sprout = function (px) { return '<svg class="ic" viewBox="0 0 32 32" width="' + px + '" height="' + px + '" aria-hidden="true"><path d="M16 28V15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M16 16C16 9 11 6 4 6c0 7 4 10 12 10z" fill="currentColor"/><path d="M16 14c0-6 4-9 12-9 0 7-4 10-12 9z" fill="currentColor" opacity=".8"/></svg>'; };
IK.ico.truck = function (px) { return '<svg class="ic" viewBox="0 0 32 32" width="' + px + '" height="' + px + '" aria-hidden="true"><path d="M3 9h16v13H3zM19 13h6l4 4v5H19z" fill="currentColor"/><circle cx="9" cy="24" r="3" fill="#0b1a33" stroke="currentColor" stroke-width="1.6"/><circle cx="23" cy="24" r="3" fill="#0b1a33" stroke="currentColor" stroke-width="1.6"/></svg>'; };

/* ---------- crops: what they cost, how long they take, when they unlock ---------- */
var CROPS = [
  { id: 'wheat', name: 'Wheat', lvl: 1, grow: 12, seed: 2, sell: 6, xp: 2 },
  { id: 'carrot', name: 'Carrot', lvl: 2, grow: 30, seed: 6, sell: 16, xp: 4 },
  { id: 'strawberry', name: 'Strawberry', lvl: 3, grow: 75, seed: 14, sell: 40, xp: 7 },
  { id: 'sunflower', name: 'Sunflower', lvl: 4, grow: 180, seed: 40, sell: 110, xp: 12 },
  { id: 'corn', name: 'Corn', lvl: 6, grow: 360, seed: 110, sell: 300, xp: 20 },
  { id: 'pumpkin', name: 'Pumpkin', lvl: 8, grow: 720, seed: 320, sell: 850, xp: 34 },
  { id: 'melon', name: 'Melon', lvl: 10, grow: 1200, seed: 900, sell: 2400, xp: 55 }
];
var CBY = {}; CROPS.forEach(function (c) { CBY[c.id] = c; });
function cIcon(id, px) { return A.icon(id + '_3', px, 2); }
function fmtSec(s) { s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '') : s + 's'; }

/* land: which tile each plot stands on, in the order the farm grows */
var PLOTC = [[2, 2], [1, 2], [2, 3], [1, 3], [2, 1], [3, 2], [3, 3], [1, 1], [3, 1], [2, 4], [1, 4], [3, 4]];
var PLOTCOST = [0, 0, 0, 0, 80, 160, 320, 640, 1200, 2400, 4800, 9600];
var HELPER = { hand: { name: 'Farmhand', desc: 'Harvests ripe crops for you', cost: [200, 1200, 7500], every: [0, 9, 5, 3] }, sow: { name: 'Sower', desc: 'Plants your chosen seed on empty plots', cost: [250, 1500, 9000], every: [0, 9, 5, 3] } };
var CAPCOST = [150, 450, 1400, 4200, 12000, 36000];

var S0 = null;    // the engine's save, set below

function blankFarm(S) {
  var X = S.x;
  if (!X.plots) { X.plots = []; for (var i = 0; i < 12; i++) X.plots.push(null); }
  if (X.open == null) X.open = 4;
  if (!X.barn) X.barn = {};
  if (!X.cap) X.cap = 24;
  if (!X.orders) X.orders = [];
  if (!X.helpers) X.helpers = { hand: 0, sow: 0 };
  if (!X.sel) X.sel = 'wheat';
  if (!X.st) X.st = { harvested: 0, delivered: 0, sold: 0, planted: 0, watered: 0, earned: 0 };
  if (X.capLv == null) X.capLv = 0;
}
function stockTotal(X) { var t = 0; for (var k in X.barn) t += X.barn[k] | 0; return t; }
function cropStage(p, now) {                                     // 1 seedling, 2 growing, 3 ripe
  var c = CBY[p.c], f = (now - p.t) / (c.grow * 1000);
  return f >= 1 ? 3 : f >= 0.34 ? 2 : 1;
}
function cropFrac(p, now) { return Math.max(0, Math.min(1, (now - p.t) / (CBY[p.c].grow * 1000))); }
function slotCount(lvl) { return lvl >= 11 ? 5 : lvl >= 6 ? 4 : 3; }

function makeOrder(E) {
  var S = E.S, L = S.lvl, un = CROPS.filter(function (c) { return c.lvl <= L; }), kinds = 1 + (L >= 3 && Math.random() < 0.6 ? 1 : 0) + (L >= 8 && Math.random() < 0.4 ? 1 : 0);
  var pool = un.slice(), need = {}, coins = 0, xp = 4;
  for (var k = 0; k < kinds && pool.length; k++) {
    var pi = Math.floor(Math.random() * pool.length), c = pool.splice(pi, 1)[0];
    var hi = c.grow >= 360 ? 4 : 5 + Math.floor(L / 2), q = 2 + Math.floor(Math.random() * (hi - 1));
    if (c.grow >= 360) q = 1 + Math.floor(Math.random() * 4);
    need[c.id] = Math.min(12, q); coins += need[c.id] * c.sell * 1.5; xp += need[c.id] * c.xp * 2;
  }
  return { need: need, coins: Math.ceil(coins / 5) * 5, xp: Math.round(xp) };
}

/* ================= the field ================= */
function makeScene(E) {
  var S = E.S, X = S.x, cv = $('scene'), wrap = $('sceneWrap');
  var st = new IK.Stage(cv, draw, 2);
  var iso = new IK.Iso(st, { N: 4, M: 5, tex: ['mountain_grass', 'soil_tilled', 'dirt_track', 'rock', 'plaza_stone'] });
  var pops = [], drops = [], sparks = [], dust = [], walkers = [], drag = null, helperT = { hand: 0, sow: 0 }, tract = { i: 0.4, dir: 1 }, tgt = null;
  st.onResize = function (W, H) { iso.layout(W, H); };
  iso.layout(st.w || 390, st.h || 300);
  var tg = h('div', ''); tg.id = 'tgt'; tg.style.cssText = 'position:absolute;pointer-events:none;width:1px;height:1px;left:0;top:0'; wrap.appendChild(tg);
  function cellPlot(ci, cj) { for (var i = 0; i < PLOTC.length; i++) if (PLOTC[i][0] === ci && PLOTC[i][1] === cj) return i; return -1; }
  function plotXY(i) { return iso.cellXY(PLOTC[i][0], PLOTC[i][1]); }
  function nowT() { return IK.now(); }
  ['sheep', 'sheep', 'chicken', 'chicken', 'chicken'].forEach(function (k, n) { var j0 = k === 'sheep' ? 2.2 : 3.2; walkers.push({ kind: k, i: 0.2 + Math.random() * 0.5, j: j0 + Math.random() * 0.8, tx: 0, ty: 0, wait: Math.random() * 2, flip: false, ph: n }); });

  function sfxAt(name, r) { IK.sfx(name, { rate: r || 1, volume: 0.6, gap: 40 }); }
  function toClient(i) { var p = plotXY(i); return st.toClient(p.x, p.y - 12 * iso.sc); }
  function plant(i, quiet) {
    var c = CBY[X.sel]; if (!c || c.lvl > S.lvl) return false;
    if (X.plots[i] || i >= X.open) return false;
    if (S.coins < c.seed) { if (!quiet) { IK.sfx('error', { volume: 0.4 }); IK.toast('Seeds cost ' + c.seed + ' coins', { icon: IK.ico.coin(22) }); } return false; }
    S.coins -= c.seed; X.plots[i] = { c: c.id, t: nowT(), w: false }; X.st.planted++;
    pops.push({ i: i, t: 0 }); var p = toClient(i); IK.fx.burst(p.x, p.y, { n: 5, speed: 90, size: 3, colors: ['#8a5a2b', '#b07a44'] }); sfxAt('plant', 1 + Math.random() * 0.2);
    E.event('plant', 1); E.coachDid('plant'); E.dirtyUI = true; return true;
  }
  function water(i, quiet) {
    var p = X.plots[i]; if (!p || p.w) return false; var c = CBY[p.c], now = nowT();
    if (cropStage(p, now) === 3) return false;
    var remain = (1 - cropFrac(p, now)) * c.grow * 1000; p.t -= remain * 0.5; p.w = true; X.st.watered++;
    var q = toClient(i); IK.fx.burst(q.x, q.y - 10, { n: 10, speed: 120, angle: -Math.PI / 2, spread: 1.8, grav: 380, size: 3, colors: ['#8be3ff', '#c8f1ff', '#4aa3e8'] }); sfxAt('water', 1 + Math.random() * 0.2);
    E.event('water', 1); E.coachDid('water'); E.dirtyUI = true; return true;
  }
  function harvest(i, quiet, auto) {
    var p = X.plots[i]; if (!p || cropStage(p, nowT()) < 3) return false; var c = CBY[p.c];
    if (stockTotal(X) >= X.cap) { if (!quiet) { IK.sfx('error', { volume: 0.4 }); IK.toast('The barn is full: fill orders or sell some crops', { icon: A.icon('crate', 22, 2) }); } return false; }
    X.plots[i] = null; X.barn[c.id] = (X.barn[c.id] | 0) + 1; X.st.harvested++;
    var q = toClient(i); IK.fx.float(q.x, q.y - 30, '+1 ' + c.name, 'green'); IK.fx.burst(q.x, q.y - 10, { n: 8, speed: 160, size: 3.5, colors: ['#ffe08a', '#bff09a', '#fff'] });
    if (E.el.stockW) IK.fx.flyTo(q.x, q.y - 14, E.el.stockW, { n: 3, color: '#f2c14e', shape: 'coin', size: 4 });
    sfxAt('harvest', 0.95 + Math.random() * 0.25); IK.vibrate(8);
    E.addXp(c.xp, 'harvest'); IK.fx.float(q.x + 30, q.y - 8, '+' + c.xp + ' XP', 'blue');
    E.event('harvest', 1); E.coachDid('harvest'); E.dirtyUI = true; return true;
  }
  function act(ci, cj) {
    var i = cellPlot(ci, cj); if (i < 0) return 0;
    if (i >= X.open) { if (i === X.open) return buyPlot() ? 1 : 0; return 0; }
    var p = X.plots[i];
    if (!p) return plant(i) ? 1 : 0;
    var stg = cropStage(p, nowT());
    if (stg === 3) return harvest(i) ? 1 : 0;
    return water(i) ? 1 : 0;
  }
  function buyPlot() {
    var i = X.open, cost = PLOTCOST[i]; if (i >= 12) return false;
    if (S.coins < cost) { IK.sfx('error', { volume: 0.4 }); IK.toast('A new plot costs ' + fmt(cost) + ' coins', { icon: IK.ico.coin(22) }); return false; }
    S.coins -= cost; X.open++; var p = plotXY(i), c = st.toClient(p.x, p.y);
    IK.fx.burst(c.x, c.y, { n: 18, speed: 220, shape: 'star', size: 4 }); IK.fx.confetti(18); sfxAt('unlock'); pops.push({ i: i, t: 0 });
    IK.toast('New plot ready!', { icon: IK.ico.sprout(22), kind: 'gold' }); E.addXp(6, 'plot'); E.dirtyUI = true; return true;
  }
  function cellAt(x, y) { var sc = iso.sc, u = ((x - iso.ox) / (iso.HW * sc) + (y - iso.oy) / (iso.HH * sc)) / 2, v = ((y - iso.oy) / (iso.HH * sc) - (x - iso.ox) / (iso.HW * sc)) / 2; return [Math.floor(u), Math.floor(v)]; }
  wrap.addEventListener('pointermove', function (ev) {
    if (!drag || !E.inGame) return;
    var p = st.toLocal(ev.clientX, ev.clientY), c = cellAt(p.x, p.y), key = c[0] + ',' + c[1];
    if (drag.last === key) return; drag.last = key;
    if (cellPlot(c[0], c[1]) >= 0 && cellPlot(c[0], c[1]) < X.open) { act(c[0], c[1]); }
  }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { wrap.addEventListener(n, function () { drag = null; }, { passive: true }); });

  function drawPlots(cx, t, now, ss) {
    var sc = iso.sc, dry = iso.pattern(cx, 'soil_tilled');
    for (var i = 0; i < PLOTC.length; i++) {
      var p = plotXY(i), open = i < X.open, pl = X.plots[i];
      if (!open) {
        iso.diamond(cx, p.x, p.y, 0.95); cx.fillStyle = i === X.open ? 'rgba(255,240,200,.16)' : 'rgba(30,60,20,.10)'; cx.fill();
        if (i === X.open) { cx.strokeStyle = 'rgba(255,224,130,' + (0.6 + 0.3 * Math.sin(t * 4)) + ')'; cx.lineWidth = 2.5; cx.setLineDash([7, 5]); cx.stroke(); cx.setLineDash([]); iso.chip(cx, PLOTCOST[i] ? fmt(PLOTCOST[i]) + ' +' : 'FREE', p.x, p.y, S.coins >= PLOTCOST[i]); }
      }
    }
  }
  function draw(cx, dt, t, W, H) {
    var sc = iso.sc, ss = iso.sprS * sc, now = nowT();
    if (W !== iso.w || H !== iso.h) iso.layout(W, H);
    cx.clearRect(0, 0, W, H);
    iso.backdrop(cx, dt, t);
    iso.ground(cx, function (g) {
      var dirt = iso.pattern(g, 'dirt_track');
      g.fillStyle = dirt || '#a9773f'; g.globalAlpha = 0.9; iso.pad(g, 1, 1, dirt || '#a9773f', 'rgba(70,40,12,.4)', 0.02, 3, 4); g.globalAlpha = 1;
    });
    drawPlots(cx, t, now, ss);
    // sprites in painter's order
    var items = [];
    [['barn', 0, 0, 1.0], ['home', 1, 0, 0.92], ['silos', 2, 0, 1.0], ['truck', 3, 0, 1.0], ['farm_windmill', 0, 1, 0.95], ['tree', 0, 2, 1], ['pine', 0, 4, 1], ['hay_bales', 0.2, 3.9, 0.55], ['crate', 3.3, 4.5, 0.9], ['treepink', 3.3, 3.2, 0.7]].forEach(function (d) { items.push({ d: d[1] + d[2] + 0.02, kind: 'deco', n: d[0], i: d[1], j: d[2], s: d[3] }); });
    for (var i = 0; i < X.open; i++) items.push({ d: PLOTC[i][0] + PLOTC[i][1] + 0.05, kind: 'plot', i: i });
    walkers.forEach(function (w) { items.push({ d: w.i + w.j, kind: 'walker', w: w }); });
    if (X.helpers.hand || X.helpers.sow) items.push({ d: tract.i + 5, kind: 'tractor' });
    items.sort(function (a, b) { return a.d - b.d; });
    walkers.forEach(function (w) { w.wait -= dt; if (w.wait <= 0 && (!w.tx || (Math.abs(w.i - w.tx) < 0.03 && Math.abs(w.j - w.ty) < 0.03))) { w.tx = 0.15 + Math.random() * 0.6; w.ty = (w.kind === 'sheep' ? 2.1 : 3.1) + Math.random() * 0.9; w.wait = 0.5 + Math.random() * 2.5; } if (w.wait <= 0) { var dx = w.tx - w.i, dy = w.ty - w.j, d = Math.hypot(dx, dy) || 1, v = (w.kind === 'chicken' ? 0.3 : 0.14) * dt; w.i += dx / d * Math.min(v, d); w.j += dy / d * Math.min(v, d); w.flip = (dx - dy) < 0; } });
    tract.i += tract.dir * 0.45 * dt; if (tract.i > 3.2) tract.dir = -1; if (tract.i < 0.3) tract.dir = 1;
    var readyN = 0;
    items.forEach(function (it) {
      if (it.kind === 'deco') { var q = iso.cellXY(it.i, it.j); A.draw(cx, it.n, q.x, q.y, ss * it.s); }
      else if (it.kind === 'walker') { var w = it.w, pw = iso.cellXY(w.i - 0.5, w.j - 0.5), bob = Math.abs(Math.sin(t * 6 + w.ph)) * (w.wait <= 0 ? 2.2 : 0.3); A.draw(cx, w.kind, pw.x, pw.y - bob, ss * (w.kind === 'chicken' ? 1.5 : 1.3), 1, w.flip); }
      else if (it.kind === 'tractor') { var pt = iso.cellXY(tract.i, 4.75); A.draw(cx, 'tractor', pt.x, pt.y, ss * 0.85, 1, tract.dir < 0); }
      else if (it.kind === 'plot') {
        var i = it.i, pl = X.plots[i], q = plotXY(i), k = 1;
        for (var pp = pops.length - 1; pp >= 0; pp--) if (pops[pp].i === i) { pops[pp].t += dt; var u = pops[pp].t / 0.35; if (u >= 1) pops.splice(pp, 1); else k = u < 0.6 ? 0.4 + 0.8 * u / 0.6 : 1.2 - 0.2 * (u - 0.6) / 0.4; }
        if (!pl) { A.draw(cx, 'plot_empty', q.x, q.y, ss); if (E.inGame && X.st.planted === 0 && i === 0) iso.chip(cx, 'TAP!', q.x, q.y - 30 * sc + Math.sin(t * 4) * 3, true); return; }
        var stg = cropStage(pl, now), fr = cropFrac(pl, now);
        cx.save(); cx.translate(q.x, q.y); cx.scale(k, k); A.draw(cx, pl.c + '_' + stg, 0, 0, ss); cx.restore();
        if (pl.w && stg < 3) { iso.diamond(cx, q.x, q.y, 0.8); cx.fillStyle = 'rgba(20,50,90,.22)'; cx.fill(); }
        if (stg < 3) { var bw = 44 * sc, bx = q.x - bw / 2, by = q.y + 12 * sc; cx.fillStyle = 'rgba(4,10,24,.75)'; iso.rr(cx, bx - 1, by - 1, bw + 2, 8, 4); cx.fill(); cx.fillStyle = pl.w ? '#5ab8f0' : '#f2c14e'; iso.rr(cx, bx, by, Math.max(4, bw * fr), 6, 3); cx.fill(); if (!pl.w) { var wd = 6 + Math.sin(t * 5) * 1.5; cx.fillStyle = 'rgba(140,220,255,.9)'; cx.beginPath(); cx.arc(q.x + bw / 2 + 8, by + 3, wd * 0.5, 0, 6.2832); cx.fill(); } }
        else {
          readyN++; var bob = Math.sin(t * 5 + i) * 3;
          cx.fillStyle = 'rgba(255,255,255,.92)'; cx.beginPath(); cx.arc(q.x, q.y - 50 * sc + bob, 15, 0, 6.2832); cx.fill(); cx.strokeStyle = '#f2c14e'; cx.lineWidth = 3; cx.stroke();
          var cm = A.map[pl.c + '_3']; if (cm) { var kk = 20 / Math.max(cm[2], cm[3]) * 1.15; cx.drawImage(A.rec.img, cm[0], cm[1], cm[2], cm[3], q.x - cm[2] * kk / 2, q.y - 50 * sc + bob - cm[3] * kk / 2, cm[2] * kk, cm[3] * kk); }
          if (Math.random() < 0.02) sparks.push({ x: q.x + (Math.random() - 0.5) * 30 * sc, y: q.y - 20 * sc, t: 0 });
        }
      }
    });
    for (var s2 = sparks.length - 1; s2 >= 0; s2--) { var sp = sparks[s2]; sp.t += dt; if (sp.t > 0.8) { sparks.splice(s2, 1); continue; } cx.globalCompositeOperation = 'lighter'; cx.fillStyle = 'rgba(255,240,180,' + (1 - sp.t / 0.8) + ')'; cx.beginPath(); cx.arc(sp.x, sp.y - sp.t * 20, 2.5, 0, 6.2832); cx.fill(); cx.globalCompositeOperation = 'source-over'; }
    // auto helpers
    if (E.inGame) {
      if (X.helpers.hand) { helperT.hand += dt; if (helperT.hand >= HELPER.hand.every[X.helpers.hand]) { helperT.hand = 0; for (var a = 0; a < X.open; a++) if (X.plots[a] && cropStage(X.plots[a], now) === 3) { if (harvest(a, true, true)) break; } } }
      if (X.helpers.sow) { helperT.sow += dt; if (helperT.sow >= HELPER.sow.every[X.helpers.sow]) { helperT.sow = 0; for (var b2 = 0; b2 < X.open; b2++) if (!X.plots[b2]) { if (plant(b2, true)) break; } } }
    }

    if (nx) return { t: 'Reach level ' + nx.lvl + ' for ' + nx.name, s: (li.need - Math.floor(li.into)) + ' XP to the next level', p: li.pct, r: 'New crop', ready: false, tab: 'orders' };
    return { t: 'Keep your farm growing', s: 'Fill orders and fill the barn', p: 0.5, r: '', ready: false, tab: 'orders' };
  },
  offlineSheet: function (E, away) {
    var X = E.S.x, now = IK.now(), ripe = 0, grow = 0; X.plots.forEach(function (p) { if (p) { if (cropStage(p, now) === 3) ripe++; else grow++; } });
    E.queueSheet(function () { IK.sheet({ art: A.icon('barn', 64, 2), title: 'WELCOME BACK!', sub: 'Your farm kept growing while you were away.', body: '<div class="ik-kv"><span>Away for</span><b>' + IK.fmtTime(away) + '</b></div><div class="ik-kv"><span>Crops ripe now</span><b>' + ripe + '</b></div><div class="ik-kv"><span>Still growing</span><b>' + grow + '</b></div>', actions: [{ label: ripe ? 'Go harvest!' : 'Back to the farm', cls: 'acc', sound: 'reward' }] }); });
  },
  makeScene: makeScene,
  cheats: {
    HOTMONEY: function (E) { E.S.coins += 100000; return '+100,000 coins.'; },
    GREENTHUMB: function (E) { E.S.x.plots.forEach(function (p) { if (p) p.t = 0; }); return 'Every crop ripens right now.'; },
    FULLBARN: function (E) { CROPS.forEach(function (c) { if (c.lvl <= E.S.lvl) E.S.x.barn[c.id] = Math.max(E.S.x.barn[c.id] | 0, 6); }); return 'The barn is stocked with crops.'; }
  },
  afterLoad: function (E) { blankFarm(E.S); },
  migrate: function (d) { return { v: 2, coins: d.coins || 0, alltime: d.lifetime || 0, lifetime: d.lifetime || 0, x: {} }; }
});
E.codes = {};
blankFarm(E.S);
if (E.S.coins === 0 && !E.hadSave) E.S.coins = 30;
window.__empire = E;
E.boot($('root'));
})();
</script>
