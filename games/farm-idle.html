function anyTier(n) { return function (S) { return Math.max.apply(null, S.owned) >= n; }; }

  { id: 'taps', name: 'Milk Maid', desc: 'Tap the cow 500 times', test: function (S) { return S.stats.taps >= 500; }, prog: function (S) { return [S.stats.taps, 500]; }, ico: function (p) { return A.icon('cow', p, 4); } },
  { id: 'chests', name: 'Treasure Hunter', desc: 'Open 5 chests', test: function (S) { return S.stats.chests >= 5; }, prog: function (S) { return [S.stats.chests, 5]; }, ico: function (p) { return IK.ico.gift(p); } },
  { id: 'bfly', name: 'Butterfly Friend', desc: 'Catch 10 butterflies', test: function (S) { return S.stats.critters >= 10; }, prog: function (S) { return [S.stats.critters, 10]; }, ico: function (p) { return IK.ico.gift(p); } },

  { id: 'trader', name: 'Trade Master', desc: 'Send 5 caravans', test: function (S) { return S.stats.trades >= 5; }, prog: function (S) { return [S.stats.trades, 5]; }, ico: function (p) { return IK.ico.cart(p); } },
  { id: 'streak3', name: 'Early Bird', desc: 'Play 3 days in a row', test: function (S) { return S.daily && S.daily.best >= 3; }, prog: function (S) { return [S.daily ? S.daily.best : 0, 3]; }, ico: function (p) { return IK.ico.scroll(p); } },
  { id: 'quests', name: 'Chore Champion', desc: 'Finish 10 daily goals', test: function (S) { return S.stats.quests >= 10; }, prog: function (S) { return [S.stats.quests, 10]; }, ico: function (p) { return IK.ico.trophy(p); } },
  { id: 'mill2', name: 'Miller', desc: 'Build the Windmill Estate', test: function (S) { return S.owned[9] > 0; }, prog: function (S) { return [S.owned[9], 1]; }, ico: function (p) { return G[9].ico(p); } }
];
var POOL = [
  { id: 'tap', kind: 'tap', text: 'Tap the cow {n} times', goals: [40, 100, 220] },
  { id: 'buy', kind: 'buy', text: 'Add {n} farm buildings', goals: [8, 20, 40] },
  { id: 'earn', kind: 'earn', text: 'Earn {n} coins', goals: function (E) { var r = Math.max(60, E.income()); return [r * 150, r * 500, r * 1500]; } },
  { id: 'upg', kind: 'upgrade', text: 'Buy {n} upgrades', goals: [1, 2, 4] },
  { id: 'crit', kind: 'critter', text: 'Catch {n} butterflies', goals: [1, 2, 3] }
];

/* ================= the farm ================= */
function makeScene(E) {
  var S = E.S, cv = $('scene');
  var st = new IK.Stage(cv, draw, 2);
  var iso = new IK.Iso(st, { N: 4, M: 4, tex: ['mountain_grass', 'soil_tilled', 'dirt_track', 'rock', 'plaza_stone'] });
  var built = [], coins = [], dust = [], bfly = null, bounce = 0, coinT = 0, walkers = [], tract = [];
  var HOME = { i: 1, j: 1 }, COW = { i: 1.55, j: 1.62 };
  st.onResize = function (W, H) { iso.layout(W, H); };
  iso.layout(st.w || 390, st.h || 300);
  function mkWalker(kind, i0, j0, i1, j1) { return { kind: kind, i: i0 + Math.random() * (i1 - i0), j: j0 + Math.random() * (j1 - j0), tx: 0, ty: 0, box: [i0, j0, i1, j1], wait: Math.random() * 2, flip: false, ph: Math.random() * 6 }; }
  function syncWalkers() {                                          // animals and tractors appear as the farm grows
    var want = { chicken: Math.min(6, Math.ceil(S.owned[1] / 3)), cow: Math.min(3, Math.ceil(S.owned[3] / 4)), sheep: 2 }, have = { chicken: 0, cow: 0, sheep: 0 };
    walkers.forEach(function (w) { have[w.kind]++; });
    if (have.chicken < want.chicken) walkers.push(mkWalker('chicken', 2.7, 1.05, 3.6, 1.9));
    if (have.cow < want.cow) walkers.push(mkWalker('cow', 1.9, 1.15, 2.7, 1.9));
    if (have.sheep < want.sheep) walkers.push(mkWalker('sheep', 0.3, 2.9, 1.9, 3.7));
    var tw = Math.min(3, Math.ceil(S.owned[6] / 6)); while (tract.length < tw) tract.push({ i: 0.2 + tract.length * 1.1, dir: 1, v: 0.35 + Math.random() * 0.1 });
  }
  function ground(cx) {
    var soil = iso.pattern(cx, 'soil_tilled'), dirt = iso.pattern(cx, 'dirt_track');
    LOT.forEach(function (L, tier) {
      if (CROP[tier]) { iso.pad(cx, L.i, L.j, soil || '#7a4a26', 'rgba(50,28,10,.6)', 0.06); cx.strokeStyle = 'rgba(40,22,8,.35)'; cx.lineWidth = 5; for (var k = 1; k < 7; k++) { cx.beginPath(); cx.moveTo(L.i * 256 + 26, L.j * 256 + 26 + k * 29); cx.lineTo(L.i * 256 + 230, L.j * 256 + 26 + k * 29); cx.stroke(); } }
      else { cx.globalAlpha = 0.9; iso.pad(cx, L.i, L.j, dirt || '#a9773f', 'rgba(70,40,12,.5)', 0.12); cx.globalAlpha = 1; }
    });
    cx.fillStyle = dirt || '#a9773f'; cx.fillRect(256 + 100, 0, 56, 4 * 256); cx.fillRect(0, 256 + 100, 4 * 256, 56);
    iso.pad(cx, 1, 1, dirt || '#a9773f', 'rgba(70,40,12,.5)', 0.03);
  }
  function spawnCoin(tier) {
    var L = LOT[tier], p = iso.cellXY(L.i, L.j), s = A.size(G[tier].spr), top = (s ? s.ay : 60) * iso.sprS * iso.sc;
    coins.push({ x: p.x + (Math.random() - 0.5) * 20 * iso.sc, y: p.y - top * 0.6, vy: -22 - Math.random() * 12, t: 0, life: 1.4 });
    if (coins.length > 30) coins.shift();
  }
  function butterfly(cx, x, y, t, sc) {
    var f = Math.sin(t * 22) * 0.6 + 0.4, w2 = 13 * sc;
    cx.save(); cx.translate(x, y); cx.rotate(Math.sin(t * 3) * 0.2);
    cx.fillStyle = '#ff9a4d'; cx.strokeStyle = '#5a2a08'; cx.lineWidth = 1.4;
    [[-1, 0], [1, 0]].forEach(function (d) { cx.save(); cx.scale(d[0] * f, 1); cx.beginPath(); cx.ellipse(w2 * 0.55, -w2 * 0.35, w2 * 0.6, w2 * 0.85, -0.5, 0, 6.2832); cx.fill(); cx.stroke(); cx.fillStyle = '#ffd45a'; cx.beginPath(); cx.ellipse(w2 * 0.4, w2 * 0.45, w2 * 0.4, w2 * 0.5, 0.5, 0, 6.2832); cx.fill(); cx.stroke(); cx.fillStyle = '#ff9a4d'; cx.restore(); });
    cx.fillStyle = '#3a2208'; cx.fillRect(-1.5, -w2 * 0.6, 3, w2 * 1.4); cx.restore();
  }

  function draw(cx, dt, t, W, H) {
    var sc = iso.sc, ss = iso.sprS * sc;
    if (W !== iso.w || H !== iso.h) iso.layout(W, H);
    cx.clearRect(0, 0, W, H);
    iso.backdrop(cx, dt, t);
    iso.ground(cx, ground);
    syncWalkers();
    walkers.forEach(function (w) {                                  // wander inside their pen
      w.wait -= dt;
      if (w.wait <= 0 && (Math.abs(w.i - w.tx) < 0.03 && Math.abs(w.j - w.ty) < 0.03 || !w.tx)) { w.tx = w.box[0] + Math.random() * (w.box[2] - w.box[0]); w.ty = w.box[1] + Math.random() * (w.box[3] - w.box[1]); w.wait = 0.5 + Math.random() * 2.5; }
      if (w.wait <= 0) { var dx = w.tx - w.i, dy = w.ty - w.j, d = Math.hypot(dx, dy) || 1, v = (w.kind === 'chicken' ? 0.35 : 0.16) * dt; w.i += dx / d * Math.min(v, d); w.j += dy / d * Math.min(v, d); w.flip = (dx - dy) < 0; }
    });
    tract.forEach(function (tr) { tr.i += tr.dir * tr.v * dt; if (tr.i > 3.2) { tr.dir = -1; } if (tr.i < 0.2) { tr.dir = 1; } });
    var items = [];
    DECOR.forEach(function (d) { items.push({ d: d.i + d.j, kind: 'decor', n: d.n, i: d.i, j: d.j, s: d.s }); });
    items.push({ d: HOME.i + HOME.j + 0.02, kind: 'home' });
    items.push({ d: COW.i + COW.j, kind: 'cow' });
    LOT.forEach(function (L, tier) { items.push({ d: L.i + L.j + 0.05, kind: 'lot', tier: tier, i: L.i, j: L.j }); });
    walkers.forEach(function (w) { items.push({ d: w.i + w.j, kind: 'walker', w: w }); });
    tract.forEach(function (tr) { items.push({ d: tr.i + 3.5, kind: 'tractor', tr: tr }); });
    items.sort(function (p, q) { return p.d - q.d; });
    var hi = E.highest();
    items.forEach(function (it) {
      if (it.kind === 'decor') { var p = iso.cellXY(it.i, it.j); A.draw(cx, it.n, p.x, p.y, ss * it.s); }
      else if (it.kind === 'home') { var ph = iso.cellXY(HOME.i, HOME.j); A.draw(cx, 'home', ph.x, ph.y - 4 * sc, ss * 0.95); }
      else if (it.kind === 'cow') {
        var pc = iso.cellXY(COW.i, COW.j), sq = bounce > 0 ? 1 + Math.sin(bounce * 20) * 0.08 * bounce / 0.3 : 1;
        cx.save(); cx.translate(pc.x, pc.y); cx.scale(sq, 2 - sq); A.draw(cx, 'cow', 0, 0, ss * 1.9); cx.restore();
        if (E.inGame && S.stats.taps < 3) iso.chip(cx, 'TAP!', pc.x, pc.y - 62 * sc + Math.sin(t * 4) * 3, true);
      } else if (it.kind === 'walker') {
        var w = it.w, pw = iso.cellXY(w.i - 0.5, w.j - 0.5), bob = Math.abs(Math.sin(t * 6 + w.ph)) * (w.wait <= 0 ? 2.5 : 0.4);
        A.draw(cx, w.kind, pw.x, pw.y - bob, ss * (w.kind === 'chicken' ? 1.5 : w.kind === 'cow' ? 1.3 : 1.3), 1, w.flip);
      } else if (it.kind === 'tractor') { var pt = iso.cellXY(it.tr.i, 3.3); A.draw(cx, 'tractor', pt.x, pt.y, ss * 0.9, 1, it.tr.dir < 0); }
      else if (it.kind === 'lot') {
        var tier = it.tier, g = G[tier], p3 = iso.cellXY(it.i, it.j), owned = S.owned[tier], bd = built[tier];
        if (owned > 0) {

          if (bd && bd.t < 0.6) { var u = bd.t / 0.6; k2 = u < 0.6 ? 0.5 + 0.7 * (u / 0.6) : 1.2 - 0.2 * ((u - 0.6) / 0.4); bd.t += dt; }
