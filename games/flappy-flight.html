<!DOCTYPE html>
<html lang="en">
<head>

<title>Flappy Flight</title>
<style>
@font-face{font-family:'Nunito';src:url(assets/fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1622;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#f6ecd0}
#stage{position:relative;overflow:hidden;background:#20304a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.scr>*{pointer-events:auto}
.hidden{display:none!important}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#score{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'New York',Georgia,serif;font-weight:900;font-size:76px;line-height:1;margin-top:34px;color:#fff4cf;background:linear-gradient(180deg,#fffbe8 8%,#ffd873 52%,#e59a25);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 rgba(60,28,0,.85)) drop-shadow(0 5px 12px rgba(0,0,0,.35));transform-origin:50% 60%}
#score.pop{animation:sPop .26s cubic-bezier(.2,1.6,.4,1)}
@keyframes sPop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
#goal{margin-top:6px;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 4px;border-radius:99px;background:rgba(10,22,34,.55);border:1px solid rgba(160,200,230,.3);font-size:14px;font-weight:900;color:#e9f1f7;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#goal svg{width:22px;height:22px;margin-top:-2px}
#goal .gb{width:62px;height:7px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden}
#goal .gb i{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe38a,#e29a24);border-radius:9px}
#feath{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;border-radius:14px;background:linear-gradient(180deg,rgba(38,68,94,.92),rgba(15,30,44,.92));border:2px solid rgba(150,196,228,.34);font-size:20px;font-weight:900;color:#fbf1d3;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);pointer-events:none}
#feath svg{width:22px;height:22px}
#feath.bump{animation:sPop .22s ease-out}
#shield{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 52px);width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(190,235,255,.95),rgba(80,160,230,.55) 60%,rgba(40,100,180,.5));border:2px solid rgba(255,255,255,.7);box-shadow:0 0 14px rgba(120,200,255,.8);display:flex;align-items:center;justify-content:center;font-size:19px}
#mute{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:46px;height:46px;border-radius:14px;border:2px solid rgba(150,196,228,.34);background:linear-gradient(180deg,rgba(38,68,94,.92),rgba(15,30,44,.92));color:#fbf1d3;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.4);z-index:5;cursor:pointer}
#mute:active{transform:scale(.93)}
#codes{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid #f0c040;color:#f0c040;font-size:12px;letter-spacing:2px;font-weight:900;pointer-events:none;z-index:4}
/* title */
#title{justify-content:flex-end;padding:max(20px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));gap:12px;background:linear-gradient(180deg,rgba(8,16,28,.55) 0%,rgba(8,16,28,0) 38%,rgba(8,16,28,0) 52%,rgba(8,16,28,.72) 100%)}
#logo{position:absolute;top:calc(max(20px,env(safe-area-inset-top)) + 46px);left:0;right:0;text-align:center;pointer-events:none}
#logo h1{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'New York',Georgia,serif;font-size:56px;line-height:.95;font-weight:900;letter-spacing:.5px;color:#fff3c8;background:linear-gradient(180deg,#fffbe6 6%,#ffd66e 46%,#d98d1f 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #5a2c06) drop-shadow(0 0 1px #3a1c04) drop-shadow(0 8px 16px rgba(0,0,0,.45))}
#logo h1 span{display:block;font-size:64px}
#logo p{margin-top:10px;font-size:16px;letter-spacing:3px;color:#ffe9b8;text-shadow:0 2px 4px rgba(0,0,0,.7);font-weight:800}
.btn{min-height:58px;padding:0 26px;border-radius:18px;font-family:inherit;font-weight:900;font-size:24px;letter-spacing:.5px;cursor:pointer;color:#fff;text-shadow:0 2px 0 rgba(20,60,10,.7);background:linear-gradient(180deg,#9bdc57,#4c9a29 62%,#3f8522);border:1px solid rgba(255,255,255,.35);border-bottom:4px solid #2b5f14;box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -10px 16px rgba(20,70,10,.35)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
#playBtn{width:min(100%,300px);min-height:68px;font-size:30px}
.seg{display:flex;gap:0;border-radius:14px;overflow:hidden;border:2px solid rgba(150,196,228,.34);background:rgba(10,22,34,.7);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.seg button{min-height:46px;min-width:88px;padding:0 10px;border:0;background:transparent;color:#b9d0e2;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;line-height:1.05}
.seg button small{display:block;font-size:11px;font-weight:700;opacity:.8}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#f7dc82,#d29b2c);color:#3a2408}
#info{font-size:15px;color:#ffe9b8;text-shadow:0 2px 4px rgba(0,0,0,.7);text-align:center;font-weight:800}
#info b{color:#fff}
/* get ready */
#ready{justify-content:center;padding-top:22%;pointer-events:none}
#ready .card{margin-top:26%;text-align:center;background:rgba(10,22,34,.62);border:1px solid rgba(160,200,230,.35);border-radius:18px;padding:12px 18px;max-width:300px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#ready .tap{font-size:52px;display:block;animation:tapHint 1s ease-in-out infinite}
#ready b{font-size:22px;color:#ffe08a;font-weight:900}
#ready p{font-size:15px;margin-top:4px;color:#e5eef5;line-height:1.3}
@keyframes tapHint{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(10px) scale(.9)}}
/* medal banner */
#banner{position:absolute;left:0;right:0;top:27%;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#banner svg{width:84px;height:84px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
#banner b{margin-top:2px;font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-size:28px;font-weight:900;color:#fff3c8;text-shadow:0 3px 0 #5a2c06,0 6px 14px rgba(0,0,0,.5)}
#banner.on{animation:ban 1.5s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#back{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;min-height:44px;padding:0 10px;display:inline-flex;align-items:center;color:#cfe0ee;font-size:14px;font-weight:800;text-decoration:none;text-shadow:0 1px 3px #000}
@media (prefers-reduced-motion:reduce){#score.pop,#feath.bump,#ready .tap,#banner.on{animation:none}#banner.on{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden"><div id="score">0</div><div id="goal"></div></div>
  <div id="feath" class="hidden"><svg viewBox="0 0 24 24"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#e0921c"/></linearGradient></defs><path d="M3 21C4 12 10 4 21 3c-1 10-8 17-15 17z" fill="url(#fg)" stroke="#7a4a08" stroke-width="1.2"/><path d="M3.5 20.5C9 14 13 10 17 6.5" fill="none" stroke="#7a4a08" stroke-width="1.2"/></svg><span id="fcount">0</span></div>
  <div id="shield" class="hidden">🛡</div>

    <button class="btn" id="playBtn" type="button">PLAY</button>
  </div>
  <div id="codes" class="hidden">CODES ON</div>
  <a id="back" class="hidden" href="../index.html">← Hub</a>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const SDK = window.ArcadeSDK || null;
function scene(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
const cheated = () => !!(SDK && SDK.cheated);
const RM = FX.rm();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
const rd = k => { const v = +lsGet(k); return Number.isFinite(v) && v > 0 ? v : 0; };
let topLevel = false; try { topLevel = window.parent === window; } catch (e) {}
const setBack = on => { if (topLevel) $('back').classList.toggle('hidden', !on); };

/* ---------------------------------------------------------------- world size and canvas */
const W = 420; let H = 760, GH = 76, GROUND = H - GH, SC = 1, CSSW = 390, CSSH = 760, Q = 2;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
function fit() {
  const vv = window.visualViewport, vw = Math.max(240, vv ? vv.width : innerWidth), vh = Math.max(320, vv ? vv.height : innerHeight);
  const A = Math.min(2.15, Math.max(1.5, vh / vw));
  CSSW = Math.floor(Math.min(vw, vh / A)); CSSH = Math.floor(CSSW * A);
  stage.style.width = CSSW + 'px'; stage.style.height = CSSH + 'px';
  SC = CSSW / W; H = Math.round(W * A); GROUND = H - GH;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(CSSW * d); cv.height = Math.round(CSSH * d);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  const q = Math.min(2, Math.max(1, d * SC));
  if (Math.abs(q - Q) > 0.3 || !assets.far) { Q = q; buildAssets(); }
}

/* ---------------------------------------------------------------- game state */
const PW = 78, CAPW = 96, CAPH = 34, BR = 13;   // pipe body width, cap size, bird hit radius (drawn bird is bigger)
const PHASE_LEN = 12;                            // pipes per time of day
let state = 'title', mode = 'classic', score = 0, runPipes = 0, feathersRun = 0, closeRun = 0, t = 0, groundX = 0, farX = 0, midX = 0, treeX = 0, nearX = 0;
let heroS = 2.1, bird = { x: 210, y: 300, vy: 0, ang: 0, wing: 0, sq: 0 }, pipes = [], pickups = [], shield = false, invuln = 0, nearStreak = 0, ghost = false, slowmo = false, wide = false;
let bestScore = rd('flappyBest'), lifePipes = rd('flappyPipes'), galePipes = rd('flappyGale'), lifeFeathers = rd('flappyFeathers');
let muted = lsGet('flappyMute') === '1', tutSeen = lsGet('flappyTut') === '1', flash = 0, medalShown = 0, deadT = 0, spawnX = 0, lastPipeY = 380, cooldown = 0;
const shake = new FX.Shake({ maxOffset: 16, maxAngle: 0.025 }), timeFx = new FX.Time(), flapSpring = new FX.Spring(320, 15), parts = new FX.Particles(180), pops = new FX.Pops(14);
const RANKS = [[0, 'Chick'], [50, 'Fledgling'], [150, 'Sky Dancer'], [400, 'Ace'], [800, 'Stormrider']];
const rankFor = n => { let r = RANKS[0][1]; for (const x of RANKS) if (n >= x[0]) r = x[1]; return r; };

/* ---------------------------------------------------------------- birds: nine skins, all drawn from one function */
const SKINS = [
  { id: 'sunny', name: 'Sunny', cost: 0, body: ['#ffe27a', '#f6b73c', '#c8791a'], belly: '#fff2c4', wing: ['#f0a12a', '#b8620f'], beak: ['#ff9a3c', '#d2601a'], cheek: '#ff8f7a' },
  { id: 'robin', name: 'Robin', cost: 30, body: ['#b98358', '#8b5a3c', '#5a3822'], belly: '#f08a58', wing: ['#7a4c2e', '#4a2c18'], beak: ['#f5c04a', '#c48a1c'], cheek: '#ff9c86' },
  { id: 'jay', name: 'Blue Jay', cost: 70, body: ['#7fb2f0', '#3f78c4', '#22508f'], belly: '#eef3fb', wing: ['#2a5fae', '#163b70'], beak: ['#3a3f4a', '#1b1e26'], cheek: '#f6a8b8', acc: 'crest' },
  { id: 'parakeet', name: 'Parakeet', cost: 120, body: ['#a8e070', '#56b04a', '#2f7a2c'], belly: '#d8f2a0', wing: ['#e2503c', '#a02a1c'], beak: ['#ffd062', '#d6942a'], cheek: '#ff9a70' },
  { id: 'pilot', name: 'Ace Pilot', cost: 190, body: ['#ffe27a', '#f6b73c', '#c8791a'], belly: '#fff2c4', wing: ['#f0a12a', '#b8620f'], beak: ['#ff9a3c', '#d2601a'], cheek: '#ff8f7a', acc: 'pilot' },
  { id: 'ninja', name: 'Ninja', cost: 270, body: ['#7a808c', '#454b58', '#22262e'], belly: '#8f96a4', wing: ['#2c313b', '#14171d'], beak: ['#c9a04a', '#8a6a24'], cheek: '#5a6070', acc: 'ninja' },
  { id: 'royal', name: 'Royal', cost: 360, body: ['#c4a4f5', '#7b4fc0', '#4a2a8a'], belly: '#eadcff', wing: ['#5a34a0', '#341a68'], beak: ['#ffd062', '#c48a1c'], cheek: '#f6a0c8', acc: 'crown' },
  { id: 'golden', name: 'Golden', cost: 0, req: { stat: 'best', v: 35, text: 'Score 35 to win the Gold medal' }, body: ['#fff2a8', '#f2c230', '#b07a08'], belly: '#fff8d0', wing: ['#f0b420', '#9a6206'], beak: ['#ffb040', '#c07018'], cheek: '#ffb090', acc: 'halo', trail: 'sparkle' },
  { id: 'phoenix', name: 'Phoenix', cost: 0, req: { stat: 'best', v: 60, text: 'Score 60 to earn Platinum' }, body: ['#ffe066', '#ff8a2a', '#c8321a'], belly: '#fff0a0', wing: ['#ff5a2a', '#a01c10'], beak: ['#ffd070', '#d67a1c'], cheek: '#ffb070', acc: 'flame', trail: 'ember' },
];
function drawBird(c, sk, x, y, s, ang, wing, sqx, sqy, time) {
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(s * sqx, s * sqy);
  const acc = sk.acc, b = sk.body, bp = Math.sin(time * 9);
  // tail
  c.fillStyle = sk.wing[1]; for (let i = -1; i <= 1; i++) { c.save(); c.translate(-15, 0); c.rotate(Math.PI + i * 0.32 + wing * 0.06); c.beginPath(); c.moveTo(0, -3); c.quadraticCurveTo(10, -4.5, 17, i * 1.5); c.quadraticCurveTo(10, 4.5, 0, 3); c.closePath(); c.fill(); c.restore(); }
  if (acc === 'ninja') { c.strokeStyle = '#c62828'; c.lineWidth = 3.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(-8, -9); c.quadraticCurveTo(-20, -8 + bp * 3, -30, -12 + bp * 5); c.moveTo(-8, -7); c.quadraticCurveTo(-19, -3 + bp * 3, -28, -2 + bp * 5); c.stroke(); }
  if (acc === 'pilot') { c.strokeStyle = '#c8402a'; c.lineWidth = 4.2; c.lineCap = 'round'; c.beginPath(); c.moveTo(-3, 9); c.quadraticCurveTo(-16, 10 + bp * 2, -27, 5 + bp * 6); c.stroke(); }
  // body
  let g = c.createRadialGradient(6, -8, 2, 0, 0, 22); g.addColorStop(0, b[0]); g.addColorStop(0.55, b[1]); g.addColorStop(1, b[2]);
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 18, 14.5, 0, 0, 6.283); c.fill();
  c.save(); c.beginPath(); c.ellipse(0, 0, 18, 14.5, 0, 0, 6.283); c.clip();
  g = c.createLinearGradient(0, 0, 0, 15); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
  c.fillStyle = sk.belly; c.beginPath(); c.ellipse(3, 8, 14, 8.5, -0.12, 0, 6.283); c.fill(); c.fillStyle = g; c.fillRect(-20, 0, 40, 16);
  c.fillStyle = 'rgba(255,240,200,.35)'; c.beginPath(); c.ellipse(6, -9, 9, 3.4, -0.35, 0, 6.283); c.fill();   // warm sun catch-light on the back
  c.restore();
  // wing (flaps around its root)
  c.save(); c.translate(-4, 1); c.rotate(wing);
  g = c.createLinearGradient(0, -8, 0, 9); g.addColorStop(0, sk.wing[0]); g.addColorStop(1, sk.wing[1]);
  c.fillStyle = g; c.beginPath(); c.moveTo(4, -2); c.quadraticCurveTo(-4, -11, -15, -3); c.quadraticCurveTo(-19, 4, -9, 9); c.quadraticCurveTo(0, 10, 6, 3); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-1, 2); c.lineTo(-13, 3); c.moveTo(0, -1); c.lineTo(-12, -1); c.moveTo(-3, 5); c.lineTo(-10, 7); c.stroke();
  c.strokeStyle = 'rgba(255,235,190,.5)'; c.lineWidth = 1.1; c.beginPath(); c.moveTo(3, -2); c.quadraticCurveTo(-4, -10, -14, -3); c.stroke();
  c.restore();
  // beak, cheek, eye
  g = c.createLinearGradient(0, -3, 0, 6); g.addColorStop(0, sk.beak[0]); g.addColorStop(1, sk.beak[1]);
  c.fillStyle = g; c.beginPath(); c.moveTo(14, -3); c.quadraticCurveTo(24, -1.5, 25.5, 1.4); c.quadraticCurveTo(22, 5.4, 14, 5.2); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(60,20,0,.45)'; c.lineWidth = 1; c.beginPath(); c.moveTo(14.5, 1.6); c.quadraticCurveTo(20, 2.2, 25, 1.5); c.stroke();
  c.fillStyle = sk.cheek; c.globalAlpha = 0.5; c.beginPath(); c.ellipse(6.5, 4.2, 3.6, 2.6, 0, 0, 6.283); c.fill(); c.globalAlpha = 1;
  c.fillStyle = '#fffdf6'; c.beginPath(); c.arc(8.5, -4.6, 5.1, 0, 6.283); c.fill(); c.strokeStyle = 'rgba(40,20,0,.5)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#231710'; c.beginPath(); c.arc(9.9, -4.4, 2.9, 0, 6.283); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(10.9, -5.6, 1.15, 0, 6.283); c.arc(8.9, -3.2, 0.55, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(255,225,160,.65)'; c.lineWidth = 1.5; c.lineCap = 'round'; c.beginPath(); c.ellipse(0, 0, 17.4, 13.9, 0, -1.25, -0.25); c.stroke();  // rim light from the low sun ahead
  // accessories
  if (acc === 'crest' || acc === 'flame') {
    const cols = acc === 'flame' ? ['#ffd24a', '#ff7a1c', '#e0341c'] : ['#5b92d8', '#3f78c4', '#22508f'];
    for (let i = 0; i < 3; i++) { c.fillStyle = cols[i]; c.beginPath(); c.moveTo(-1 + i * 4, -12); c.quadraticCurveTo(-8 + i * 4 - bp * 1.5, -21 - i * 1.5, -9 + i * 5 - bp * 2, -25 + i * 2); c.quadraticCurveTo(-2 + i * 4, -18, 4 + i * 4, -12); c.closePath(); c.fill(); }
  }

  } else if (state === 'dead' || state === 'won') {

    if (state === 'dead') { bird.vy = Math.min(760, bird.vy + 1500 * dt); bird.y += bird.vy * dt; bird.ang += real * 9; if (bird.y + BR > GROUND) { bird.y = GROUND - BR; if (Math.abs(bird.vy) > 200) { bird.vy = -bird.vy * 0.3; parts.emit(bird.x, GROUND, { n: 8, colors: ['#8a6a3a', '#b28a52'], speed: [30, 120], angle: [3.4, 6.0], life: 0.5, size: [2, 5], gravity: 300 }); } else { bird.vy = 0; bird.ang *= 0.9; } } }
    else { bird.y += Math.sin(t * 6) * 0.6; bird.wing = Math.sin(t * 14) * 0.6; }
  }
}
let cloudsX = 0;

/* ---------------------------------------------------------------- draw */
function tile(img, ox, y, w, h) {   // draw a 2-screen-wide strip scrolled by ox, seamlessly (whole pixels, 1px overlap)
  const iw = W * 2; let x = -Math.floor(ox % iw); if (x > 0) x -= iw;
  for (; x < W; x += iw) ctx.drawImage(img, x, y, iw + 1, h);
}
function draw() {
  ctx.save(); shake.apply(ctx, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40);
  const ph = sky.draw(ctx, W, GROUND, score / PHASE_LEN, t), star = ph.star;
  // clouds (warm light from below, drifting)
  for (let i = 0; i < 5; i++) { const c = assets.clouds[i], w = c.width / Q, cx = ((i * 190 - cloudsX * (0.5 + i * 0.16)) % (W + 240) + W + 240) % (W + 240) - 120, cy = 70 + ((i * 97) % 5) * 52 + i * 8; ctx.globalAlpha = 0.9 - i * 0.05 - star * 0.6; if (ctx.globalAlpha > 0.02) ctx.drawImage(c, cx - w / 2, cy, w, c.height / Q); }
  ctx.globalAlpha = 1;
  // layered land: far peaks, mid hills, two tree belts
  tile(assets.far, farX, GROUND - 346, W * 2, 340); tile(assets.mid, midX, GROUND - 198, W * 2, 200); tile(assets.trees1, treeX, GROUND - 118, W * 2, 130); tile(assets.trees2, nearX, GROUND - 120, W * 2, 150);
  // pipes: soft shadow to the left (the sun is low on the right), body, cap
  for (const p of pipes) {
    const top = p.y - p.gap / 2, bot = p.y + p.gap / 2;
    const sg = ctx.createLinearGradient(p.x - 26, 0, p.x, 0); sg.addColorStop(0, 'rgba(20,10,30,0)'); sg.addColorStop(1, 'rgba(20,10,30,.3)'); ctx.fillStyle = sg; ctx.fillRect(p.x - 26, 0, 26, top - CAPH + 4); ctx.fillRect(p.x - 26, bot + CAPH - 4, 26, GROUND - bot);
    pipeBody(p.x, 0, top - CAPH + 2, true); pipeBody(p.x, bot + CAPH - 2, GROUND, false);
    ctx.drawImage(assets.cap, p.x - (CAPW - PW) / 2, top - CAPH, CAPW, CAPH);
    ctx.save(); ctx.translate(p.x - (CAPW - PW) / 2, bot); ctx.drawImage(assets.cap, 0, 0, CAPW, CAPH); ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(p.x - 6, top, PW + 12, 5); ctx.fillRect(p.x - 6, bot + CAPH, PW + 12, 4);
  }
  // ground
  const gy = GROUND - 4; let gx = -Math.floor(groundX % W); for (; gx < W; gx += W) ctx.drawImage(assets.ground, gx, gy, W + 1, GH + 6);
  // time-of-day grade over the land (multiply keeps texture, shifts colour); nothing at golden hour
  const tn = sky.tint(ph); if (tn) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tn; ctx.fillRect(0, GROUND - 260, W, H - GROUND + 260); ctx.restore(); }
  // pickups
  for (const kk of pickups) { const y = kk.y + Math.sin(t * 3 + kk.ph) * 5; if (kk.kind === 'f') { ctx.save(); ctx.translate(kk.x, y); ctx.rotate(Math.sin(t * 2 + kk.ph) * 0.25); const s = 1 + Math.sin(t * 5 + kk.ph) * 0.06; ctx.drawImage(assets.feather, -22 * s, -22 * s, 44 * s, 44 * s); ctx.restore(); } else { ctx.drawImage(assets.bubble, kk.x - 24, y - 24, 48, 48); } }
  // bird
  const sk = skinNow(), sq = FX.squash(flapSpring.x), ba = bird.ang;
  ctx.save(); if (invuln > 0 && state === 'play') ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 40);
  if (shield && state !== 'title') { ctx.drawImage(assets.bubble, bird.x - 34, bird.y - 34, 68, 68); }
  drawBird(ctx, sk, bird.x, bird.y, heroS, ba, bird.wing, sq.sx, sq.sy, t); ctx.restore();
  parts.draw(ctx); pops.draw(ctx);
  ctx.drawImage(assets.vig, 0, 0, W, H);
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.6; ctx.fillStyle = '#fff'; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.globalAlpha = 1; }
  ctx.restore();
}
function pipeBody(x, y0, y1, fromBottom) {   // tile the 256px texture away from the cap so the rivet bands line up
  const th = 256, len = y1 - y0; if (len <= 0) return;
  if (fromBottom) { for (let y = y1; y > y0; y -= th) { const h = Math.min(th, y - y0); ctx.drawImage(assets.pipe, 0, (th - h) * Q, PW * Q, h * Q, x, y - h, PW, h); } }
  else { for (let y = y0; y < y1; y += th) { const h = Math.min(th, y1 - y); ctx.drawImage(assets.pipe, 0, 0, PW * Q, h * Q, x, y, PW, h); } }
}
/* ---------------------------------------------------------------- loop */
let last = 0, running = true;
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) { last = 0; return; }
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now;
  update(dt); draw();
}

/* ---------------------------------------------------------------- input */
stage.addEventListener('pointerdown', e => {
  if (SDK && SDK.paused) return;
  if (e.target.closest('button,a,.hm,#title .seg,#metaHost')) return;
  if (state === 'title') getReady(false); else if (state === 'ready') go(); else if (state === 'play') flap();
});
addEventListener('keydown', e => {
  if (SDK && SDK.paused) return;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== document.body) return;
    e.preventDefault();
    if (state === 'title') getReady(false); else if (state === 'ready') go(); else if (state === 'play') flap();
  }
});
$('playBtn').addEventListener('click', e => { e.stopPropagation(); getReady(false); });
addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (!SDK) document.addEventListener('visibilitychange', () => { last = 0; });

/* ---------------------------------------------------------------- codes, hints, arcade SDK */
const CODES = { GHOSTBIRD: 'Ghost bird: fly through pipes and bounce off the ground', WIDEGAP: 'Wide gaps: every pipe gap is 22% taller', SLOWMO: 'Slow motion: the whole sky runs at 60% speed' };
function code(c) { if (!CODES[c]) return { ok: false }; $('codes').classList.remove('hidden'); if (c === 'GHOSTBIRD') ghost = true; if (c === 'WIDEGAP') wide = true; if (c === 'SLOWMO') slowmo = true; return { ok: true, message: CODES[c] }; }
function hint() {
  if (state !== 'play') return state === 'ready' ? 'Tap to start. Short taps keep the bird level; long gaps between taps let it drop.' : 'Press Play, then tap to flap. Golden feathers are worth a coin each and buy new birds.';
  const p = pipes.find(q => q.x + PW > bird.x - BR); if (!p) return 'Short taps: hold the bird in the middle of the sky until the next pipe arrives.';
  const d = bird.y - p.y; return d < -30 ? 'The next gap is lower: let the bird fall a little before you flap.' : d > 30 ? 'The next gap is higher: flap now, in short taps.' : 'You are lined up with the next gap: small taps to hold your height.' + (shield ? ' Your shield will save you once.' : '');
}
if (SDK) SDK.init({ pauseButton: 'br', onRestart: () => getReady(false), onExit: showTitle, onTutorial: () => getReady(true), onHint: hint, onCheat: code });

/* ---------------------------------------------------------------- go */
const mh = meta.mountBar($('metaHost'));
fit(); showTitle(); requestAnimationFrame(loop);
window.__flappy = { get state() { return state; }, get score() { return score; }, meta, start: () => getReady(false), flap, go, setMode, get bird() { return bird; }, get pipes() { return pipes; }, cheat: c => code(c), pipesPassed: () => runPipes };
})();
</script>
