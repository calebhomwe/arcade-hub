<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff0dc">
<title>2048</title>
<style>
:root{--bg1:#f6ead0;--bg2:#d9b88a;--ink:#4a2f17;--muted:rgba(74,47,23,.68);--bgtex:url(assets/tex/linen.jpg);--frametex:url(assets/tex/walnut.jpg);--frametint:#ffffff;--welltex:url(assets/tex/leather.jpg);--wellshade:rgba(10,5,0,.45);--tiletex:url(assets/tex/oak.jpg);--blend:overlay;--texsize:150px;--accent:#c2571f;--bs:min(calc(100vw - 24px),calc(100vh - 340px),460px);--pad:calc(var(--bs)*.045);--gap:calc(var(--bs)*.026);--n:4;--cell:calc((var(--bs) - 2*var(--pad) - (var(--n) - 1)*var(--gap))/var(--n));--pz-ov1:#f6ead0;--pz-ov2:#d9b88a;--pz-ovink:#4a2f17}
@supports (height:100dvh){:root{--bs:min(calc(100vw - 24px),calc(100dvh - 340px),460px)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--pz-text,system-ui,-apple-system,'Segoe UI',sans-serif);color:var(--ink);background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,214,140,.5),rgba(255,214,140,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,300px;background-blend-mode:normal,normal,multiply;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.glass{background:var(--pz-navy,linear-gradient(180deg,#1c3460,#0a162e));box-shadow:inset 0 0 0 1.5px rgba(255,220,140,.42),inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.35);border-radius:16px;color:#fff3d2}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px;touch-action:none}
#top{width:min(100%,480px);display:flex;align-items:center;gap:8px;min-height:48px;padding-right:52px}
#back{display:inline-flex;align-items:center;min-height:44px;padding:0 12px 0 4px;color:var(--muted);text-decoration:none;font:700 15px/1 var(--pz-display,sans-serif)}
#modeName{flex:1;text-align:center;font:600 16px/1.1 var(--pz-display,sans-serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{width:var(--bs);display:flex;gap:10px;align-items:stretch;min-height:64px;margin-top:auto}
.stat{flex:1;padding:8px 12px 7px;min-width:0;position:relative}
.stat small{display:block;font:700 12px/1 var(--pz-display,sans-serif);letter-spacing:.14em;color:rgba(255,243,210,.7)}
.stat b{display:block;font:700 28px/1.1 var(--pz-display,sans-serif);font-variant-numeric:tabular-nums;white-space:nowrap;background:linear-gradient(180deg,#fff8d2,#f6c651 62%,#d9902a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(60,25,0,.85));width:fit-content;max-width:100%}
.stat b.bump{animation:bump .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.2)}}
.stat.goal{flex:1.6}
.stat.goal b{font-size:21px;background:none;color:#fff3d2;filter:none;-webkit-background-clip:border-box}
.stat.goal .gi{display:inline-block;vertical-align:-4px;width:24px;height:24px;margin-right:4px}
#stage{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{position:absolute;inset:0;border-radius:calc(var(--bs)*.06);background-color:#fff;background-image:linear-gradient(135deg,rgba(255,235,190,.3),rgba(0,0,0,0) 50%,rgba(0,0,0,.4)),var(--frametex);background-size:auto,cover;box-shadow:0 calc(var(--bs)*.025) 0 rgba(30,15,0,.55),0 22px 30px rgba(30,15,0,.4),inset 0 0 0 calc(var(--bs)*.004) rgba(255,240,200,.6),inset 0 calc(var(--bs)*.006) 0 rgba(255,255,255,.35);touch-action:none;contain:layout;background-blend-mode:normal,multiply}
#board::before{content:'';position:absolute;inset:calc(var(--bs)*.02);border-radius:calc(var(--bs)*.04);background-color:var(--wellshade);background-image:var(--welltex);background-size:220px;background-blend-mode:multiply;box-shadow:inset 0 calc(var(--bs)*.012) calc(var(--bs)*.03) rgba(0,0,0,.85),0 0 0 calc(var(--bs)*.004) #c8901f,0 calc(var(--bs)*.003) 0 calc(var(--bs)*.004) rgba(255,255,255,.2)}
#board.danger{animation:danger 1.2s ease-in-out infinite}
@keyframes danger{50%{box-shadow:0 calc(var(--bs)*.025) 0 rgba(30,15,0,.55),0 0 0 4px rgba(255,90,70,.75),0 22px 30px rgba(30,15,0,.4)}}
.cell{position:absolute;left:var(--pad);top:var(--pad);width:var(--cell);height:var(--cell);border-radius:20%;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.24));box-shadow:inset 0 calc(var(--cell)*.03) calc(var(--cell)*.05) rgba(0,0,0,.4),0 calc(var(--cell)*.02) 0 rgba(255,255,255,.08);transform:translate(calc(var(--c)*(var(--cell) + var(--gap))),calc(var(--r)*(var(--cell) + var(--gap))))}
.tile{position:absolute;left:var(--pad);top:var(--pad);width:var(--cell);height:var(--cell);transform:translate(calc(var(--c)*(var(--cell) + var(--gap))),calc(var(--r)*(var(--cell) + var(--gap))));transition:transform .13s cubic-bezier(.3,.85,.4,1);will-change:transform;z-index:2}
.tile.dead{z-index:1}
.tile .in{position:absolute;inset:0;border-radius:20%;background-color:var(--bg);background-image:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%,rgba(0,0,0,.26)),var(--tiletex);background-size:auto,var(--texsize);background-position:0 0,var(--tx,0) var(--ty,0);background-blend-mode:normal,var(--blend);color:var(--fg);box-shadow:0 calc(var(--cell)*.07) calc(var(--cell)*.09) rgba(20,8,0,.55),0 calc(var(--cell)*.03) 0 var(--sh),inset 0 calc(var(--cell)*.035) 0 rgba(255,255,255,.5),inset 0 calc(var(--cell)*-.04) calc(var(--cell)*.04) rgba(0,0,0,.28),inset 0 0 0 calc(var(--cell)*.012) rgba(255,255,255,.14);display:grid;place-items:center;font:700 calc(var(--cell)*.44)/1 var(--pz-display,sans-serif);overflow:hidden}
.tile[data-len="3"] .in{font-size:calc(var(--cell)*.36)}
.tile[data-len="4"] .in{font-size:calc(var(--cell)*.29)}
.tile[data-len="5"] .in{font-size:calc(var(--cell)*.24)}
.tile .in::before{content:'';position:absolute;left:10%;right:10%;top:5%;height:34%;border-radius:40% 40% 70% 70%;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.tile .num{position:relative;z-index:1;text-shadow:var(--numsh)}
.tile.gold .in{background-image:linear-gradient(155deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(120,60,0,.35)),radial-gradient(circle at 30% 25%,#fff3b0,rgba(255,243,176,0) 55%);box-shadow:0 0 calc(var(--cell)*.3) rgba(255,205,80,.85),0 calc(var(--cell)*.03) 0 var(--sh),inset 0 calc(var(--cell)*.035) 0 rgba(255,255,255,.7),inset 0 calc(var(--cell)*-.04) calc(var(--cell)*.04) rgba(120,60,0,.4)}
.tile.pop .in{animation:pop .24s cubic-bezier(.2,1.6,.4,1)}
.tile.born .in{animation:born .2s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes born{from{transform:scale(.2);opacity:0}}
.tile.smash .in{animation:smash .28s ease-in forwards}
@keyframes smash{to{transform:scale(1.4) rotate(14deg);opacity:0}}
body.faces .tile .in{display:block}
body.faces .tile .face{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
body.faces .tile .num{position:absolute;right:calc(var(--cell)*.05);bottom:calc(var(--cell)*.05);min-width:calc(var(--cell)*.36);padding:calc(var(--cell)*.035) calc(var(--cell)*.09);border-radius:999px;background:linear-gradient(180deg,#fff8e4,#ead9ae);color:#4a2f17;font:700 calc(var(--cell)*.2)/1.05 var(--pz-display,sans-serif);text-align:center;z-index:3;box-shadow:0 0 0 1.5px #8a5a0c,0 2px 3px rgba(0,0,0,.35);text-shadow:none}
body.faces .tile .in::before{display:none}
#praise{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;font:700 40px/1 var(--pz-display,sans-serif);color:#fff3c0;text-shadow:0 3px 0 rgba(90,40,0,.85),0 0 26px rgba(255,190,70,.9);opacity:0;z-index:8}
#praise.go{animation:praise 1s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes praise{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.2) rotate(2deg)}32%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
#arrow{position:absolute;left:50%;top:50%;width:calc(var(--bs)*.26);height:calc(var(--bs)*.26);margin:calc(var(--bs)*-.13) 0 0 calc(var(--bs)*-.13);z-index:9;pointer-events:none;opacity:0;transition:opacity .2s}
#arrow.on{opacity:.92;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{translate:0 -10px}}
#tools{width:var(--bs);display:flex;gap:8px;flex:none}
.tool{flex:1;min-height:54px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:700 13px/1 var(--pz-display,sans-serif);position:relative;touch-action:manipulation;color:#ffe9a8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.tool svg{width:22px;height:22px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.tool:active{transform:translateY(2px)}
.tool[disabled]{opacity:.4}
.tool.armed{box-shadow:inset 0 0 0 3px #ffd979,0 0 18px rgba(255,205,90,.8)}
.tool .n{position:absolute;top:-7px;right:-3px;min-width:23px;height:23px;padding:0 5px;border-radius:12px;background:var(--pz-gold,#f0b93a);color:#4a2a00;display:grid;place-items:center;font:700 13px/1 var(--pz-display,sans-serif);box-shadow:0 0 0 1.5px #8a5a0c,0 2px 0 1.5px #6b4408;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#hintline{width:var(--bs);min-height:40px;margin-bottom:auto;font:800 15px/1.3 var(--pz-text,sans-serif);color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center}
#hintline.coach{color:#4a2f17;border-radius:16px;padding:6px 6px 6px 14px;justify-content:space-between;gap:10px;text-align:left;background-color:#f3e2b3;background-image:linear-gradient(180deg,rgba(255,250,232,.55),rgba(214,170,96,.18)),var(--pz-paper);background-blend-mode:normal,overlay;background-size:auto,220px;box-shadow:0 0 0 2px #6e4519,0 0 0 4px #e6bb55,0 8px 18px rgba(0,0,0,.3)}
#hintline button{flex:none;min-height:44px;min-width:60px;border:0;border-radius:12px;background:linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,inset 0 1px 0 rgba(255,255,255,.4);font:700 15px/1 var(--pz-display,sans-serif);color:#fff3d2;cursor:pointer}
.tool:focus-visible,.mbtn:focus-visible,#back:focus-visible,.sbtn:focus-visible,#board:focus-visible,.sizes button:focus-visible{outline:3px solid #ffd979;outline-offset:3px}
#finger{position:fixed;left:0;top:0;width:54px;height:54px;z-index:25;pointer-events:none;display:none}
#finger.on{display:block}
#logo{display:flex;gap:7px}
#logo i{font-style:normal;width:clamp(52px,17vw,70px);height:clamp(52px,17vw,70px);border-radius:20%;display:grid;place-items:center;font:700 clamp(30px,10vw,42px)/1 var(--pz-display,sans-serif);color:var(--fg,#fff6dc);text-shadow:var(--numsh);background-color:var(--bg);background-image:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%,rgba(0,0,0,.26)),var(--tiletex);background-size:auto,150px;background-blend-mode:normal,overlay;box-shadow:0 8px 12px rgba(20,8,0,.5),0 4px 0 var(--sh),inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 6px rgba(0,0,0,.28);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tag{font:600 17px/1.35 var(--pz-display,sans-serif);color:var(--muted);max-width:320px}
.menu{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}
.mbtn{--a:#8fe062;--b:#3ea52d;--edge:#256f1b;--deep:#1d5a14;--fg:#fff;--sh:rgba(10,50,0,.55);border:0;cursor:pointer;min-height:76px;border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--fg);text-shadow:0 2px 0 var(--sh);background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0) 50%),linear-gradient(180deg,var(--a),var(--b));box-shadow:0 0 0 2px var(--edge),0 6px 0 2px var(--deep),0 14px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);touch-action:manipulation;position:relative;margin-bottom:6px}
.mbtn:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--edge),0 2px 0 2px var(--deep),inset 0 1px 0 rgba(255,255,255,.5)}
.mbtn svg{flex:none;width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.mbtn b{display:block;font:700 23px/1.05 var(--pz-display,sans-serif)}
.mbtn small{display:block;font:800 14px/1.25 var(--pz-text,sans-serif);opacity:.86;margin-top:3px}
.mbtn.cls{--a:#ffd66b;--b:#dc9224;--edge:#8a5a0c;--deep:#6b4408;--fg:#3a2200;--sh:rgba(255,255,255,.5)}
.mbtn.day{--a:#7fbcff;--b:#2d6ccd;--edge:#1c4a99;--deep:#143a78;--sh:rgba(0,20,70,.55)}
.mbtn .badge{position:absolute;top:-8px;right:10px;padding:4px 9px;border-radius:999px;background:linear-gradient(180deg,#ff8a6d,#d63b1f);color:#fff;font:700 12px/1 var(--pz-display,sans-serif);box-shadow:0 0 0 2px #8a1f0c,0 2px 0 2px #6b1808;text-shadow:none}
.sizes{display:flex;gap:6px;justify-content:center;padding:5px;border-radius:16px;background:linear-gradient(180deg,#4b2e10,#6b4519);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.3)}
.sizes button{border:0;min-height:44px;padding:0 14px;border-radius:12px;background:transparent;font:700 15px/1 var(--pz-display,sans-serif);cursor:pointer;color:#f5e2b8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.sizes button.on{background:var(--pz-gold);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 0 0 2px #8a5a0c,inset 0 1px 0 rgba(255,255,255,.7)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sbtn{border:0;cursor:pointer;min-height:48px;padding:0 20px;border-radius:14px;font:700 16px/1 var(--pz-display,sans-serif);color:#fff3d2;text-shadow:0 2px 0 rgba(30,12,0,.6);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 52%),linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,0 4px 0 2px #3a230b,0 8px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:4px}
.sbtn:active{transform:translateY(3px)}
#codesOn{position:fixed;left:12px;top:60px;z-index:31;background:#ffd23f;color:#26170a;font:700 12px/1 var(--pz-display,sans-serif);letter-spacing:.14em;padding:6px 10px;border-radius:999px}
#codesOn[hidden]{display:none}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.album div{text-align:center;padding:6px 2px 8px;border-radius:12px;background:rgba(120,78,30,.14);font:800 12px/1.15 var(--pz-text,sans-serif);color:#7d5a33;box-shadow:inset 0 1px 3px rgba(80,40,0,.25),0 1px 0 rgba(255,255,255,.45)}
.album .fc{width:46px;height:46px;margin:0 auto 3px;border-radius:20%;background-color:var(--bg);background-image:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%,rgba(0,0,0,.26)),var(--tiletex);background-size:auto,100px;background-blend-mode:normal,overlay;box-shadow:0 2px 3px rgba(0,0,0,.4),0 2px 0 var(--sh)}
.album svg{display:block;width:100%;height:100%}
.album div.no .fc{filter:grayscale(1) brightness(.5);opacity:.55}
.album div.got{color:#4a2f17}
.pz-ov:not(.dim){background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,214,140,.5),rgba(255,214,140,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,300px;background-blend-mode:normal,normal,multiply}
[hidden]{display:none!important}
@media (max-height:640px){#hud{min-height:56px}.stat b{font-size:24px}#hintline{min-height:32px}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.pop .in,.tile.born .in,#board.danger,#logo i,#praise.go,#arrow.on,.stat b.bump{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a id="back" href="../index.html" aria-label="Back to the arcade hub">‹ Hub</a><div id="modeName">2048</div></div>
  <div id="hud">
    <div class="stat glass"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat glass"><small>BEST</small><b id="best">0</b></div>
    <div class="stat goal glass" id="goalBox" hidden><small id="goalLab">GOAL</small><b id="goalVal"></b></div>
  </div>
  <div id="stage">
    <div id="board" tabindex="0" role="application" aria-label="2048 board. Swipe or use the arrow keys."></div>
    <div id="arrow" aria-hidden="true"></div>
    <div id="praise" aria-hidden="true"></div>
  </div>
  <div id="tools">
    <button class="tool glass" id="btnUndo" aria-label="Undo the last move"><span id="icoUndo"></span>Undo<span class="n" id="nUndo">3</span></button>
    <button class="tool glass" id="btnHint" aria-label="Show a good move"><span id="icoHint"></span>Hint</button>
    <button class="tool glass" id="btnHammer" aria-label="Hammer: smash one tile"><span id="icoHammer"></span>Hammer<span class="n" id="nHammer">0</span></button>
    <button class="tool glass" id="btnMenu" aria-label="Menu"><span id="icoMenu"></span>Menu</button>
  </div>
  <div id="hintline" aria-live="polite">Swipe anywhere to slide the tiles</div>
</div>
<div id="finger" aria-hidden="true"></div>
<div id="codesOn" hidden>CODES ON</div>
<div id="live" style="position:absolute;left:-9999px" aria-live="polite"></div>

<div class="pz-ov on" id="title" role="dialog" aria-label="2048">
  <div id="logo" aria-label="2048"></div>
  <div class="tag">Slide the tiles. Match the numbers. Make friends with every critter.</div>
  <div class="menu">
    <button class="mbtn adv" id="mTrials"><span id="icoTrials"></span><span><b>Trials</b><small id="sTrials">18 goals · win stars</small></span></button>
    <button class="mbtn cls" id="mClassic"><span id="icoClassic"></span><span><b>Classic</b><small id="sClassic">Build a 2048 tile</small></span></button>
    <button class="mbtn day" id="mDaily"><span id="icoDaily"></span><span><b>Daily board</b><small id="sDaily">Same tiles for everyone today</small></span><span class="badge" id="dayBadge" hidden>NEW</span></button>
  </div>
  <div class="sizes" id="sizes" role="group" aria-label="Board size"><button data-n="5">Easy 5×5</button><button data-n="4">Normal 4×4</button><button data-n="3">Hard 3×3</button></div>
  <div class="row2" id="titleChip"></div>
</div>
<div class="pz-ov" id="trials" role="dialog" aria-label="Trials"><h2>Trials</h2><div id="tmap" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%"></div><div class="row2"><span id="starTotal" style="font:700 16px var(--pz-display,sans-serif);color:var(--muted)"></span><button class="sbtn" id="trBack">‹ Back</button></div></div>
<div class="pz-ov dim" id="pre" role="dialog" aria-label="Trial goal"></div>
<div class="pz-ov dim" id="result" role="dialog" aria-label="Result"></div>

<script src="kit/pz.js"></script>
<script src="kit/critters.js"></script>
<script src="kit/g2048-core.js"></script>
<script>
(function () {
'use strict';
const G = window.G2048, PZ = window.PZ, SDK = window.ArcadeSDK || null;
const $ = id => document.getElementById(id);
const LS = PZ.store, RM = PZ.RM;
const scene = (sc, extra) => { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} };
const cheated = () => !!(SDK && SDK.cheated);
const say = t => { const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };

/* ------------------------------------------------------------ looks you unlock by playing */

    const mx = tiles.length ? Math.max(...tiles.map(t => t.v)) : 0, cur = def.type === 'tile' ? mx : def.type === 'score' ? score : merges;

}

/* ------------------------------------------------------------ input: swipe anywhere (fires as soon as the finger has clearly moved) */

document.addEventListener('pointerdown', e => {
  if (!inGame() || e.target.closest('button,a,.pz-chip')) return; if (hammerMode) { smashAt(e.clientX, e.clientY); return; }

document.addEventListener('pointermove', e => {

/* ------------------------------------------------------------ tools */
function undo() {

  const s = history.pop(); undoLeft--; restore(s); over = false; playing = true; won = won && Math.max(0, ...tiles.map(t => t.v)) >= goalTile(); clearHintArrow(); PZ.snd.play('tap'); boardEl.classList.remove('danger'); updateHud(); scene('play', { score });
}

$('btnHammer').addEventListener('click', () => { if (!playing || over) return; if (hammers <= 0) { $('hintline').textContent = 'Merge 12 tiles to earn a hammer'; return; } hammerMode = !hammerMode; PZ.snd.play('pick'); $('hintline').textContent = hammerMode ? 'Tap a tile to smash it' : ''; updateHud(); });

function smashAt(px, py) {

}
const ARROWDEG = { up: 0, right: 90, down: 180, left: 270 }, ARROWNAME = { left: 'left', right: 'right', up: 'up', down: 'down' };

/* ------------------------------------------------------------ runs */
function fitBoard() {

}

window.addEventListener('orientationchange', () => setTimeout(fitBoard, 200));

  else if (opts.tutorial) { addTile(2, 1, 0, false); addTile(2, 1, 3, false); addTile(4, 3, 2, false); }

  $('modeName').textContent = mode === 'trial' ? def.name + (def.boss ? '  ·  Boss' : '') : mode === 'daily' ? 'Daily board · ' + todayKey() : 'Classic ' + N + '×' + N;
  $('hintline').textContent = ''; show(null); prof.stamp(); updateHud(); scene('play', { score: 0, level: mode === 'trial' ? def.i + 1 : undefined });

}
function endRun() {
  if (over) return; over = true; playing = false; clearHintArrow();
  const key = bestKey(), prev = LS.get(key, 0) | 0, isBest = !cheated() && score > prev && prev > 0; if (!cheated() && score > prev) LS.set(key, score);
  const mx = Math.max(0, ...tiles.map(t => t.v)); lifeMerges(); const xp = Math.min(90, Math.floor(score / 30) + Math.round(Math.log2(Math.max(2, mx))) * 3 + (isBest ? 12 : 0));

      if (a === 'again') newRun(mode); else if (a === 'undo') { undo(); show(null); } else toTitle();
    });
    if (xp && !cheated()) { prof.addXp(xp, 'a good game', true); if (prof.info().level > before.level) $('result').querySelector('.xp').textContent += '  ·  LEVEL UP!'; }
  }, 650);
}
function lifeMerges() { if (!cheated()) { LS.set('lifeMerges2048', (LS.get('lifeMerges2048', 0) | 0) + runMerges); } }
function winClassic() {
  playing = false; PZ.snd.play('win'); PZ.fx.confetti(90); if (!cheated()) LS.set('wins2048', (LS.get('wins2048', 0) | 0) + 1); prof.addXp(80, 'you made ' + goalTile(), true);
  scene('over', { score, outcome: 'win' });
  PZ.ui.result($('result'), { title: 'You made ' + goalTile() + '!', big: score, sub: 'Every critter is cheering. Keep going for a bigger tile?', stats: [{ v: moves, l: 'moves' }, { v: runMerges, l: 'merges' }, { v: bestTile, l: 'best tile' }], xp: 80, buttons: [{ id: 'menu', label: 'Menu' }, { id: 'new', label: 'New game' }, { id: 'keep', label: 'Keep going', primary: true }] }, a => {

function winTrial() {

  const st = G.starsFor(def, movesLeft), was = trials.stars[def.i]; trials.stars[def.i] = Math.max(was, st); saveTrials();
  const xp = 25 + st * 12 + (was ? 0 : 20); prof.count('trialwin'); if (st === 3) prof.count('star3'); if (!cheated()) prof.addXp(xp, def.name, true);
  PZ.snd.play('win'); PZ.fx.confetti(60); scene('over', { score, level: def.i + 1, stars: st });
  const nextOk = def.i + 1 < G.TRIALS && (G.trialDef(def.i + 1).pack === def.pack || packOpen(def.pack + 1));
  PZ.ui.result($('result'), { title: 'Trial clear!', stars: st, sub: def.name + ' · ' + movesLeft + ' moves to spare', stats: [{ v: score, l: 'score' }, { v: merges, l: 'merges' }, { v: Math.max(...grid()), l: 'best tile' }], xp: xp, buttons: [{ id: 'map', label: 'Trials' }, { id: 'again', label: 'Replay' }].concat(nextOk ? [{ id: 'next', label: 'Next trial', primary: true }] : []) }, a => {
    if (a === 'next') startTrial(def.i + 1); else if (a === 'again') startTrial(def.i); else openTrials();

}

  const mx = Math.max(...grid()), cur = def.type === 'tile' ? mx : def.type === 'score' ? score : merges; if (!cheated()) prof.addXp(8, 'good try', true);
  PZ.ui.result($('result'), { title: 'So close!', big: Math.min(cur, def.goal) + '<span style="font-size:24px"> / ' + def.goal + '</span>', sub: why + '. Tip: ' + (def.type === 'tile' ? 'keep your biggest tile in a corner.' : def.type === 'score' ? 'merge big tiles together for more points.' : 'line up pairs so one swipe merges several at once.'), buttons: [{ id: 'map', label: 'Trials' }].concat(history.length && undoLeft > 0 ? [{ id: 'undo', label: 'Undo move' }] : []).concat([{ id: 'again', label: 'Try again', primary: true }]) }, a => {
    if (a === 'again') startTrial(def.i); else if (a === 'undo') { undo(); show(null); } else openTrials();
  });
}
function startTrial(i) { newRun('trial', G.trialDef(i)); }

/* ------------------------------------------------------------ screens */
function show(id) { ['title', 'trials', 'pre', 'result'].forEach(k => { const e = $(k); e.classList.toggle('on', k === id); if (k !== id && (k === 'result' || k === 'pre')) e.classList.remove('dim'); if (k === id && (k === 'result' || k === 'pre')) e.classList.add('dim'); }); }
function toTitle() { playing = false; over = false; hammerMode = false; scene('title'); refreshTitle(); show('title'); try { $('mClassic').focus({ preventScroll: true }); } catch (e) {} }
function refreshTitle() {
  $('sTrials').textContent = totalStars() ? 'Trial ' + Math.min(G.TRIALS, firstOpen() + 1) + ' · ' + totalStars() + '/' + G.TRIALS * 3 + ' stars' : '18 goals · win stars';
  const b = LS.get(bestKey().replace(/_daily.*/, ''), 0) | 0; $('sClassic').textContent = (b ? 'Best ' + b + ' · ' : '') + 'Build a ' + goalTile() + ' tile';
  const db = LS.get('best2048_daily_' + N + '_' + todayKey(), 0) | 0; $('sDaily').textContent = db ? "Today's best " + db : 'Same tiles for everyone today'; $('dayBadge').hidden = !!db;
  document.querySelectorAll('#sizes [data-n]').forEach(b => { b.classList.toggle('on', +b.dataset.n === N); b.setAttribute('aria-pressed', String(+b.dataset.n === N)); });
  const tc = $('titleChip'); if (!tc.firstChild) { prof.chip(tc); const h = document.createElement('button'); h.className = 'sbtn'; h.textContent = 'How to play'; h.addEventListener('click', () => { PZ.snd.play('tap'); newRun('classic', null, { tutorial: true }); }); tc.appendChild(h); }
}
function buildLogo() { const el = $('logo'); el.innerHTML = ''; ['2', '0', '4', '8'].forEach((d, k) => { const v = [2, 8, 32, 128][k], i = document.createElement('i'); i.textContent = d; const bg = colorFor(v); i.style.setProperty('--bg', bg); i.style.setProperty('--sh', shade(bg, -0.3)); const light = lum(bg) > 0.6; i.style.setProperty('--fg', light ? '#4a2f17' : '#fff6dc'); i.style.setProperty('--numsh', light ? '0 1px 0 rgba(255,255,255,.55)' : '0 2px 0 rgba(0,0,0,.42)'); i.style.animationDelay = (-k * 0.4) + 's'; el.appendChild(i); }); }

$('mClassic').addEventListener('click', () => { PZ.snd.play('tap'); newRun('classic'); try { localStorage.setItem('mode2048', 'classic'); } catch (e) {} });

  $('starTotal').textContent = totalStars() + ' / ' + G.TRIALS * 3 + ' stars';
}

  const d = G.trialDef(i), what = d.type === 'tile' ? 'Make a <b>' + d.goal + '</b> tile' : d.type === 'score' ? 'Score <b>' + d.goal + '</b> points' : 'Merge tiles <b>' + d.goal + '</b> times';
  const r = $('pre'); r.innerHTML = '<div class="pz-res"><h2>' + d.name + (d.boss ? ' · Boss' : '') + '</h2><p style="font-size:18px;color:var(--pz-ink)">' + what + ' in <b>' + d.moves + ' moves</b> on a <b>' + d.n + '×' + d.n + '</b> board.</p><p>' + PZ.ui.star(true).replace('<svg', '<svg style="width:22px;height:22px;vertical-align:-5px"') + ' Finish with moves to spare for more stars.</p><div class="btns"><button class="pz-btn ghost" data-a="back">Back</button><button class="pz-btn" data-a="go">Play</button></div></div>';
  show('pre'); r.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { PZ.snd.play('tap'); if (b.dataset.a === 'go') startTrial(i); else openTrials(d.pack); }));
}

/* ------------------------------------------------------------ first-run coach */
let tut = 0, tutSeen = LS.get('tut2048', '') === '1' || LS.get('tut2048', 0) === 1;
const hintLine = $('hintline');
function coach(t, b) { hintLine.className = 'coach'; hintLine.innerHTML = '<span>' + t + '</span><button id="coachBtn">' + (b || 'Skip') + '</button>'; $('coachBtn').addEventListener('click', endTut); }

function startTut() { tut = 1; coach('Swipe anywhere: every tile slides as far as it can.'); setTimeout(fingerDemo, 500); }
function tutMoved(merged) {
  if (!tut) return; fingerOff();
  if (tut === 1) { if (merged) { tut = 3; } else { tut = 2; coach('Two tiles with the same number merge: 2 + 2 makes 4. Try it!'); return; } }
  else if (tut === 2) { if (merged) tut = 3; else return; }

}

}

/* ------------------------------------------------------------ SDK + codes */
const CODES = { HAMMERTIME: 'Hammer time: three hammers, ready to smash', ALLFOURS: 'All fours: every new tile is a 4', BIGTILE: 'Big tile: a 256 drops into an empty square' };
function code(c) {

  if (c === 'HAMMERTIME') { hammers = 3; updateHud(); }
  if (c === 'ALLFOURS') allFours = true;

}

/* ------------------------------------------------------------ boot */
tiles = []; nextId = 1; score = 0; moves = 0; merges = 0; movesLeft = 99; history = []; undoLeft = 5; hammers = 0; mergeCount = 0; hammerMode = false; over = false; playing = false; won = false; runMaxTile = 0; runMerges = 0;

window.__g48 = { newRun, toTitle, move, get state() { return { mode, N, score, over, playing, movesLeft, grid: grid(), level: prof.level(), best: bestTile }; }, prof, G, trial: startTrial, openTrials };
})();
