<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/jsm/"}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5fb0ff">
<title>Hole Swallow</title>
<link rel="stylesheet" href="./kit3d/gk.css">
<style>
  :root { --gk-a:#b48bff; --gk-a2:#7444e8; --gk-a3:#4525a3; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#5fb0ff; font-family:var(--gk-body); }
  body { position:fixed; inset:0; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  canvas#c { position:fixed; inset:0; display:block; touch-action:none; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden; }
  .gk-logo .l2 { color:#d9c2ff; }
  #timeChip b { min-width:2.4ch; }
  #timeChip.low { background:linear-gradient(#ff8b7a,#e5445b); animation:gk-pulse .5s ease infinite; }
</style>
</head>
<body class="gk">
<canvas id="c"></canvas>
<div id="fx"></div>
<div class="gk-combo gk-out" id="comboBig"></div>

<div class="gk-hud gk-hidden" id="hud">
  <div class="gk-row">
    <div id="lvlbar" style="flex:1;min-width:0"></div>
    <button class="gk-ib" id="mute" type="button" aria-label="Sound"></button>
  </div>
  <div class="gk-row">
    <span class="gk-chip" id="timeChip"></span>
    <span class="gk-chip dim" id="chainChip" style="visibility:hidden"></span>
  </div>
  <div class="gk-score gk-out" id="scoreBig">0</div>
</div>

<div class="gk-screen" id="start">
  <div class="gk-tb"><a class="gk-ib" id="hub" href="../index.html" aria-label="Back to the hub"></a><span class="sp"></span><span class="gk-chip" id="coinChip"></span><button class="gk-ib" id="mute2" type="button" aria-label="Sound"></button></div>
  <h1 class="gk-logo">Hole<span class="l2">Swallow</span></h1>
  <div class="gk-seg" id="modeSeg" role="tablist"><button type="button" data-m="level" class="on">MISSIONS</button><button type="button" data-m="classic">CLASSIC</button></div>
  <div id="picker"></div>
  <div id="classicInfo" class="gk-goals gk-hidden"></div>
  <div class="gk-goals row" id="goals"></div>
  <button class="gk-btn purple wide throb" id="playBtn" type="button"></button>
  <div class="gk-menu"><button class="gk-btn sm dark" id="skinBtn" type="button"></button></div>
  <div id="dailyHost"></div>
  <div id="weekHost"></div>
  <button class="gk-btn xs dark" id="gfxBtn" type="button" aria-label="Graphics quality">GRAPHICS: HIGH</button>
</div>

<div class="gk-screen dim center gk-hidden" id="gameover">
  <div class="gk-card">
    <div class="gk-head" id="ovHead"><h2 id="ovTitle">MISSION 1</h2></div>
    <div class="gk-stars" id="ovStars"></div>
    <div><div class="gk-big gk-out" id="finalScore">0</div><div class="gk-cap">Score <span class="gk-newbest gk-hidden" id="newBest">NEW BEST</span></div></div>
    <div class="gk-stat" id="ovStat"></div>
    <div class="gk-goals card" id="ovGoals"></div>
    <div id="ovNote" class="gk-note"></div>
    <button class="gk-btn purple wide" id="restartBtn" type="button"></button>
    <div class="gk-menu"><button class="gk-btn sm dark" id="againBtn" type="button"></button><button class="gk-btn sm dark" id="menuBtn" type="button"></button></div>
  </div>
</div>
<script type="module">
import { HoleWorld, REDUCED } from './kit3d/hole3d.js';
import * as THREE from 'three';
import { GK } from './kit3d/gk.js';
const KEY = 'hole-swallow-best';
const canvas = document.getElementById('c');
const $ = id => document.getElementById(id);
let W = 0, H = 0;
const M = 0.05;   // metres per screen px of the play field
let GFX = 'high';
try { const g = localStorage.getItem('hole-swallow-gfx'); GFX = g === 'low' ? 'low' : g === 'high' ? 'high' : 'auto'; } catch (e) { GFX = 'auto'; }
const W3 = new HoleWorld(canvas, { quality: GFX, skyTop: '#5fb0ff', skyLow: '#e8f6ff' });
GFX = W3.quality;   // 'auto' starts on Low when WebGL runs on the CPU
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
let ready = false;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  W3.resize();
  if (ready) dress();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 80));

let audioCtx = null, muted = false;
try { muted = localStorage.getItem(KEY + '-mute') === '1'; } catch (e) {}
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
const buzz = ms => GK.haptic(ms);
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
GK.hooks.sfx = sfx;

const ITEMS = [
  { e:'cherries', r:14, v:1, mods:['cherries'] }, { e:'apple', r:19, v:2, mods:['apple'] }, { e:'donut', r:16, v:2, mods:['donut'] },
  { e:'cake', r:23, v:3, mods:['cake'] }, { e:'watermelon', r:27, v:4, mods:['watermelon'] }, { e:'pizza', r:32, v:5, mods:['pizza'] },
  { e:'car', r:46, v:10, mods:['sedan','taxi','suv','van'] }, { e:'tree', r:55, v:14, mods:['treeOak','treeDef','treeS','treeDet'] },
  { e:'house', r:68, v:20, mods:['houseA','houseC','houseD','houseF'] }, { e:'tower', r:92, v:30, mods:['towerA','skyA','skyC'] }
];
const RANKS = [
  { r: 0,   n: 'Snacker' },
  { r: 55,  n: 'Gobbler' },
  { r: 90,  n: 'Devourer' },
  { r: 125, n: 'Monstro' },
  { r: 165, n: 'Void Feeder' },
  { r: 200, n: 'Legend' }
];
const SUCK_TIME = 0.32, MAX_HOLE = 210, TARGET_COUNT = 26;

/* ---------- progression: missions, worlds, stars, hole skins, daily goal ---------- */
const SKINS = [
  { id:'violet',  name:'Violet',   css:'radial-gradient(circle,#0a0716 46%,#b48bff 50%,#7444e8 62%,#0a0716 64%)', color:'#a78bfa', cost:0 },
  { id:'aqua',    name:'Aqua',     css:'radial-gradient(circle,#04141c 46%,#7ff0ff 50%,#22b8d8 62%,#04141c 64%)', color:'#22d3ee', cost:{ stars:3 } },
  { id:'lime',    name:'Lime',     css:'radial-gradient(circle,#0a1404 46%,#d6ff7a 50%,#7cc21a 62%,#0a1404 64%)', color:'#a3e635', cost:{ coins:50 } },
  { id:'sunset',  name:'Sunset',   css:'radial-gradient(circle,#160a04 46%,#ffd08a 50%,#ff7a1a 62%,#160a04 64%)', color:'#fb923c', cost:{ coins:90 } },
  { id:'rose',    name:'Rose',     css:'radial-gradient(circle,#16040c 46%,#ffb3d4 50%,#f0559a 62%,#16040c 64%)', color:'#f472b6', cost:{ level:6 } },
  { id:'gold',    name:'Gold',     css:'radial-gradient(circle,#140e02 46%,#fff2a8 50%,#f5b400 62%,#140e02 64%)', color:'#fbbf24', cost:{ stars:15 } },
  { id:'ghost',   name:'Ghost',    css:'radial-gradient(circle,#0b0d12 46%,#ffffff 50%,#b8c0d0 62%,#0b0d12 64%)', color:'#e5e7eb', cost:{ coins:150 } },
  { id:'rainbow', name:'Rainbow',  css:'radial-gradient(circle,#0a0716 46%,transparent 50%),conic-gradient(#ff5a6e,#ffd23f,#5cec8c,#3fa8ff,#b48bff,#ff5a6e)', color:'#ff7ad0', rainbow:true, cost:{ streak:3 } },
  { id:'galaxy',  name:'Galaxy',   css:'radial-gradient(circle,#05030f 46%,#8fb4ff 50%,#4c3bd6 62%,#05030f 64%)', color:'#60a5fa', pulse:true, cost:{ stars:27 } },
];
const WORLDS = [
  { name:'Town Park',    kind:'park',  sky:['#3b6ea5','#f6d3a0'], mix:null },
  { name:'Bakery Lane',  kind:'candy', sky:['#7a5a8c','#f5b98a'], mix:'food' },
  { name:'Old Plaza',    kind:'plaza', sky:['#4a6fa8','#e8d4b0'], mix:'town' },
  { name:'Night Market', kind:'night', sky:['#0d1526','#3a4a75'], mix:'gold' },
];
const P = GK.progress('hole-swallow', {
  perWorld: 8, worlds: WORLDS, skins: SKINS, dailyReward: 60,
  daily: [
    { id:'score', icon:'trophy', text:n => 'Score ' + n + ' points in total', targets:[300, 500, 800] },
    { id:'gold',  icon:'star',   text:n => 'Swallow ' + n + ' golden things', targets:[4, 7, 10] },
    { id:'clock', icon:'clock',  text:n => 'Grab ' + n + ' time stars',       targets:[2, 3, 4] },
    { id:'wins',  icon:'flag',   text:n => 'Clear ' + n + ' missions',        targets:[2, 3, 4] },
  ],
});
let MODE = P.d.mode === 'classic' ? 'classic' : 'level';
let LEVEL = Math.min(P.d.level, P.d.pick || P.d.level);
let SPEC = null;
const CAL = 1.0;   // score scale of the star targets (measured with the ?bot player, see the report)
function levelSpec(L) {
  const t1 = Math.round((60 + 16 * L) * CAL / 5) * 5;
  return { L, t1, t2: Math.round(t1 * 1.55 / 5) * 5, t3: Math.round(t1 * 2.2 / 5) * 5 };
}
let holeCol = new THREE.Color('#a78bfa');
let skinNow = SKINS[0];
function applySkin() { skinNow = P.current() || SKINS[0]; holeCol.set(skinNow.color); }
function applyWorld(L) {
  const w = P.world(L);
  W3.setSky(w.sky[0], w.sky[1]);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', w.sky[0]);
  if (ready && w.kind !== groundKind) dress(w.kind);
}
let groundKind = 'park';

const hole = { x:0, y:0, r:34, tx:0, ty:0, pulse:0, squash:0 };
let objects = [];
let score = 0, best = 0, timeLeft = 60, running = false, shake = 0, spawnT = 0;
let chain = 0, chainT = 0;
let bestR = 34, gild = 0, gildL = 0, gildMilestone = 5, clocks = 0, eaten = 0, ended = false, coach = null, mixKind = null;

try { best = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
try { bestR = parseFloat(localStorage.getItem('hole-swallow-rank') || '0', 10) || 34; } catch (e) {}
try { gildL = parseInt(localStorage.getItem('hole-swallow-gild') || '0', 10) || 0; } catch (e) {}
const SDK = window.ArcadeSDK || null;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function scene(sc, extra) { try { if (SDK) SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
function cheated() { return !!(SDK && SDK.cheated); }
const codes = {}, keys = {};
let tutSeen = false, waiting = false;
try { tutSeen = localStorage.getItem('hole-swallow-tut') === '1'; } catch (e) {}
function go() { if (!waiting) return; waiting = false; if (coach) { coach.remove(); coach = null; } if (!tutSeen) { tutSeen = true; try { localStorage.setItem('hole-swallow-tut', '1'); } catch (e) {} } }

const EDGES = ['top', 'bottom', 'left', 'right'];
const elTime = () => $('timeChip').querySelector('b');
let lastTimeTxt = '';
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function pickItem() {
  if (!mixKind) return pick(ITEMS);
  const r = Math.random();
  if (mixKind === 'food') return r < 0.62 ? ITEMS[(Math.random() * 6) | 0] : pick(ITEMS);
  if (mixKind === 'town') return r < 0.55 ? ITEMS[6 + ((Math.random() * 4) | 0)] : pick(ITEMS);
  return pick(ITEMS);
}
function rankIdxOf(r) { let i; for (i = RANKS.length - 1; i >= 0; i--) { if (r >= RANKS[i].r) return i; } return 0; }
function rankName() { return RANKS[rankIdxOf(bestR)].n; }
function rankInfoText() {
  const i = rankIdxOf(bestR);
  const nxt = RANKS[i + 1];
  return RANKS[i].n + (nxt ? ' · next at size ' + nxt.r : ' · MAX');
}
function updateRank() {
  if (hole.r <= bestR) return;
  const ri = rankIdxOf(bestR), ni = rankIdxOf(hole.r);
  if (cheated()) return;
  bestR = hole.r;
  try { localStorage.setItem('hole-swallow-rank', String(bestR)); } catch (e) {}
  if (ni > ri) {
    bigCombo('RANK UP: ' + RANKS[ni].n, '#fde68a');
    sfx('levelup');
    buzz(20);
  }
}

function spawnObject(smallOnly, edge) {
  const clock = !smallOnly && Math.random() < 0.06;
  // (the clock is drawn as a blue time star)
  const goldP = mixKind === 'gold' ? 0.1 : 0.05;
  const gold = !clock && (codes.GOLDRUSH ? true : !smallOnly && Math.random() < goldP);
  const it = clock ? { e:'time star', r:26, v:0, mods:['star'] } : (smallOnly ? ITEMS[(Math.random() * 4) | 0] : pickItem());
  const m = it.r + 8;
  let x = W / 2, y = H / 2;
  if (edge === 'top') { x = rand(m, Math.max(m + 1, W - m)); y = m; }
  else if (edge === 'bottom') { x = rand(m, Math.max(m + 1, W - m)); y = Math.max(m, H - m); }
  else if (edge === 'left') { x = m; y = rand(m, Math.max(m + 1, H - m)); }
  else if (edge === 'right') { x = Math.max(m, W - m); y = rand(m, Math.max(m + 1, H - m)); }
  else {
    for (let tries = 0; tries < 14; tries++) {
      x = rand(m, Math.max(m + 1, W - m));
      y = rand(m, Math.max(m + 1, H - m));
      if (Math.hypot(x - hole.x, y - hole.y) > hole.r + it.r + 46) break;
    }
  }
  const vx = rand(-16, 16), vy = rand(-16, 16);
  objects.push({ x, y, r: it.r, r0: it.r, e: it.e, v: it.v, clock: clock, gold: gold, vx, vy, suck:null, pop: 0, mod: it.mods[(Math.random() * it.mods.length) | 0], yaw: Math.atan2(-vy, vx) + Math.PI / 2, wob: Math.random() * 6 });
}
function sx(x) { return (x - W / 2) * M; }
function sz(y) { return (y - H / 2) * M; }
function burst(x, y, color, n, speed) {
  W3.burst(sx(x), 0.3, sz(y), color, GFX === 'low' ? Math.ceil(n / 3) : n, speed / 40, 0.14);
}
let popN = 0;
function addFloater(text, x, y, color) {
  if (popN > 8) return;
  const s = W3.project(sx(x), 1.2, sz(y)); if (!s) return;
  popN++;
  GK.pop(Math.max(60, Math.min(W - 60, s.x)), Math.max(130, s.y), text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim(), { color, size: /GOLD|FEAST/.test(text) ? 24 : 30 });
  setTimeout(() => { popN--; }, 800);
}
function bigCombo(text, color) {
  const e = $('comboBig'); e.textContent = text; e.style.color = color || '#fff';
  if (!e.animate || RM) { e.style.opacity = '1'; setTimeout(() => { e.style.opacity = '0'; }, 600); return; }
  e.animate([{ opacity: 0, transform: 'translate(-50%,-50%) scale(.4)' }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1.15)', offset: .25 }, { opacity: 1, transform: 'translate(-50%,-60%) scale(1)', offset: .7 }, { opacity: 0, transform: 'translate(-50%,-110%) scale(1)' }], { duration: 820, easing: 'ease-out' });
}

/* ---------- HUD and screens ---------- */
const ic = (n, px) => GK.icon(n, px);
const bar = GK.levelBar($('lvlbar'));
function paintChrome() {
  $('hub').innerHTML = ic('home');
  ['mute', 'mute2'].forEach(id => { $(id).innerHTML = ic(muted ? 'sndOff' : 'snd'); });
  $('coinChip').innerHTML = ic('coin') + '<b>' + P.d.coins + '</b>';
  $('skinBtn').innerHTML = ic('bag') + 'HOLES' + (P.newSkins.length ? '<span class="gk-badge">' + P.newSkins.length + '</span>' : '');
  $('timeChip').innerHTML = ic('clock') + '<b>60</b>';
  paintPlay();
}
function paintPlay() { $('playBtn').innerHTML = ic('play') + (MODE === 'level' ? 'PLAY MISSION ' + LEVEL : 'PLAY'); }
function goalsFor(spec) {
  const st = P.starsFor(spec.L);
  return [{ s:1, t:'Score ' + spec.t1, ok: st >= 1 }, { s:2, t:'Score ' + spec.t2, ok: st >= 2 }, { s:3, t:'Score ' + spec.t3, ok: st >= 3 }];
}
function goalsHTML(list, res, row) {
  return list.map(g => {
    const ok = res ? res[g.s - 1] : g.ok;
    if (row) return '<div class="g' + (ok ? ' done' : '') + '"><span class="gk-stars mini">' + ic(ok ? 'star' : 'starOff').repeat(g.s) + '</span><span>' + g.t + '</span></div>';
    return '<div class="g' + (ok ? ' done' : '') + '">' + ic(ok ? 'star' : 'starOff') + '<span>' + g.t + '</span></div>';
  }).join('');
}
function paintTitle() {
  const lv = MODE === 'level';
  $('picker').classList.toggle('gk-hidden', !lv); $('goals').classList.toggle('gk-hidden', !lv);
  $('classicInfo').classList.toggle('gk-hidden', lv);
  $('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === MODE));
  if (lv) { applyWorld(LEVEL); $('goals').innerHTML = goalsHTML(goalsFor(levelSpec(LEVEL)), null, true); }
  else {
    applyWorld(1);
    $('classicInfo').innerHTML = '<div class="g">' + ic('trophy') + '<span>Best score</span><span class="n">' + best + '</span></div><div class="g">' + ic('crown') + '<span>Rank</span><span class="n">' + rankName() + '</span></div><div class="g">' + ic('star') + '<span>Golden feast (best)</span><span class="n">' + gildL + '</span></div>';
  }
  paintPlay();
  $('dailyHost').replaceChildren(GK.dailyStrip(P));
  $('weekHost').replaceChildren(GK.weekRow(P));
}
const picker = GK.levelPicker($('picker'), P, { label: 'Mission', start: LEVEL, onChange: l => { LEVEL = l; P.d.pick = l; P.save(); paintTitle(); } });

function startGame() {
  ended = false;
  SPEC = MODE === 'level' ? levelSpec(LEVEL) : null;
  const w = P.world(SPEC ? LEVEL : 1); mixKind = SPEC ? w.mix : null;
  applyWorld(SPEC ? LEVEL : 1);
  objects = [];
  score = 0; timeLeft = 60; spawnT = 0; shake = 0; chain = 0; chainT = 0; gild = 0; gildMilestone = 5; clocks = 0; eaten = 0;
  hole.r = codes.MEGAHOLE ? 110 : 34; hole.x = W / 2; hole.y = H / 2; hole.tx = W / 2; hole.ty = H / 2;
  for (let i = 0; i < 16; i++) spawnObject(i < 9);
  running = true;
  $('hud').classList.remove('gk-hidden');
  $('start').classList.add('gk-hidden');
  $('gameover').classList.add('gk-hidden');
  $('scoreBig').textContent = '0';
  if (codes.EXTRATIME) timeLeft = 90;
  paintChrome();
  elTime().textContent = String(Math.ceil(timeLeft)); lastTimeTxt = '';
  $('timeChip').classList.remove('low');
  $('lvlbar').style.display = SPEC ? '' : 'none';
  if (SPEC) { bar.levels(SPEC.L, ''); bar.end(ic('star', 24)); bar.marks([SPEC.t1 / SPEC.t3, SPEC.t2 / SPEC.t3, 1]); bar.set(0); bar.done(false); }
  waiting = true;
  if (coach) coach.remove();
  coach = GK.coach(tutSeen ? 'Drag to move' : 'Drag to move the hole<small>Swallow things smaller than the hole to grow. The clock starts when you move.</small>', { drag: true });
  scene('play', SPEC ? { level: SPEC.L } : undefined);
}
function toTitle() {
  running = false; waiting = false; objects = []; ended = true;
  if (coach) { coach.remove(); coach = null; }
  ['gameover', 'hud'].forEach(id => $(id).classList.add('gk-hidden'));
  hole.r = 34; hole.tx = hole.x = W / 2; hole.ty = hole.y = H / 2;
  LEVEL = Math.min(LEVEL, P.d.level); picker.set(LEVEL);
  paintChrome(); paintTitle();
  $('start').classList.remove('gk-hidden');
  scene('title');
}
function dirWord(dx, dy) {
  const v = Math.abs(dy) > 40 ? (dy < 0 ? 'up' : 'down') : '', h = Math.abs(dx) > 40 ? (dx < 0 ? 'left' : 'right') : '';
  return v && h ? v + ' and ' + h : v || h || 'right next to you';
}
function sdkHint() {
  if (!running) return 'Press Play, then drag the hole over things smaller than it.';
  let bestO = null, bd = Infinity, big = null;
  for (const o of objects) {
    if (o.suck || o.clock) continue;
    const d = Math.hypot(o.x - hole.x, o.y - hole.y);
    if (o.r < hole.r) { const sc = d / (o.v + 1); if (sc < bd) { bd = sc; bestO = o; } }
    else if (!big || o.r < big.r) big = o;
  }
  const clock = objects.find(o => o.clock && o.r < hole.r && !o.suck);
  if (clock && timeLeft < 20) return 'Grab the blue time star ' + dirWord(clock.x - hole.x, clock.y - hole.y) + ' for 5 more seconds!';
  if (bestO) return 'Swallow the ' + bestO.e + ' ' + dirWord(bestO.x - hole.x, bestO.y - hole.y) + '.' + (big ? ' The ' + big.e + ' is still too big: grow first.' : '');
  return 'Nothing small enough nearby: wait for new things to drift in from the edges.';
}
function code(c) {
  if (c === 'MEGAHOLE') { codes.MEGAHOLE = 1; if (running) hole.r = Math.max(hole.r, 110); }
  else if (c === 'EXTRATIME') { codes.EXTRATIME = 1; if (running) timeLeft += 30; }
  else if (c === 'GOLDRUSH') { codes.GOLDRUSH = 1; for (const o of objects) if (!o.clock) o.gold = true; }
  else return { ok: false };

function update(dt) {

  if (hole.pulse > 0) hole.pulse = Math.max(0, hole.pulse - 3 * dt);

  if (hole.squash > 0) hole.squash = Math.max(0, hole.squash - 4.5 * dt);
  if (!running) return;
  if (!waiting) timeLeft -= dt;

    endGame(); return;
  }
  const tt = String(Math.ceil(timeLeft));

  spawnT -= dt;

  for (let i = objects.length - 1; i >= 0; i--) {

      o.r = o.suck.sr * (1 - p);
      if (p >= 1) {

          hole.r = Math.min(MAX_HOLE, hole.r + 1.5);
          updateRank();
          hole.pulse = 1;
          burst(hole.x, hole.y, '#fbbf24', 12, 180);
          addFloater('+5s', o.x, o.y - o.suck.sr, '#fbbf24');
          sfx('tick');
          buzz(20);
          shake = Math.max(shake, 3);
          clocks++; P.addDaily('clock', 1) && dailyDone();
        } else {

          $('scoreBig').classList.remove('bump'); void $('scoreBig').offsetWidth; $('scoreBig').classList.add('bump');
          if (SPEC) bar.set(score / SPEC.t3);
          hole.r = Math.min(MAX_HOLE, hole.r + o.v * 0.55);
          updateRank();
          hole.pulse = 1;
          hole.squash = 1;
          burst(hole.x, hole.y, '#' + holeCol.getHexString(), 8 + Math.min(14, o.v), 180);
          addFloater('+' + (o.v + cb), o.x, o.y - o.suck.sr, cb > 0 ? '#ffd23f' : '#ffffff');
          if (chain >= 3) { const c = $('chainChip'); c.style.visibility = 'visible'; c.innerHTML = ic('flame') + '<b>x' + chain + '</b>'; c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }
          sfx(cb >= 4 ? 'levelup' : 'coin');
          buzz(o.v >= 10 ? 30 : 10);
          shake = Math.max(shake, Math.min(16, 1.5 + o.v * 0.6));
          if (o.v >= 10) { sfx('boom'); }
        }
        objects.splice(i, 1);

      continue;
    }
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.x < -o.r - 60 || o.x > W + o.r + 60 || o.y < -o.r - 60 || o.y > H + o.r + 60) {

}

window.addEventListener('mouseup', pointerEnd);
window.addEventListener('keydown', e => { if (/^Arrow/.test(e.key) || 'wasd'.indexOf(e.key) >= 0 && e.key.length === 1) { keys[e.key] = true; if (/^Arrow/.test(e.key)) e.preventDefault(); } });
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function begin() { ensureAudio(); sfx('tap'); startGame(); }
$('playBtn').addEventListener('click', begin);
$('restartBtn').addEventListener('click', () => {
  if ($('restartBtn').dataset.mode === 'next') { LEVEL = Math.min(P.d.level, LEVEL + 1); P.d.pick = LEVEL; P.save(); picker.set(LEVEL); }
  begin();
});
$('againBtn').addEventListener('click', begin);
$('menuBtn').addEventListener('click', () => { sfx('tap'); toTitle(); });
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  MODE = b.dataset.m; P.d.mode = MODE; P.save(); sfx('tap'); paintTitle();
});
$('skinBtn').addEventListener('click', () => {
  sfx('tap'); P.takeNewSkins();
  GK.shop({ prog: P, title: 'Hole styles', onEquip: () => { applySkin(); paintChrome(); }, onClose: () => { paintChrome(); },
    preview: s => '<div class="sw" style="background:' + s.css + ';border-radius:50%;background-color:#7fb2ff33"></div>' });
});
function toggleMute() { ensureAudio(); muted = !muted; try { localStorage.setItem(KEY + '-mute', muted ? '1' : '0'); } catch (e) {} paintChrome(); }
$('mute').addEventListener('click', toggleMute); $('mute2').addEventListener('click', toggleMute);

// ?bot plays by itself (health/progression tests, star-target calibration): steer to the best edible thing near the hole
if (/[?&]bot\b/.test(location.search)) setInterval(() => {
  if (!running) return;
  let tgt = null, sc = -1;
  for (const o of objects) {
    if (o.suck || o.r >= hole.r * 0.96) continue;
    const d = Math.hypot(o.x - hole.x, o.y - hole.y) + 30;
    const s = (o.clock ? (timeLeft < 30 ? 14 : 4) : o.v + 1) / d;
    if (s > sc) { sc = s; tgt = o; }
  }
  if (tgt) { hole.tx = tgt.x; hole.ty = tgt.y; go(); } else { hole.tx = W / 2; hole.ty = H / 2; go(); }
}, 50);
resize();
applySkin();
W3.load('models/hole-swallow.glb').then(() => { ready = true; dress(); applyWorld(MODE === 'level' ? LEVEL : 1); }).catch(() => {});
hole.tx = W / 2; hole.ty = H / 2; hole.x = W / 2; hole.y = H / 2;
paintChrome(); paintTitle();
requestAnimationFrame(loop);
scene('title');
if (SDK) SDK.init({
  pauseButton: 'bl',
  onRestart: () => startGame(),
  onExit: toTitle,
  onTutorial: () => { tutSeen = false; startGame(); },
  onHint: sdkHint,
  onCheat: code
});
</script>
</body>
</html>
