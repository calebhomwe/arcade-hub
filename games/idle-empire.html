var POOL = [
  { id: 'tap', kind: 'tap', text: 'Tap the fountain {n} times', goals: [40, 100, 220] },
  { id: 'buy', kind: 'buy', text: 'Build {n} buildings', goals: [8, 20, 40] },
  { id: 'earn', kind: 'earn', text: 'Earn {n} coins', goals: function (E) { var r = Math.max(60, E.income()); return [r * 150, r * 500, r * 1500]; } },
  { id: 'upg', kind: 'upgrade', text: 'Buy {n} upgrades', goals: [1, 2, 4] },
  { id: 'crit', kind: 'critter', text: 'Greet {n} visiting merchants', goals: [1, 2, 3] }
];

/* ================= the scene: a golden-hour island, drawn from rendered 3D sprites ================= */
function makeScene(E) {
  var S = E.S, cv = $('scene');
  var st = new IK.Stage(cv, draw, 2);
  var iso = new IK.Iso(st, { N: 4, M: 4, tex: ['mountain_grass', 'plaza_stone', 'dirt_track', 'rock'] });
  var built = [], coins = [], dust = [], critter = null, bounce = 0, coinT = 0;
  st.onResize = function (W, H) { iso.layout(W, H); };
  iso.layout(st.w || 390, st.h || 300);

  function ground(cx) {
    var dirt = iso.pattern(cx, 'dirt_track'), stone = iso.pattern(cx, 'plaza_stone');
    LOT.forEach(function (L) { cx.globalAlpha = 0.92; iso.pad(cx, L.i, L.j, dirt || '#a9773f', 'rgba(70,40,12,.55)', 0.1); cx.globalAlpha = 1; });
    cx.fillStyle = dirt || '#a9773f'; cx.fillRect(256 + 100, 0, 56, 4 * 256); cx.fillRect(0, 256 + 100, 4 * 256, 56);
    iso.pad(cx, 1, 1, stone || '#a7a7a0', 'rgba(60,50,40,.6)', 0.03);
  }
  function spawnCoin(tier) {
    var L = LOT[tier], p = iso.cellXY(L.i, L.j), s = A.size(G[tier].spr);
    var top = (s ? (s.ay + 4) : 60) * iso.sprS * iso.sc;
    coins.push({ x: p.x + (Math.random() - 0.5) * 20 * iso.sc, y: p.y - top * 0.7, vy: -22 - Math.random() * 12, t: 0, life: 1.4 });
    if (coins.length > 30) coins.shift();
  }

  function draw(cx, dt, t, W, H) {
    var sc = iso.sc, ss = iso.sprS * sc;
    if (W !== iso.w || H !== iso.h) iso.layout(W, H);
    cx.clearRect(0, 0, W, H);
    iso.backdrop(cx, dt, t);
    iso.ground(cx, ground);
    var items = [];
    DECOR.forEach(function (d) { items.push({ d: d.i + d.j, kind: 'decor', n: d.n, i: d.i, j: d.j, s: d.s }); });
    items.push({ d: FOUNTAIN.i + FOUNTAIN.j, kind: 'fountain' });
    LOT.forEach(function (L, tier) { items.push({ d: L.i + L.j + 0.05, kind: 'lot', tier: tier, i: L.i, j: L.j }); });
    if (critter) items.push({ d: critter.d, kind: 'critter' });
    items.sort(function (p, q) { return p.d - q.d; });
    var hi = E.highest();
    items.forEach(function (it) {
      if (it.kind === 'decor') { var p = iso.cellXY(it.i, it.j); A.draw(cx, it.n, p.x, p.y, ss * it.s); }
      else if (it.kind === 'fountain') {
        var p2 = iso.cellXY(FOUNTAIN.i, FOUNTAIN.j), sq = bounce > 0 ? 1 + Math.sin(bounce * 20) * 0.05 * bounce / 0.3 : 1;
        cx.save(); cx.translate(p2.x, p2.y); cx.scale(sq, 2 - sq); A.draw(cx, 'fountain', 0, 0, ss * 1.05); cx.restore();
        if (E.inGame && S.stats.taps < 3) iso.chip(cx, 'TAP!', p2.x, p2.y - 92 * sc + Math.sin(t * 4) * 3, true);
      } else if (it.kind === 'lot') {
        var tier = it.tier, g = G[tier], p3 = iso.cellXY(it.i, it.j), owned = S.owned[tier], bd = built[tier];
        if (owned > 0) {
          var k2 = 1;
          if (bd && bd.t < 0.6) { var u = bd.t / 0.6; k2 = u < 0.6 ? 0.5 + 0.7 * (u / 0.6) : 1.2 - 0.2 * ((u - 0.6) / 0.4); bd.t += dt; }
          else if (bd && bd.b > 0) { k2 = 1 + 0.06 * Math.sin(bd.b * 18) * (bd.b / 0.25); bd.b -= dt; }
          cx.save(); cx.translate(p3.x, p3.y); cx.scale(k2, Math.max(0.9, Math.min(1.05, 2 - k2))); A.draw(cx, g.spr, 0, 0, ss); cx.restore();
          iso.chip(cx, '×' + owned, p3.x, p3.y + 15 * sc, false);
          if (owned >= 25) { var st2 = owned >= 100 ? 3 : owned >= 50 ? 2 : 1, star = '★★★'.slice(0, st2); cx.font = '800 13px "DM Sans", sans-serif'; cx.textAlign = 'center'; cx.strokeStyle = 'rgba(40,20,0,.8)'; cx.lineWidth = 3; cx.strokeText(star, p3.x, p3.y + 31 * sc); cx.fillStyle = '#ffd45a'; cx.fillText(star, p3.x, p3.y + 31 * sc); }
        } else {
          var can = E.canBuy(tier), nextUp = tier === hi + 1 && can;
          iso.drawGhost(cx, A, g.spr, p3.x, p3.y, ss, nextUp ? 0.5 + 0.12 * Math.sin(t * 3) : 0.2);
          if (nextUp) {
            cx.strokeStyle = 'rgba(255,224,130,' + (0.6 + 0.3 * Math.sin(t * 4)) + ')'; cx.lineWidth = 2.5; cx.setLineDash([7, 5]); iso.diamond(cx, p3.x, p3.y, 0.9); cx.stroke(); cx.setLineDash([]);
            iso.chip(cx, S.coins >= E.cost(tier, 1) ? 'BUILD!' : 'NEXT', p3.x, p3.y - 6 * sc + Math.sin(t * 4) * 2, S.coins >= E.cost(tier, 1));
          } else if (tier > hi + 1 || !E.unlocked(tier)) { cx.fillStyle = 'rgba(255,255,255,.6)'; cx.font = '800 14px "DM Sans", sans-serif'; cx.textAlign = 'center'; cx.fillText(E.unlocked(tier) ? '?' : 'Lv ' + g.lvl, p3.x, p3.y + 4); }
        }
      } else if (it.kind === 'critter') {
        var c = critter; A.draw(cx, 'truck', c.x, c.y, ss * 1.05);
        iso.chip(cx, 'TAP!', c.x, c.y - 46 * sc + Math.sin(t * 6) * 3, true);
      }
    });
    coinT -= dt;
    if (E.inGame && coinT <= 0) {
      if (E.income() > 0) {
        var ws = [], wsum = 0, i2; for (i2 = 0; i2 < G.length; i2++) { var r = E.genRate(i2); ws.push(r); wsum += r; }
        var pick = Math.random() * wsum, ti = 0; for (i2 = 0; i2 < ws.length; i2++) { pick -= ws[i2]; if (pick <= 0) { ti = i2; break; } }
        spawnCoin(ti); coinT = 0.45 + Math.random() * 0.5;
      } else coinT = 1;
    }
    for (var c2 = coins.length - 1; c2 >= 0; c2--) {
      var co = coins[c2]; co.t += dt; if (co.t > co.life) { coins.splice(c2, 1); continue; }
      co.y += co.vy * dt; var al = co.t < 0.15 ? co.t / 0.15 : co.t > co.life - 0.4 ? (co.life - co.t) / 0.4 : 1;
      cx.globalAlpha = al; cx.fillStyle = '#8a5a12'; cx.beginPath(); cx.arc(co.x, co.y + 1, 7, 0, 6.2832); cx.fill(); cx.fillStyle = '#f2c14e'; cx.beginPath(); cx.arc(co.x, co.y, 7, 0, 6.2832); cx.fill(); cx.fillStyle = 'rgba(255,255,255,.6)'; cx.beginPath(); cx.arc(co.x - 2, co.y - 2, 2.5, 0, 6.2832); cx.fill(); cx.globalAlpha = 1;
    }
    for (var d2 = dust.length - 1; d2 >= 0; d2--) { var du = dust[d2]; du.t += dt; if (du.t > du.life) { dust.splice(d2, 1); continue; } var f = du.t / du.life; cx.globalAlpha = 0.5 * (1 - f); cx.fillStyle = '#eadcc0'; cx.beginPath(); cx.arc(du.x + du.vx * du.t, du.y + du.vy * du.t, du.r * (0.6 + f), 0, 6.2832); cx.fill(); cx.globalAlpha = 1; }
    bounce = Math.max(0, bounce - dt);
    if (critter) {
      critter.t += dt; critter.x += critter.vx * dt; critter.y += critter.vx * 0.5 * dt; critter.d = 5.5;
      if (critter.t > 16 || critter.x > W + 60) { critter = null; E.critterOut = false; }
    }
    iso.light(cx, dt, t);
  }

  function hitFountain(p) { var c = iso.cellXY(FOUNTAIN.i, FOUNTAIN.j), s = A.size('fountain'); if (!s) return false; var k = iso.sprS * iso.sc, r = Math.max(s.w, s.h) * k * 0.55; return Math.abs(p.x - c.x) < r && p.y > c.y - s.h * k && p.y < c.y + 20 * iso.sc; }
  return {
    stage: st,
    pointer: function (cxp, cyp) {
      var p = st.toLocal(cxp, cyp), sc = iso.sc, k = iso.sprS * sc;
      if (critter && Math.abs(p.x - critter.x) < 46 * sc && Math.abs(p.y - (critter.y - 20 * sc)) < 46 * sc) {
        var cc = st.toClient(critter.x, critter.y - 30 * sc); E.critterTapped('truck', cc.x, cc.y); critter = null; E.critterOut = false; return;
      }
      for (var tier = 0; tier < LOT.length; tier++) {
        if (S.owned[tier] <= 0) continue;
        var L = LOT[tier], c = iso.cellXY(L.i, L.j), s = A.size(G[tier].spr); if (!s) continue;
        var hh = s.h * k * 0.9, ww = s.w * k * 0.5;
        if (Math.abs(p.x - c.x) < ww && p.y < c.y + 12 * sc && p.y > c.y - hh + 6 * sc && !hitFountain(p)) {
          IK.sfx('tap'); built[tier] = built[tier] || {}; built[tier].b = 0.25; IK.fx.pop(E.rows[tier].row, 0.02);
          IK.toast(G[tier].name + ' ×' + S.owned[tier] + ': ' + fmt(E.genRate(tier) * E.globalMul()) + ' coins per second', { icon: G[tier].ico(24) });
          E.switchTab('build'); var row = E.rows[tier].row; if (row && row.scrollIntoView) { try { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { row.scrollIntoView(); } }
          return;
        }
      }
      var f = iso.cellXY(FOUNTAIN.i, FOUNTAIN.j), cl = st.toClient(f.x, f.y - 56 * sc), onF = hitFountain(p);
      bounce = 0.3; E.tapMain(onF ? cl.x : cxp, onF ? cl.y : cyp);
      IK.fx.burst(cl.x, cl.y, { n: 8, speed: 210, angle: -Math.PI / 2, spread: 1.5, grav: 520, shape: 'coin', size: 4.5, colors: ['#f2c14e', '#ffe08a'] });
    },
    update: function () {},
    onBuy: function (i, n, first) {
      built[i] = built[i] || {}; if (first) built[i].t = 0; else built[i].b = 0.25;
      var L = LOT[i], p = iso.cellXY(L.i, L.j), sc = iso.sc;
      for (var q = 0; q < (first ? 14 : 5); q++) dust.push({ x: p.x + (Math.random() - 0.5) * 40 * sc, y: p.y + (Math.random() - 0.3) * 10 * sc, vx: (Math.random() - 0.5) * 30, vy: -12 - Math.random() * 20, r: 5 + Math.random() * 6, t: 0, life: 0.7 + Math.random() * 0.4 });
      var c = st.toClient(p.x, p.y - 30 * sc); IK.fx.burst(c.x, c.y, { n: first ? 24 : 10, speed: 200, shape: 'star', size: 4 });
    },
    onLevel: function () {},
    spawnCritter: function () {
      if (critter) return false;
      var q = iso.cellXY(0, 3), sc = iso.sc;
      critter = { x: q.x - 90 * sc, y: q.y + 6 * sc, vx: 60 + Math.random() * 20, t: 0, d: 5.5 };
      IK.toast('A delivery truck rolls in. Tap it!', { icon: IK.ico.cart(22) });
      IK.sfx('whoosh', { volume: 0.5 });
      return true;
    },
    onCaravan: function (kind) { if (kind === 'go') IK.sfx('whoosh', { volume: 0.4 }); }
  };
}

/* ================= the game ================= */
var E = new IK.Idle({
  id: 'idle-empire', name: 'Idle Empire', saveKey: 'ie_state', muteKey: 'ie_muted',
  cur: { name: 'coins', ico: function (px) { return IK.ico.coin(px); } },
  gens: G, growth: 1.15, ups: UPS, perks: PERKS, ach: ACH, dailyPool: POOL,
  tapBase: 1, tapName: 'fountain', workers: 'townsfolk', critterName: 'The merchant',
  tabs: [
    { id: 'build', label: 'Build', ico: IK.ico.hammer },
    { id: 'ups', label: 'Upgrades', ico: IK.ico.up },
    { id: 'goals', label: 'Goals', ico: IK.ico.scroll },
    { id: 'crown', label: 'Crown', ico: IK.ico.crown }
  ],
  tabLevels: { ups: 2, goals: 3, crown: 5 },
  levelInfo: { 2: { kind: 'Unlocked', text: 'Upgrades for your buildings' }, 3: { kind: 'Unlocked', text: 'Daily goals, gifts and visitors' }, 5: { kind: 'Unlocked', text: 'Royal Decree and the Crown shop' } },
  prestige: { name: 'Crown', plural: 'Crowns', label: 'Royal Decree', tab: 'Crown', ico: function (px) { return IK.ico.crown(px); }, art: function (px) { return IK.ico.crown(px); }, unit: 1e6, coef: 3, per: 0.10, lore: 'Crown a new age. Your town starts over, and every crown adds 10% to all income forever.' },
  levelArt: function () { return IK.ico.star(56); }, welcomeArt: function () { return G[2].ico(64); },
  logo: 'IDLE<br>EMPIRE<small>MARKET TO METROPOLIS</small>', tagline: 'Tap the fountain, build a town and grow it into a harbour city.', pitch: 'A tiny town with a big future.',
  howto: ['Tap the fountain to earn coins.', 'Build a Market Stall, then more buildings. Each one earns coins every second, even while you are away.', 'Own 25, 50 or 100 of a building to multiply its output. Buy upgrades to earn even more.', 'Reach 1M coins in one age, then a Royal Decree turns them into Crowns: a permanent income bonus and a shop of perks.'],
  coach: function (E) {
    return [
      { text: 'Tap the fountain to make a wish and earn coins.', target: '#sceneWrap', on: 'tap' },
      { text: 'Nice! Now build your first Market Stall.', target: function () { return E.rows[0].btn; }, on: 'buy' },
      { text: 'Every building earns coins by itself, even when you are away. Keep building to level up and unlock new tabs.', target: '', on: null }
    ];
  },
  makeScene: makeScene,
  cheats: {
    GOLDRAIN: function (E) { var g = Math.max(1e6, E.income() * 600); E.S.coins += g; E.S.lifetime += g; E.S.alltime += g; return 'Gold rain: +' + fmt(g) + ' coins.'; },
    MIDAS: function (E) { E.codes.MIDAS = 1; return 'Midas touch: every tap is worth 10 times more.'; },
    TIMEWARP: function (E) { var h = E.income() * 3600; E.S.coins += h; E.S.lifetime += h; E.S.alltime += h; return 'Time warp: one hour of income (+' + fmt(h) + ').'; }
  },
  /* old saves (v1) keep working: buildings, coins, golden coins -> crowns, deeds by position */
  migrate: function (d, E) {
    var o = { v: 2, coins: d.coins, lifetime: d.lifetime, alltime: d.alltime, owned: d.owned, prem: d.gold || 0, buy: d.buy, stats: { taps: d.taps || 0, trades: d.trades || 0 }, chests: d.chests || 0, last: d.last };
    var ids = ['first', 'hoard', 'mill', 'bill', 'trill', 'builder', 'magnate', 'board', 'crowns10', 'crowns50'], ach = {};
    (d.deeds || []).forEach(function (v, i) { if (v && ids[i]) ach[ids[i]] = 1; });
    o.ach = ach; return o;
  }
});
E.codes = {};
window.__empire = E;
E.boot($('root'));
