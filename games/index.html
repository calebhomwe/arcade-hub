<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Arcade — 38 instant games</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--card:#121827;--line:#26314a;--text:#f7f8fb;--muted:#99a6bd;--hot:#7c5cff;--cyan:#20d9ff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% -10%,#262057 0,transparent 40%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
main{width:min(1080px,100%);margin:auto}
header{display:grid;gap:12px;margin-bottom:18px}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(34px,9vw,68px);line-height:.94;margin:0;letter-spacing:-.055em}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:650px}
.tools{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;top:env(safe-area-inset-top);z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}
input,button{min-height:48px;border-radius:15px;border:1px solid var(--line);font:inherit}
input{width:100%;padding:0 16px;background:#0d1220;color:var(--text);outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #20d9ff22}
button{padding:0 17px;background:linear-gradient(135deg,var(--hot),#b04cff);color:white;font-weight:800;cursor:pointer}
.filters{display:flex;gap:8px;overflow:auto;padding:0 0 13px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;min-height:40px;padding:0 14px;background:#101625;color:var(--muted);font-size:13px}
.filter.active{background:#e9edff;color:#0a0d16;border-color:#e9edff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{position:relative;display:grid;gap:10px;min-height:164px;padding:17px;text-decoration:none;color:var(--text);background:linear-gradient(145deg,#151c2d,#0e1320);border:1px solid var(--line);border-radius:21px;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s,border-color .16s}
.card:active{transform:scale(.97)}
.card:hover{transform:translateY(-3px);border-color:#596b94}
.icon{font-size:42px;filter:drop-shadow(0 8px 18px #0008)}
.name{font-weight:850;font-size:17px;line-height:1.1}
.tag{color:var(--muted);font-size:12px}
.play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#ffffff12;border:1px solid #ffffff25}
.empty{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--muted)}
footer{color:var(--muted);text-align:center;font-size:12px;padding:28px 0 0}
@media(max-width:520px){body{padding-left:12px;padding-right:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:145px;padding:14px;border-radius:18px}.icon{font-size:36px}.name{font-size:15px}.tools{grid-template-columns:1fr}.tools button{display:none}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Instant • touch ready • no install</div>
<h1>Pocket Arcade</h1>
<p class="sub">Pick a game and play immediately. Designed for iPhone, iPad and desktop.</p>
</header>
<div class="tools"><input id="search" type="search" placeholder="Search 38 games…" autocomplete="off" aria-label="Search games"><button id="random">Surprise me</button></div>
<nav class="filters" id="filters" aria-label="Game categories"></nav>
<section class="grid" id="grid" aria-live="polite"></section>
<footer>Games save locally on your device when supported.</footer>
</main>
<script>
const games=[["Block Blast","block-blast.html","Puzzle","🧱"],["Brick Breaker","brick-breaker.html","Arcade","🟣"],["Bubble Pop","bubble-pop.html","Arcade","🫧"],["Chess","chess.html","Strategy","♟️"],["Color Switch","color-switch.html","Arcade","🎨"],["Connect Four","connect-four.html","Strategy","🔴"],["Dino Dash","dino-dash.html","Runner","🦖"],["Farm Harvest","farm-harvest.html","Cozy","🌾"],["Farm Idle","farm-idle.html","Idle","🚜"],["Flappy Flight","flappy-flight.html","Arcade","🐦"],["2048","game-2048.html","Puzzle","🔢"],["Hangman","hangman.html","Words","📝"],["Helix Smash","helix-smash.html","Arcade","🌀"],["Hole Swallow","hole-swallow.html","Arcade","🕳️"],["Idle Empire","idle-empire.html","Idle","🏰"],["Idle Miner","idle-miner.html","Idle","⛏️"],["Isle of Bells","isle-of-bells.html","Adventure","🔔"],["Knife Hit","knife-hit.html","Arcade","🎯"],["Math Battle","math-battle.html","Learning","⚔️"],["Math Blast","math-blast.html","Learning","💥"],["Math Run","math-run.html","Learning","🏃"],["Math Snake","math-snake.html","Learning","🐍"],["Memory Match","memory-match.html","Puzzle","🧠"],["Merge Blocks","merge-blocks.html","Puzzle","🔷"],["Minesweeper","minesweeper.html","Puzzle","💣"],["Missing Letter","missing-letter.html","Words","🔤"],["Rhyme Time","rhyme-time.html","Words","🎵"],["Simon Says","simon-says.html","Memory","🟩"],["Snake","snake.html","Arcade","🐍"],["Spell & Say","spell-and-say.html","Words","🗣️"],["Stack Ball","stack-ball.html","Arcade","🏐"],["Sudoku","sudoku.html","Puzzle","9️⃣"],["Survivor Wave","survivor-wave.html","Action","🧟"],["Tap Monsters","tap-monsters.html","Action","👾"],["Tic Tac Toe","tic-tac-toe.html","Strategy","❌"],["Tower Stack","tower-stack.html","Arcade","🏗️"],["Whack-a-Mole","whack-a-mole.html","Arcade","🔨"],["Word Scramble","word-scramble.html","Words","🔀"]];
const grid=document.getElementById("grid"),search=document.getElementById("search"),filters=document.getElementById("filters");
let category="All";
const categories=["All"].concat([...new Set(games.map(g=>g[2]))].sort());
function renderFilters(){filters.innerHTML="";categories.forEach(c=>{const b=document.createElement("button");b.className="filter"+(c===category?" active":"");b.textContent=c;b.onclick=()=>{category=c;renderFilters();render()};filters.appendChild(b)})}
function render(){const q=search.value.trim().toLowerCase();const shown=games.filter(g=>(category==="All"||g[2]===category)&&(!q||g[0].toLowerCase().includes(q)||g[2].toLowerCase().includes(q)));grid.innerHTML="";shown.forEach(g=>{const a=document.createElement("a");a.className="card";a.href=encodeURI(g[1]);a.innerHTML='<span class="icon">'+g[3]+'</span><span class="name">'+g[0]+'</span><span class="tag">'+g[2]+'</span><span class="play">▶</span>';grid.appendChild(a)});if(!shown.length)grid.innerHTML='<div class="empty">No games found. Try another search.</div>'}
search.addEventListener("input",render);
document.getElementById("random").onclick=()=>{const g=games[Math.floor(Math.random()*games.length)];location.href=encodeURI(g[1])};
renderFilters();render();
</script>
</body>
</html>
