<style>
@font-face{font-family:'Nunito';src:url(assets/fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#logo h1{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'New York',Georgia,serif;font-size:62px;line-height:.95;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#fffbe6 6%,#ffd66e 46%,#d98d1f 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #5a2c06) drop-shadow(0 0 1px #3a1c04) drop-shadow(0 8px 16px rgba(0,0,0,.5))}

#banner b{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-size:34px;font-weight:900;color:#fff3c8;text-shadow:0 3px 0 #5a2c06,0 6px 14px rgba(0,0,0,.5)}
#banner span{font-size:16px;color:#ffe9b8;text-shadow:0 2px 4px #000;margin-top:2px}
#banner canvas{width:120px;height:44px;margin-top:6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#banner.on{animation:ban 1.9s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1.15)}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#back{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;min-height:44px;padding:0 10px;display:inline-flex;align-items:center;color:#cfe0ee;font-size:14px;font-weight:800;text-decoration:none;text-shadow:0 1px 3px #000}
@media (prefers-reduced-motion:reduce){#stageLbl.pop,#apples.bump,#ready .tap,#banner.on{animation:none}#banner.on{opacity:1}}
</style>

<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden"><div id="stageLbl">STAGE 1</div><div id="pips"></div></div>
  <div id="apples" class="chip hidden"><span>🍎</span><span id="acount">0</span></div>
  <button id="mute" type="button" aria-label="Sound on or off">🔊</button>
  <div id="banner"></div>
  <div id="ready" class="scr hidden"><div class="card"><span class="tap" aria-hidden="true">👆</span><b>Tap to throw</b><p id="readyMore">Stick every knife in the spinning log. Don't hit a knife that's already in! Golden and red apples are coins.</p></div></div>
  <div id="title" class="scr">
    <div id="logo"><h1>Knife<span>Hit</span></h1><p>THROW · STICK · SHATTER</p></div>
    <div id="info"></div>
    <div id="metaHost" style="width:100%"></div>
    <div class="seg" id="startSeg" role="group" aria-label="Starting stage"></div>
    <button class="btn" id="playBtn" type="button">PLAY</button>
  </div>
  <div id="codes" class="hidden">CODES ON</div>
  <a id="back" class="hidden" href="../index.html">← Hub</a>
</div>
<script src="kit/fxkit.js"></script>
<script src="kit/artkit.js"></script>
<script src="kit/metakit.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const SDK = window.ArcadeSDK || null;
function scene(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
const cheated = () => !!(SDK && SDK.cheated);
const RM = FX.rm();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
let topLevel = false; try { topLevel = window.parent === window; } catch (e) {}
const setBack = on => { if (topLevel) $('back').classList.toggle('hidden', !on); };
const TAU = Math.PI * 2, norm = a => ((a % TAU) + TAU) % TAU, angDiff = (a, b) => { const d = norm(a - b); return d > Math.PI ? TAU - d : d; };
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------------------------------------------------------------- canvas */
const W = 420; let H = 760, SC = 1, CSSW = 390, CSSH = 760, Q = 2, LX = 210, LY = 280, LR = 116;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), assets = { logs: {} };
function fit() {
  const vv = window.visualViewport, vw = Math.max(240, vv ? vv.width : innerWidth), vh = Math.max(320, vv ? vv.height : innerHeight);
  const A = Math.min(2.15, Math.max(1.5, vh / vw));
  CSSW = Math.floor(Math.min(vw, vh / A)); CSSH = Math.floor(CSSW * A); stage.style.width = CSSW + 'px'; stage.style.height = CSSH + 'px';
  SC = CSSW / W; H = Math.round(W * A); LX = W / 2; LY = Math.round(H * 0.37);
  const d = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(CSSW * d); cv.height = Math.round(CSSH * d); ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  const q = Math.min(2, Math.max(1, d * SC)); if (Math.abs(q - Q) > 0.3 || !assets.bg || assets.h !== H) { Q = q; assets.logs = {}; buildAssets(); }
}

/* ---------------------------------------------------------------- state */
const log = { a: 0, w: 0, dir: 1, base: 1.2, kind: 'oak', boss: 0, R: 116, t: 0, squash: 0, kick: 0, pat: 'const', scale: 1 };
let state = 'title', stageN = 1, startStage = 1, points = 0, applesRun = 0, throwsRun = 0, comboN = 0, comboT = 0, best = parseInt(lsGet('knife-hit-best') || '0', 10) || 0;
let stuck = [], apples = [], flying = [], pieces = [], toThrow = 0, total = 0, clearT = 0, t = 0, lastThrow = 0, slow = false, ghost = false, rain = false, intro = 0, dead = false;
let muted = lsGet('knife-hit-mute') === '1', tutSeen = lsGet('knife-hit-tut') === '1', ckpt = parseInt(lsGet('knife-hit-ckpt') || '1', 10) || 1, appleTot = parseInt(lsGet('knife-hit-apples') || '0', 10) || 0;
const shake = new FX.Shake({ maxOffset: 12, maxAngle: 0.02 }), timeFx = new FX.Time(), parts = new FX.Particles(220), pops = new FX.Pops(14), kick = new FX.Spring(260, 12);
const SEP = 0.185;     // how close (radians) a new knife may land to one already in the log

/* ---------------------------------------------------------------- knives: 9 skins, one drawing routine (blade pointing +x) */
const SKINS = [
  { id: 'iron', name: 'Iron Dagger', cost: 0, blade: ['#f4f7fb', '#b6bfcc', '#6c7686'], guard: '#8a6a3a', handle: ['#6a4a2a', '#3f2a16'], wrap: '#2a1a0c', len: 1 },
  { id: 'hunter', name: 'Hunter', cost: 20, blade: ['#ecf0f4', '#a8b2c0', '#5a6474'], guard: '#5a4a3a', handle: ['#efe4c8', '#b8a678'], wrap: '#8a7a54', len: 1, pom: 'bone' },
  { id: 'kunai', name: 'Kunai', cost: 45, blade: ['#dfe6ee', '#8892a2', '#3e4756'], guard: '#22262e', handle: ['#454c58', '#1e222a'], wrap: '#c62828', len: 0.95, shape: 'leaf', pom: 'ring' },
  { id: 'gilded', name: 'Gilded', cost: 80, blade: ['#fff6c8', '#e8bd48', '#a8720a'], guard: '#c9982a', handle: ['#7a1f24', '#3f0d10'], wrap: '#e8bd48', len: 1 },
  { id: 'cleaver', name: 'Chef\'s Cleaver', cost: 120, blade: ['#f2f5f9', '#b0bac8', '#6a7484'], guard: '#5a5a5a', handle: ['#a2723a', '#5a3a1a'], wrap: '#3a2410', len: 1, shape: 'wide' },
  { id: 'ruby', name: 'Ruby Blade', cost: 170, blade: ['#ffb8c0', '#e0303e', '#7a0f1c'], guard: '#c9982a', handle: ['#3a1a4a', '#1a0a26'], wrap: '#c9982a', len: 1, glow: '#ff5a6a', pom: 'gem' },
  { id: 'bark', name: 'Bark Splitter', cost: 0, req: { stat: 'boss', v: 1, text: 'Beat the first boss (stage 5)' }, blade: ['#dfe8d0', '#8fa872', '#4a5e3a'], guard: '#6a4a26', handle: ['#7a5a32', '#3a2a14'], wrap: '#4f7a3a', len: 1.05, shape: 'wide' },
  { id: 'frost', name: 'Frost Fang', cost: 0, req: { stat: 'boss', v: 2, text: 'Beat the second boss (stage 10)' }, blade: ['#f0fbff', '#8fd8f6', '#3f8ad0'], guard: '#b8d8ea', handle: ['#dbeef8', '#7aa8c8'], wrap: '#5aa8d8', len: 1.05, glow: '#8fe0ff', shape: 'leaf' },
  { id: 'ember', name: 'Ember Edge', cost: 0, req: { stat: 'boss', v: 3, text: 'Beat the third boss (stage 15)' }, blade: ['#ffe8a0', '#ff8a2a', '#b02a10'], guard: '#3a2a26', handle: ['#4a3a34', '#1e1612'], wrap: '#ff8a2a', len: 1.05, glow: '#ff7a2a', pom: 'gem' },
];
function drawKnife(c, sk, L, tm, rusty) {   // origin at the guard; blade points +x, handle -x. L = whole length
  const bl = L * 0.58, hl = L * 0.42, bw = sk.shape === 'wide' ? 9.5 : sk.shape === 'leaf' ? 8 : 6.2;
  if (sk.glow && !rusty) { c.save(); c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(bl * 0.5, 0, 1, bl * 0.5, 0, bl * 0.75); g.addColorStop(0, sk.glow + '99'); g.addColorStop(1, sk.glow + '00'); c.fillStyle = g; c.fillRect(-4, -bl * 0.75, bl * 1.3, bl * 1.5); c.restore(); }
  // handle
  let g = c.createLinearGradient(0, -6, 0, 6); g.addColorStop(0, sk.handle[0]); g.addColorStop(1, sk.handle[1]); c.fillStyle = g; c.beginPath();
  if (c.roundRect) c.roundRect(-hl, -5.4, hl, 10.8, 3.4); else c.rect(-hl, -5.4, hl, 10.8); c.fill();
  c.strokeStyle = sk.wrap; c.lineWidth = 1.6; for (let x = -hl + 4; x < -2; x += 5) { c.beginPath(); c.moveTo(x, -5.2); c.lineTo(x + 3, 5.2); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(-hl + 2, -4.6, hl - 4, 1.6);
  if (sk.pom) { c.fillStyle = sk.pom === 'gem' ? (sk.glow || '#e0303e') : sk.guard; if (sk.pom === 'ring') { c.strokeStyle = '#9aa4b2'; c.lineWidth = 2.6; c.beginPath(); c.arc(-hl - 5, 0, 5, 0, TAU); c.stroke(); } else { c.beginPath(); c.arc(-hl, 0, 5.2, 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(-hl - 1.4, -1.6, 1.6, 0, TAU); c.fill(); } }
  // guard
  g = c.createLinearGradient(0, -9, 0, 9); g.addColorStop(0, '#ffffff66'); g.addColorStop(0.4, sk.guard); g.addColorStop(1, '#00000066'); c.fillStyle = sk.guard; c.beginPath(); c.roundRect ? c.roundRect(-3.2, -9.4, 6.4, 18.8, 2.4) : c.rect(-3.2, -9.4, 6.4, 18.8); c.fill(); c.fillStyle = g; c.fill();
  // blade: lit top edge, mid steel, dark fuller, sharp tip
  c.beginPath(); c.moveTo(3, -bw); if (sk.shape === 'leaf') { c.quadraticCurveTo(bl * 0.5, -bw * 1.5, bl, 0); c.quadraticCurveTo(bl * 0.5, bw * 1.5, 3, bw); } else if (sk.shape === 'wide') { c.lineTo(bl * 0.78, -bw); c.quadraticCurveTo(bl * 0.95, -bw * 0.7, bl, bw * 0.15); c.lineTo(bl * 0.9, bw); c.lineTo(3, bw); } else { c.lineTo(bl * 0.72, -bw * 0.8); c.lineTo(bl, 0); c.lineTo(bl * 0.72, bw * 0.8); c.lineTo(3, bw); } c.closePath();
  g = c.createLinearGradient(0, -bw, 0, bw); g.addColorStop(0, sk.blade[0]); g.addColorStop(0.5, sk.blade[1]); g.addColorStop(1, sk.blade[2]); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(20,20,30,.5)'; c.lineWidth = 0.9; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.1; c.beginPath(); c.moveTo(6, -bw * 0.55); c.lineTo(bl * 0.72, -bw * 0.4); c.stroke();
  c.strokeStyle = 'rgba(20,24,34,.35)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(8, 0.5); c.lineTo(bl * 0.68, 0.3); c.stroke();
  if (rusty) { c.fillStyle = 'rgba(120,60,20,.28)'; c.beginPath(); c.moveTo(3, -bw); c.lineTo(bl * 0.72, -bw * 0.8); c.lineTo(bl, 0); c.lineTo(bl * 0.72, bw * 0.8); c.lineTo(3, bw); c.closePath(); c.fill(); }
  void tm;
}
function drawSkin(x, sk, cx, cy, size, tm) { x.save(); x.translate(cx, cy); x.rotate(-0.78 + Math.sin(tm * 2) * 0.05); x.translate(-size * 0.02, 0); drawKnife(x, sk, size * 1.0, tm, false); x.restore(); }

/* ---------------------------------------------------------------- progression */
const meta = HubMeta.create({
  id: 'knife', title: 'Knife Hit', accent: '#e9a93a', weeklyBonus: 60,
  coin: { icon: '🍎', name: 'Apples' },
  skins: SKINS, drawSkin: (x, sk, cx, cy, size, tm) => drawSkin(x, sk, cx, cy, size, tm),
  medals: [{ name: 'Bronze', at: 4 }, { name: 'Silver', at: 6 }, { name: 'Gold', at: 11 }, { name: 'Platinum', at: 16 }],
  missions: [
    { id: 's3', text: 'Reach stage 3', stat: 'stage', kind: 'max', target: 3, reward: 8, easy: true },
    { id: 's6', text: 'Reach stage 6 in one run', stat: 'stage', kind: 'max', target: 6, reward: 20 },
    { id: 'a5', text: 'Slice 5 apples today', stat: 'apples', kind: 'sum', target: 5, reward: 15 },
    { id: 'a3r', text: 'Slice 3 apples in one run', stat: 'applesRun', kind: 'max', target: 3, reward: 20 },
    { id: 't60', text: 'Throw 60 knives today', stat: 'throws', kind: 'sum', target: 60, reward: 15 },
    { id: 'cl4', text: 'Clear 4 stages today', stat: 'cleared', kind: 'sum', target: 4, reward: 15 },
    { id: 'boss', text: 'Beat a boss', stat: 'boss', kind: 'sum', target: 1, reward: 30 },
    { id: 'cb8', text: 'Land 8 knives in a row without pausing', stat: 'combo', kind: 'max', target: 8, reward: 20 },
    { id: 'gold', text: 'Slice a golden apple', stat: 'gold', kind: 'sum', target: 1, reward: 20 },
  ],
  daily: [
    { id: 'd8', text: 'Reach stage 8 in one run', stat: 'stage', kind: 'max', target: 8, reward: 25 },
    { id: 'd15a', text: 'Slice 15 apples today', stat: 'apples', kind: 'sum', target: 15, reward: 25 },
    { id: 'd120t', text: 'Throw 120 knives today', stat: 'throws', kind: 'sum', target: 120, reward: 25 },
    { id: 'd6c', text: 'Clear 6 stages today', stat: 'cleared', kind: 'sum', target: 6, reward: 25 },
  ],
  sfx: n => snd(n === 'unlock' ? 'powerup' : n === 'win' ? 'win' : 'tap'),
});
const skinNow = () => meta.skin || SKINS[0];
function snd(n, o) { if (muted) return; try { if (SDK && SDK.sfx) SDK.sfx(n, o || {}); } catch (e) {} }
$('mute').addEventListener('click', e => { e.stopPropagation(); muted = !muted; lsSet('knife-hit-mute', muted ? 1 : 0); $('mute').textContent = muted ? '🔇' : '🔊'; if (!muted) snd('tap'); });
$('mute').textContent = muted ? '🔇' : '🔊';

/* ---------------------------------------------------------------- painted art */
const BOSSES = [
  { name: 'THE BARK BEAST', kind: 'oak', face: true, pat: 'flip', col: '#7a4a24', sub: 'It spins both ways!' },
  { name: 'FROST WHEEL', kind: 'frost', face: true, pat: 'pulse', col: '#8ad0f0', sub: 'It speeds up and slows down' },

  } else if (stageN % 5 === 4) snd('levelup', { volume: 0.5 });
}
function banner(title, sub, skin) {
  const b = $('banner'); b.innerHTML = '<b></b><span></span>'; b.querySelector('b').textContent = title; b.querySelector('span').textContent = sub;
  if (skin) { const c = meta.skinCanvas(skin, 64); b.appendChild(c); } b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
}
function endRun() {
  const stage = stageN, res = meta.finish({ score: stage, coins: applesRun + Math.floor(stage / 2), trackBest: true }); scene('over', { score: points });
  if (!cheated()) { if (points > best) { best = points; lsSet('knife-hit-best', best); } }
  setTimeout(() => { if (state !== 'dead') return; meta.showResult({ res, title: 'Stage ' + stage, subtitle: points + ' points', scoreLabel: 'STAGE REACHED', againLabel: stage > 1 && startStage > 1 ? 'PLAY AGAIN' : 'PLAY AGAIN', onAgain: () => getReady(false), onMenu: showTitle }); }, 850);
}

/* ---------------------------------------------------------------- update */
function update(dt) {
  t += dt; const real = dt; dt = timeFx.step(dt); shake.update(real); parts.update(real); pops.update(real); kick.update(real);
  if (log.squash > 0) log.squash = Math.max(0, log.squash - real * 5);
  log.scale += (1 - log.scale) * Math.min(1, real * 7);
  for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; p.t += real; p.x += p.vx * real; p.y += p.vy * real; p.vy += 900 * real; p.r += p.vr * real; if (p.t >= p.life || p.y > H + 80) pieces.splice(i, 1); }
  if (pieces.length > 40) pieces.length = 40;
  if (dt <= 0) return;
  if (state === 'title' || state === 'ready') { log.t += dt; log.a += (state === 'title' ? 0.5 : log.base * log.dir) * dt; return; }
  if (state === 'clear') { clearT += real; if (clearT > 1.05) { state = 'play'; setupStage(stageN + 1); if (stageN === 2 && !RM) pops.add(W / 2, LY + 6, 'Watch the knives in the log!', { color: '#ffe9b8', size: 20, life: 1.6 }); } return; }
  if (state === 'dead') { log.a += log.w * dt * 0.3; return; }
  log.t += dt; log.w = omegaOf() * (slow ? 0.5 : 1); log.a += log.w * dt;
  for (let i = flying.length - 1; i >= 0; i--) { const f = flying[i], ty = LY + log.R + 18; f.v = Math.min(2300, f.v + 9000 * dt); f.y -= f.v * dt; if (f.y <= ty) { flying.splice(i, 1); land(f); if (state !== 'play') break; } }
  if (rain && apples.every(a => !a.alive) && Math.random() < 0.02) apples.push({ a: Math.random() * TAU, gold: false, alive: true });
}

/* ---------------------------------------------------------------- draw */
function drawLog() {
  const tex = logTexture(log.kind, log.boss, log.R, Q), R = log.R, sc = log.scale * (1 + log.squash * 0.05), ky = kick.x * 0.01;
  ctx.save(); ctx.translate(LX, LY + kick.x * 0.08); ctx.scale(sc * (1 + ky), sc * (1 - ky * 0.6));
  ctx.globalAlpha = 0.9; ctx.drawImage(assets.shadow, -R - 30 + 6, -R - 30 + 14, 2 * (R + 30), 2 * (R + 30)); ctx.globalAlpha = 1;
  ctx.save(); ctx.rotate(log.a); ctx.drawImage(tex, -R - 6, -R - 6, 2 * (R + 6), 2 * (R + 6)); ctx.restore();
  ctx.drawImage(assets.light, -R - 4, -R - 4, 2 * R + 8, 2 * R + 8);
  if (log.kind === 'ember') { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 4); const g = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R); g.addColorStop(0, 'rgba(255,120,30,.5)'); g.addColorStop(1, 'rgba(255,60,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle = 'rgba(255,225,170,.5)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, 0, R - 0.8, -2.5, -0.4); ctx.stroke();
  ctx.restore();
}
function drawStuck(s, sk, rusty) {
  // the tip sits inside the rim, the guard just outside it, the handle pointing out: how a real thrown knife stands in wood
  const a = s.a + log.a, R = log.R * log.scale, L = 80 * sk.len, x = LX + Math.cos(a) * (R + 18 * log.scale), y = LY + kick.x * 0.08 + Math.sin(a) * (R + 18 * log.scale);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI); ctx.scale(log.scale, log.scale); drawKnife(ctx, sk, L, t, rusty); ctx.restore();
}
function draw() {
  ctx.save(); shake.apply(ctx, W, H);
  ctx.drawImage(assets.bg, 0, 0, W, H);
  if (state !== 'clear') {
    drawLog();
    for (const s of stuck) {
      drawStuck(s, s.pre ? SKINS[0] : skinNow(), s.pre);
      if (s.flash > 0) { s.flash -= 0.04; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,60,40,' + s.flash * 0.6 + ')'; const a = s.a + log.a; ctx.beginPath(); ctx.arc(LX + Math.cos(a) * (log.R + 12), LY + Math.sin(a) * (log.R + 12), 30, 0, TAU); ctx.fill(); ctx.restore(); }
    }
    for (const ap of apples) if (ap.alive) {
      const a = ap.a + log.a, R = log.R * log.scale, x = LX + Math.cos(a) * (R - 6), y = LY + kick.x * 0.08 + Math.sin(a) * (R - 6);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2); const img = ap.gold ? assets.gold : assets.apple, s2 = (1 + (ap.gold ? Math.sin(t * 5) * 0.06 : 0)) * log.scale; ctx.drawImage(img, -22 * s2, -26 * s2, 44 * s2, 44 * s2); ctx.restore();
    }
  }
  // the knives in flight, the one in your hand, the ammo rack
  const sk = skinNow();
  for (const f of flying) { ctx.save(); ctx.translate(LX, f.y); ctx.rotate(-Math.PI / 2); drawKnife(ctx, sk, 80 * sk.len, t, false); ctx.restore(); }
  if (state === 'play' || state === 'ready' || state === 'dead') {
    if (toThrow - flying.length > 0 && state !== 'dead') { ctx.save(); ctx.translate(LX, H - 64 + (state === 'ready' ? Math.sin(t * 3) * 3 : 0)); ctx.rotate(-Math.PI / 2); drawKnife(ctx, sk, 80 * sk.len, t, false); ctx.restore(); }
    drawAmmo();
  }
  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p.t / p.life - 0.55) / 0.45);
    if (p.kind === 'knife') drawKnife(ctx, p.sk, 80 * p.sk.len, t, p.rusty);
    else if (p.kind === 'wedge') { const tex = logTexture(p.tex, p.boss, p.R, Q), R = p.R; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, p.a0 - p.aw / 2, p.a0 + p.aw / 2); ctx.closePath(); ctx.clip(); ctx.rotate(p.aBreak - p.r); ctx.drawImage(tex, -R - 6, -R - 6, 2 * (R + 6), 2 * (R + 6)); }
    else if (p.kind === 'half') { const img = p.gold ? assets.gold : assets.apple; ctx.beginPath(); ctx.rect(p.flip > 0 ? 0 : -22, -26, 22, 44); ctx.clip(); ctx.drawImage(img, -22, -26, 44, 44); }
    ctx.restore();
  }
  parts.draw(ctx); pops.draw(ctx);
  ctx.drawImage(assets.vig, 0, 0, W, H);
  ctx.restore();
}
function drawAmmo() {
  const left = toThrow - flying.length, sk = skinNow();
  for (let i = 0; i < total; i++) { const x = 16 + Math.floor(i / 6) * 22, y = H - 100 - (i % 6) * 24; ctx.save(); ctx.globalAlpha = i < left ? 1 : 0.28; ctx.translate(x + 8, y); ctx.rotate(-Math.PI / 2); ctx.scale(0.6, 0.6); drawKnife(ctx, sk, 80 * sk.len, t, false); ctx.restore(); }
}
let last = 0;
function loop(now) { requestAnimationFrame(loop); if (document.hidden) { last = 0; return; } const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now; update(dt); draw(); }

/* ---------------------------------------------------------------- input */
stage.addEventListener('pointerdown', e => {
  if (SDK && SDK.paused) return; if (e.target.closest('button,a,.hm,#metaHost,.seg')) return;
  if (state === 'title') getReady(false); else throwKnife();
});
addEventListener('keydown', e => {
  if (SDK && SDK.paused) return;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); if (state === 'title') getReady(false); else throwKnife(); }
});
$('playBtn').addEventListener('click', e => { e.stopPropagation(); getReady(false); });
addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { clearTimeout(fit._t); fit._t = setTimeout(fit, 120); });
addEventListener('orientationchange', () => setTimeout(fit, 250));

/* ---------------------------------------------------------------- codes, hints, SDK */
const CODES = { SLOWLOG: 'Slow log: every log spins at half speed', GHOSTBLADE: 'Ghost blade: knives slip past knives already in the log', APPLERAIN: 'Apple rain: a new apple keeps growing on the log' };
function code(c) { if (!CODES[c]) return { ok: false }; $('codes').classList.remove('hidden'); if (c === 'SLOWLOG') { slow = true; log.base *= 0.5; } if (c === 'GHOSTBLADE') ghost = true; if (c === 'APPLERAIN') { rain = true; if (state === 'play' && !apples.length) apples.push({ a: Math.random() * TAU, gold: false, alive: true }); } return { ok: true, message: CODES[c] + '. Codes on: this run will not count.' }; }
function hint() {
  if (state !== 'play') return state === 'ready' ? 'Tap to throw. Knives already in the log are the danger.' : 'Press Play, then tap to throw knives into the spinning log.';
  const a = norm(Math.PI / 2 - (log.a + log.w * 0.12)); let near = 9; for (const s of stuck) near = Math.min(near, angDiff(a, s.a));
  if (near < 0.3) return 'Wait: a knife that is already in the log is coming round to the bottom. Throw just after it passes.';
  for (const ap of apples) if (ap.alive && angDiff(a, ap.a) < 0.3) return 'Throw now to slice the apple!';
  return 'Clear at the bottom: throw now. ' + toThrow + ' knife' + (toThrow === 1 ? '' : 's') + ' left in this log.';
}
if (SDK) SDK.init({ pauseButton: 'br', onRestart: () => getReady(false), onExit: showTitle, onTutorial: () => getReady(true), onHint: hint, onCheat: code });

const mh = meta.mountBar($('metaHost'));
fit(); showTitle(); requestAnimationFrame(loop);
window.__knife = { get state() { return state; }, get stage() { return stageN; }, meta, start: () => getReady(false), throwKnife, get log() { return log; }, get stuck() { return stuck; }, get flying() { return flying; }, get toThrow() { return toThrow; }, cheat: c => code(c) };
})();
</script>
