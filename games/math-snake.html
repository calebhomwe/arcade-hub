<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 50% -10%,#166534,#0f0f23 55%,#07070f);display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.back{position:fixed;top:12px;left:14px;color:#cbd5e1;text-decoration:none;font-size:15px;font-weight:800;z-index:40}
#muteBtn{position:fixed;top:10px;right:12px;z-index:40;background:linear-gradient(180deg,#273449,#1e293b);border:none;border-bottom:3px solid #0b1220;color:#fff;font-size:20px;width:48px;height:48px;border-radius:14px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.5)}
#pauseBtn{position:fixed;top:64px;right:12px;z-index:40;background:linear-gradient(180deg,#273449,#1e293b);border:none;border-bottom:3px solid #0b1220;color:#fff;font-size:20px;width:48px;height:48px;border-radius:14px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.5)}
#stage{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
.top{text-align:center;padding:38px 10px 4px}
.top h1{font-size:clamp(18px,5vw,26px);font-weight:900;letter-spacing:-.5px;background:linear-gradient(90deg,#4ade80,#a3e635,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}
#problem{font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:1px;text-shadow:0 0 24px rgba(74,222,128,.55);margin-top:4px}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-weight:800;font-size:14px}
.hud span{background:rgba(30,41,59,.55);border:1px solid rgba(148,163,184,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.28);padding:7px 14px;border-radius:12px}
.ops{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.op{width:58px;height:58px;border-radius:16px;border:2px solid #334155;background:#1e293b;color:#fff;font-size:26px;font-weight:900;cursor:pointer}
.op.on{border-color:#4ade80;background:#14532d;box-shadow:0 0 16px rgba(74,222,128,.5)}
#lives{color:#f87171;letter-spacing:2px}
#streak{color:#facc15}
#msg{min-height:22px;text-align:center;font-weight:900;font-size:16px;margin-top:4px;opacity:0;transition:opacity .25s}
#msg.show{opacity:1}
#game{flex:1;width:100%;min-height:0;display:block}
.popup{position:fixed;font-weight:900;font-size:24px;pointer-events:none;z-index:50;text-shadow:0 2px 6px rgba(0,0,0,.7);animation:popup .7s ease forwards}
@keyframes popup{0%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -52px}}
#flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none;z-index:45;transition:opacity .12s ease-out}
.hud span.jpop{animation:jpopk .3s ease}
@keyframes jpopk{40%{transform:scale(1.16)}}
#game.shake{animation:shk .4s}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(7,7,15,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(148,163,184,.16);z-index:60;text-align:center;padding:20px}
.ov h1{font-size:38px;font-weight:900}
.ov p{color:#cbd5e1;font-size:15px;line-height:1.6;max-width:420px}
.diff{display:flex;gap:10px}
.diff button{min-height:50px;padding:0 22px;border-radius:14px;border:2px solid #334155;background:#1e293b;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.diff button.on{border-color:#38bdf8;background:#0c4a6e;box-shadow:0 0 16px rgba(56,189,248,.5)}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#4ade80,#a3e635);color:#04240f;font-size:22px;font-weight:900;padding:16px 48px;border-radius:999px;box-shadow:0 8px 26px rgba(74,222,128,.4);min-height:56px}
.btn:active{transform:scale(.94)}
.best{color:#4ade80;font-weight:800}
.hidden{display:none!important}
#problem.pg{animation:pgc .5s}
@keyframes pgc{0%,55%{color:#4ade80;text-shadow:0 0 26px rgba(74,222,128,.95)}100%{}}
#problem.pr{animation:prc .5s}
@keyframes prc{0%,55%{color:#f87171;text-shadow:0 0 26px rgba(248,113,113,.95)}100%{}}
#dpad{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(3,52px);grid-auto-rows:52px;gap:8px;z-index:40}
@media (pointer:coarse){#dpad{display:grid}}
#dpad button{background:#1e293b;border:2px solid #334155;color:#cbd5e1;font-size:22px;font-weight:900;border-radius:14px;opacity:.82;cursor:pointer;padding:0}
#dpad button:active{border-color:#4ade80;background:#14532d;color:#fff}
#dpad button:nth-child(1){grid-column:2}
#dpad button:nth-child(2){grid-column:1}
#dpad button:nth-child(3){grid-column:2}
#dpad button:nth-child(4){grid-column:3}
#count{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:#facc15;text-shadow:0 0 44px rgba(250,204,21,.85);opacity:0;pointer-events:none;z-index:65}
#count.show{opacity:1;animation:countpop .62s ease}
@keyframes countpop{0%{scale:1.7;opacity:0}30%{opacity:1}100%{scale:1;opacity:1}}
@media (max-height:430px){.ov{gap:8px;padding:10px}.ov h1{font-size:26px}.ov p{font-size:13px;line-height:1.35}.op{width:46px;height:46px;font-size:20px;border-radius:12px}.diff button{min-height:40px;padding:0 16px;font-size:14px}.btn{min-height:44px;padding:10px 36px;font-size:18px}.top{padding-top:30px}#dpad{grid-template-columns:repeat(3,42px);grid-auto-rows:42px;gap:6px}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button id="muteBtn">🔊</button>
<button id="pauseBtn">⏸</button>
<div id="stage">
  <div class="top">
    <h1>🐍 MATH SNAKE</h1>
    <div id="problem">4 + 5 = ?</div>
    <div class="hud">
      <span>Score <b id="score">0</b></span>
      <span id="lives">❤️❤️❤️</span>
      <span>Length <b id="len">3</b></span>
      <span>Streak <b id="streak">×1</b></span>
      <span>⭐ <b id="bonus">0</b></span>
      <span>⚡ <b id="frenzy">0/4</b></span>
    </div>
    <div id="msg"></div>
  </div>
  <canvas id="game"></canvas>
</div>
<div id="flash"></div>
<div id="count"></div>
<div class="ov" id="start">
  <h1>🐍 Math Snake</h1>
  <p>Swipe to steer! Eat the number that <b>matches the answer</b>.<br>Wrong number = lose a ❤️.</p>
  <div class="ops" id="ops"></div>
  <div class="diff" id="diff"></div>
  <div id="prog" style="font-size:14px;color:#cbd5e1"><b id="progLv">Lv 1</b> · <span id="progTitle">🎓 Rookie</span><div style="width:min(70vw,300px);height:8px;background:#1e293b;border-radius:999px;overflow:hidden;margin:6px auto 2px"><div id="xpfill" style="height:100%;width:0%;background:linear-gradient(90deg,#a78bfa,#38bdf8);border-radius:999px"></div></div><div id="progNext" style="font-size:12px;color:#94a3b8"></div></div>
  <button class="btn" id="playBtn">▶ Start</button>
</div>
<div class="ov hidden" id="over">
  <h1>💀 Game Over</h1>
  <div style="font-size:15px;color:#94a3b8" id="finCheer">Good try!</div>
  <div style="font-size:20px">Score: <b id="finScore">0</b></div>
  <div style="font-size:16px">Best: <b class="best" id="finBest">0</b></div>
  <div style="font-size:16px">⭐ Bonus: <b id="finBonus">0</b></div>
  <div style="font-size:16px;color:#fde047" id="finTrophy">🎖 Rookie</div>
  <div style="font-size:15px;color:#94a3b8">Lifetime eaten: <b id="finEaten">0</b></div>
  <button class="btn" id="againBtn">Play Again</button>
</div>
<div class="ov hidden" id="pause"><h1>⏸ Paused</h1><button class="btn" id="resumeBtn">▶ Resume</button></div>
<div id="dpad">
  <button data-dir="up" aria-label="Up">▲</button>
  <button data-dir="left" aria-label="Left">◀</button>
  <button data-dir="down" aria-label="Down">▼</button>
  <button data-dir="right" aria-label="Right">▶</button>
</div>
<script>

const DIFF={easy:{add:[1,9],sub:[2,9],mul:[2,5],div:[2,5],tick:180,foodTtl:14},medium:{add:[4,20],sub:[4,20],mul:[3,9],div:[3,9],tick:140,foodTtl:12},hard:{add:[10,50],sub:[10,50],mul:[6,12],div:[6,12],tick:100,foodTtl:10},insane:{add:[25,120],sub:[25,120],mul:[9,19],div:[9,15],tick:75,foodTtl:8},max:{add:[50,400],sub:[50,400],mul:[12,25],div:[12,19],tick:55,foodTtl:7}};
function saveLS(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function readLS(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
const PROGKEY='mathSnakeProg';
const TIERS=[['easy','EASY'],['medium','MEDIUM'],['hard','HARD'],['insane','INSANE'],['max','MAX MAX']];
const UNLOCK={easy:1,medium:1,hard:3,insane:6,max:10};
const TIER_XP={easy:2,medium:4,hard:6,insane:8,max:10};
let PROG={level:1,xp:0};
function xpNeed(lv){return 80+(lv-1)*40;}
function titleFor(lv){return lv>=12?'🌟 Mythic':lv>=10?'👑 Grandmaster':lv>=8?'💎 Master':lv>=6?'🥇 Elite':lv>=4?'🥈 Adept':lv>=2?'🥉 Cadet':'🎓 Rookie';}
function progLv(){return PROG.level;}
const COLS=16,ROWS=19,FOOD_COUNT=4;
let difficulty='easy',state='ready',score=0,best=+readLS('mathSnakeBest','0')||0,lives=3,currentAns=0,streak=0;
let selected={'+':true,'-':true,'×':true,'÷':true};
const goldPool=[],goldens=[];let bonus=0,goldCd=8,sprGold=null;
let chest=null,chestCd=15,sprChest=null;
const TROPHIES=[['🎖 Rookie',25],['🥉 Snacker',75],['🥈 Gobbler',150],['🥇 Champion',300],['👑 Mythic',600]];
let foodsEaten=+readLS('mathSnakeEaten','0')||0,trophyName='';
let frenzy=0,frenzyT=0;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},foods=[],acc=0,lastTs=0;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const problemEl=document.getElementById('problem'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),lenEl=document.getElementById('len'),streakEl=document.getElementById('streak'),flash=document.getElementById('flash'),bonusEl=document.getElementById('bonus'),frenzyEl=document.getElementById('frenzy');
let W=0,H=0,DPR=1,cell=0,ox=0,oy=0;
let canvasRect={left:0,top:0},boardSprite=null,bgSprite=null,vigSprite=null,dotsSprite=null,sprHead=null,sprBody=null,sprFood=null;
let elapsed=0,prevTs=0;
const foodPool=[];
const popupPool=[];

let AC,muted=readLS('mathSnakeMuted','0')==='1';
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
const TONEF={tap:440,pop:660,coin:880,hit:220,boom:110,jump:520,whoosh:300,win:700,lose:180,buzz:140,levelup:760,tick:980};
function sfx(n){if(muted)return;var a=SFXP[n];if(!a){tone(TONEF[n]||440,.12,'sine',.12);return;}try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function flashColor(col,o){flash.style.background=col;flash.style.opacity=String(o);setTimeout(()=>{flash.style.opacity='0';},100);}
function jpop(el){if(!el)return;el.classList.remove('jpop');void el.offsetWidth;el.classList.add('jpop');}
function shakeCanvas(){canvas.classList.remove('shake');void canvas.offsetWidth;canvas.classList.add('shake');}
function pulseProblem(ok){const cls=ok?'pg':'pr';problemEl.classList.remove('pg','pr');void problemEl.offsetWidth;problemEl.classList.add(cls);}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function genProblem(){
  const ops=['+','-','×','÷'].filter(o=>selected[o]);
  if(!ops.length){selected['+']=true;ops.push('+');}
  const op=ops[rnd(0,ops.length-1)],lv=DIFF[difficulty];
  let a,b,ans,sym;
  if(op==='+'){a=rnd(lv.add[0],lv.add[1]);b=rnd(lv.add[0],lv.add[1]);ans=a+b;sym='+';}
  else if(op==='-'){a=rnd(lv.sub[0],lv.sub[1]);b=rnd(0,a);ans=a-b;sym='−';}
  else if(op==='×'){a=rnd(lv.mul[0],lv.mul[1]);b=rnd(lv.mul[0],lv.mul[1]);ans=a*b;sym='×';}
  else{b=rnd(lv.div[0],lv.div[1]);const q=rnd(lv.div[0],lv.div[1]);a=b*q;ans=q;sym='÷';}
  return {text:a+' '+sym+' '+b,ans};
}
function genOptions(ans,n){
  const set=new Set([ans]);let guard=0;
  const spread=Math.max(3,Math.round(Math.abs(ans)*0.25)+2);
  while(set.size<n&&guard++<300){const d=rnd(1,spread);let v=ans+(Math.random()<.5?-d:d);if(v<0)v=ans+d;set.add(v);}
  for(let v=ans+1;set.size<n;v++)set.add(v);
  const arr=[...set];
  for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function occupied(x,y){if(snake.some(s=>s.x===x&&s.y===y))return true;if(foods.some(f=>f.x===x&&f.y===y))return true;if(goldens.some(g=>g.x===x&&g.y===y))return true;if(chest&&chest.x===x&&chest.y===y)return true;return false;}
function emptyCell(){
  let x,y,g=0;
  do{x=rnd(0,COLS-1);y=rnd(0,ROWS-1);g++;}while(occupied(x,y)&&g<300);
  if(!occupied(x,y))return {x,y};
  for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(!occupied(xx,yy))return {x:xx,y:yy};
  return {x,y};
}
function getFood(x,y,value,correct){let f=foodPool.pop();if(!f)f={x:0,y:0,value:0,correct:false};f.x=x;f.y=y;f.value=value;f.correct=correct;f.ttl=DIFF[difficulty].foodTtl;return f;}
function getGold(x,y){let g=goldPool.pop();if(!g)g={x:0,y:0};g.x=x;g.y=y;return g;}
function placeFoods(){
  const p=genProblem(),opts=genOptions(p.ans,FOOD_COUNT);
  currentAns=p.ans;problemEl.textContent=p.text+' = ?';
  while(foods.length){foodPool.push(foods.pop());}
  for(let i=0;i<FOOD_COUNT;i++){const c=emptyCell();foods.push(getFood(c.x,c.y,opts[i],opts[i]===p.ans));}
}
function resize(){
  const r=canvas.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cell=Math.floor(Math.min(W/COLS,H/ROWS));
  ox=Math.floor((W-cell*COLS)/2);oy=Math.floor((H-cell*ROWS)/2);
  canvasRect=r;
  buildBoard();
  buildBG();
  buildDots();
}
function orbBase(x,S,R,stops){const g=x.createRadialGradient(S*.5-R*.3,S*.5-R*.35,R*.12,S*.5,S*.5+R*.08,R*1.12);for(let i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]);x.fillStyle=g;x.beginPath();x.arc(S*.5,S*.5,R,0,7);x.fill();}
function orbShade(x,S,R){x.save();x.beginPath();x.arc(S*.5,S*.5,R,0,7);x.clip();const b=x.createLinearGradient(0,S*.5,0,S*.5+R);b.addColorStop(0,'rgba(0,0,0,0)');b.addColorStop(1,'rgba(0,0,0,.4)');x.fillStyle=b;x.fillRect(S*.5-R,S*.5,R*2,R);const hx=S*.5-R*.38,hy=S*.5-R*.48;const s=x.createRadialGradient(hx,hy,0,hx,hy,R*.55);s.addColorStop(0,'rgba(255,255,255,.9)');s.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=s;x.beginPath();x.ellipse(hx,hy,R*.36,R*.22,-0.6,0,7);x.fill();x.restore();}
function makeOrb(stops){const S=128,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');orbBase(x,S,S*.49,stops);orbShade(x,S,S*.49);return c;}
function makeGlow(stops,glow){const S=128,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');const R=S*.34;const g=x.createRadialGradient(S*.5,S*.5,R*.4,S*.5,S*.5,S*.5);g.addColorStop(0,glow);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,S,S);x.strokeStyle=glow;x.lineWidth=S*.035;x.beginPath();x.arc(S*.5,S*.5,R*1.14,0,7);x.stroke();orbBase(x,S,R,stops);orbShade(x,S,R);return c;}
function buildSprites(){
  sprHead=makeOrb([[0,'#d1fae5'],[.45,'#4ade80'],[1,'#15803d']]);
  sprBody=makeOrb([[0,'#bbf7d0'],[.45,'#22c55e'],[1,'#166534']]);
  const S=128;
  sprFood=document.createElement('canvas');sprFood.width=S;sprFood.height=S;
  const fx=sprFood.getContext('2d');
  const sh=fx.createRadialGradient(S*.5,S*.94,1,S*.5,S*.94,S*.34);
  sh.addColorStop(0,'rgba(0,0,0,.42)');sh.addColorStop(1,'rgba(0,0,0,0)');
  fx.fillStyle=sh;fx.save();fx.translate(S*.5,S*.94);fx.scale(1,.35);fx.beginPath();fx.arc(0,0,S*.34,0,7);fx.fill();fx.restore();
  orbBase(fx,S,S*.4,[[0,'#ffffff'],[.4,'#a78bfa'],[1,'#7c3aed']]);
  orbShade(fx,S,S*.4);
  sprGold=makeGlow([[0,'#fef3c7'],[.4,'#facc15'],[1,'#d97706']],'rgba(250,204,21,.55)');
  sprChest=makeGlow([[0,'#ffedd5'],[.4,'#fb923c'],[1,'#9a3412']],'rgba(251,146,60,.5)');
  const sc=sprChest.getContext('2d');sc.font='44px system-ui';sc.textAlign='center';sc.textBaseline='middle';sc.fillText('💰',64,66);
}
function rrPath(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function buildBoard(){
  if(W<=0)return;
  boardSprite=document.createElement('canvas');
  boardSprite.width=Math.max(1,Math.ceil(W*DPR));boardSprite.height=Math.max(1,Math.ceil(H*DPR));
  const x=boardSprite.getContext('2d');x.scale(DPR,DPR);
  const bx=ox-10,by=oy-10,bw=COLS*cell+20,bh=ROWS*cell+20;
  x.save();
  x.shadowColor='rgba(74,222,128,.55)';x.shadowBlur=26;
  x.fillStyle='rgba(8,20,14,.6)';
  rrPath(x,bx,by,bw,bh,18);x.fill();x.fill();
  x.restore();
  x.strokeStyle='rgba(74,222,128,.4)';x.lineWidth=1.5;rrPath(x,bx,by,bw,bh,18);x.stroke();
  const pad=Math.max(1.5,cell*.07),cr=Math.max(3,cell*.18);
  for(let gx=0;gx<COLS;gx++)for(let gy=0;gy<ROWS;gy++){
    const even=(gx+gy)%2===0,px=ox+gx*cell+pad,py=oy+gy*cell+pad,cs=cell-pad*2;
    if(cs<=2)continue;
    const g=x.createLinearGradient(0,py,0,py+cs);
    if(even){g.addColorStop(0,'rgba(163,230,120,.10)');g.addColorStop(1,'rgba(20,83,45,.16)');}
    else{g.addColorStop(0,'rgba(120,200,110,.05)');g.addColorStop(1,'rgba(6,40,22,.22)');}
    x.fillStyle=g;rrPath(x,px,py,cs,cs,cr);x.fill();
    x.fillStyle='rgba(255,255,255,.05)';rrPath(x,px,py,cs,Math.max(2,cs*.14),cr);x.fill();
  }
}
function buildBG(){
  if(W<=0)return;
  bgSprite=document.createElement('canvas');
  bgSprite.width=Math.max(1,Math.ceil(W*DPR));bgSprite.height=Math.max(1,Math.ceil(H*DPR));
  const x=bgSprite.getContext('2d');x.scale(DPR,DPR);
  x.fillStyle='#030806';x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(W*.5,H*-.12,0,W*.5,H*-.12,Math.max(W,H)*.85);
  g.addColorStop(0,'rgba(21,128,61,.42)');g.addColorStop(.5,'rgba(20,83,45,.18)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*.5,H*.62,0,W*.5,H*.62,Math.max(W,H)*.9);
  g.addColorStop(0,'rgba(6,78,40,.25)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createLinearGradient(0,H*.55,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  vigSprite=document.createElement('canvas');
  vigSprite.width=bgSprite.width;vigSprite.height=bgSprite.height;
  const v=vigSprite.getContext('2d');v.scale(DPR,DPR);
  const vg=v.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.45,W*.5,H*.5,Math.hypot(W,H)*.62);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.42)');
  v.fillStyle=vg;v.fillRect(0,0,W,H);
}
function buildDots(){
  if(W<=0)return;
  dotsSprite=document.createElement('canvas');
  dotsSprite.width=Math.max(1,Math.ceil(W*DPR));dotsSprite.height=Math.max(1,Math.ceil(H*DPR));
  const x=dotsSprite.getContext('2d');x.scale(DPR,DPR);
  for(let i=0;i<30;i++){
    const dx=Math.random()*W,dy=Math.random()*H,r=1.2+Math.random()*3.8,warm=Math.random()<.45;
    const g=x.createRadialGradient(dx,dy,0,dx,dy,r*3.2);
    g.addColorStop(0,warm?'rgba(253,230,138,.5)':'rgba(187,247,208,.42)');
    g.addColorStop(.4,warm?'rgba(253,230,138,.18)':'rgba(187,247,208,.14)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.beginPath();x.arc(dx,dy,r*3.2,0,7);x.fill();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(bgSprite)ctx.drawImage(bgSprite,0,0,W,H);
  if(vigSprite)ctx.drawImage(vigSprite,0,0,W,H);
  if(dotsSprite&&W>0){const off=(elapsed*7)%W;ctx.drawImage(dotsSprite,off,0,W,H);ctx.drawImage(dotsSprite,off-W,0,W,H);}
  if(boardSprite)ctx.drawImage(boardSprite,0,0,W,H);
  for(const f of foods){
    const cx=ox+f.x*cell+cell/2,cy=oy+f.y*cell+cell/2,r=cell*0.42*(1+0.06*Math.sin(elapsed*4+f.x+f.y)),k=r/0.8;
    ctx.drawImage(sprFood,cx-k,cy-k,k*2,k*2);
    ctx.fillStyle='#0f172a';ctx.font='900 '+Math.round(r*1.1)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.value,cx,cy+1);
  }
  for(const g of goldens){
    const cx=ox+g.x*cell+cell/2,cy=oy+g.y*cell+cell/2,r=cell*0.42,k=r/0.68;
    ctx.drawImage(sprGold,cx-k,cy-k,k*2,k*2);
    ctx.fillStyle='#0f172a';ctx.font='900 '+Math.round(r*1.1)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('★',cx,cy+1);
  }
  if(chest&&sprChest){
    const cx=ox+chest.x*cell+cell/2,cy=oy+chest.y*cell+cell/2,r=cell*0.5,k=r/0.68;
    ctx.drawImage(sprChest,cx-k,cy-k,k*2,k*2);
  }
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],cx=ox+s.x*cell+cell/2,cy=oy+s.y*cell+cell/2;
    if(i===0){
      const r=cell*0.45*1.08;
      ctx.drawImage(sprHead,cx-r,cy-r,r*2,r*2);
      const er=Math.max(1.5,r*.14),ex=cx+dir.x*r*.34,ey=cy+dir.y*r*.34,px=-dir.y*r*.32,py=dir.x*r*.32;
      ctx.fillStyle='#052e16';
      ctx.beginPath();ctx.arc(ex+px,ey+py,er,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(ex-px,ey-py,er,0,7);ctx.fill();
    }else{
      const r=cell*0.45;
      ctx.drawImage(sprBody,cx-r,cy-r,r*2,r*2);
    }
  }
}
function updateHUD(){scoreEl.textContent=score;lenEl.textContent=snake.length;livesEl.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));streakEl.textContent='×'+Math.max(1,Math.min(streak,5));}
function updateFrenzyUI(){frenzyEl.textContent=frenzyT>0?'⚡ '+Math.ceil(frenzyT)+'s':frenzy+'/4';}
const msgEl=document.getElementById('msg');let msgT=0;
const CHEER=['Nice! 🎯','Great job! 🌟','Awesome! 🚀','Super! ⚡','Amazing! 🎉','Keep going! 🔥'];
const TRY=['Almost! 💪','Try again! 🙌','You can do it! 🌈','So close! ✨'];
function say(txt,color){msgEl.textContent=txt;msgEl.style.color=color||'#4ade80';msgEl.classList.remove('show');void msgEl.offsetWidth;msgEl.classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>msgEl.classList.remove('show'),1200);}
function popup(txt,x,y,color){
  let p=popupPool.pop();
  if(!p){p=document.createElement('div');p.className='popup';}
  p.textContent=txt;
  p.style.left=(x-20)+'px';p.style.top=(y-10)+'px';p.style.color=color;
  if(!p.parentNode)document.body.appendChild(p);
  p.style.animation='none';void p.offsetWidth;p.style.animation='';
  setTimeout(()=>{if(p.parentNode)p.parentNode.removeChild(p);popupPool.push(p);},700);
}
function trophyOf(n){let r='';for(const t of TROPHIES)if(n>=t[1])r=t[0];return r;}
function eatBump(){
  foodsEaten++;saveLS('mathSnakeEaten',foodsEaten);
  const rk=trophyOf(foodsEaten);
  if(rk&&rk!==trophyName){
    trophyName=rk;
    popup(rk+'!',ox+snake[0].x*cell+canvasRect.left-40,oy+snake[0].y*cell+canvasRect.top-46,'#fde047');
    sfx('levelup');
  }
}
function loseLife(){
  lives--;streak=0;updateHUD();sfx('buzz');frenzy=0;frenzyT=0;updateFrenzyUI();
  flashColor('#ef4444',.45);shakeCanvas();
  if(lives<=0){gameOver();return;}
  say(TRY[rnd(0,TRY.length-1)],'#fca5a5');
  resetSnake();
  updateHUD();
}
function resetSnake(){
  const cy=Math.floor(ROWS/2);
  snake=[{x:3,y:cy},{x:2,y:cy},{x:1,y:cy}];
  dir={x:1,y:0};nextDir={x:1,y:0};
}
function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  const bodyCheck=snake.length>1?snake.slice(0,-1):snake;
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||bodyCheck.some(s=>s.x===head.x&&s.y===head.y)){loseLife();return;}
  snake.unshift(head);
  const gi=goldens.findIndex(g=>g.x===head.x&&g.y===head.y);
  if(gi>=0){
    goldPool.push(goldens.splice(gi,1)[0]);
    bonus+=25;
    sfx('coin');
    popup('+25 ⭐',ox+head.x*cell+canvasRect.left,oy+head.y*cell+canvasRect.top,'#facc15');
    bonusEl.textContent=bonus;
  }
  if(chest&&chest.x===head.x&&chest.y===head.y){
    const roll=Math.random(),cy0=oy+head.y*cell+canvasRect.top,cx0=ox+head.x*cell+canvasRect.left;
    if(roll<0.4){bonus+=25;bonusEl.textContent=bonus;popup('+25 ⭐',cx0,cy0,'#facc15');sfx('coin');}
    else if(roll<0.7){if(lives<3){lives++;updateHUD();popup('+1 ❤',cx0,cy0,'#fb7185');}else{bonus+=15;bonusEl.textContent=bonus;popup('+15 ⭐',cx0,cy0,'#facc15');}sfx('coin');}
    else{frenzyT=Math.max(frenzyT,8);updateFrenzyUI();popup('⚡ FRENZY 8s',cx0,cy0,'#38bdf8');sfx('levelup');}
    chest=null;chestCd=22+rnd(0,12);
  }
  const fi=foods.findIndex(f=>f.x===head.x&&f.y===head.y);
  if(fi>=0){
    const f=foods[fi];
    if(f.value===currentAns){
        streak++;
        const pts=10*Math.min(streak,5);
        score+=pts;sfx('coin');
        gainXP(TIER_XP[difficulty]);
        if(streak===10){popup('🔥 UNSTOPPABLE! ×10',ox+head.x*cell+canvasRect.left,oy+head.y*cell+canvasRect.top-40,'#fb923c');sfx('levelup');}
        if(streak===20){popup('⚡ GODLIKE! ×20',ox+head.x*cell+canvasRect.left,oy+head.y*cell+canvasRect.top-40,'#f87171');sfx('levelup');}
        flashColor('#4ade80',.13);jpop(scoreEl.parentElement);pulseProblem(true);
        popup('+'+pts,ox+head.x*cell+canvasRect.left,oy+head.y*cell+canvasRect.top,'#4ade80');
        if(streak%3===0)say(CHEER[rnd(0,CHEER.length-1)]);
        if(streak%5===0&&lives<3){lives++;say('❤️ +1 Life!','#fb7185');}
        updateHUD();
        if(frenzyT>0){bonus+=10;bonusEl.textContent=bonus;popup('+10 ⚡',ox+head.x*cell+canvasRect.left,oy+head.y*cell+canvasRect.top-40,'#38bdf8');}
        else{frenzy++;if(frenzy>=4){frenzyT=10;frenzy=0;say('⚡ FRENZY!','#38bdf8');sfx('levelup');}}
        updateFrenzyUI();
        eatBump();
        placeFoods();
    }else{
      foods.splice(fi,1);
      const c=emptyCell();foods.push(getFood(c.x,c.y,f.value,false));
      foodPool.push(f);
      pulseProblem(false);
      loseLife();
    }
  }else{
    snake.pop();
  }
}
function gameOver(){
  state='over';sfx('lose');
  if(score>best){best=score;saveLS('mathSnakeBest',best);}
  document.getElementById('finCheer').textContent=TRY[rnd(0,TRY.length-1)];
  document.getElementById('finScore').textContent=score;
  document.getElementById('finBest').textContent=best;
  document.getElementById('finBonus').textContent=bonus;
  trophyName=trophyOf(foodsEaten);
  document.getElementById('finTrophy').textContent=trophyName||'🎖 Rookie';
  document.getElementById('finEaten').textContent=foodsEaten;
  setTimeout(()=>document.getElementById('over').classList.remove('hidden'),500);
}
function loadProg(){try{const d=JSON.parse(localStorage.getItem(PROGKEY));if(d&&typeof d==='object'){PROG.level=Math.max(1,Math.floor(+d.level)||1);PROG.xp=Math.max(0,Math.floor(+d.xp)||0);}}catch(e){}}
function saveProg(){saveLS(PROGKEY,JSON.stringify(PROG));}
function nextUnlockTxt(){for(const t of TIERS){if(UNLOCK[t[0]]>PROG.level)return 'Next unlock: '+t[1]+' at Lv '+UNLOCK[t[0]];}return 'All tiers unlocked!';}
function renderProg(){document.getElementById('progLv').textContent='Lv '+PROG.level;document.getElementById('progTitle').textContent=titleFor(PROG.level);document.getElementById('xpfill').style.width=Math.min(100,PROG.xp/xpNeed(PROG.level)*100)+'%';document.getElementById('progNext').textContent=nextUnlockTxt();}
function refreshDiffLocks(){[...diffBox.children].forEach((b,i)=>{b.textContent=(progLv()<UNLOCK[TIERS[i][0]]?'🔒 ':'')+TIERS[i][1];});}
function gainXP(n){PROG.xp+=n;while(PROG.xp>=xpNeed(PROG.level)){PROG.xp-=xpNeed(PROG.level);PROG.level++;popup('LEVEL UP! Lv '+PROG.level,ox+COLS*cell/2+canvasRect.left,oy+ROWS*cell/2+canvasRect.top,'#a78bfa');sfx('levelup');}saveProg();renderProg();refreshDiffLocks();}
function enterPause(){state='pause';document.getElementById('pause').classList.remove('hidden');}
function curTick(){
  const base=DIFF[difficulty].tick;
  const cut=Math.min(base*0.4,Math.floor(score/150)*7);
  return Math.round(Math.max(base*0.6,base-cut));
}
function loop(ts){
  requestAnimationFrame(loop);
  if(prevTs>0)elapsed+=Math.min(0.1,(ts-prevTs)/1000);
  prevTs=ts;
  if(state==='play'){
    const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
    acc+=dt*1000;
    let step=curTick();
    while(state==='play'&&acc>=step){acc-=step;tick();step=curTick();}
    if(goldCd>0&&state==='play')goldCd-=dt;
    if(state==='play'&&goldCd<=0&&goldens.length===0){
      const gc=emptyCell();
      goldens.push(getGold(gc.x,gc.y));
      goldCd=12+rnd(0,8);
    }
    if(chestCd>0&&state==='play')chestCd-=dt;
    if(state==='play'&&chestCd<=0&&!chest){
      const c0=emptyCell();
      chest={x:c0.x,y:c0.y};
      chestCd=9999;
    }
    for(const f of foods){if(!f.correct&&f.ttl>0){f.ttl-=dt;if(f.ttl<=0){const c=emptyCell();f.x=c.x;f.y=c.y;f.ttl=DIFF[difficulty].foodTtl;}}}
    if(frenzyT>0){frenzyT-=dt;if(frenzyT<=0){frenzyT=0;say('⚡ Frenzy over','#94a3b8');}updateFrenzyUI();}
  }
  draw();
}
function startGame(){
  if(state==='countdown')return;
  bonus=0;goldCd=8;goldens.length=0;goldPool.length=0;bonusEl.textContent=0;frenzy=0;frenzyT=0;updateFrenzyUI();
  chest=null;chestCd=15;
  score=0;lives=3;streak=0;acc=0;lastTs=0;resetSnake();placeFoods();updateHUD();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  state='countdown';showCount(3);
}
function showCount(n){
  if(document.hidden){setTimeout(()=>showCount(n),300);return;}
  const c=document.getElementById('count');
  if(n>0){c.textContent=n;c.classList.remove('show');void c.offsetWidth;c.classList.add('show');sfx('tick');setTimeout(()=>showCount(n-1),620);}
  else{c.textContent='GO!';c.classList.remove('show');void c.offsetWidth;c.classList.add('show');sfx('coin');setTimeout(()=>{c.classList.remove('show');state='play';lastTs=performance.now();},560);}
}
function steer(nx,ny){
  if(state!=='play')return;
  if(nx===-dir.x&&ny===-dir.y)return;
  if(nx===dir.x&&ny===dir.y)return;
  nextDir={x:nx,y:ny};
  sfx('tap');
}
let sx=0,sy=0;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;initAudio();});
canvas.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>Math.abs(dy))steer(dx>0?1:-1,0);else if(Math.abs(dy)>10)steer(0,dy>0?1:-1);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch')return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>24||Math.abs(dy)>24){if(Math.abs(dx)>Math.abs(dy))steer(dx>0?1:-1,0);else steer(0,dy>0?1:-1);sx=e.clientX;sy=e.clientY;}
});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W')steer(0,-1);
  else if(k==='ArrowDown'||k==='s'||k==='S')steer(0,1);
  else if(k==='ArrowLeft'||k==='a'||k==='A')steer(-1,0);
  else if(k==='ArrowRight'||k==='d'||k==='D')steer(1,0);
  else return;
  if(k.indexOf('Arrow')===0)e.preventDefault();
});
document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;saveLS('mathSnakeMuted',muted?'1':'0');document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';});
const DPADMAP={up:[0,-1],left:[-1,0],down:[0,1],right:[1,0]};
document.querySelectorAll('#dpad button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();const v=DPADMAP[b.dataset.dir];if(v)steer(v[0],v[1]);});});
document.getElementById('playBtn').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();startGame();});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});
const opsBox=document.getElementById('ops');
['+','-','×','÷'].forEach(o=>{const b=document.createElement('button');b.className='op on';b.textContent=o;b.addEventListener('pointerdown',e=>{e.stopPropagation();selected[o]=!selected[o];b.classList.toggle('on',selected[o]);if(!Object.keys(selected).some(k=>selected[k])){selected[o]=true;b.classList.add('on');}});opsBox.appendChild(b);});
const diffBox=document.getElementById('diff');
TIERS.forEach(d=>{const b=document.createElement('button');b.textContent=d[1];if(d[0]===difficulty)b.classList.add('on');b.addEventListener('pointerdown',e=>{e.stopPropagation();if(progLv()<UNLOCK[d[0]])return;difficulty=d[0];[...diffBox.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');});diffBox.appendChild(b);});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){enterPause();}});
document.getElementById('pauseBtn').addEventListener('pointerdown',e=>{e.stopPropagation();if(state==='play')enterPause();});
document.getElementById('resumeBtn').addEventListener('pointerdown',e=>{e.stopPropagation();document.getElementById('pause').classList.add('hidden');state='play';lastTs=performance.now();});
loadProg();renderProg();refreshDiffLocks();
buildSprites();resize();resetSnake();placeFoods();updateHUD();requestAnimationFrame(loop);
</script>
</body>
</html>
