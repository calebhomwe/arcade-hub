<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0c">
<title>Memory Match</title>
<link rel="stylesheet" href="kit/kidskit.css">
<style>
body.kk{background:#2b1a0c}
/* ---------- a games table in warm lamplight: real oak, a felt mat in a wooden frame, cards with a lattice back ---------- */
#table{position:fixed;inset:0;background:radial-gradient(ellipse 90% 60% at 72% 8%,rgba(255,214,140,.7) 0,rgba(255,190,100,.18) 45%,transparent 70%),linear-gradient(180deg,rgba(50,24,6,.15),rgba(24,10,2,.6)),url(assets/kids/tex/wood.jpg) center/420px}

#mat{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:none;border-radius:26px;border:12px solid transparent;
  background:radial-gradient(ellipse at 70% 15%,rgba(255,240,180,.4),transparent 60%) padding-box,url(assets/kids/tex/cloth.jpg) center/180px padding-box,linear-gradient(180deg,var(--felt1,#2f7d4a),var(--felt2,#1c5a34)) padding-box,linear-gradient(180deg,rgba(255,220,150,.2),rgba(0,0,0,.3)) border-box,url(assets/kids/tex/wood-dark.jpg) center/300px border-box;
  background-blend-mode:normal,overlay,normal,normal,normal;
  box-shadow:0 0 0 2px #2a1707,0 26px 40px rgba(0,0,0,.6),inset 0 0 44px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.4)}
#mat.on{display:block}
#cards{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gap,8px);padding:var(--pad,10px)}
.card{position:relative;width:var(--cw,70px);height:calc(var(--cw,70px)*1.2);perspective:700px;cursor:pointer;touch-action:manipulation;outline:none;animation:deal .5s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes deal{from{opacity:0;transform:translateY(-40px) scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--cw,70px)*.13);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}

.face.back::before{content:'';position:absolute;inset:calc(var(--cw,70px)*.07);border-radius:calc(var(--cw,70px)*.08);border:2px solid rgba(240,196,90,.85);box-shadow:inset 0 0 6px rgba(0,0,0,.4)}
.face.back img{width:52%;height:auto;opacity:.92;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)) sepia(.25) saturate(1.2) brightness(1.05)}
.face.front{transform:rotateY(180deg);background:linear-gradient(180deg,rgba(255,250,232,.88),rgba(246,226,176,.8)),url(assets/kids/tex/paper.jpg) center/160px;box-shadow:-5px 9px 12px rgba(0,0,0,.5),inset 0 0 0 2px rgba(217,164,65,.9),inset 0 4px 10px rgba(140,90,20,.22)}
.face.front img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 5px 3px rgba(60,30,0,.4))}
.card.done .face.front{box-shadow:-3px 6px 10px rgba(0,0,0,.4),inset 0 0 0 3px #ffd23f,0 0 16px 3px rgba(255,210,60,.75),inset 0 0 14px rgba(255,220,120,.6)}
.card.done .inner{animation:happy .55s ease}
@keyframes happy{0%{transform:rotateY(180deg) scale(1)}35%{transform:rotateY(180deg) scale(1.16) rotate(-3deg)}65%{transform:rotateY(180deg) scale(1.04) rotate(2deg)}100%{transform:rotateY(180deg) scale(1)}}
.card.shake .inner{animation:wrong .4s ease}
@keyframes wrong{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) translateX(-6px)}40%{transform:rotateY(180deg) translateX(6px)}60%{transform:rotateY(180deg) translateX(-4px)}80%{transform:rotateY(180deg) translateX(3px)}}
.card.hint .face.back{box-shadow:-5px 9px 12px rgba(0,0,0,.5),0 0 0 3px #fff2a8,0 0 22px 6px rgba(255,230,120,.85)}
.card.hint{animation:pulse .7s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.08)}}
.card:focus-visible .face.back{box-shadow:-5px 9px 12px rgba(0,0,0,.5),0 0 0 3px #fff}
/* ---------- HUD ---------- */
#hud{position:fixed;left:var(--kk-l);right:var(--kk-r);top:calc(var(--kk-top) + 56px);z-index:25;display:none;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
#hud.on{display:flex}
#hud>*{pointer-events:auto}
#stc{padding:0 10px}
#stc .kk-stars img{width:26px;height:26px}
#stc .kk-stars{gap:0}
#hint,#peek{appearance:none;border:2px solid var(--kk-goldline);cursor:pointer;height:48px;min-width:48px;padding:0 12px;border-radius:24px;display:inline-flex;align-items:center;gap:6px;font-family:var(--kk-font);font-weight:700;font-size:20px;color:var(--kk-cream);
  background:radial-gradient(circle at 32% 24%,#3d6a8d 0,#1a3d59 46%,#0c1e30 100%);box-shadow:0 4px 0 #6b430c,0 8px 12px rgba(20,8,0,.45),inset 0 2px 0 rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.6)}
#hint img,#peek img{width:30px;height:30px}
#peek:disabled{opacity:.5}
#hint:active,#peek:active{transform:translateY(3px);box-shadow:0 1px 0 #6b430c}
#prev{position:fixed;left:0;right:0;top:calc(var(--kk-top) + 110px);z-index:26;text-align:center;pointer-events:none;display:none}
#prev.on{display:block}
#prev span{display:inline-flex;align-items:center;gap:8px;padding:6px 20px;border-radius:20px;background:rgba(10,26,42,.9);border:1.5px solid rgba(233,181,68,.85);color:var(--kk-cream);font-weight:700;font-size:22px;box-shadow:0 6px 12px rgba(0,0,0,.4)}
#prev img{width:32px;height:32px}
#prev i{display:block;height:6px;margin:6px auto 0;border-radius:3px;background:linear-gradient(90deg,#ffeaa6,#e9b544);width:100%;transform-origin:0 50%}
#codes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kk-bot) + 4px);z-index:30;background:#ffd23f;color:#6b3b00;font-weight:700;font-size:14px;padding:3px 12px;border-radius:12px;letter-spacing:1px;display:none}
#titleHero{position:relative;width:min(84vw,320px);height:220px;margin:8px 0 4px}
#titleHero .card{position:absolute;width:104px;height:125px;left:50%;top:50%;margin:-62px 0 0 -52px;animation:none;perspective:none}
#titleHero .card .inner{transition:none}
#titleHero .c0{transform:translate(-92px,16px) rotate(-14deg)}#titleHero .c1{transform:translate(0,-8px) rotate(2deg);z-index:2}#titleHero .c2{transform:translate(92px,16px) rotate(15deg)}
#titleHero .card.up .inner{transform:rotateY(180deg)}
#titleHero .card .inner{animation:none}
#titleHero .bob{animation:kkBob 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.card,.card.done .inner,.card.shake .inner,.card.hint,#titleHero .bob{animation:none}.card .inner{transition-duration:.01s}}
</style>
</head>

<script src="kit/kidskit.js"></script>
<script>

var NLEV = 15;

/* ======================= state ======================= */

function gs(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }

var hintBtn = $('hint'), peekBtn = $('peek');
hintBtn.appendChild(img('magnifying-glass-tilted-left')); peekBtn.appendChild(img('eye')); peekBtn.appendChild(h('b', { text: '0', id: 'pk' }));

/* ======================= screens ======================= */
function clearUI() { document.querySelectorAll('.kk-title,.kk-map,.kk-album,.kk-scrim,.kk-coach,.kk-finger').forEach(function (e) { e.remove(); }); }
function heroEl() {
  var wrap = h('div', { id: 'titleHero' }), b = backOf(), pics = ['cow-face', 'rocket', 'cupcake'];
  pics.forEach(function (p, i) {
    var c = h('div', { class: 'card c' + i + (i === 1 ? ' up bob' : ''), style: { '--k1': b.k[0], '--k2': b.k[1] } });
    c.innerHTML = '<div class="inner"><div class="face back"><img src="' + IMG(b.img) + '" alt=""></div><div class="face front"><img src="' + IMG(p) + '" alt=""></div></div>';

}
function foundCount() { return Object.keys(P.d.found).length; }
function showTitle() {
  clearUI(); phase = 'title'; $('mat').classList.remove('on'); $('hud').classList.remove('on'); $('prev').classList.remove('on'); $('codes').style.display = 'none';
  var nxt = P.next(NLEV), fresh = P.cleared() === 0, w = WORLDS[LV[nxt - 1].world];
  setFelt(w);
  KKs.ui.title(document.body, {
    title: 'Memory Match', tagline: fresh ? 'Find the twins!' : w.name + ' - level ' + nxt, heroEl: heroEl(), profile: P,
    playLabel: fresh ? 'Play' : 'Level ' + nxt, onPlay: function () { startLevel(nxt); },

}
function setFelt(w) { var m = $('mat'); m.style.setProperty('--felt1', w.felt[0]); m.style.setProperty('--felt2', w.felt[1]); }

  var t = document.querySelector('.kk-title'); if (t) t.remove();
}
function showHelp() { KKs.ui.help({ steps: [{ pic: 'cow-face', text: 'Tap a card to flip it.' }, { pic: 'rabbit-face', text: 'Find its twin!' }, { pic: 'star', text: 'Fewer tries, more stars.' }] }); }
function setBack() { var b = backOf(), c = $('cards'); c.style.setProperty('--k1', b.k[0]); c.style.setProperty('--k2', b.k[1]); c.querySelectorAll('.face.back img').forEach(function (i) { i.src = IMG(b.img); }); }

/* ======================= playing ======================= */
function fit(n) {

function layout() {

}
function showPreview(ms) {

  setTimeout(function () {

    cards.forEach(function (c, i) { setTimeout(function () { up(c, false); }, i * 30); }); KKs.sfx('whoosh');

  }, cfg.preview + cards.length * 35);
}
function beginPlay() { if (phase !== 'preview') return; phase = 'play'; idleT = 0; if (cur === 1 && !P.flag('tutMem')) startTutorial(); }
function up(c, on) { c.up = on; c.el.classList.toggle('up', on); c.el.setAttribute('aria-label', on ? c.name + ', face up' : 'Card ' + (+c.el.dataset.i + 1) + ', face down'); }

  idleT = 0; clearGlow(); up(c, true); KKs.sfx('flip'); KKs.haptic(8); seen[cards.indexOf(c)] = c.id; open.push(c); tutStep('flip', open.length);

function centre(c) { var r = c.el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

  var pa = centre(a), pb = centre(b); KKs.sfx('match'); KKs.sfx('ding', Math.min(streak, 8)); KKs.haptic(20);
  KKs.fx.burst(pa.x, pa.y, 'star', 8); KKs.fx.burst(pb.x, pb.y, 'star', 8); KKs.float((pa.x + pb.x) / 2, (pa.y + pb.y) / 2 - 10, streak >= 2 ? 'x' + streak : 'Yes!', '#a86f16');
  if (!cheated && !P.d.found[a.id]) { P.d.found[a.id] = 1; P.save(); newFound.push(a); setTimeout(function () { KKs.ui.toast('New friend: ' + a.name + '!', a.id); KKs.say(a.name); }, 500); }
  else if (matched < cfg.pairs) KKs.say(a.name);
  if (streak > 0 && streak % 3 === 0) { peeks = Math.min(3, peeks + 1); $('pk').textContent = peeks; peekBtn.disabled = false; KKs.ui.toast('You earned a peek!', 'eye'); }
  tutStep('pair', true);
  if (matched === cfg.pairs) setTimeout(win, 750);
}
function onMiss(a, b) {
  lock = true; streak = 0; misses++; KKs.sfx('bloop'); tutStep('pair', false);
  setTimeout(function () { a.el.classList.add('shake'); b.el.classList.add('shake'); }, 420);
  setTimeout(function () { a.el.classList.remove('shake'); b.el.classList.remove('shake'); up(a, false); up(b, false); lock = false; KKs.sfx('flip'); }, cheats.slow ? 3000 : 1050);
}
function win() {
  phase = 'over'; var stars = starsFor(moves), clean = !cheated, score = Math.max(0, cfg.pairs * 100 - moves * 10) + (misses === 0 ? 100 : 0);
  var res = { unlocked: [], first: false, newBest: false, gained: 0 }, daily = null;
  if (clean) {
    res = P.finish(cur, stars, score); if (misses === 0) P.stat('flawless', 1); daily = P.dailyWin();
    try { localStorage.setItem('memBest', String(P.d.hi || score)); localStorage.setItem('memStars', String(P.total())); } catch (e) {}
    try {
      if (SDK && SDK.profile) {
        SDK.profile.award({ xp: 5 + stars * 3, reason: 'Level ' + cur }); SDK.profile.achievement('first-pair', { title: 'Twin finder', desc: 'Match a pair', tier: 'bronze' });
        if (misses === 0) SDK.profile.achievement('flawless', { title: 'No mistakes', desc: 'Finish a level without a miss', tier: 'silver' });
        if (foundCount() >= 30) SDK.profile.achievement('collector', { title: 'Collector', desc: 'Find 30 friends', tier: 'gold' });
        SDK.profile.quest('mem-album', Math.min(1, foundCount() / 60), { title: 'Find all 60 friends' });
      }
    } catch (e) {}
  }
  gs('over', { score: score, level: cur, stars: stars, lower: false });
  KKs.sfx('win'); KKs.confetti(); cards.forEach(function (c, i) { setTimeout(function () { c.el.classList.remove('done'); void c.el.offsetWidth; c.el.classList.add('done'); }, i * 55); });
  setTimeout(function () { showResult(stars, res, daily); }, 1000);
}
function showResult(stars, res, daily) {
  var lines = ['Tries: ' + moves + (misses === 0 ? '   Perfect!' : '')];
  if (newFound.length) lines.push(newFound.length + ' new friend' + (newFound.length > 1 ? 's' : '') + ' in your album!');
  if (cheated) lines.push('Codes are on, so this level does not count.');
  if (daily && daily.just) lines.push('Daily goal done! +3 stars');
  if (cur === NLEV) lines.push('You finished every level!');
  var more = cur < NLEV, btn = [];
  if (more) btn.push({ label: 'Next level', cls: 'kk-go kk-big', pic: 'star', fn: function () { startLevel(cur + 1, { quick: true }); } });
  btn.push({ label: 'Play again', cls: more ? 'kk-blue' : 'kk-go kk-big', fn: function () { startLevel(cur); } });
  btn.push({ label: 'Levels', cls: 'kk-purple', fn: showMap });
  KKs.ui.result({ title: stars === 3 ? 'Perfect memory!' : stars === 2 ? 'Well done!' : 'You did it!', stars: stars, lines: lines, newItems: res.unlocked, buttons: btn });
  KKs.sfx('star');
}

/* ---------- hint (only uses what you have already seen), peek, idle help ---------- */
function clearGlow() { cards.forEach(function (c) { c.el.classList.remove('hint'); }); }
function glow(list) { clearGlow(); list.forEach(function (c) { c.el.classList.add('hint'); }); setTimeout(clearGlow, 2400); }
function hint() {
  if (phase !== 'play') return phase === 'title' ? 'Press Play, then tap a card.' : 'Wait for the cards to hide.';
  var live = cards.filter(function (c) { return !c.done; }), down = live.filter(function (c) { return !c.up; });
  if (open.length === 1) { var o = open[0], twin = down.filter(function (c) { return seen[cards.indexOf(c)] === o.id; })[0]; if (twin) { glow([twin]); return 'You have seen the twin of ' + o.name + '. It is glowing.'; } }
  var by = {}; down.forEach(function (c) { var k = seen[cards.indexOf(c)]; if (k) (by[k] = by[k] || []).push(c); });
  for (var k in by) if (by[k].length >= 2) { glow(by[k].slice(0, 2)); return 'You have seen both ' + by[k][0].name + ' cards. They are glowing.'; }
  var fresh = down.filter(function (c) { return !seen[cards.indexOf(c)]; })[0]; if (fresh) { glow([fresh]); return 'Try this card. It is new.'; }
  return 'Tap a card to start.';
}
function doHint() { if (phase !== 'play' || lock) return; hintUsed++; var t = hint(); KKs.sfx('good'); KKs.ui.toast(t, 'magnifying-glass-tilted-left'); }
function doPeek() {
  if (phase !== 'play' || lock || peeks <= 0) return; peeks--; $('pk').textContent = peeks; peekBtn.disabled = peeks <= 0; lock = true; KKs.sfx('whoosh');
  var was = cards.filter(function (c) { return !c.up && !c.done; }); was.forEach(function (c, i) { setTimeout(function () { up(c, true); seen[cards.indexOf(c)] = c.id; }, i * 25); });
  setTimeout(function () { was.forEach(function (c) { if (!c.done) up(c, false); }); lock = false; open = open.filter(function (c) { return c.up; }); }, 1500 + was.length * 25);
}
KKs.press(hintBtn, doHint); KKs.press(peekBtn, doPeek);
setInterval(function () { if (phase === 'play' && !lock && !(SDK && SDK.paused)) { idleT += 1; if (idleT === 12) { hint(); } } }, 1000);
$('cards').addEventListener('pointerdown', function (e) { var el = e.target.closest('.card'); if (!el) return; var c = cards[+el.dataset.i]; if (c) flip(c); }, { passive: true });
$('cards').addEventListener('keydown', function (e) {
  var el = e.target.closest('.card'); if (!el) return; var i = +el.dataset.i, c = cards[i];
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (c) flip(c); return; }
  var cols = Math.max(1, Math.round(($('cards').clientWidth - 20) / ($('cards').querySelector('.card').offsetWidth + 8))), mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
  if (mv !== undefined) { e.preventDefault(); var n = cards[i + mv]; if (n) n.el.focus(); }
});
document.addEventListener('keydown', function (e) { if (phase === 'title' && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) { e.preventDefault(); $('playBtn') && $('playBtn').click(); } });

/* ---------- first-time coach: teach by doing ---------- */
function startTutorial() {
  var tp = { skip: function () { endTut(); P.flag('tutMem', true); } };
  tut = { step: 1, co: KKs.ui.coach('Tap a card!', { pic: 'pointer-down', top: '150px', skip: tp.skip }) };
  var r = cards[0].el.getBoundingClientRect(); tut.fg = h('img', { class: 'kk-finger', src: IMG('pointer'), alt: '', style: { left: (r.left + r.width / 2) + 'px', top: (r.top + r.height * .35) + 'px' } }); document.body.appendChild(tut.fg);
}
function tutStep(kind, v) {
  if (!tut) return;
  if (kind === 'flip' && tut.step === 1 && v === 1) { tut.step = 2; tut.fg && tut.fg.remove(); tut.co.close(); tut.co = KKs.ui.coach('Now find its twin!', { pic: 'rabbit-face', top: '150px', skip: function () { endTut(); P.flag('tutMem', true); } }); }
  else if (kind === 'pair' && tut.step === 2) { tut.step = 3; tut.co.close(); tut.co = KKs.ui.coach(v ? 'A pair! Match them all!' : 'No match. Try to remember!', { pic: v ? 'party-popper' : 'thinking-face', top: '150px' }); setTimeout(function () { endTut(); P.flag('tutMem', true); }, 2600); }
}
function endTut() { if (!tut) return; if (tut.co) tut.co.close(); if (tut.fg) tut.fg.remove(); tut = null; }

/* ======================= arcade hooks ======================= */
var CODES = { PEEKABOO: 'Peekaboo: three extra peeks', AUTOPAIR: 'Auto pair: one pair matches itself (enter it again for more)', SLOWFLIP: 'Slow flip: a wrong pair stays face up for 3 seconds' };
function code(c) {
  c = String(c || '').toUpperCase(); if (!CODES[c]) return { ok: false };
  cheated = true; $('codes').style.display = 'block';
  if (c === 'PEEKABOO') { peeks += 3; $('pk').textContent = peeks; peekBtn.disabled = false; }
  if (c === 'SLOWFLIP') cheats.slow = true;
  if (c === 'AUTOPAIR' && phase === 'play' && !lock) {
    var live = cards.filter(function (x) { return !x.done && !x.up; }), first = live[0]; if (first) { var two = live.filter(function (x) { return x.id === first.id; }).slice(0, 2); if (two.length === 2) { two.forEach(function (x) { up(x, true); }); moves++; setTimeout(function () { onMatch(two[0], two[1]); }, 350); } }
  }
  return { ok: true, message: CODES[c] };
}
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: function () { startLevel(cur); }, onExit: showTitle, onTutorial: function () { P.flag('tutMem', false); startLevel(1); }, onHint: hint, onCheat: code, cheats: [{ code: 'PEEKABOO', effect: CODES.PEEKABOO }, { code: 'AUTOPAIR', effect: CODES.AUTOPAIR }, { code: 'SLOWFLIP', effect: CODES.SLOWFLIP }] });
KKs.ui.topbar({ back: true });
KKs.preload(['star', 'eye', 'magnifying-glass-tilted-left', 'rabbit-face', 'party-popper', 'thinking-face']);
window.__mem = { get phase() { return phase; }, get cards() { return cards; }, get cfg() { return cfg; }, LV: LV, P: P, start: startLevel, flip: flip, get moves() { return moves; }, WORLDS: WORLDS };
showTitle();
})();
</script>
