<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% -20%,#be185d,#0f0f23 60%,#07070f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.back{position:fixed;top:12px;left:14px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:800;z-index:10}
.mute{position:fixed;top:10px;right:12px;z-index:10;width:44px;height:44px;border:none;border-radius:12px;background:#1e293b;font-size:20px;cursor:pointer;color:#fff}
.mute:active{transform:scale(.92)}
h1{font-size:30px;font-weight:900;letter-spacing:-1px}
.hud{display:flex;gap:12px;font-weight:800;font-size:15px}
.hud span{background:#1e293b;padding:8px 16px;border-radius:12px}
.peek{background:#1e293b;border:none;color:#fff;font-size:14px;font-weight:800;padding:8px 14px;border-radius:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,430px,calc(100vh - 170px));contain:layout}
.card{aspect-ratio:1;position:relative;cursor:pointer;perspective:600px;animation:deal .45s cubic-bezier(.2,.8,.3,1.2) backwards}
.inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d;will-change:transform}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(26px,8vw,44px)}
.front{background:linear-gradient(145deg,#7c3aed,#4c1d95);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.4)}
.front::after{content:'?';color:rgba(255,255,255,.5);font-weight:900}
.backf{background:linear-gradient(160deg,#fef3c7,#fde68a);transform:rotateY(180deg);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.card.matched .inner{transform:rotateY(180deg)}
.card.matched .backf{animation:pop .45s ease;background:linear-gradient(160deg,#bbf7d0,#4ade80);box-shadow:0 0 20px 3px rgba(74,222,128,.5),0 6px 16px rgba(0,0,0,.4)}
.card.shake .inner{animation:shake .4s}
.cf{position:fixed;top:-20px;z-index:45;pointer-events:none;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(660deg)}}
@keyframes pop{0%{scale:1}40%{scale:1.25}100%{scale:1}}
@keyframes shake{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) translateX(-7px)}40%{transform:rotateY(180deg) translateX(7px)}60%{transform:rotateY(180deg) translateX(-5px)}80%{transform:rotateY(180deg) translateX(4px)}}
@keyframes deal{from{opacity:0;transform:scale(.5) translateY(18px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.82);backdrop-filter:blur(5px);z-index:20;text-align:center}
.ov h1{font-size:40px}
.stars{font-size:52px}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#f472b6,#a78bfa);color:#1c1024;font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;box-shadow:0 8px 24px rgba(244,114,182,.35)}
.btn:active{transform:scale(.94)}
.nb{color:#4ade80;font-weight:900;letter-spacing:.06em;font-size:15px}
.hidden{display:none}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button class="mute" id="muteBtn">🔊</button>
<h1>Memory Match</h1>
<div class="hud"><span>🃏 <b id="moves">0</b></span><span>⏱ <b id="time">0:00</b></span><span>🏆 <b id="best">–</b></span><button class="peek" id="peekBtn">👁 ×0</button><button class="peek" id="shufBtn">🔄 OFF</button></div>
<div class="grid" id="grid"></div>
<div class="ov hidden" id="over">
  <h1>You Win!</h1>
  <div class="stars" id="stars">⭐⭐⭐</div>
  <div style="color:#94a3b8;font-size:13px">3★ ≤ 16 moves · 2★ ≤ 24 moves</div>
  <div class="nb hidden" id="newBest">★ NEW BEST ★</div>
  <div style="font-size:16px">Moves: <b id="finMoves">0</b> · Time: <b id="finTime">0:00</b></div>
  <div style="color:#94a3b8;font-size:14px">⭐ Star bank: <b id="finBank">0</b> (lifetime)</div>
  <div style="color:#facc15;font-size:14px" id="finFlawless"></div>
  <button class="btn" id="againBtn">Play Again</button>
</div>
<script>

const EMOJIS=['🍎','🍕','🚀','🎈','🐸','🌟','🍩','🐙'];
const grid=document.getElementById('grid');
let open=[],lock=false,moves=0,matched=0,seconds=0,timer=null,t0=0,started=false,best=+localStorage.getItem('memBest')||0;
let muted=localStorage.getItem('memMute')==='1';
let fever=0,tokens=0,starBank=+localStorage.getItem('memStars')||0;
let misses=0,chain=0,chainBest=+localStorage.getItem('memFlawless')||0;
let shuffleMode=false;
let AC;
function initAudio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.16,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function snd(n){if(n==='flip')sfx('tap');else if(n==='match')sfx('pop');else if(n==='miss')sfx('buzz');else if(n==='win')sfx('win');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function startTimer(){if(started)return;started=true;t0=Date.now();tick();timer=setInterval(tick,250);}
function tick(){seconds=Math.floor((Date.now()-t0)/1000);document.getElementById('time').textContent=fmt(seconds);}
document.addEventListener('visibilitychange',()=>{
if(document.hidden){clearInterval(timer);timer=null;}
else if(started&&!timer&&matched<EMOJIS.length){timer=setInterval(tick,250);tick();}
});
function newGame(){
clearInterval(timer);timer=null;open=[];lock=false;moves=0;matched=0;seconds=0;started=false;fever=0;tokens=0;misses=0;updatePeekUI();
document.getElementById('moves').textContent=0;document.getElementById('time').textContent='0:00';
document.getElementById('best').textContent=best||'–';
document.getElementById('over').classList.add('hidden');
const nb=document.getElementById('newBest');if(nb)nb.classList.add('hidden');
grid.innerHTML='';
const deck=shuffle([...EMOJIS,...EMOJIS]);
deck.forEach((emo,i)=>{
const card=document.createElement('div');card.className='card';
card.style.animationDelay=(i*35)+'ms';
card.dataset.e=emo;
card.innerHTML=`<div class="inner"><div class="face front"></div><div class="face backf">${emo}</div></div>`;
grid.appendChild(card);
});
}
function flip(card,emo){
initAudio();
if(lock||card.classList.contains('flip')||card.classList.contains('matched'))return;
startTimer();
card.classList.add('flip');snd('flip');
open.push({card,emo});
if(open.length===2){
moves++;document.getElementById('moves').textContent=moves;
if(open[0].emo===open[1].emo){
open.forEach(o=>o.card.classList.add('matched'));
open=[];matched++;snd('match');
fever++;if(fever%3===0&&tokens<3){tokens++;sfx('levelup');}
updatePeekUI();
if(matched===EMOJIS.length)win();
}else{
lock=true;snd('miss');fever=0;misses++;updatePeekUI();
open.forEach(o=>o.card.classList.add('shake'));
setTimeout(()=>{
open.forEach(o=>{o.card.classList.remove('flip');o.card.classList.remove('shake');});
open=[];lock=false;
if(shuffleMode)shuffleUnmatched();
},820);
}
}
}
function updatePeekUI(){document.getElementById('peekBtn').textContent='👁 ×'+tokens;}
function shuffleUnmatched(){
  const cards=[].slice.call(grid.children).filter(c=>!c.classList.contains('matched'));
  if(cards.length<4)return;
  const ems=cards.map(c=>c.dataset.e);
  shuffle(ems);
  for(let i=0;i<cards.length;i++){
    cards[i].dataset.e=ems[i];
    const bf=cards[i].querySelector('.backf');
    if(bf)bf.textContent=ems[i];
  }
  sfx('whoosh');
}
function doPeek(){
if(lock||tokens<=0||matched>=EMOJIS.length)return;
tokens--;updatePeekUI();sfx('whoosh');open=[];
lock=true;
for(let i=0;i<grid.children.length;i++){
const c=grid.children[i];
if(!c.classList.contains('matched'))c.classList.add('flip');
}
setTimeout(()=>{
for(let i=0;i<grid.children.length;i++){
const c=grid.children[i];
if(!c.classList.contains('matched'))c.classList.remove('flip');
}
lock=false;
},1200);
}
function confetti(){
const cols=['#f472b6','#a78bfa','#4ade80','#facc15','#38bdf8','#fb923c'];
for(let i=0;i<32;i++){
const c=document.createElement('div');c.className='cf';
c.style.left=(Math.random()*100)+'vw';
c.style.width=(6+Math.random()*8)+'px';c.style.height=(10+Math.random()*8)+'px';
c.style.background=cols[(Math.random()*cols.length)|0];
c.style.borderRadius=Math.random()<.4?'50%':'2px';
c.style.animationDelay=(Math.random()*.25)+'s';
c.style.transform='rotate('+(Math.random()*360)+'deg)';
document.body.appendChild(c);
setTimeout(()=>{if(c.parentNode)c.parentNode.removeChild(c);},2300);
}
}
function win(){
clearInterval(timer);timer=null;snd('win');confetti();
const starCount=moves<=16?3:moves<=24?2:1;
starBank+=starCount;localStorage.setItem('memStars',starBank);
if(misses===0){chain++;if(chain>chainBest){chainBest=chain;localStorage.setItem('memFlawless',chainBest);}starBank+=1;localStorage.setItem('memStars',starBank);}
else{chain=0;}
document.getElementById('finBank').textContent=starBank;
const fl=document.getElementById('finFlawless');
if(fl)fl.textContent=misses===0?('🔥 Flawless win! +1 ⭐ · streak ×'+chain+' (best '+chainBest+')'):'';
document.getElementById('stars').textContent='⭐'.repeat(starCount);
document.getElementById('finMoves').textContent=moves;
document.getElementById('finTime').textContent=fmt(seconds);
const isBest=!best||moves<best;
if(isBest){best=moves;localStorage.setItem('memBest',best);}
document.getElementById('best').textContent=best;
const nb=document.getElementById('newBest');if(nb)nb.classList.toggle('hidden',!isBest);
setTimeout(()=>document.getElementById('over').classList.remove('hidden'),500);
}
document.getElementById('againBtn').addEventListener('pointerdown',newGame);
grid.addEventListener('pointerdown',e=>{
const card=e.target.closest('.card');if(!card)return;
flip(card,card.dataset.e);
},{passive:true});
const muteBtn=document.getElementById('muteBtn');
function updMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('pointerdown',()=>{muted=!muted;localStorage.setItem('memMute',muted?'1':'0');updMute();});
document.getElementById('peekBtn').addEventListener('pointerdown',()=>{doPeek();});
const shufBtn=document.getElementById('shufBtn');
shufBtn.addEventListener('pointerdown',()=>{
  shuffleMode=!shuffleMode;
  shufBtn.textContent=shuffleMode?'🔄 ON':'🔄 OFF';
  sfx('tap');
  newGame();
});
updMute();
newGame();
</script>
</body>
</html>
