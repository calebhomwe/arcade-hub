<script>

const N=6;
const SDK=window.ArcadeSDK||null;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function scene(sc,extra){try{if(window.__PROG){extra=extra||{};if(extra.level==null)extra.level=window.__PROG.lv();if(extra.stars==null)extra.stars=window.__PROG.stars();}SDK&&SDK.state(Object.assign({scene:sc},extra||{}));}catch(e){}}
function cheated(){return !!(SDK&&SDK.cheated);}
function save(k,v){if(cheated())return;try{localStorage.setItem(k,v);}catch(e){}}
// Difficulty: how many undos you get and which blocks can come next. Daily drops: the same blocks for everyone today.
const DIFF={easy:{undo:3,max:2,note:'Blocks of 2 or 4 · 3 undos'},normal:{undo:1,max:2,note:'Blocks of 2 or 4 · 1 undo'},hard:{undo:0,max:3,note:'Blocks of 2, 4 or 8 · no undo'},daily:{undo:1,max:2,note:"Today's drops are the same for everyone · 1 undo"}};
let diff='normal';try{diff=localStorage.getItem('mergeDiff')||'normal';}catch(e){}if(!DIFF[diff])diff='normal';
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function bestKey(){return diff==='normal'?'mergeBest':diff==='daily'?'mergeBest_daily_'+today():'mergeBest_'+diff;}
let rngState=0;function seedRng(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}rngState=h>>>0;}
function rng(){if(diff!=='daily')return Math.random();rngState=(rngState+0x6D2B79F5)>>>0;let t=rngState;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
let undoLeft=1,infiniteUndo=false,peekNext=false,bigDrop=false;
let grid=[],next=0,score=0,best=+localStorage.getItem(bestKey())||0,locked=false,over=false,mergedIdxs=[],chain=0;
let muted=localStorage.getItem('gamesMuted')==='1';
let drops=0,goldPending=false,megas=0,megaAll=+localStorage.getItem('mergeMegas')||0,snaps=[],undoUsed=false;
let xp=+localStorage.getItem('mergeXp')||0,pstreak=+localStorage.getItem('mergeStreak')||0,lastScore=+localStorage.getItem('mergeLast')||0;
let medals=[];try{medals=JSON.parse(localStorage.getItem('mergeMedals')||'[]')||[];}catch(e){medals=[];}
let runBlocks=0,runsNs=+localStorage.getItem('mergeRuns')||0,lifeBlocks=+localStorage.getItem('mergeBlocks')||0;
function lvOf(v){return Math.floor(v/300)+1;}
let lv=lvOf(xp);
/* ---- progression: coins, stars, daily challenge, board skins, goals (P01) ---- */
const PROG=ProgKit.create({
key:'merge_prog_v1',accent:'#facc15',cheated:cheated,xp0:xp,need:()=>300,
sfx:n=>sfx(n==='levelup'?'levelup':n==='coin'?'coin':n==='win'?'levelup':n==='buzz'?'buzz':'tap'),
skins:[
 {id:'classic',name:'Classic',cost:0,sw:['#fde68a','#fb923c','#f87171'],pal:{}},
 {id:'sunset',name:'Sunset',cost:30,sw:['#fdba74','#f87171','#facc15'],pal:{2:'#fef3c7',3:'#fdba74',4:'#fb923c',5:'#f87171',6:'#ef4444',7:'#dc2626',8:'#facc15',9:'#fbbf24',10:'#f59e0b',11:'#d97706'}},
 {id:'jewel',name:'Jewel',cost:30,sw:['#38bdf8','#a78bfa','#34d399'],pal:{2:'#e0f2fe',3:'#7dd3fc',4:'#38bdf8',5:'#0ea5e9',6:'#818cf8',7:'#a78bfa',8:'#34d399',9:'#10b981',10:'#059669',11:'#fcd34d'}},
 {id:'mono',name:'Slate',cost:60,sw:['#cbd5e1','#94a3b8','#64748b'],pal:{2:'#f1f5f9',3:'#e2e8f0',4:'#cbd5e1',5:'#94a3b8',6:'#64748b',7:'#475569',8:'#facc15',9:'#fbbf24',10:'#f59e0b',11:'#d97706'}},
 {id:'neon',name:'Neon',cost:90,sw:['#4ade80','#22d3ee','#f0abfc'],pal:{2:'#bbf7d0',3:'#4ade80',4:'#22d3ee',5:'#38bdf8',6:'#818cf8',7:'#f0abfc',8:'#f472b6',9:'#fb7185',10:'#fbbf24',11:'#facc15'}},
 {id:'aurora',name:'Aurora',cost:0,req:{stat:'maxScore',v:400,text:'Score 400 in one game'},sw:['#86efac','#67e8f9','#c4b5fd'],pal:{2:'#d9f99d',3:'#86efac',4:'#67e8f9',5:'#22d3ee',6:'#93c5fd',7:'#c4b5fd',8:'#a78bfa',9:'#f0abfc',10:'#f9a8d4',11:'#fde68a'}},
],
goals:[
 {id:'mg1',txt:'Make a mega merge (32+)',stat:'megam',kind:'max',target:1,rw:15},
 {id:'mg5',txt:'Make 5 mega merges in one game',stat:'megam',kind:'max',target:5,rw:30},
 {id:'m512',txt:'Merge a 512 block',stat:'p512',kind:'max',target:1,rw:40},
 {id:'sc300',txt:'Score 300 in one game',stat:'maxScore',kind:'max',target:300,rw:30},
 {id:'r10',txt:'Play 10 games',stat:'runs',kind:'sum',target:10,rw:20},
 {id:'mg500',txt:'Make 500 merges in total',stat:'merges',kind:'sum',target:500,rw:35},
],
dailies:[
 {id:'dm25',txt:'Make 25 merges today',stat:'merges',kind:'sum',target:25,rw:25},
 {id:'dm3',txt:'Make 3 mega merges today',stat:'megam',kind:'sum',target:3,rw:25},
 {id:'ds300',txt:'Score 300 in one game today',stat:'maxScore',kind:'max',target:300,rw:30},
 {id:'dr3',txt:'Play 3 games today',stat:'runs',kind:'sum',target:3,rw:20},
],
achievements:[
 {id:'first',icon:'🧩',txt:'Finish your first game',test:d=>d.runs>=1},
 {id:'mm5',icon:'🏅',txt:'5 mega merges in one game',test:d=>(d.stats.megam||0)>=5},
 {id:'m256',icon:'💎',txt:'Merge a 256 block',test:d=>(d.stats.p512||0)>=1||(d.stats.p256||0)>=1},
 {id:'skin1',icon:'🎨',txt:'Own a board skin',test:d=>d.unlocked.length>=1},
 {id:'s3',icon:'📅',txt:'Play 3 days in a row',test:d=>d.streak>=3},
],
onSkin:sk=>{for(var k2 in sk.pal)colors[k2]=sk.pal[k2];for(var i2=0;i2<shown.length;i2++)shown[i2]=-1;render();},
});
function paintCoins(){const el=document.getElementById('pkCoins');if(el)el.textContent=PROG.coins();}
document.getElementById('best').textContent=best;
document.getElementById('lv').textContent=lv;
document.getElementById('streak').textContent=pstreak;
document.getElementById('medals').textContent=medals.length;
function refreshMute(){document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
document.getElementById('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;localStorage.setItem('gamesMuted',muted?'1':'0');refreshMute();});
refreshMute();
const colors={1:'#e2e8f0',2:'#fde68a',3:'#fb923c',4:'#f87171',5:'#f472b6',6:'#a78bfa',7:'#818cf8',8:'#38bdf8',9:'#34d399',10:'#4ade80',11:'#facc15'};
let AC;
function initAudio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.16,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function snd(n){if(n==='drop')sfx('pop');else if(n==='merge')sfx('pop');else if(n==='over')sfx('lose');}
const boardEl=document.getElementById('board'),cells=[],shown=new Array(N*N).fill(-1);
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);cells.push(d);}
let bRect=boardEl.getBoundingClientRect();
window.addEventListener('resize',()=>{bRect=boardEl.getBoundingClientRect();});
function newNext(){next=bigDrop?3:DIFF[diff].max===3?1+Math.floor(rng()*3):(rng()<.5?1:2);const el=document.getElementById('next');el.textContent=Math.pow(2,next);el.style.background=colors[next];el.style.color=next<=2?'#1e293b':'#fff';}
function startGame(){
initAudio();
if(diff==='daily')seedRng('merge-'+today());best=+localStorage.getItem(bestKey())||0;document.getElementById('best').textContent=best;
PROG.beginRun();
grid=Array(N*N).fill(0);score=0;locked=false;over=false;drops=0;goldPending=false;megas=0;snaps=[];undoUsed=false;runBlocks=0;undoLeft=DIFF[diff].undo;
document.getElementById('score').textContent=0;
document.getElementById('megas').textContent=0;
updUndo();
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
newNext();render();scene('play');
}
function render(hlCol){
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
const i=r*N+c,d=cells[i],v=grid[i];
d.classList.toggle('hl',hlCol===c);
if(v!==shown[i]){
shown[i]=v;
d.classList.remove('pop','drop');
if(v){
d.textContent=Math.pow(2,v);
d.style.background=colors[Math.min(v,11)]||'#f59e0b';
d.style.color=v<=2?'#1e293b':'#fff';
}else{
d.textContent='';
d.style.background='';
d.style.color='';
}
}
}
}
function drop(col){
if(locked||over)return;
locked=true;
initAudio();
for(let r=N-1;r>=0;r--){
if(grid[r*N+col]===0){
    snaps.push({grid:grid.slice(),score:score,next:next,chain:chain,drops:drops,goldPending:goldPending,megas:megas,rng:rngState});if(snaps.length>50)snaps.shift();
    tutDropped();
    grid[r*N+col]=next;
    chain=0;
    drops++;goldPending=(drops%8===0);
    snd('drop');
render(col);
const d=cells[r*N+col];
d.classList.remove('drop');void d.offsetWidth;d.classList.add('drop');
setTimeout(cascade,240);
return;
}
}
locked=false;
sfx('buzz');
if(!RM){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');}
const topCell=cells[col],tcr=topCell.getBoundingClientRect();
const cf=document.createElement('div');cf.className='cfloat chain';cf.textContent='COLUMN FULL';
cf.style.left=(tcr.left+tcr.width/2)+'px';cf.style.top=(tcr.top-4)+'px';cf.style.transform='translateX(-50%)';cf.style.fontSize='12px';
document.body.appendChild(cf);setTimeout(()=>{if(cf.parentNode)cf.parentNode.removeChild(cf);},750);
}
function mergePass(){
let count=0;mergedIdxs=[];
const done=new Set();
for(let r=N-1;r>=0;r--)for(let c=0;c<N;c++){
const i=r*N+c,v=grid[i];
if(!v||done.has(i))continue;
if(r<N-1&&grid[i+N]===v&&!done.has(i+N)){
grid[i+N]++;grid[i]=0;done.add(i+N);
score+=Math.pow(2,grid[i+N]);mergedIdxs.push({i:i+N,p:Math.pow(2,grid[i+N])});count++;
}else if(c<N-1&&grid[i+1]===v&&!done.has(i+1)){
grid[i]++;grid[i+1]=0;done.add(i);
score+=Math.pow(2,grid[i]);mergedIdxs.push({i:i,p:Math.pow(2,grid[i])});count++;
}
}
return count;
}
function applyGravity(){
let moved=false;
for(let c=0;c<N;c++){
let w=N-1;
for(let r=N-1;r>=0;r--){
const v=grid[r*N+c];
if(v){if(w!==r){grid[w*N+c]=v;grid[r*N+c]=0;moved=true;}w--;}
}
}
return moved;
}
function popScore(){
const s=document.getElementById('score');s.classList.remove('pp');void s.offsetWidth;s.classList.add('pp');
}
function floatScore(i,pts){
const cell=cells[i];if(!cell)return;
const cr=cell.getBoundingClientRect();
const f=document.createElement('div');f.className='cfloat';f.textContent='+'+pts;
f.style.left=(cr.left+cr.width/2)+'px';f.style.top=cr.top+'px';f.style.transform='translateX(-50%)';
document.body.appendChild(f);setTimeout(()=>{if(f.parentNode)f.parentNode.removeChild(f);},750);
}
function cascade(){
const merged=mergePass();
applyGravity();
render();
document.getElementById('score').textContent=score;
popScore();
if(score>best&&!cheated()){best=score;localStorage.setItem(bestKey(),best);document.getElementById('best').textContent=best;}
PROG.stat('maxScore',score);
if(merged){
chain++;
runBlocks+=merged;
const xpGain=mergedIdxs.reduce((n,m)=>n+m.p,0);
xp+=xpGain;save('mergeXp',xp);
PROG.addXp(xpGain);PROG.addCoins(Math.ceil(mergedIdxs.length/2));PROG.event('merges',mergedIdxs.length);paintCoins();
const nLv=lvOf(xp);
if(nLv>lv){lv=nLv;document.getElementById('lv').textContent=lv;sfx('levelup');
const b2=document.createElement('div');b2.className='cfloat chain';b2.textContent='🎖 LEVEL '+lv+'!';b2.style.left='50%';b2.style.top='46%';document.body.appendChild(b2);
setTimeout(()=>{if(b2.parentNode)b2.parentNode.removeChild(b2);},750);}
const ms=mergedIdxs.reduce((n,m)=>m.p>=32?n+1:n,0);
if(ms){megas+=ms;sfx('levelup');document.getElementById('megas').textContent=megas;PROG.event('megam',ms);PROG.stat('megam',megas);
const b=document.createElement('div');b.className='cfloat chain';b.textContent='🏅 MEGA ×'+ms+'!';
b.style.left='50%';b.style.top='28%';document.body.appendChild(b);
setTimeout(()=>{if(b.parentNode)b.parentNode.removeChild(b);},750);}
let nMed=0;mergedIdxs.forEach(m=>{const v=m.p;if(v>=512){PROG.stat('p512',1);}if(v>=256){PROG.stat('p256',1);}if(v>=512&&medals.indexOf(v)===-1){medals.push(v);nMed++;}});
if(nMed){save('mergeMedals',JSON.stringify(medals));
document.getElementById('medals').textContent=medals.length;
const b3=document.createElement('div');b3.className='cfloat chain';b3.textContent='💎 '+medals[medals.length-1]+' BLOCK! ('+medals.length+'/3)';
b3.style.left='50%';b3.style.top='31%';document.body.appendChild(b3);
setTimeout(()=>{if(b3.parentNode)b3.parentNode.removeChild(b3);},750);sfx('levelup');}
snd('merge');
void boardEl.offsetWidth;
mergedIdxs.forEach(m=>{const d=cells[m.i];if(d)d.classList.add('pop');floatScore(m.i,m.p);});
if(chain>=2){const f=document.createElement('div');f.className='cfloat chain';f.textContent='🔥 CHAIN ×'+chain+'!';f.style.left='50%';f.style.top='40%';f.style.fontSize=(16+Math.min(chain,6)*2)+'px';document.body.appendChild(f);setTimeout(()=>{if(f.parentNode)f.parentNode.removeChild(f);},750);}
setTimeout(cascade,230);
return;
}
let full=true;
for(let c=0;c<N&&full;c++){for(let r=0;r<N;r++){if(grid[r*N+c]===0){full=false;break;}}}
if(full){endGame();return;}
  newNext();
  if(goldPending){
    goldPending=false;next=3;
    const el=document.getElementById('next');
    el.textContent=Math.pow(2,next);el.style.background='#facc15';el.style.color='#1e293b';
    sfx('levelup');
    const f=document.createElement('div');f.className='cfloat chain';f.textContent='✨ GOLDEN NEXT!';
    f.style.left='50%';f.style.top='34%';document.body.appendChild(f);
    setTimeout(()=>{if(f.parentNode)f.parentNode.removeChild(f);},750);
  }
  locked=false;updUndo();
}
function endGame(){
if(over)return;
over=true;snd('over');scene('over',{score:score});
if(score>best&&!cheated()){best=score;localStorage.setItem(bestKey(),best);document.getElementById('best').textContent=best;}
document.getElementById('finScore').textContent=score;
document.getElementById('finBest').textContent=best;
document.getElementById('finMegas').textContent=megas;
megaAll+=megas;save('mergeMegas',megaAll);
document.getElementById('finMegaAll').textContent=megaAll;
document.getElementById('finLv').textContent=lv;
document.getElementById('finMedals').textContent=medals.length;
runsNs++;lifeBlocks+=runBlocks;
save('mergeRuns',runsNs);
save('mergeBlocks',lifeBlocks);
document.getElementById('finBlocks').textContent=lifeBlocks;
document.getElementById('finRuns').textContent=runsNs;
if(!cheated()){PROG.event('runs',1);const res=PROG.awardRun({coins:Math.floor(score/40),xp:0,best:score});paintCoins();
document.getElementById('pkEarn').textContent='+'+res.coins+' 🪙 coins earned this game'+(res.levelUp?' · ⭐ LEVEL '+res.levelUp+'!':'');}
if(Math.floor(lifeBlocks/500)>Math.floor((lifeBlocks-runBlocks)/500)){
const bl=document.createElement('div');bl.className='cfloat chain';bl.textContent='🧱 '+lifeBlocks+' BLOCKS!';
bl.style.left='50%';bl.style.top='25%';document.body.appendChild(bl);
setTimeout(()=>{if(bl.parentNode)bl.parentNode.removeChild(bl);},750);sfx('levelup');}
save('mergeXp',xp);
if(score>lastScore&&score>0){pstreak++;if(pstreak>=2){const sf=document.createElement('div');sf.className='cfloat chain';sf.textContent='🔥 HOT STREAK ×'+pstreak+'!';sf.style.left='50%';sf.style.top='22%';document.body.appendChild(sf);setTimeout(()=>{if(sf.parentNode)sf.parentNode.removeChild(sf);},750);}}
else pstreak=0;
lastScore=score;save('mergeStreak',pstreak);save('mergeLast',lastScore);
document.getElementById('streak').textContent=pstreak;
document.getElementById('finStreak').textContent=pstreak;
setTimeout(()=>document.getElementById('over').classList.remove('hidden'),450);
}
const $=id=>document.getElementById(id);
function press(el,fn){el.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();fn();});el.addEventListener('click',e=>{if(e.detail===0)fn();});}
function busy(){return !$('start').classList.contains('hidden')||(SDK&&SDK.paused);}
boardEl.addEventListener('pointerdown',e=>{
if(busy())return;bRect=boardEl.getBoundingClientRect();
const col=Math.floor((e.clientX-bRect.left)/(bRect.width/N));
if(col>=0&&col<N)drop(col);
});
window.addEventListener('keydown',e=>{if(busy()||e.repeat)return;
if(e.key>='1'&&e.key<='6')drop(+e.key-1);
if(e.key==='z'||e.key==='Z'||e.key==='u'||e.key==='U')undo();
if(e.key==='h'||e.key==='H')showHint();});
/* ---- undo: the difficulty sets how many; the last drop and all its merges come back ---- */
function updUndo(){const b=$('undoBtn');const n=infiniteUndo?'∞':undoLeft;b.textContent='↩'+(n?'':'');b.setAttribute('aria-label','Undo last drop ('+n+' left)');b.title='Undo ('+n+' left)';b.style.opacity=(infiniteUndo||undoLeft>0)&&snaps.length&&!over?'1':'0.4';}
function undo(){if(over||locked||!snaps.length||(!infiniteUndo&&undoLeft<1))return;
initAudio();const snap=snaps.pop();
grid=snap.grid.slice();score=snap.score;next=snap.next;chain=snap.chain;drops=snap.drops;goldPending=snap.goldPending;megas=snap.megas;rngState=snap.rng;
if(!infiniteUndo)undoLeft--;undoUsed=true;
$('score').textContent=score;$('megas').textContent=megas;
const el=$('next');el.textContent=Math.pow(2,next);el.style.background=colors[next];el.style.color=next<=2?'#1e293b':'#fff';
updUndo();render();sfx('whoosh');}
press($('undoBtn'),undo);
/* ---- hint: plays every column in a copy of the board, merges and all ---- */
function simulate(col){const g=grid.slice();let r=-1;for(let k=N-1;k>=0;k--)if(!g[k*N+col]){r=k;break;}if(r<0)return null;g[r*N+col]=next;let gain=0,chains=0;
for(let guard=0;guard<40;guard++){let count=0;const done=new Set();
for(let rr=N-1;rr>=0;rr--)for(let c=0;c<N;c++){const i=rr*N+c,v=g[i];if(!v||done.has(i))continue;
if(rr<N-1&&g[i+N]===v&&!done.has(i+N)){g[i+N]++;g[i]=0;done.add(i+N);gain+=Math.pow(2,g[i+N]);count++;}
else if(c<N-1&&g[i+1]===v&&!done.has(i+1)){g[i]++;g[i+1]=0;done.add(i);gain+=Math.pow(2,g[i]);count++;}}
for(let c=0;c<N;c++){let w=N-1;for(let rr=N-1;rr>=0;rr--){const v=g[rr*N+c];if(v){if(w!==rr){g[w*N+c]=v;g[rr*N+c]=0;}w--;}}}
if(!count)break;chains++;}
const empty=g.filter(v=>!v).length;let tall=0;for(let c=0;c<N;c++){let h=0;for(let rr=0;rr<N;rr++)if(g[rr*N+c]){h=N-rr;break;}tall=Math.max(tall,h);}
return {col,gain,chains,empty,tall,score:gain+empty*6-tall*4};}
function bestCol(){let b=null;for(let c=0;c<N;c++){const s2=simulate(c);if(s2&&(!b||s2.score>b.score))b=s2;}return b;}
function hint(){if(!$('start').classList.contains('hidden'))return 'Pick a difficulty and press Play.';if(over)return 'Game over: press Play Again.';
const b=bestCol();if(!b)return 'Every column is full.';
cells.forEach((d,i)=>d.classList.toggle('hinted',i%N===b.col));setTimeout(()=>cells.forEach(d=>d.classList.remove('hinted')),1800);
return 'Drop the '+Math.pow(2,next)+' in column '+(b.col+1)+(b.gain?': it merges for +'+b.gain+(b.chains>1?' in a '+b.chains+'-step chain':''):': no merge is possible, and it keeps the stacks lowest')+'. '+b.empty+' squares stay free.';}
function showHint(){if(busy())return;coach('💡 '+hint(),'OK');tut=0;}
press($('hintBtn'),showHint);
/* ---- first-game coach marks ---- */
let tut=0,tutSeen=false;try{tutSeen=localStorage.getItem('mergeTut')==='1';}catch(e){}
function coach(t,b){$('coachTxt').textContent=t;$('coachBtn').textContent=b||'Skip';$('coach').classList.remove('hidden');}
function endTut(){tut=0;$('coach').classList.add('hidden');tutSeen=true;try{localStorage.setItem('mergeTut','1');}catch(e){}}
press($('coachBtn'),()=>{if(tut)endTut();else $('coach').classList.add('hidden');});
function startTut(){tut=1;coach('👆 Tap a column (or press 1 to 6): the Next block drops to the bottom of it.');}
function tutDropped(){if(tut===1){tut=2;coach('Two touching blocks with the same number merge into one twice as big, and merges can chain.');}else if(tut===2){tut=3;coach('The game ends when every column is full. ↩ undoes a drop; 💡 picks the best column.','Got it');}else if(tut===3)endTut();}
/* ---- title ---- */
function paintDiff(){document.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('on',b.dataset.d===diff);b.setAttribute('aria-pressed',String(b.dataset.d===diff));});const bk=+localStorage.getItem(bestKey())||0;$('diffNote').textContent=DIFF[diff].note+' · Best '+(bk||'–');}
document.querySelectorAll('[data-d]').forEach(b=>press(b,()=>{diff=b.dataset.d;try{localStorage.setItem('mergeDiff',diff);}catch(e){}paintDiff();}));
paintDiff();
function begin(withTut){startGame();$('coach').classList.add('hidden');tut=0;if(withTut||!tutSeen)startTut();}
function toTitle(){over=true;locked=false;$('over').classList.add('hidden');$('coach').classList.add('hidden');paintDiff();$('start').classList.remove('hidden');scene('title');}
PROG.mount(document.getElementById('start'));paintCoins();
press($('playBtn'),()=>begin(false));
press($('againBtn'),()=>begin(false));
/* ---- codes: just for fun; a game with codes on saves no records ---- */
const CODES={UNDOALL:'Undo all: unlimited undos',BIGDROP:'Big drop: every new block is an 8',CLEARTOP:'Clear top: the top two rows are wiped'};
function code(c){if(!CODES[c])return{ok:false};$('codesOn').classList.remove('hidden');
if(c==='UNDOALL'){infiniteUndo=true;updUndo();}
if(c==='BIGDROP'){bigDrop=true;if(!over){next=3;const el=$('next');el.textContent=8;el.style.background=colors[3];el.style.color='#fff';}}
if(c==='CLEARTOP'&&!over&&!locked){for(let i=0;i<2*N;i++)grid[i]=0;render();}
return{ok:true,message:CODES[c]};}
if(SDK)SDK.init({
pauseButton:'br',pauseKeys:'p+esc',
onRestart:()=>begin(false),
onExit:toTitle,
onTutorial:()=>begin(true),
onHint:hint,
onCheat:code,
});
grid=Array(N*N).fill(0);newNext();render();
scene('title');
</script>
