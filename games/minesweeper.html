<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Minesweeper</title>
<style>
:root{--bg1:#4f8f3a;--bg2:#153a16;--ink:#fff3d2;--muted:rgba(255,243,210,.72);--accent:#ffd979;--bgtex:url(assets/tex/linen.jpg);--bs:min(calc(100vw - 20px),calc(100vh - 320px),470px);--pz-ov1:#4f8f3a;--pz-ov2:#153a16;--pz-ovink:#fff3d2}
@supports (height:100dvh){:root{--bs:min(calc(100vw - 20px),calc(100dvh - 320px),470px)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--pz-text,system-ui,-apple-system,'Segoe UI',sans-serif);color:var(--ink);background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,226,150,.36),rgba(255,226,150,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,320px;background-blend-mode:normal,normal,soft-light;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.glass{background:var(--pz-navy,linear-gradient(180deg,#1c3460,#0a162e));box-shadow:inset 0 0 0 1.5px rgba(255,220,140,.42),inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.35);border-radius:16px;color:#fff3d2}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:8px;touch-action:none}
#top{width:min(100%,480px);display:flex;align-items:center;gap:8px;min-height:48px;padding-right:52px}
#back{display:inline-flex;align-items:center;min-height:44px;padding:0 12px 0 4px;color:var(--muted);text-decoration:none;font:700 15px/1 var(--pz-display,sans-serif);text-shadow:0 1px 0 rgba(0,0,0,.4)}
#modeName{flex:1;text-align:center;font:600 16px/1.1 var(--pz-display,sans-serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#hud{width:var(--bs);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:6px 14px;margin-top:auto}
#hud .it{display:flex;align-items:center;gap:8px;font:700 24px/1 var(--pz-display,sans-serif);font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff8d2,#f6c651 62%,#d9902a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(60,25,0,.85))}
#hud .it svg{width:26px;height:26px;flex:none;filter:none}
#hearts{display:flex;gap:4px}
#hearts svg{width:26px;height:26px;filter:drop-shadow(0 2px 0 rgba(60,0,0,.6));transition:transform .3s}
#hearts svg.lost{filter:grayscale(1) brightness(.5)}
#stage{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;filter:drop-shadow(0 14px 12px rgba(0,0,0,.5))}
#praise{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font:700 40px/1 var(--pz-display,sans-serif);color:#fff3c0;text-shadow:0 3px 0 rgba(90,40,0,.85),0 0 26px rgba(255,190,70,.9);opacity:0;z-index:5}
#praise.go{animation:praise 1.1s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes praise{0%{opacity:0;transform:scale(.4) rotate(-6deg)}16%{opacity:1;transform:scale(1.25) rotate(2deg)}30%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
#tools{width:var(--bs);display:flex;gap:8px;flex:none;margin-bottom:auto}
.tool{flex:1;min-height:56px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:700 13px/1 var(--pz-display,sans-serif);position:relative;touch-action:manipulation;color:#ffe9a8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.tool svg{width:23px;height:23px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.tool:active{transform:translateY(2px)}
.tool[disabled]{opacity:.4}
.tool.flag.on{box-shadow:inset 0 0 0 3px #ffd979,0 0 18px rgba(255,205,90,.75);color:#fff}
.tool .n{position:absolute;top:-7px;right:-3px;min-width:23px;height:23px;padding:0 5px;border-radius:12px;background:var(--pz-gold,#f0b93a);color:#4a2a00;display:grid;place-items:center;font:700 13px/1 var(--pz-display,sans-serif);box-shadow:0 0 0 1.5px #8a5a0c,0 2px 0 1.5px #6b4408;text-shadow:0 1px 0 rgba(255,255,255,.5)}
#hintline{width:var(--bs);min-height:38px;font:800 15px/1.3 var(--pz-text,sans-serif);color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tool:focus-visible,.mbtn:focus-visible,.sbtn:focus-visible,#back:focus-visible,#board:focus-visible,.sizes button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));text-align:center;background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,226,150,.4),rgba(255,226,150,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,320px;background-blend-mode:normal,normal,soft-light;overflow:auto;-webkit-overflow-scrolling:touch}
.ov.on{display:flex}
#logo{display:flex;flex-direction:column;align-items:center;gap:8px}
#logo .sign{padding:14px 24px 12px;border-radius:18px;background-color:#6b4423;background-image:linear-gradient(135deg,rgba(255,235,190,.3),rgba(0,0,0,0) 50%,rgba(0,0,0,.4)),var(--pz-walnut);background-size:auto,cover;background-blend-mode:normal,multiply;box-shadow:0 0 0 3px #3a230b,0 0 0 5px #e6bb55,0 14px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35)}
#logo b{display:block;font:700 clamp(28px,9vw,40px)/1 var(--pz-display,sans-serif);background:linear-gradient(180deg,#fff8d2,#f6c651 60%,#c98a22);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(40,15,0,.9));letter-spacing:.01em}
#logo canvas{width:190px;height:72px}
.tag{font:600 17px/1.35 var(--pz-display,sans-serif);color:var(--muted);max-width:330px;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.menu{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}
.mbtn{--a:#8fe062;--b:#3ea52d;--edge:#256f1b;--deep:#1d5a14;--fg:#fff;--sh:rgba(10,50,0,.55);border:0;cursor:pointer;min-height:76px;border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--fg);text-shadow:0 2px 0 var(--sh);background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0) 50%),linear-gradient(180deg,var(--a),var(--b));box-shadow:0 0 0 2px var(--edge),0 6px 0 2px var(--deep),0 14px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);touch-action:manipulation;position:relative;margin-bottom:6px}
.mbtn:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--edge),0 2px 0 2px var(--deep),inset 0 1px 0 rgba(255,255,255,.5)}
.mbtn svg{flex:none;width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.mbtn b{display:block;font:700 23px/1.05 var(--pz-display,sans-serif)}
.mbtn small{display:block;font:800 14px/1.25 var(--pz-text,sans-serif);opacity:.86;margin-top:3px}
.mbtn.cls{--a:#ffd66b;--b:#dc9224;--edge:#8a5a0c;--deep:#6b4408;--fg:#3a2200;--sh:rgba(255,255,255,.5)}
.mbtn.day{--a:#7fbcff;--b:#2d6ccd;--edge:#1c4a99;--deep:#143a78;--sh:rgba(0,20,70,.55)}
.mbtn .badge{position:absolute;top:-8px;right:10px;padding:4px 9px;border-radius:999px;background:linear-gradient(180deg,#ff8a6d,#d63b1f);color:#fff;font:700 12px/1 var(--pz-display,sans-serif);box-shadow:0 0 0 2px #8a1f0c,0 2px 0 2px #6b1808;text-shadow:none}
.sizes{display:flex;gap:6px;justify-content:center;padding:5px;border-radius:16px;background:linear-gradient(180deg,#4b2e10,#6b4519);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.3)}
.sizes button{border:0;min-height:44px;padding:0 12px;border-radius:12px;background:transparent;font:700 15px/1 var(--pz-display,sans-serif);cursor:pointer;color:#f5e2b8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.sizes button.on{background:var(--pz-gold);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 0 0 2px #8a5a0c,inset 0 1px 0 rgba(255,255,255,.7)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sbtn{border:0;cursor:pointer;min-height:48px;padding:0 20px;border-radius:14px;font:700 16px/1 var(--pz-display,sans-serif);color:#fff3d2;text-shadow:0 2px 0 rgba(30,12,0,.6);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 52%),linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,0 4px 0 2px #3a230b,0 8px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:4px}
.sbtn:active{transform:translateY(3px)}
#trials h2{font:700 30px/1 var(--pz-display,sans-serif);text-shadow:0 2px 0 rgba(0,0,0,.45)}
#coach{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;width:min(360px,calc(100vw - 24px));display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;color:#4a2f17;font:800 15px/1.25 var(--pz-text,sans-serif);background-color:#f3e2b3;background-image:linear-gradient(180deg,rgba(255,250,232,.55),rgba(214,170,96,.18)),var(--pz-paper);background-blend-mode:normal,overlay;background-size:auto,220px;box-shadow:0 0 0 2px #6e4519,0 0 0 4px #e6bb55,0 12px 30px rgba(0,0,0,.5)}
#coach.on{display:flex}
#coach button{flex:none;min-height:44px;min-width:60px;border:0;border-radius:12px;background:linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,inset 0 1px 0 rgba(255,255,255,.4);font:700 15px/1 var(--pz-display,sans-serif);color:#fff3d2;cursor:pointer}
#codesOn{position:fixed;left:12px;top:60px;z-index:31;background:#ffd23f;color:#26170a;font:700 12px/1 var(--pz-display,sans-serif);letter-spacing:.14em;padding:6px 10px;border-radius:999px}
#codesOn[hidden]{display:none}
[hidden]{display:none!important}
@media (max-height:640px){#hud{min-height:48px}#hintline{min-height:30px}}
@media (prefers-reduced-motion:reduce){#praise.go{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a id="back" href="../index.html" aria-label="Back to the arcade hub">‹ Hub</a><div id="modeName">Minesweeper</div></div>
  <div id="hud" class="glass">
    <div class="it" id="hMines"></div>
    <div class="it" id="hTime"></div>
    <div id="hearts" aria-label="Lives"></div>
  </div>
  <div id="stage"><canvas id="board" tabindex="0" role="application" aria-label="Minesweeper board. Arrow keys move, Enter digs, F flags."></canvas><div id="praise" aria-hidden="true"></div></div>
  <div id="tools">
    <button class="tool glass" id="btnUndo" aria-label="Undo"><span id="icoUndo"></span>Undo<span class="n" id="nUndo">3</span></button>

    <button class="tool glass" id="btnMenu" aria-label="Menu"><span id="icoMenu"></span>Menu</button>
  </div>
  <div id="hintline" aria-live="polite"></div>
</div>
<div id="coach" role="status"><span id="coachTxt"></span><button id="coachBtn">Skip</button></div>
<div id="codesOn" hidden>CODES ON</div>
<div id="live" style="position:absolute;left:-9999px" aria-live="polite"></div>

<div class="ov on" id="title" role="dialog" aria-label="Minesweeper">
  <div id="logo"><div class="sign"><b>MINESWEEPER</b></div><canvas id="logoArt" width="380" height="144" aria-hidden="true"></canvas></div>
  <div class="tag">Dig safe. Numbers count the bombs next to them.</div>
  <div class="menu">
    <button class="mbtn" id="mTrials"><svg viewBox="0 0 40 40"><path d="M20 3l4.8 10.2L36 14.6l-8.2 7.6L30 33 20 27.6 10 33l2.2-10.8L4 14.6l11.2-1.4z" fill="url(#pzGold)" stroke="#8a5a0c" stroke-width="2.2" stroke-linejoin="round"/></svg><span><b>Expeditions</b><small id="sTrials">18 boards · 3 lives · win stars</small></span></button>
    <button class="mbtn cls" id="mClassic"><svg viewBox="0 0 40 40"><rect x="4" y="4" width="14" height="14" rx="3" fill="#c9d1a8" stroke="#3a4a1a" stroke-width="2"/><rect x="22" y="4" width="14" height="14" rx="3" fill="#7fae52" stroke="#2a4a12" stroke-width="2"/><rect x="4" y="22" width="14" height="14" rx="3" fill="#7fae52" stroke="#2a4a12" stroke-width="2"/><rect x="22" y="22" width="14" height="14" rx="3" fill="#c9d1a8" stroke="#3a4a1a" stroke-width="2"/><text x="11" y="15" font-size="11" font-weight="700" text-anchor="middle" fill="#2a6fdb">1</text></svg><span><b>Classic</b><small id="sClassic">9×9 · one life</small></span></button>
    <button class="mbtn day" id="mDaily"><svg viewBox="0 0 40 40"><rect x="5" y="7" width="30" height="28" rx="7" fill="#fff6dc" stroke="#143a78" stroke-width="2.4"/><path d="M5 16h30" stroke="#143a78" stroke-width="2.4"/><path d="M13 3v8M27 3v8" stroke="#143a78" stroke-width="2.8" stroke-linecap="round"/><circle cx="20" cy="26" r="4.5" fill="#2d6ccd"/></svg><span><b>Daily board</b><small id="sDaily">Same board for everyone today</small></span><span class="badge" id="dayBadge" hidden>NEW</span></button>
  </div>
  <div class="sizes" id="sizes" role="group" aria-label="Classic difficulty"><button data-lv="easy">Easy · 8</button><button data-lv="normal">Normal · 10</button><button data-lv="hard">Hard · 16</button></div>
  <div class="row2" id="titleChip"></div>
</div>
<div class="ov" id="trials" role="dialog" aria-label="Expeditions"><h2>Expeditions</h2><div id="tmap" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%"></div><div class="row2"><span id="starTotal" style="font:700 16px var(--pz-display,sans-serif);color:var(--muted)"></span><button class="sbtn" id="trBack">‹ Back</button></div></div>
<div class="pz-ov dim" id="pre" role="dialog" aria-label="Expedition"></div>
<div class="pz-ov dim" id="result" role="dialog" aria-label="Result"></div>

<script src="kit/pz.js"></script>
<script src="kit/mat.js"></script>
<script>
(function () {
'use strict';
const PZ = window.PZ, SDK = window.ArcadeSDK || null, Mat = window.Mat, shade = Mat.shade, rr = Mat.rr;

/* ------------------------------------------------------------ looks: every world is a different ground */
const THEMES = [

  { id: 'cave', name: 'Crystal Cave', level: 6, colors: ['#3a3a48', '#5a4a3a', '#7bd0ff'], bg: ['#34344a', '#0a0a14'], bgTex: 'leather', ink: '#eef0ff', muted: 'rgba(238,240,255,.74)', accent: '#9fd8ff', tint: '#22222e', frame: { tex: 'onyx', tint: '#8a8fa8' },

    cover: { tex: 'pine', tint: '#5f9a48', hi: 'rgba(220,255,170,.45)' }, floor: { tex: 'walnut', tint: '#8a5f38', dark: true }, nums: ['', '#8cc0ff', '#8fe08a', '#ff8a7a', '#c9a0ff', '#ffbf6a', '#66e0d6', '#f0f0f0', '#cccccc'] },
  { id: 'volcano', name: 'Volcano', level: 12, colors: ['#a0382a', '#3a1f16', '#ff9a2e'], bg: ['#6a1e10', '#160504'], bgTex: 'leather', ink: '#fff0dc', muted: 'rgba(255,240,220,.76)', accent: '#ffb35c', tint: '#3a0f08', frame: { tex: 'onyx', tint: '#b0563a' },
    cover: { tex: 'onyx', tint: '#b3503c', hi: 'rgba(255,190,140,.45)' }, floor: { tex: 'leather', tint: '#4a2618', dark: true }, nums: ['', '#8cc0ff', '#8fe08a', '#ff9a8a', '#d3a8ff', '#ffc470', '#66e0d6', '#f4f4f4', '#cccccc'] },
];
const QUESTS = [
  { id: 'dig80', key: 'dig', text: 'Dig {n} safe squares', goal: 80, xp: 25 },
  { id: 'dig200', key: 'dig', text: 'Dig {n} safe squares', goal: 200, xp: 45 },
  { id: 'win2', key: 'win', text: 'Clear {n} boards', goal: 2, xp: 35 },
  { id: 'win4', key: 'win', text: 'Clear {n} boards', goal: 4, xp: 60 },
  { id: 'flag8', key: 'flag', text: 'Plant {n} correct flags', goal: 8, xp: 30 },
  { id: 'nohurt', key: 'nohurt', text: 'Clear a board without losing a life', goal: 1, xp: 45 },
  { id: 'fast', key: 'fast', text: 'Clear a board in under 60 seconds', goal: 1, xp: 45 },
  { id: 'chord5', key: 'chord', text: 'Tap a number to open around it {n} times', goal: 5, xp: 30 },
  { id: 'star3', key: 'star3', text: 'Earn 3 stars on an expedition', goal: 1, xp: 50 },

let theme = THEMES[0], ready = false, uiOpen = false, bgCanvas = null;
const spriteCache = new Map();
const prof = PZ.profile({ id: 'mines', name: 'Your progress', xp: { base: 60, p: 1.45 }, themes: THEMES, quests: QUESTS, onTheme: t => applyTheme(t), onOpen: () => { uiOpen = true; }, onClose: () => { uiOpen = false; } });
