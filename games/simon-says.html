<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simon Says</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% -20%,#7f1d1d,#0f0f23 60%,#07070f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.back{position:fixed;top:6px;left:6px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:800;z-index:10;display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:10px}
h1{font-size:26px;font-weight:900;letter-spacing:-1px}
.hud{display:flex;gap:8px 10px;font-weight:800;font-size:15px;flex-wrap:wrap;justify-content:center;max-width:96vw}
.hud span{background:#1e293b;padding:8px 16px;border-radius:12px}
#board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(86vw,360px,calc(100dvh - 104px));touch-action:manipulation;contain:layout}
.pad{aspect-ratio:1;border-radius:24px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.3);transition:filter .1s,box-shadow .1s,scale .1s;position:relative}
.pad:active{scale:.95}
.pad.on{filter:brightness(1.75) saturate(1.3);box-shadow:0 0 30px 6px currentColor,inset 0 -6px 0 rgba(0,0,0,.3);scale:1.05}
.pad.err{box-shadow:0 0 30px 8px #ef4444,inset 0 -6px 0 rgba(0,0,0,.3);animation:padshake .4s}
@keyframes padshake{0%,100%{translate:0 0}20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-6px 0}80%{translate:5px 0}}
.p0{background:linear-gradient(145deg,#f87171,#b91c1c);color:#f87171}
.p1{background:linear-gradient(145deg,#4ade80,#15803d);color:#4ade80}
.p2{background:linear-gradient(145deg,#60a5fa,#1d4ed8);color:#60a5fa}
.p3{background:linear-gradient(145deg,#facc15,#ca8a04);color:#facc15}
.label{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;font-weight:900;color:rgba(255,255,255,.55);letter-spacing:.1em}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.82);backdrop-filter:blur(5px);z-index:20;text-align:center}
.ov h1{font-size:40px}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#f87171,#facc15);color:#1c1024;font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;box-shadow:0 8px 24px rgba(248,113,113,.35)}
.btn:active{transform:scale(.94)}
.best{color:#4ade80;font-weight:800}
.roundflash{position:fixed;top:20%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.95);border:2px solid #334155;padding:14px 30px;border-radius:16px;font-size:22px;font-weight:900;z-index:30;pointer-events:none;animation:rflash .55s ease forwards}
@keyframes rflash{0%{scale:.6;opacity:0}25%{scale:1;opacity:1}75%{opacity:1}100%{opacity:0}}
.mute{position:fixed;top:10px;right:12px;z-index:40;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;background:#1e293b;color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.mute:active{transform:scale(.92)}
.hidden{display:none}
.pad:focus-visible,.btn:focus-visible,.hintbtn:focus-visible,.mute:focus-visible,.back:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pad.peek{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 10px 30px rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.3)}
.coach{display:flex;align-items:center;gap:10px;background:#facc15;color:#1c1024;font-weight:800;font-size:14px;border-radius:12px;padding:6px 8px 6px 14px;max-width:min(94vw,420px)}
.coach.hidden{display:none}
.coach button{border:none;border-radius:9px;background:rgba(0,0,0,.18);color:#1c1024;font-weight:900;font-size:13px;min-height:40px;min-width:52px;cursor:pointer;flex:none}
.seg{display:flex;gap:6px;background:#1e293b;border-radius:999px;padding:4px}
.seg button{border:none;border-radius:999px;background:transparent;color:#cbd5e1;font-size:14px;font-weight:800;min-height:40px;min-width:48px;padding:0 14px;cursor:pointer}
.seg button.on{background:linear-gradient(90deg,#f87171,#facc15);color:#1c1024}
.codes{position:fixed;top:62px;left:12px;z-index:10;background:#1e293b;color:#facc15;font-size:12px;font-weight:900;letter-spacing:2px;padding:5px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.pad,.pad.on{transition:none;scale:1}.pad.err,.roundpop,.roundflash{animation:none}.confetti{display:none}}
.confetti{position:fixed;left:50%;top:35%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:60;transition:transform .9s cubic-bezier(.15,.8,.3,1),opacity .9s ease-in}
@keyframes roundpop{0%{scale:1}45%{scale:1.5}100%{scale:1}}
.roundpop{animation:roundpop .35s ease}
.hintbtn{border:none;border-radius:12px;background:#1e293b;color:#facc15;font-size:14px;font-weight:800;padding:0 18px;min-height:44px;cursor:pointer}
.hintbtn:active{transform:scale(.94)}
.hintbtn.used{opacity:.35;color:#94a3b8}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<button class="mute" id="muteBtn" aria-label="Toggle sound">🔊</button>
<h1>Simon Says</h1>
<div class="hud"><span>🎯 Round <b id="round">0</b></span><span>⭐ <b id="score">0</b></span><span>💎 <b id="medals">0</b>/4</span><span>🔥 <b id="run">0</b></span><span>Best: <b class="best" id="best">0</b></span></div>
<button class="hintbtn" id="hintBtn">💡 Replay (1x)</button>
<div class="coach hidden" id="coach"><span id="coachTxt"></span><button id="coachBtn">Skip</button></div>
<div class="codes hidden" id="codesOn">CODES ON</div>
<div id="board">
  <div class="pad p0" data-i="0" role="button" tabindex="0" aria-label="Red (key 1)"><span class="label">RED</span></div>
  <div class="pad p1" data-i="1" role="button" tabindex="0" aria-label="Green (key 2)"><span class="label">GREEN</span></div>
  <div class="pad p2" data-i="2" role="button" tabindex="0" aria-label="Blue (key 3)"><span class="label">BLUE</span></div>
  <div class="pad p3" data-i="3" role="button" tabindex="0" aria-label="Yellow (key 4)"><span class="label">YELLOW</span></div>
</div>
<div class="ov" id="start">
  <h1>Simon Says</h1>
  <div style="color:#cbd5e1;font-size:15px;line-height:1.5">Watch the sequence of colors,<br>then repeat it back!</div>
  <button class="hintbtn" id="mirrorBtn">🪞 Mirror mode: OFF</button>
  <button class="hintbtn" id="gambitBtn">💥 Gambit: OFF</button>
  <div style="color:#cbd5e1;font-size:14px">Start at round:</div>
  <div class="seg" role="group" aria-label="Start at round"><button data-lv="1">1</button><button data-lv="5">5</button><button data-lv="10">10</button></div>
  <button class="btn" id="playBtn">▶ Play</button>
</div>
<div class="ov hidden" id="over">
  <h1>Game Over</h1>
  <div style="font-size:16px">You reached round <b id="finRound">0</b></div>
  <div style="font-size:16px">Score: <b class="best" id="finScore">0</b> · Best: <b class="best" id="finBest">0</b></div>
  <div style="font-size:15px;color:#fbbf24;display:none" id="finGambit"></div>
  <div style="font-size:15px;color:#94a3b8" id="finMedals"></div>
  <div style="font-size:15px;color:#fbbf24" id="finRun"></div>
  <button class="btn" id="againBtn">Play Again</button>
  <button class="hintbtn" id="undoBtn">↩ Undo that tap (once per game)</button>
</div>
<script>

const FREQS=[329.6,415.3,493.9,659.3];
let seq=[],step=0,listening=false,round=0,best=+localStorage.getItem('simonBest')||0,token=0;
let score=0,bestScore=+localStorage.getItem('simonScore')||0,hintUsed=false;
const SDK=window.ArcadeSDK||null;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function scene(sc,extra){try{SDK&&SDK.state(Object.assign({scene:sc},extra||{}));}catch(e){}}
function cheated(){return !!(SDK&&SDK.cheated);}
function save(k,v){if(cheated())return;try{localStorage.setItem(k,v);}catch(e){}}
let startLv=1;try{startLv=+localStorage.getItem('simonStart')||1;}catch(e){}if(![1,5,10].includes(startLv))startLv=1;
let slowSimon=false,showNext=false,endless=false,undoLeft=1,missed=null;
let mirrorMode=false,gambit=false,gambitPts=0;
let medals=[];try{medals=JSON.parse(localStorage.getItem('simonMedals')||'[]')||[];}catch(e){medals=[];}
const PAD_EMOJI=['🟥','🟩','🟦','🟨'];
let runStreak=+localStorage.getItem('simonRun')||0;
let muted=localStorage.getItem('simonMuted')==='1';
document.getElementById('best').textContent=best;
document.getElementById('medals').textContent=medals.length;
document.getElementById('run').textContent=runStreak;
const pads=document.querySelectorAll('.pad');
let AC;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function confetti(){if(RM)return;const cols=['#f87171','#4ade80','#60a5fa','#facc15'];for(let i=0;i<30;i++){const d=document.createElement('div');d.className='confetti';d.style.background=cols[i%cols.length];document.body.appendChild(d);const a=Math.random()*Math.PI*2,s=90+Math.random()*240,dx=Math.cos(a)*s,dy=Math.sin(a)*s-140,rot=(Math.random()*720-360)|0;requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform='translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)';d.style.opacity='0';}));setTimeout(()=>d.remove(),1000);}}
const muteBtn=document.getElementById('muteBtn');
function renderMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;localStorage.setItem('simonMuted',muted?'1':'0');renderMute();});
renderMute();
function padMs(){return Math.round((210+250*Math.pow(.93,round-1))*(slowSimon?1.8:1));}
function flash(i,ms){
const p=pads[i];
p.classList.add('on');
sfx('tap');
setTimeout(()=>p.classList.remove('on'),ms*.75);
}
function startGame(){
token++;
seq=[];round=0;listening=false;
score=0;document.getElementById('score').textContent=0;
hintUsed=false;const hb=document.getElementById('hintBtn');hb.classList.remove('used');hb.textContent=endless?'💡 Replay (∞)':'💡 Replay (1x)';undoLeft=1;missed=null;
for(let k=1;k<startLv;k++)seq.push(Math.floor(Math.random()*4));
scene('play');
gambitPts=0;
document.getElementById('round').textContent=0;
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
nextRound();
}
function nextRound(){
listening=false;step=0;
seq.push(Math.floor(Math.random()*4));
round=seq.length;
document.getElementById('round').textContent=round;
const rf=document.createElement('div');rf.className='roundflash';rf.textContent='Round '+round;
document.body.appendChild(rf);setTimeout(()=>rf.remove(),600);
const tk=token;setTimeout(()=>{if(tk===token)playSeq(0);},650);
}
function playSeq(i,setListening){
if(i>=seq.length){if(setListening!==false){listening=true;yourTurn();}return;}
if(i===0&&setListening!==false)tutWatch();
const ms=padMs();
flash(seq[i],ms);
setTimeout(()=>playSeq(i+1,setListening),ms);
}
function mirror(i){return mirrorMode?3-i:i;}
function press(i){
initAudio();
if(!listening||(SDK&&SDK.paused))return;
flash(i,180);clearPeek();
  if(mirror(i)===seq[step]){
    step++;if(step<seq.length)yourTurn();
    if(step===seq.length){
      listening=false;
      sfx('win');
      const rEl=document.getElementById('round');rEl.classList.remove('roundpop');void rEl.offsetWidth;rEl.classList.add('roundpop');
      score+=10*round;document.getElementById('score').textContent=score;
      if(gambit)gambitPts+=5*round;
      let got=0;
      seq.forEach(c=>{if(medals.indexOf(c)===-1){medals.push(c);got++;}});
      if(got){
        document.getElementById('medals').textContent=medals.length;
        save('simonMedals',JSON.stringify(medals));
        sfx('levelup');
        const mf=document.createElement('div');mf.className='roundflash';mf.textContent='💎 '+PAD_EMOJI[medals[medals.length-1]]+' COLLECTED! '+medals.length+'/4';
        document.body.appendChild(mf);setTimeout(()=>mf.remove(),600);
      }
      tutRound();
      const tk=token;setTimeout(()=>{if(tk===token)nextRound();},750);
    }
}else{
listening=false;missed={step};
sfx('buzz');
const p=pads[i];p.classList.add('err');
scene('over',{score:score,round:round});
document.getElementById('undoBtn').classList.toggle('hidden',undoLeft<1);
setTimeout(()=>p.classList.remove('err'),500);
const nb=round>best&&!cheated();
if(nb){best=round;localStorage.setItem('simonBest',best);document.getElementById('best').textContent=best;}
const ns=score>bestScore&&!cheated();
if(ns){bestScore=score;localStorage.setItem('simonScore',bestScore);}
document.getElementById('finScore').textContent=score;
document.getElementById('finRound').textContent=round;
document.getElementById('finBest').textContent=best+(nb?' NEW!':'');
if(round>=4){runStreak++;}else{runStreak=0;}
save('simonRun',runStreak);
document.getElementById('run').textContent=runStreak;
document.getElementById('finMedals').textContent='💎 '+medals.length+'/4 pads collected';
document.getElementById('finRun').textContent='🔥 Golden runs: '+runStreak+' (clear rounds 1-3 in a row)';
const gWon=gambit&&round>=3;
const gEl=document.getElementById('finGambit');
if(gEl){if(gambit){gEl.style.display='';gEl.textContent=gWon?('⚔ Gambit bonus: +'+gambitPts+' · Total: '+(score+gambitPts)):'💀 Gambit lost — died before round 3!';}else{gEl.style.display='none';}}
if(nb)confetti();
const tk=token;
setTimeout(()=>{if(tk===token)sfx('lose');},450);
// Teach the miss: flash the correct sequence back before the game-over screen,
// instead of just ending — a wrong tap should show what the right answer was.
const replayDelay=750,ms=padMs(),replayDur=seq.length*ms;
setTimeout(()=>{
  if(tk!==token)return;
  const rf=document.createElement('div');rf.className='roundflash';rf.textContent='✅ Correct sequence:';
  document.body.appendChild(rf);setTimeout(()=>rf.remove(),600);
  playSeq(0,false);
},replayDelay);
setTimeout(()=>{if(tk===token)document.getElementById('over').classList.remove('hidden');},replayDelay+replayDur+300);
}
}
const hintBtn=document.getElementById('hintBtn');
function replayHint(){
if((hintUsed&&!endless)||!listening||step>=seq.length)return;
initAudio();hintUsed=true;listening=false;
if(!endless){hintBtn.classList.add('used');hintBtn.textContent='💡 Used';}
sfx('whoosh');
const tk=token;setTimeout(()=>{if(tk===token)playSeq(0);},120);
}
const $=id=>document.getElementById(id);
// Buttons answer the pointer at once and the keyboard (Enter) through click.
function tap(el,fn){el.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();fn();});el.addEventListener('click',e=>{if(e.detail===0)fn();});}
tap(hintBtn,replayHint);
const mirrorBtn=$('mirrorBtn');
function updMirrorBtn(){mirrorBtn.textContent='🪞 Mirror mode: '+(mirrorMode?'ON':'OFF');}
tap(mirrorBtn,()=>{mirrorMode=!mirrorMode;updMirrorBtn();});
updMirrorBtn();
const gambitBtn=$('gambitBtn');
function updGambitBtn(){gambitBtn.textContent='💥 Gambit: '+(gambit?'ON':'OFF');}
tap(gambitBtn,()=>{gambit=!gambit;updGambitBtn();});
updGambitBtn();
pads.forEach(p=>{
p.addEventListener('pointerdown',()=>press(+p.dataset.i),{passive:true});
p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();press(+p.dataset.i);}});
});
window.addEventListener('keydown',e=>{if((SDK&&SDK.paused)||e.repeat)return;if(e.key>='1'&&e.key<='4')press(+e.key-1);if(e.key==='r'||e.key==='R')replayHint();});
tap($('playBtn'),()=>{initAudio();begin(false);});
tap($('againBtn'),()=>begin(false));
/* ---- undo: once per game, take back the wrong tap and carry on from it ---- */
function undoMiss(){if(!missed||undoLeft<1)return;undoLeft--;token++;const st=missed.step;missed=null;
$('over').classList.add('hidden');document.querySelectorAll('.roundflash').forEach(x=>x.remove());
step=st;listening=true;sfx('whoosh');scene('play');coach('↩ Taken back. Carry on from colour '+(st+1)+' of '+seq.length+'.','OK');yourTurn();}
tap($('undoBtn'),undoMiss);
/* ---- start round: a level select ---- */
function paintLv(){document.querySelectorAll('[data-lv]').forEach(b=>{b.classList.toggle('on',+b.dataset.lv===startLv);b.setAttribute('aria-pressed',String(+b.dataset.lv===startLv));});}
document.querySelectorAll('[data-lv]').forEach(b=>tap(b,()=>{startLv=+b.dataset.lv;try{localStorage.setItem('simonStart',startLv);}catch(e){}paintLv();}));
paintLv();
function begin(withTut){tut=0;$('coach').classList.add('hidden');if(withTut||!tutSeen)tut=1;startGame();}
function toTitle(){token++;listening=false;$('over').classList.add('hidden');$('coach').classList.add('hidden');clearPeek();paintLv();$('start').classList.remove('hidden');scene('title');}
/* ---- first-game coach marks ---- */
let tut=0,tutSeen=false;try{tutSeen=localStorage.getItem('simonTut')==='1';}catch(e){}
function coach(t,b){$('coachTxt').textContent=t;$('coachBtn').textContent=b||'Skip';$('coach').classList.remove('hidden');}
function endTut(){tut=0;$('coach').classList.add('hidden');tutSeen=true;try{localStorage.setItem('simonTut','1');}catch(e){}}
tap($('coachBtn'),()=>{if(tut)endTut();else $('coach').classList.add('hidden');});
function tutWatch(){if(tut===1)coach('👀 Watch: Simon lights up a colour and plays its note.');}
function yourTurn(){if(tut===1){tut=2;coach('👆 Your turn: tap the same colour (or press 1 to 4).');}if(showNext&&listening)peekNext();}
function tutRound(){if(tut===2){tut=3;coach('✅ Each round adds one more colour. Repeat the whole sequence from the start!','Got it');}else if(tut===3)endTut();}
/* ---- hint: the next colour to tap ---- */
const NAMES=['RED','GREEN','BLUE','YELLOW'];
function hint(){if(!$('start').classList.contains('hidden'))return 'Press Play, watch the flashes, then repeat them.';
if(!listening)return 'Watch the pads: Simon is showing the sequence.';
const want=seq[step],padI=mirrorMode?3-want:want;
return 'Next is '+NAMES[want]+(mirrorMode?', so in Mirror mode tap '+NAMES[padI]:'')+' (colour '+(step+1)+' of '+seq.length+').'+(!hintUsed||endless?' Replay shows the whole sequence again.':'');}
function peekNext(){clearPeek();const want=seq[step];if(want===undefined)return;pads[mirrorMode?3-want:want].classList.add('peek');}
function clearPeek(){pads.forEach(p=>p.classList.remove('peek'));}
/* ---- codes: just for fun; a game with codes on keeps no records ---- */
const CODES={SLOWSIMON:'Slow Simon: flashes last almost twice as long',SHOWNEXT:'Show next: the pad to tap next is outlined',ENDLESSREPLAY:'Endless replay: replay the sequence as often as you like'};
function code(c){if(!CODES[c])return{ok:false};$('codesOn').classList.remove('hidden');
if(c==='SLOWSIMON')slowSimon=true;if(c==='SHOWNEXT'){showNext=true;if(listening)peekNext();}if(c==='ENDLESSREPLAY'){endless=true;hintBtn.classList.remove('used');hintBtn.textContent='💡 Replay (∞)';}
return{ok:true,message:CODES[c]};}
if(SDK)SDK.init({
pauseButton:'br',pauseKeys:'p+esc',
onRestart:()=>begin(false),
onExit:toTitle,
onTutorial:()=>begin(true),
onHint:hint,
onCheat:code,
});
scene('title');
</script>
</body>
</html>
