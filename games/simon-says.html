  background:radial-gradient(circle at 32% 24%,#3d6a8d 0,#1a3d59 46%,#0c1e30 100%);box-shadow:0 4px 0 #6b430c,0 8px 12px rgba(20,8,0,.45),inset 0 2px 0 rgba(255,255,255,.28);z-index:12;position:fixed;left:50%;margin-left:-26px}

<body class="kk">
<div id="stage" class="w0"><div class="wall"></div><div class="cone"></div><div class="floor"></div><div class="curtain l"></div><div class="curtain r"></div><div class="pelmet"></div><div class="fringe"></div></div>

<script src="kit/kidskit.js"></script>
<script>
(function () {
'use strict';
var KKs = window.KK, SDK = window.ArcadeSDK || null, h = KKs.h, img = KKs.img;
var $ = function (id) { return document.getElementById(id); };
var IMG = function (n) { return KKs.imgUrl(n); };

/* ======================= bands, consoles, stickers ======================= */
var BANDS = [
  { name: 'Farm Band', pads: [['cow-face', 'Cow'], ['pig-face', 'Pig'], ['chicken', 'Chicken'], ['ewe', 'Sheep']], notes: [523.25, 659.25, 783.99, 880], wave: 'triangle' },
  { name: 'Pet Band', pads: [['cat-face', 'Cat'], ['dog-face', 'Dog'], ['rabbit-face', 'Rabbit'], ['hamster', 'Hamster']], notes: [587.33, 739.99, 880, 987.77], wave: 'sine' },
  { name: 'Jungle Band', pads: [['lion', 'Lion'], ['monkey-face', 'Monkey'], ['elephant', 'Elephant'], ['frog', 'Frog']], notes: [392, 493.88, 587.33, 698.46], wave: 'triangle' }];
var CONSOLES = [{ id: 'oak', img: 'drum', name: 'Oak', need: 0 }, { id: 'walnut', img: 'guitar', name: 'Walnut', need: 6 }, { id: 'brass', img: 'trumpet', name: 'Brass', need: 13 }, { id: 'crystal', img: 'gem-stone', name: 'Crystal', need: 22 }];
var STICK = [{ id: 's1', img: 'musical-note', name: 'Note', need: 2 }, { id: 's2', img: 'maracas', name: 'Maracas', need: 4 }, { id: 's3', img: 'saxophone', name: 'Saxophone', need: 8 }, { id: 's4', img: 'violin', name: 'Violin', need: 11 },
  { id: 's5', img: 'accordion', name: 'Accordion', need: 15 }, { id: 's6', img: 'banjo', name: 'Banjo', need: 18 }, { id: 's7', img: 'flute', name: 'Flute', need: 26 }, { id: 's8', img: 'microphone', name: 'Microphone', need: 30 }, { id: 's9', img: 'trophy', name: 'Trophy', need: 38 }];
var ALBUM = CONSOLES.concat(STICK);
var P = KKs.profile('simon_kk', { album: ALBUM, dailyGoal: 3, dailyBonus: 3 });
var NLEV = 15, LEN = [3, 4, 5, 5, 6, 6, 7, 7, 8, 8, 8, 9, 9, 10, 12];
var LV = []; for (var i = 1; i <= NLEV; i++) LV.push({ n: i, len: LEN[i - 1], world: Math.floor((i - 1) / 5), note: Math.max(300, 700 - i * 24), gap: Math.max(110, 300 - i * 9), boss: i % 5 === 0 });

/* ======================= state ======================= */
var state = 'title', cur = 1, cfg = null, seq = [], round = 0, pos = 0, hearts = 3, oops = 0, turn = 'watch', playToken = 0, idleT = 0, jam = false, pts = 0, bestRun = 0;
var cheats = { slow: false, next: false, lives: false }, cheated = false, tut = null, hintTxt = 'Watch the animals, then tap them in the same order.';
var chLv = KKs.ui.chip('sparkles', ''); $('lvchip').replaceWith(chLv.el); chLv.el.id = 'lvchip';
function gs(sc, extra) { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} }
function band() { return BANDS[jam ? Math.min(2, Math.floor(Math.max(0, P.cleared() - 1) / 5)) : cfg ? cfg.world : 0]; }
function consoleSkin() { return P.eqp('console', 'oak'); }

/* ======================= building the console ======================= */
function buildPads(face, bnd, interactive) {
  face.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var p = h('div', { class: 'pad p' + i, 'data-i': i, role: 'button', tabindex: interactive ? '0' : '-1', 'aria-label': bnd.pads[i][1] }, [img(bnd.pads[i][0]), h('div', { class: 'sh' })]);
    face.appendChild(p);
  }
  if (interactive) face.appendChild(h('div', { id: 'hub' }));
}
function setStage(w) { $('stage').className = 'w' + w; document.querySelector('meta[name=theme-color]').content = ['#3a0f10', '#0d444f', '#154a1c'][w]; document.body.style.background = ['#2a0c0c', '#0a2a30', '#0e2a12'][w]; $('console').className = consoleSkin(); }
function size() {
  var vw = window.innerWidth, vh = window.innerHeight, D = Math.min(vw - 20, vh - 250, 400); D = Math.max(220, D); $('console').style.setProperty('--D', D + 'px');
  var wrap = $('wrap'); var top = 150, bot = 92; wrap.style.top = top + 'px'; wrap.style.bottom = bot + 'px';
  var dots = $('dots'); dots.style.top = (top + 4) + 'px'; $('replay').style.bottom = (bot - 60) + 'px';
}
window.addEventListener('resize', function () { clearTimeout(size.t); size.t = setTimeout(size, 120); });
function hubSet(kind, txt) {
  var hb = $('hub'); if (!hb) return; hb.innerHTML = '';
  if (kind === 'num') hb.appendChild(h('b', { text: String(txt) })); else hb.appendChild(img(kind));
}

/* ======================= sound and light ======================= */
function padOn(i, ms, silent) {
  var p = $('face').querySelector('.pad.p' + i); if (!p) return; p.classList.add('lit'); var b = band();
  if (!silent) { KKs.note(b.notes[i], Math.max(0.28, ms / 1000 + 0.15), b.wave, 0.26); if (b.wave === 'sine') KKs.note(b.notes[i] * 2, 0.3, 'sine', 0.06); }
  var a = $('aura'); a.style.setProperty('--glow', getComputedStyle(p).getPropertyValue('--glow') || '#fff'); a.classList.add('on');
  var r = p.getBoundingClientRect(); KKs.fx.burst(r.left + r.width * (i % 2 ? 0.35 : 0.65), r.top + r.height * (i < 2 ? 0.65 : 0.35), 'star', 3);
  KKs.haptic(8);
}
function padOff(i) { var p = $('face').querySelector('.pad.p' + i); if (p) p.classList.remove('lit'); $('aura').classList.remove('on'); }
function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
function playSeq(n) {
  var tok = ++playToken; turn = 'watch'; hubSet('eyes'); $('replay').classList.remove('on'); clearHint();
  var ms = cfg.note * (cheats.slow ? 1.7 : 1), gap = cfg.gap * (cheats.slow ? 1.7 : 1), k = 0;
  function step() {
    if (tok !== playToken || state !== 'play') return;
    if (k >= n) { turn = 'you'; pos = 0; hubSet('pointer'); $('replay').classList.add('on'); idleT = 0; return; }
    var i = seq[k++]; padOn(i, ms); setTimeout(function () { padOff(i); setTimeout(step, gap); }, ms);
  }
  setTimeout(step, 650);
}
function dotsPaint() { var d = $('dots'); d.querySelectorAll('i').forEach(function (e, k) { e.classList.toggle('on', k < round - 1 || (k === round - 1 && false)); }); }
function heartsPaint() { var hb = $('hearts'); hb.innerHTML = ''; for (var i = 0; i < 3 + (cheats.lives ? 3 : 0); i++) hb.appendChild(img('red-heart', i < hearts ? '' : 'lost')); }

/* ======================= a level ======================= */
function startLevel(n, opts) {
  clearUI(); jam = false; cur = Math.max(1, Math.min(NLEV, n | 0)); cfg = LV[cur - 1]; state = 'ready'; hearts = 3 + (cheats.lives ? 3 : 0); oops = 0; round = 1; pts = 0;
  cheated = !!(SDK && SDK.cheated) || cheats.slow || cheats.next || cheats.lives; seq = []; for (var i = 0; i < cfg.len; i++) { var v = Math.floor(Math.random() * 4); if (i > 1 && v === seq[i - 1] && v === seq[i - 2]) v = (v + 1) % 4; seq.push(v); }
  setStage(cfg.world); buildPads($('face'), band(), true); size(); $('wrap').classList.add('on'); $('hud').classList.add('on'); $('dots').classList.remove('on');
  var d = $('dots'); d.innerHTML = ''; for (var k = 0; k < cfg.len; k++) d.appendChild(h('i')); d.classList.add('on'); dotsPaint(); heartsPaint();
  chLv.set('Level ' + cur); chLv.el.querySelector('img').src = IMG(['drum', 'guitar', 'trumpet'][cfg.world]);
  $('rdT').textContent = cfg.boss ? 'Big show!' : 'Level ' + cur; $('rdN').textContent = cfg.len; $('rdW').textContent = band().name; $('ready').classList.add('on'); KKs.sfx('level'); $('codes').style.display = cheated ? 'block' : 'none';
  hubSet('musical-notes'); gs('play', { score: 0, level: cur }); P.touchDay();
  setTimeout(function () { if (state !== 'ready') return; $('ready').classList.remove('on'); state = 'play'; KKs.banner('Listen!'); playSeq(round); if (cur === 1 && !P.flag('tutSim')) startTutorial(); }, opts && opts.quick ? 700 : 1500);
}
function padTap(i) {
  if ((state !== 'play' && state !== 'jam') || (SDK && SDK.paused)) return; KKs.audio.unlock();
  if (state === 'jam') { padOn(i, 260); setTimeout(function () { padOff(i); }, 260); return; }
  if (turn !== 'you') return; idleT = 0; clearHint();
  var b = band(); padOn(i, 320); setTimeout(function () { padOff(i); }, 320);
  if (i === seq[pos]) {
    pos++; tutStep('tap', pos);
    if (pos >= round) { turn = 'wait'; success(); }
  } else wrong(i);
}
function success() {
  pts += round * 10; KKs.sfx('good'); hubSet('thumbs-up'); var dots = $('dots').querySelectorAll('i'); if (dots[round - 1]) dots[round - 1].classList.add('on'); KKs.float(window.innerWidth / 2, 190, 'Yes!', '#a86f16'); KKs.fx.burst(window.innerWidth / 2, window.innerHeight * 0.4, 'star', 8);
  try { SDK && SDK.state({ scene: 'play', score: pts, level: cur }); } catch (e) {}
  bestRun = Math.max(bestRun, round);
  if (round >= cfg.len) { setTimeout(win, 700); return; }
  round++; setTimeout(function () { if (state === 'play') playSeq(round); }, 900);
}
function wrong(i) {
  turn = 'wait'; oops++; hearts--; heartsPaint(); KKs.sfx('oops'); KKs.shake($('console'), 6); hubSet('pleading-face'); KKs.haptic(30);
  var hb = $('hearts'); hb.classList.remove('kk-pop'); void hb.offsetWidth; hb.classList.add('kk-pop');
  if (hearts <= 0) { setTimeout(lose, 900); return; }
  // show the right pad, then play the round again from the start
  setTimeout(function () { padOn(seq[pos], 500, true); $('face').querySelector('.pad.p' + seq[pos]).classList.add('hint'); setTimeout(function () { padOff(seq[pos]); clearHint(); KKs.ui.toast('Watch again!', 'eyes'); playSeq(round); }, 900); }, 700);
  if (tut) endTut();
}
function stopAll() { playToken++; }
function win() {
  state = 'over'; stopAll(); var stars = oops === 0 ? 3 : oops === 1 ? 2 : 1, score = pts + (3 - Math.min(3, oops)) * 20;
  var res = { unlocked: [], first: false, newBest: false }, daily = null;
  if (!cheated) {
    res = P.finish(cur, stars, score); daily = P.dailyWin(); P.stat('rounds', cfg.len);
    try { localStorage.setItem('simonBest', String(Math.max(bestRun, +localStorage.getItem('simonBest') || 0))); localStorage.setItem('simonScore', String(P.d.hi || score)); } catch (e) {}
    try { if (SDK && SDK.profile) { SDK.profile.award({ xp: 5 + stars * 3, reason: 'Level ' + cur }); SDK.profile.achievement('first-tune', { title: 'First tune', desc: 'Finish a level', tier: 'bronze' }); if (stars === 3) SDK.profile.achievement('perfect-ear', { title: 'Perfect ear', desc: 'Finish a level with no mistakes', tier: 'silver' }); if (cur >= 10 && stars > 0) SDK.profile.achievement('band-leader', { title: 'Band leader', desc: 'Reach level 10', tier: 'gold' }); SDK.profile.quest('simon-stars', Math.min(1, P.total() / 45), { title: 'Collect 45 stars' }); } } catch (e) {}
  }
  gs('over', { score: score, level: cur, stars: stars }); KKs.sfx('win'); KKs.confetti();
  $('face').querySelectorAll('.pad').forEach(function (p, k) { setTimeout(function () { p.classList.add('lit'); setTimeout(function () { p.classList.remove('lit'); }, 240); }, k * 160); });
  setTimeout(function () { showResult(stars, res, daily, true); }, 1000);
}
function lose() {
  state = 'over'; stopAll(); gs('over', { score: pts, level: cur, stars: 0 }); KKs.sfx('oops'); setTimeout(function () { showResult(0, { unlocked: [] }, null, false); }, 500);
}
function showResult(stars, res, daily, ok) {
  var lines = [ok ? 'You copied ' + cfg.len + ' sounds!' : 'You got to round ' + round + '.']; if (ok && oops === 0) lines.push('No mistakes!'); if (cheated) lines.push('Codes are on, so this level does not count.'); if (daily && daily.just) lines.push('Daily goal done! +3 stars'); if (ok && cur === NLEV) lines.push('You finished every level!');
  var btn = [], more = ok && cur < NLEV;
  if (more) btn.push({ label: 'Next level', cls: 'kk-go kk-big', pic: 'star', fn: function () { startLevel(cur + 1, { quick: true }); } });
  btn.push({ label: ok ? 'Play again' : 'Try again', cls: ok ? 'kk-blue' : 'kk-go kk-big', fn: function () { startLevel(cur, { quick: true }); } }); btn.push({ label: 'Levels', cls: 'kk-purple', fn: showMap });
  KKs.ui.result({ title: ok ? (stars === 3 ? 'Perfect ears!' : 'Great show!') : 'Nearly there!', stars: stars, lines: lines, newItems: res.unlocked, buttons: btn }); if (ok) KKs.sfx('star');
}

/* ---------- hints and the coach ---------- */
var hintEl = null; function clearHint() { $('face').querySelectorAll('.pad.hint').forEach(function (p) { p.classList.remove('hint'); }); }
function hint() {
  if (state !== 'play' || turn !== 'you') return state === 'title' ? 'Press Play, then copy the animals.' : 'Watch and listen first.';
  var p = $('face').querySelector('.pad.p' + seq[pos]); if (p) { p.classList.add('hint'); setTimeout(clearHint, 1800); }
  return 'Tap the ' + band().pads[seq[pos]][1] + ' (it is glowing).';
}
setInterval(function () { if (state === 'play' && turn === 'you' && !(SDK && SDK.paused)) { idleT++; if (idleT === 7) hint(); if (cheats.next) { var p = $('face').querySelector('.pad.p' + seq[pos]); if (p) p.classList.add('hint'); } } }, 1000);
function startTutorial() { tut = { step: 1 }; tut.co = KKs.ui.coach('Listen, then copy!', { pic: 'eyes', top: '112px', skip: function () { endTut(); P.flag('tutSim', true); } }); }
function tutStep(kind, v) { if (!tut) return; if (kind === 'tap' && v >= 1 && tut.step === 1) { tut.step = 2; tut.co.close(); tut.co = KKs.ui.coach('Yes! Same order!', { pic: 'thumbs-up', top: '112px' }); setTimeout(function () { endTut(); P.flag('tutSim', true); }, 2200); } }
function endTut() { if (!tut) return; if (tut.co) tut.co.close(); tut = null; }
KKs.press($('replay'), function () { if (state === 'play' && turn === 'you') { pos = 0; playSeq(round); } });
$('replay').appendChild(img('counterclockwise-arrows-button'));

/* ======================= screens ======================= */
function clearUI() { document.querySelectorAll('.kk-title,.kk-map,.kk-album,.kk-scrim,.kk-coach,.kk-finger').forEach(function (e) { e.remove(); }); }
function heroEl() { var w = h('div', { id: 'titleHero' }), c = h('div', { class: 'consolebox ' + consoleSkin() }), f = h('div', { class: 'facebox' }); c.appendChild(f); buildPads(f, BANDS[Math.min(2, Math.floor(Math.max(0, P.cleared() - 1) / 5))], false); w.appendChild(c); return w; }
function showTitle() {
  stopAll(); clearUI(); state = 'title'; jam = false; $('wrap').classList.remove('on'); $('hud').classList.remove('on'); $('dots').classList.remove('on'); $('replay').classList.remove('on'); $('ready').classList.remove('on'); $('codes').style.display = 'none'; $('aura').classList.remove('on');
  var nxt = P.next(NLEV), fresh = P.cleared() === 0; setStage(LV[nxt - 1].world);
  var extra = [{ cls: 'kk-blue', pic: 'musical-keyboard', label: 'Jam', fn: startJam }];
  KKs.ui.title(document.body, { title: 'Simon Says', tagline: fresh ? 'Copy the band!' : BANDS[LV[nxt - 1].world].name + ' - level ' + nxt, heroEl: heroEl(), profile: P, playLabel: fresh ? 'Play' : 'Level ' + nxt, onPlay: function () { startLevel(nxt); },
    onMap: showMap, onAlbum: showAlbum, albumLabel: 'Stickers', albumPic: 'musical-notes', onHelp: showHelp, extraIcons: extra, dot: (P.d.seen.albumN || 0) < P.unlockedIds().length ? String(P.unlockedIds().length - (P.d.seen.albumN || 0)) : '' });
  gs('title', { score: +localStorage.getItem('simonScore') || 0 });
}
function startJam() {
  clearUI(); jam = true; state = 'jam'; cfg = LV[0]; var w = Math.min(2, Math.floor(Math.max(0, P.cleared() - 1) / 5)); setStage(w); buildPads($('face'), BANDS[w], true); size(); $('wrap').classList.add('on'); hubSet('musical-keyboard'); P.touchDay(); gs('play', { score: 0, level: 0 });
  $('console').className = consoleSkin(); KKs.ui.toast('Tap the animals to play!', 'musical-notes');
  var back = h('button', { class: 'kk-btn kk-blue', type: 'button', style: { position: 'fixed', left: '50%', bottom: 'calc(var(--kk-bot) + 12px)', transform: 'translateX(-50%)', zIndex: 30 } }, [h('span', { text: 'Done' })]); KKs.press(back, function () { back.remove(); showTitle(); }); back.id = 'jamDone'; document.body.appendChild(back);
}
function showMap() { KKs.ui.map(document.body, { profile: P, title: 'Levels', levels: LV.map(function (l) { return { n: l.n, boss: l.boss, banner: (l.n - 1) % 5 === 0 ? BANDS[l.world].name : null }; }), onPick: function (n) { startLevel(n); } }); }
function showAlbum() {
  P.d.seen.albumN = P.unlockedIds().length; P.save();
  KKs.ui.album(document.body, { profile: P, title: 'Stickers', sections: [{ title: 'Music boxes', slot: 'console', def: 'oak', items: CONSOLES }, { title: 'Band stickers', items: STICK }], onEquip: function () {}, onClose: function () { if (state === 'title') showTitle(); } });
  var t = document.querySelector('.kk-title'); if (t) t.remove();
}
function showHelp() { KKs.ui.help({ steps: [{ pic: 'eyes', text: 'Watch the animals sing.' }, { pic: 'pointer', text: 'Tap them in the same order.' }, { pic: 'star', text: 'Fewer mistakes, more stars.' }] }); }
function pointerPad(e) { var el = e.target.closest && e.target.closest('.pad'); if (!el) return; e.preventDefault && 0; el.classList.add('down'); setTimeout(function () { el.classList.remove('down'); }, 120); padTap(+el.dataset.i); }
$('face').addEventListener('pointerdown', pointerPad, { passive: true });
$('face').addEventListener('keydown', function (e) { var el = e.target.closest('.pad'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); padTap(+el.dataset.i); } });
document.addEventListener('keydown', function (e) {
  if (state === 'title' && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) { e.preventDefault(); $('playBtn') && $('playBtn').click(); return; }
  if (/^[1-4]$/.test(e.key)) padTap(+e.key - 1); else if (e.key === 'r' || e.key === 'R') { if (state === 'play' && turn === 'you') { pos = 0; playSeq(round); } }
});

/* ======================= arcade hooks ======================= */
var CODES = { SLOWSIMON: 'Slow Simon: the animals sing almost twice as slowly', SHOWNEXT: 'Show next: the pad to tap next is always outlined', EXTRALIVES: 'Extra lives: three more hearts' };
function code(c) {
  c = String(c || '').toUpperCase(); if (!CODES[c]) return { ok: false };
  if (c === 'SLOWSIMON') cheats.slow = true; if (c === 'SHOWNEXT') cheats.next = true; if (c === 'EXTRALIVES') { cheats.lives = true; if (state === 'play') { hearts += 3; heartsPaint(); } }
  cheated = true; $('codes').style.display = 'block'; return { ok: true, message: CODES[c] };
}
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: function () { if (jam) return; startLevel(cur, { quick: true }); }, onExit: function () { var j = $('jamDone'); if (j) j.remove(); showTitle(); }, onTutorial: function () { P.flag('tutSim', false); startLevel(1, { quick: true }); }, onHint: hint, onCheat: code, cheats: [{ code: 'SLOWSIMON', effect: CODES.SLOWSIMON }, { code: 'SHOWNEXT', effect: CODES.SHOWNEXT }, { code: 'EXTRALIVES', effect: CODES.EXTRALIVES }] });
KKs.ui.topbar({ back: true }); KKs.preload(['star', 'eyes', 'pointer', 'thumbs-up', 'red-heart', 'pleading-face', 'musical-notes']);
window.__sim = { get state() { return state; }, get seq() { return seq; }, get turn() { return turn; }, get round() { return round; }, get pos() { return pos; }, get cfg() { return cfg; }, LV: LV, P: P, start: startLevel, tap: padTap, get hearts() { return hearts; } };
showTitle();
})();
</script>
