<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#274766">
<title>Tic Tac Toe</title>
<style>
:root{--bg1:#38607f;--bg2:#12233a;--ink:#fff3d2;--muted:rgba(255,243,210,.7);--accent:#ffd979;--bgtex:url(assets/tex/linen.jpg);--bs:min(calc(100vw - 24px),calc(100vh - 330px),460px);--pz-ov1:#38607f;--pz-ov2:#12233a;--pz-ovink:#fff3d2}
@supports (height:100dvh){:root{--bs:min(calc(100vw - 24px),calc(100dvh - 330px),460px)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--pz-text,system-ui,-apple-system,'Segoe UI',sans-serif);color:var(--ink);background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,196,112,.32),rgba(255,196,112,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,320px;background-blend-mode:normal,normal,soft-light;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.glass{background:var(--pz-navy,linear-gradient(180deg,#1c3460,#0a162e));box-shadow:inset 0 0 0 1.5px rgba(255,220,140,.42),inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.35);border-radius:16px;color:#fff3d2}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px;touch-action:none}
#top{width:min(100%,480px);display:flex;align-items:center;gap:8px;min-height:48px;padding-right:52px}
#back{display:inline-flex;align-items:center;min-height:44px;padding:0 12px 0 4px;color:var(--muted);text-decoration:none;font:700 15px/1 var(--pz-display,sans-serif);text-shadow:0 1px 0 rgba(0,0,0,.4)}
#modeName{flex:1;text-align:center;font:600 16px/1.1 var(--pz-display,sans-serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#plaque{margin-top:auto;width:var(--bs);display:grid;grid-template-columns:78px 1fr 78px;align-items:center;gap:6px;padding:8px 10px;border-radius:18px;color:#4a2f17;box-shadow:0 0 0 2px #6e4519,0 0 0 4px #e6bb55,0 10px 20px rgba(0,0,0,.4),inset 0 0 26px rgba(120,70,10,.22);min-height:98px}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.side b{font:700 14px/1 var(--pz-display,sans-serif);color:#5b3a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px}
.med{width:52px;height:52px;border-radius:50%;background-color:var(--mc,#efe2c4);background-image:radial-gradient(circle at 35% 25%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--pz-oak);background-size:auto,120px;background-blend-mode:normal,overlay;box-shadow:0 0 0 3px #e6bb55,0 0 0 5px #7a4d10,0 4px 6px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden;position:relative}
.med svg{width:100%;height:100%}
.med canvas{width:100%;height:100%}
.pips{display:flex;gap:4px;height:12px}
.pips i{width:11px;height:11px;border-radius:50%;background:linear-gradient(180deg,#4b2e10,#6b4519);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.4)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff3b0,#e6b53d 55%,#a06a10);box-shadow:0 0 6px rgba(255,190,60,.8),0 0 0 1px #8a5a0c}
#bubble{font:800 14px/1.3 var(--pz-text,sans-serif);color:#4a2f17;text-align:center;padding:6px 8px;border-radius:12px;background:rgba(255,250,232,.7);box-shadow:inset 0 1px 3px rgba(80,40,0,.25),0 1px 0 rgba(255,255,255,.5);min-height:40px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 12px rgba(0,0,0,.5))}
#cells button{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;touch-action:none}
#cells button:focus-visible{outline:3px solid var(--accent);outline-offset:-4px}
#praise{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;font:700 40px/1 var(--pz-display,sans-serif);color:#fff3c0;text-shadow:0 3px 0 rgba(90,40,0,.85),0 0 26px rgba(255,190,70,.9);opacity:0;z-index:5}
#praise.go{animation:praise 1.2s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes praise{0%{opacity:0;transform:scale(.4) rotate(-6deg)}16%{opacity:1;transform:scale(1.25) rotate(2deg)}30%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
#status{width:var(--bs);min-height:46px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;font:700 17px/1.2 var(--pz-display,sans-serif);text-align:center}
#status .pc{width:30px;height:30px;flex:none}
#tools{width:var(--bs);display:flex;gap:8px;flex:none;margin-bottom:auto}
.tool{flex:1;min-height:54px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:700 13px/1 var(--pz-display,sans-serif);position:relative;touch-action:manipulation;color:#ffe9a8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.tool svg{width:22px;height:22px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.tool:active{transform:translateY(2px)}
.tool[disabled]{opacity:.4}
.tool:focus-visible,.mbtn:focus-visible,.sbtn:focus-visible,#back:focus-visible,.opp:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));text-align:center;background-color:var(--bg2);background-image:radial-gradient(90% 46% at 50% -4%,rgba(255,196,112,.34),rgba(255,196,112,0) 70%),linear-gradient(180deg,var(--bg1),var(--bg2)),var(--bgtex);background-size:auto,auto,320px;background-blend-mode:normal,normal,soft-light;overflow:auto;-webkit-overflow-scrolling:touch}
.ov.on{display:flex}
#logo{display:flex;flex-direction:column;align-items:center;gap:8px}
#logo .sign{padding:14px 26px 12px;border-radius:18px;background-color:#6b4423;background-image:linear-gradient(135deg,rgba(255,235,190,.3),rgba(0,0,0,0) 50%,rgba(0,0,0,.4)),var(--pz-walnut);background-size:auto,cover;background-blend-mode:normal,multiply;box-shadow:0 0 0 3px #3a230b,0 0 0 5px #e6bb55,0 14px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35)}
#logo b{display:block;font:700 clamp(34px,11vw,48px)/1 var(--pz-display,sans-serif);background:linear-gradient(180deg,#fff8d2,#f6c651 60%,#c98a22);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(40,15,0,.9));letter-spacing:.01em}
#logo canvas{width:120px;height:56px}
.tag{font:600 17px/1.35 var(--pz-display,sans-serif);color:var(--muted);max-width:330px;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.menu{display:flex;flex-direction:column;gap:14px;width:min(340px,100%)}
.mbtn{--a:#8fe062;--b:#3ea52d;--edge:#256f1b;--deep:#1d5a14;--fg:#fff;--sh:rgba(10,50,0,.55);border:0;cursor:pointer;min-height:76px;border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--fg);text-shadow:0 2px 0 var(--sh);background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0) 50%),linear-gradient(180deg,var(--a),var(--b));box-shadow:0 0 0 2px var(--edge),0 6px 0 2px var(--deep),0 14px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);touch-action:manipulation;position:relative;margin-bottom:6px}
.mbtn:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--edge),0 2px 0 2px var(--deep),inset 0 1px 0 rgba(255,255,255,.5)}
.mbtn .med{flex:none;width:46px;height:46px}
.mbtn svg.ic{flex:none;width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.mbtn b{display:block;font:700 23px/1.05 var(--pz-display,sans-serif)}
.mbtn small{display:block;font:800 14px/1.25 var(--pz-text,sans-serif);opacity:.86;margin-top:3px}
.mbtn.cls{--a:#ffd66b;--b:#dc9224;--edge:#8a5a0c;--deep:#6b4408;--fg:#3a2200;--sh:rgba(255,255,255,.5)}
.mbtn.day{--a:#7fbcff;--b:#2d6ccd;--edge:#1c4a99;--deep:#143a78;--sh:rgba(0,20,70,.55)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sbtn{border:0;cursor:pointer;min-height:48px;padding:0 20px;border-radius:14px;font:700 16px/1 var(--pz-display,sans-serif);color:#fff3d2;text-shadow:0 2px 0 rgba(30,12,0,.6);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 52%),linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,0 4px 0 2px #3a230b,0 8px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:4px}
.sbtn:active{transform:translateY(3px)}
#ladder h2{font:700 30px/1 var(--pz-display,sans-serif);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.lad{width:min(360px,100%);border-radius:24px;padding:12px 12px 14px;color:#4a2f17;background-color:#f3e2b3;background-image:linear-gradient(180deg,rgba(255,250,232,.55),rgba(214,170,96,.18)),var(--pz-paper);background-blend-mode:normal,overlay;background-size:auto,220px;box-shadow:0 0 0 3px #6e4519,0 0 0 5px #e6bb55,0 18px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(120,70,10,.25);display:flex;flex-direction:column;gap:8px}
.opp{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 10px;border-radius:14px;background:rgba(120,78,30,.14);box-shadow:inset 0 1px 3px rgba(80,40,0,.22),0 1px 0 rgba(255,255,255,.45);min-height:68px;touch-action:manipulation;color:#4a2f17}
.opp:active{transform:translateY(2px)}
.opp .med{flex:none}
.opp .nm{flex:1;min-width:0}
.opp .nm b{display:block;font:700 18px/1.1 var(--pz-display,sans-serif);color:#5b3a1a}
.opp .nm small{display:block;font:800 13px/1.25 var(--pz-text,sans-serif);color:#7d5a33;margin-top:2px}
.opp .st{flex:none;font:700 16px/1 var(--pz-display,sans-serif);color:#e0a010;letter-spacing:1px;text-shadow:0 1px 0 rgba(90,50,0,.5)}
.opp .st i{font-style:normal;color:rgba(90,50,0,.3)}
.opp.lock{filter:saturate(.35);opacity:.7;cursor:default}
.opp.cur{box-shadow:0 0 0 3px #c2571f,inset 0 1px 3px rgba(80,40,0,.22)}
.opp.lock .med{filter:grayscale(1) brightness(.7)}
#coach{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);z-index:20;width:min(360px,calc(100vw - 24px));display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;color:#4a2f17;font:800 15px/1.25 var(--pz-text,sans-serif);background-color:#f3e2b3;background-image:linear-gradient(180deg,rgba(255,250,232,.55),rgba(214,170,96,.18)),var(--pz-paper);background-blend-mode:normal,overlay;background-size:auto,220px;box-shadow:0 0 0 2px #6e4519,0 0 0 4px #e6bb55,0 12px 30px rgba(0,0,0,.5)}
#coach.on{display:flex}
#coach button{flex:none;min-height:44px;min-width:60px;border:0;border-radius:12px;background:linear-gradient(180deg,#a5773d,#6b4519);box-shadow:0 0 0 2px #4b2e10,inset 0 1px 0 rgba(255,255,255,.4);font:700 15px/1 var(--pz-display,sans-serif);color:#fff3d2;cursor:pointer}
#codesOn{position:fixed;left:12px;top:60px;z-index:31;background:#ffd23f;color:#26170a;font:700 12px/1 var(--pz-display,sans-serif);letter-spacing:.14em;padding:6px 10px;border-radius:999px}
#codesOn[hidden]{display:none}
[hidden]{display:none!important}
@media (max-height:660px){#plaque{min-height:84px;padding:6px 10px}.med{width:44px;height:44px}#bubble{min-height:34px;font-size:13px}#status{min-height:38px}}
@media (prefers-reduced-motion:reduce){#praise.go{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a id="back" href="../index.html" aria-label="Back to the arcade hub">‹ Hub</a><div id="modeName">Tic Tac Toe</div></div>
  <div id="plaque" class="pz-parch">
    <div class="side"><div class="med" id="medYou"></div><b id="nameYou">You</b><div class="pips" id="pipsYou"></div></div>
    <div id="bubble" aria-live="polite">Your move!</div>
    <div class="side"><div class="med" id="medOpp"></div><b id="nameOpp">Mousey</b><div class="pips" id="pipsOpp"></div></div>
  </div>
  <div id="stage"><canvas id="board" aria-hidden="true"></canvas><div id="cells" role="group" aria-label="Tic Tac Toe board"></div><div id="praise" aria-hidden="true"></div></div>
  <div id="status" class="glass" aria-live="polite"></div>
  <div id="tools">
    <button class="tool glass" id="btnUndo" aria-label="Undo your last move"><span id="icoUndo"></span>Undo</button>
    <button class="tool glass" id="btnHint" aria-label="Show a good move"><span id="icoHint"></span>Hint</button>
    <button class="tool glass" id="btnMenu" aria-label="Menu"><span id="icoMenu"></span>Menu</button>
  </div>
</div>
<div id="coach" role="status"><span id="coachTxt"></span><button id="coachBtn">Skip</button></div>
<div id="codesOn" hidden>CODES ON</div>
<div id="live" style="position:absolute;left:-9999px" aria-live="polite"></div>

<div class="ov on" id="title" role="dialog" aria-label="Tic Tac Toe">
  <div id="logo"><div class="sign"><b>TIC TAC TOE</b></div><canvas id="logoPieces" width="240" height="112" aria-hidden="true"></canvas></div>
  <div class="tag">Beat six critters on the ladder. Win rounds, earn stars, unlock new sets.</div>
  <div class="menu">
    <button class="mbtn" id="mPlay"><span class="med" id="medPlay"></span><span><b id="playName">Play</b><small id="sPlay">Start with Mousey</small></span></button>
    <button class="mbtn cls" id="mLadder"><svg class="ic" viewBox="0 0 40 40"><path d="M20 3l4.8 10.2L36 14.6l-8.2 7.6L30 33 20 27.6 10 33l2.2-10.8L4 14.6l11.2-1.4z" fill="url(#pzGold)" stroke="#8a5a0c" stroke-width="2.2" stroke-linejoin="round"/></svg><span><b>The Ladder</b><small id="sLadder">6 opponents · 18 stars</small></span></button>
    <button class="mbtn day" id="mPvp"><svg class="ic" viewBox="0 0 40 40"><circle cx="13" cy="14" r="6" fill="#fff6dc" stroke="#143a78" stroke-width="2.2"/><circle cx="27" cy="14" r="6" fill="#fff6dc" stroke="#143a78" stroke-width="2.2"/><path d="M3 34c0-7 5-11 10-11s10 4 10 11M17 34c0-7 5-11 10-11s10 4 10 11" fill="#2d6ccd" stroke="#143a78" stroke-width="2.2"/></svg><span><b>Two players</b><small>Pass the phone to a friend</small></span></button>
  </div>
  <div class="row2" id="titleChip"></div>
</div>
<div class="ov" id="ladder" role="dialog" aria-label="The ladder"><h2>The Ladder</h2><div class="lad" id="lad"></div><div class="row2"><span id="starTotal" style="font:700 16px var(--pz-display,sans-serif);color:var(--muted)"></span><button class="sbtn" id="ladBack">‹ Back</button></div></div>
<div class="pz-ov dim" id="pre" role="dialog" aria-label="Next opponent"></div>
<div class="pz-ov dim" id="result" role="dialog" aria-label="Result"></div>

<script src="kit/pz.js"></script>
<script src="kit/critters.js"></script>
<script>
(function () {
'use strict';
const PZ = window.PZ, SDK = window.ArcadeSDK || null, CR = window.Critters;
const $ = id => document.getElementById(id);
const LS = PZ.store, RM = PZ.RM;
const scene = (sc, extra) => { try { SDK && SDK.state(Object.assign({ scene: sc }, extra || {})); } catch (e) {} };
const cheated = () => !!(SDK && SDK.cheated);
const say = t => { const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };

/* ------------------------------------------------------------ piece sets you unlock by playing (real materials) */
const SETS = [
  { id: 'oak', name: 'Oak & Ivory', level: 1, colors: ['#6b4423', '#b8442f', '#efe3c7'], bg: ['#38607f', '#12233a'], ink: '#fff3d2', muted: 'rgba(255,243,210,.7)', accent: '#ffd979', tint: '#274766',
    frame: { tex: 'walnut', tint: null }, surface: { tex: 'oak', tint: '#f2cf94' }, groove: 'rgba(40,18,4,.7)', x: { kind: 'lacquer', base: '#b8442f', tex: 'oak' }, o: { kind: 'lacquer', base: '#f1e6c9', tex: 'pine' } },
  { id: 'slate', name: 'Chalkboard', level: 2, colors: ['#2d4a42', '#f4f1e6', '#ffd86b'], bg: ['#4a3a28', '#1a120a'], ink: '#fff3d2', muted: 'rgba(255,243,210,.7)', accent: '#ffd979', tint: '#3a2c1c',
    frame: { tex: 'oak', tint: '#c98a4a' }, surface: { tex: 'leather', tint: '#5b7d70', light: true }, groove: 'rgba(240,240,225,.22)', x: { kind: 'chalk', base: '#f6f3e8' }, o: { kind: 'chalk', base: '#ffd86b' } },
  { id: 'marble', name: 'Marble & Brass', level: 4, colors: ['#efe8da', '#d9a63a', '#2f7f5f'], bg: ['#ece2cc', '#b9ab8c'], ink: '#4a3620', muted: 'rgba(74,54,32,.72)', accent: '#b8791a', tint: '#ece2cc',
    frame: { tex: 'marble', tint: '#e8d9b8' }, surface: { tex: 'marble', tint: '#f4efe4' }, groove: 'rgba(60,50,40,.55)', x: { kind: 'metal', base: '#d9a63a' }, o: { kind: 'stone', base: '#2f7f5f', tex: 'marble' } },
  { id: 'jade', name: 'Jade & Ruby', level: 6, colors: ['#1f4a3c', '#c8203c', '#3fae7f'], bg: ['#1f5a48', '#08201a'], ink: '#e9fff4', muted: 'rgba(233,255,244,.72)', accent: '#ffe08a', tint: '#1f5a48',
    frame: { tex: 'onyx', tint: '#4a8f76' }, surface: { tex: 'onyx', tint: '#2c5a4a' }, groove: 'rgba(0,20,10,.65)', x: { kind: 'gem', base: '#d3243f' }, o: { kind: 'stone', base: '#3fae7f', tex: 'marble' } },
  { id: 'glass', name: 'Neon Glass', level: 9, colors: ['#141a3c', '#ff4fd8', '#3fe6ff'], bg: ['#2b2270', '#0a0723'], ink: '#efeaff', muted: 'rgba(239,234,255,.72)', accent: '#8ff0ff', tint: '#1a1440',
    frame: { tex: 'onyx', tint: '#6a5fe0' }, surface: { tex: 'leather', tint: '#1c2350', light: false }, groove: 'rgba(120,140,255,.4)', x: { kind: 'glass', base: '#ff4fd8' }, o: { kind: 'glass', base: '#3fe6ff' } },
  { id: 'gold', name: 'Gold & Onyx', level: 12, colors: ['#0f0c08', '#f2c14a', '#3a3630'], bg: ['#3a3016', '#0a0805'], ink: '#fff2c9', muted: 'rgba(255,242,201,.72)', accent: '#ffd979', tint: '#15120a',
    frame: { tex: 'walnut', tint: '#e2b25a' }, surface: { tex: 'leather', tint: '#2a2016', light: false }, groove: 'rgba(255,220,140,.35)', x: { kind: 'metal', base: '#f2c14a' }, o: { kind: 'stone', base: '#1a1712', tex: 'onyx' } },
];
const QUESTS = [
  { id: 'rw3', key: 'roundwin', text: 'Win {n} rounds', goal: 3, xp: 25 },
  { id: 'rw8', key: 'roundwin', text: 'Win {n} rounds', goal: 8, xp: 45 },
  { id: 'mw2', key: 'matchwin', text: 'Win {n} matches', goal: 2, xp: 40 },
  { id: 'flaw', key: 'flawless', text: 'Win a match 2 to 0', goal: 1, xp: 45 },
  { id: 'rp10', key: 'rounds', text: 'Play {n} rounds', goal: 10, xp: 25 },
  { id: 'dr2', key: 'draw', text: 'Draw {n} rounds', goal: 2, xp: 30 },
  { id: 'pvp1', key: 'pvp', text: 'Play a two-player game', goal: 1, xp: 20 },
  { id: 'star3', key: 'star3', text: 'Earn 3 stars in a match', goal: 1, xp: 50 },
];
let set = SETS[0], ready = false, uiOpen = false;
const spriteBust = () => { bgCanvas = null; };
let bgCanvas = null;

    c.save(); c.lineCap = 'round'; c.shadowColor = '#ffcf4a'; c.shadowBlur = CW * 0.3; c.strokeStyle = 'rgba(255,232,150,.95)'; c.lineWidth = Math.max(4, CW * 0.07); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(ex, ey); c.stroke(); c.restore();

function drawSmall(cv2, kind, size) { // a single piece on a small canvas (status bar, plaque, title)

function paintYou() {
  const m = $('medYou'); m.innerHTML = '<canvas></canvas>'; m.style.setProperty('--mc', set.id === 'slate' ? '#3a4a44' : '#cfd8dc'); drawSmall(m.firstChild, 1, 52);

/* ------------------------------------------------------------ playing */
function humanMove(i) {

}

}
function cpuTurn() {

}
function talk(o, ev) { const l = o.lines[ev]; return l[(Math.random() * l.length) | 0]; }
function bubble(t) { $('bubble').textContent = t; }

  else txt = turn === 1 ? 'Your move' : OPPS[match.idx].name + ' is thinking...';

function pips(el, n, total) { el.innerHTML = ''; for (let k = 0; k < total; k++) { const d = document.createElement('i'); if (k < n) d.className = 'on'; el.appendChild(d); } }
function updPlaque() {

  if (match.kind === 'ladder') { const o = OPPS[match.idx]; $('nameOpp').textContent = o.name; $('nameYou').textContent = 'You'; const c = critFor(o), col = CR.color(c), m = $('medOpp'); m.style.setProperty('--mc', col); m.innerHTML = CR.svg(c, shade(col, -0.28)); }
  else { $('nameOpp').textContent = 'Player O'; $('nameYou').textContent = 'Player X'; const m = $('medOpp'); m.style.setProperty('--mc', '#cfd8dc'); m.innerHTML = '<canvas></canvas>'; drawSmall(m.firstChild, 2, 52); }
}
function startMatch(cfg) {
  match = Object.assign({ wins: [0, 0], draws: 0, roundNo: 0, lost: 0 }, cfg); playing = true; cpuNaps = 0; xray = false;
  const o = match.kind === 'ladder' ? OPPS[match.idx] : null;
  $('modeName').textContent = o ? 'vs ' + o.name + (o.mis ? ' · Opposite Day' : '') : 'Two players'; show(null); updPlaque(); prof.stamp();

}
function nextRound(firstOne) {
  match.roundNo++; board = Array(9).fill(0); hist = []; roundOver = false; locked = false; winFx = null; hintCell = -1; for (const k in anim) delete anim[k];

function endRound(res, line) {

  let banner, ev;

  else {

    const winnerIsYou = ladderM && o.mis ? !completerIsYou : completerIsYou;      // Opposite Day: whoever completes a line loses the round
    if (winnerIsYou) match.wins[0]++; else { match.wins[1]++; if (ladderM) match.lost++; }

      if (winnerIsYou) { prof.count('roundwin'); recW++; streak++; if (!cheated()) { LS.set('tttRecW', recW); if (streak > bestStreak) { bestStreak = streak; LS.set('tttBest', bestStreak); } } PZ.snd.play('win'); PZ.fx.confetti(30); } else { streak = 0; PZ.snd.play('lose'); }
    } else { banner = (winnerIsYou ? 'X' : 'O') + ' wins the round!'; ev = 'x'; PZ.snd.play('win'); PZ.fx.confetti(30); }
    const pts = line.map(i => cellC(i)); const br = cv.getBoundingClientRect(); pts.forEach(p => PZ.fx.burst(br.left + p.x / dpr, br.top + p.y / dpr, { colors: ['#ffd979', '#fff3c0', set.x.base], n: 8, speed: 220, size: 6 }));
    if (ladderM) bubble(talk(o, ev)); PZ.fx.haptic([12, 30, 12]);
  }

  const done = match.wins[0] >= 2 || match.wins[1] >= 2 || match.roundNo >= 5;

function praise(t) { const e = $('praise'); e.textContent = t; e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); }
function endMatch() {
  playing = false; const ladderM = match.kind === 'ladder', o = ladderM ? OPPS[match.idx] : null;

  PZ.ui.result($('result'), { title, stars: stars || undefined, big: stars ? undefined : w + ' – ' + l, sub: 'Rounds ' + w + ' – ' + l + (match.draws ? ' · ' + match.draws + ' draw' + (match.draws > 1 ? 's' : '') : '') + (stars && !was && match.idx + 1 < OPPS.length ? ' · ' + OPPS[match.idx + 1].name + ' unlocked' : ''), xp: xp,
    buttons: [{ id: 'ladder', label: 'Ladder' }, { id: 'again', label: stars ? 'Rematch' : 'Try again', primary: !nextOk }].concat(nextOk ? [{ id: 'next', label: 'Next: ' + OPPS[match.idx + 1].name, primary: true }] : []) }, a => {

/* ------------------------------------------------------------ tools */

  if (match.kind === 'ladder') { if (hist[hist.length - 1].p === 2) { const m = hist.pop(); board[m.i] = 0; } if (hist.length && hist[hist.length - 1].p === 1) { const m = hist.pop(); board[m.i] = 0; } turn = 1; }

}

  const mis = match.kind === 'ladder' && OPPS[match.idx].mis, me = turn, m = perfectMoves(board.slice(), me, mis), i = m[(Math.random() * m.length) | 0];
  hintCell = i; kick(); setTimeout(() => { if (hintCell === i) hintCell = -1; }, 5000); PZ.snd.play('pick');
  const NAMES = ['top left', 'top middle', 'top right', 'middle left', 'centre', 'middle right', 'bottom left', 'bottom middle', 'bottom right'], b2 = board.slice();

  const wins = completes(b2, i, me), blocks = completes(b2, i, 3 - me);
  return wins ? 'You can win right now: take the ' + NAMES[i] + '.' : blocks ? 'Block them: take the ' + NAMES[i] + '.' : 'Take the ' + NAMES[i] + ': it keeps the most lines open.';
}
$('btnHint').addEventListener('click', () => { const t = hintText(); bubble(t); say(t); });
$('btnMenu').addEventListener('click', () => { PZ.snd.play('tap'); if (SDK && SDK.showMenu) { try { SDK.showMenu(); return; } catch (e) {} } toTitle(); });

function refreshTitle() {

  $('medPlay').style.setProperty('--mc', col); $('medPlay').innerHTML = CR.svg(c, shade(col, -0.28)); $('playName').textContent = totalStars() ? 'Play: ' + o.name : 'Play'; $('sPlay').textContent = totalStars() ? o.tag : 'Start with Mousey';
  $('sLadder').textContent = totalStars() + ' / ' + OPPS.length * 3 + ' stars · ' + ladder.stars.filter(s => s > 0).length + ' of 6 beaten';
  const tc = $('titleChip'); if (!tc.firstChild) { prof.chip(tc); const h = document.createElement('button'); h.className = 'sbtn'; h.textContent = 'How to play'; h.addEventListener('click', () => { PZ.snd.play('tap'); tutSeen = false; startMatch({ kind: 'ladder', idx: 0 }); }); tc.appendChild(h); }
}

    const ok = unlocked(i), st = ladder.stars[i], b = document.createElement('button'); b.className = 'opp' + (ok ? '' : ' lock') + (ok && i === cur && !st ? ' cur' : ''); b.type = 'button'; b.setAttribute('aria-label', o.name + (ok ? (st ? ', ' + st + ' stars' : ', new') : ', locked'));

}
$('mPlay').addEventListener('click', () => { PZ.snd.play('tap'); startMatch({ kind: 'ladder', idx: nextIdx() }); });

$('mPvp').addEventListener('click', () => { PZ.snd.play('tap'); startMatch({ kind: 'pvp' }); });

/* ------------------------------------------------------------ coach */
let tut = 0, tutSeen = LS.get('tttTut', '') === '1' || LS.get('tttTut', 0) === 1;
function placeCoach() { const c = $('coach'); if (!c.classList.contains('on')) return; const r = $('status').getBoundingClientRect(); if (r.width > 40) { c.style.width = Math.round(r.width) + 'px'; c.style.bottom = Math.max(6, Math.round(innerHeight - r.bottom)) + 'px'; } }

function code(c) {

$('icoMenu').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>';
prof.chip($('top')); ready = true; applySet(prof.theme()); layout(); paintYou(); drawLogoPieces(); toTitle();
window.__ttt = { startMatch, get state() { return { board: board.slice(), turn, roundOver, playing, match: match && JSON.parse(JSON.stringify(match)), level: prof.level() }; }, humanMove, prof, OPPS, cpuPick, perfectMoves, mm, ladder, openLadder };
