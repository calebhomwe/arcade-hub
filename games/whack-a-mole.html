<style>
body.kk{background:#3a6a3a}
/* ---------- the meadow: layered like a painting. sky, sun glow and rays, far trees in haze, fence, a perspective lawn of real grass ---------- */
#scene{position:fixed;inset:0;overflow:hidden;--sky1:#4f86c6;--sky2:#9fc4dc;--sky3:#ffd9a2;--haze:255,222,170;--tree1:#3f6b34;--tree2:#5f8f3f;--tree3:#7fae4a;--lawn:rgba(255,210,120,.28);--glow:255,206,120;--shade:18,40,10;--dirtT:rgba(105,60,25,.42);--dirtL:rgba(255,206,140,.28);--pitA:#3a2210;--pitB:#0d0602;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 24%,var(--sky3) 40%,var(--sky3) 44%,#4b7a2c 44.2%)}
#scene.w1{--sky1:#2f4877;--sky2:#c9705a;--sky3:#ffbe72;--haze:255,176,110;--tree1:#4d5a2c;--tree2:#7b8a35;--tree3:#a8a03e;--lawn:rgba(255,140,60,.32);--glow:255,150,70;--dirtT:rgba(120,60,20,.5);--dirtL:rgba(255,160,90,.3)}
#scene.w2{--sky1:#070b26;--sky2:#243372;--sky3:#6d7dc0;--haze:120,140,220;--tree1:#0f2a3a;--tree2:#1b4552;--tree3:#2a6a6a;--lawn:rgba(90,120,220,.30);--glow:150,170,255;--shade:4,10,30;--dirtT:rgba(40,20,50,.55);--dirtL:rgba(150,170,255,.22);--pitA:#1e1330;--pitB:#050208}
#scene .sunglow{position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(circle at 80% 27%,rgba(var(--glow),.85) 0,rgba(var(--glow),.34) 16%,rgba(var(--glow),0) 46%)}
#scene .rays{position:absolute;left:-20%;right:-20%;top:-6%;height:66%;opacity:.5;background:conic-gradient(from 168deg at 80% 22%,rgba(var(--glow),.0) 0,rgba(var(--glow),.42) 4deg,rgba(var(--glow),0) 9deg,rgba(var(--glow),.3) 15deg,rgba(var(--glow),0) 19deg,rgba(var(--glow),.36) 27deg,rgba(var(--glow),0) 32deg,rgba(var(--glow),.22) 40deg,rgba(var(--glow),0) 46deg);-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 92%);mask-image:linear-gradient(180deg,#000 0,transparent 92%)}
#scene .sun{position:absolute;right:9%;top:calc(var(--kk-top) + 138px);width:96px;height:96px;filter:drop-shadow(0 0 30px rgba(255,200,100,.9))}
#scene .moon{position:absolute;right:11%;top:calc(var(--kk-top) + 130px);width:84px;height:84px;display:none;filter:drop-shadow(0 0 22px rgba(200,215,255,.8))}
#scene.w2 .sun{display:none}#scene.w2 .moon{display:block}
#scene .cloud{position:absolute;width:150px;height:150px;left:-190px;opacity:.9;animation:drift 90s linear infinite}
#scene.w1 .cloud{filter:sepia(.6) saturate(1.6) hue-rotate(-18deg) brightness(.98)}
#scene.w2 .cloud{filter:brightness(.5) saturate(.6) hue-rotate(200deg)}
.c1{top:calc(var(--kk-top) + 110px)}.c2{top:calc(var(--kk-top) + 190px);animation-duration:140s!important;animation-delay:-60s!important;width:110px!important;height:110px!important;opacity:.7!important}.c3{top:calc(var(--kk-top) + 30px);animation-duration:120s!important;animation-delay:-95s!important;width:120px!important;height:120px!important;opacity:.8!important}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 380px))}}
#scene .stars{position:absolute;left:0;right:0;top:0;height:34%;display:none;animation:twinkle 3.4s ease-in-out infinite;background:radial-gradient(circle at 12% 20%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 34% 8%,#fff 0 2px,transparent 3px),radial-gradient(circle at 58% 24%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 66% 10%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 92% 30%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 46% 16%,#ffe9a8 0 2px,transparent 3px),radial-gradient(circle at 22% 33%,#fff 0 1.5px,transparent 2.5px)}
#scene.w2 .stars{display:block}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
#scene .trees{position:absolute;left:0;width:100%;top:23%;height:22%}
#scene .lawn{position:absolute;left:-30%;right:-30%;top:41%;bottom:-8%;transform-origin:50% 0;transform:perspective(520px) rotateX(46deg);background:url(assets/kids/tex/grass.jpg) 0 0/300px 300px}
#scene .lawn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--haze),.55) 0,rgba(var(--haze),0) 22%),radial-gradient(ellipse at 62% 20%,var(--lawn) 0,transparent 62%)}
#scene .patch{position:absolute;left:4%;right:4%;top:44%;bottom:6%;background:url(assets/kids/tex/soil.jpg) center/260px;opacity:.55;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,transparent 72%);mix-blend-mode:multiply}
#scene .lawnshade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(var(--shade),0),rgba(var(--shade),.5))}
#scene.w1 .lawn{filter:sepia(.55) saturate(1.3) hue-rotate(-14deg) brightness(.92)}
#scene.w2 .lawn{filter:brightness(.42) saturate(.9) hue-rotate(18deg)}
#scene .fence{position:absolute;left:0;right:0;top:40.2%;height:34px;pointer-events:none}
#scene .fence i{position:absolute;top:0;width:11px;height:32px;border-radius:5px 5px 2px 2px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 40%,rgba(0,0,0,.25)),url(assets/kids/tex/wood.jpg) center/70px;box-shadow:0 3px 4px rgba(0,0,0,.35)}
#scene .fence b{position:absolute;left:0;right:0;height:7px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.28)),url(assets/kids/tex/wood.jpg) center/160px;box-shadow:0 3px 3px rgba(0,0,0,.35)}
#scene.w1 .fence,#scene.w1 .trees{filter:sepia(.35) saturate(1.2)}
#scene.w2 .fence{filter:brightness(.4)}
.fly{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff6a8;box-shadow:0 0 14px 6px rgba(255,240,140,.7);display:none;animation:fly 5s ease-in-out infinite}
#scene.w2 .fly{display:block}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(24px,-30px);opacity:1}}
#decor{position:absolute;inset:0;pointer-events:none}
#decor img{position:absolute;transform:translate(-50%,-100%);filter:drop-shadow(-6px 5px 4px rgba(20,30,0,.45))}
#decor .fl{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:translate(-50%,-100%) rotate(-4deg)}50%{transform:translate(-50%,-100%) rotate(4deg)}}
#decor .bf{animation:flutter 7s ease-in-out infinite;filter:drop-shadow(0 8px 5px rgba(20,30,0,.35))}
@keyframes flutter{0%,100%{transform:translate(-50%,-100%)}25%{transform:translate(-20%,-140%) rotate(8deg)}50%{transform:translate(-80%,-120%) rotate(-6deg)}75%{transform:translate(-40%,-160%)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:var(--kk-l);right:var(--kk-r);top:calc(var(--kk-top) + 56px);z-index:25;display:none;flex-direction:column;gap:8px;pointer-events:none}
#hud.on{display:flex}
#hud .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
#goal{position:relative;height:30px;border-radius:15px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(30,15,0,.4));border:1.5px solid rgba(233,181,68,.8);box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 3px 8px rgba(20,8,0,.4)}
#goal i{position:absolute;left:2px;top:2px;bottom:2px;border-radius:13px;width:0;background:linear-gradient(180deg,#ffeaa6,#e9b544 55%,#c98a1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .18s ease-out}
#goal img{position:absolute;top:-8px;width:44px;height:44px;margin-left:-22px;filter:grayscale(1) brightness(.75);opacity:.7;transition:transform .3s}
#goal img.got{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));opacity:1;animation:kkBump .5s}
#time{min-width:96px}
#time.low{background:linear-gradient(180deg,#8a2a1c,#5a150c);border-color:#ffb0a0}#time.low b{animation:kkBump .5s infinite}
#combo{display:none}#combo.on{display:inline-flex}
#codes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kk-bot) + 4px);z-index:30;background:#ffd23f;color:#6b3b00;font-weight:700;font-size:14px;padding:3px 12px;border-radius:12px;letter-spacing:1px;display:none}

/* ---------- the holes: real soil, a dark pit, a lit rim, a soft long shadow ---------- */
#field{position:fixed;left:0;right:0;z-index:10;display:none;justify-content:center;align-items:center}
#field.on{display:flex}
#grid{display:grid;--cw:118px;grid-template-columns:repeat(var(--cols,3),var(--cw));gap:calc(var(--cw)*.16) calc(var(--cw)*.06);justify-content:center}
.hole{position:relative;width:var(--cw);height:calc(var(--cw)*.8333);touch-action:manipulation}
.hole svg.hb,.hole svg.hf{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hole .clip{position:absolute;left:0;right:0;top:-72%;height:160%;overflow:hidden}
.mole{position:absolute;left:50%;bottom:-9%;width:calc(var(--cw)*.64);height:calc(var(--cw)*.923);transform:translate(-50%,108%);transition:transform .2s cubic-bezier(.4,0,.6,1);will-change:transform}
.hole[data-s=rise] .mole,.hole[data-s=up] .mole{transform:translate(-50%,0);transition:transform .15s cubic-bezier(.3,1.7,.5,1)}
.hole[data-s=hit] .mole{transform:translate(-50%,12%) scale(1.08,.8);transition:transform .09s ease-out}
.hole[data-s=hit] .dz{display:block}
.mole .body{position:absolute;inset:0;transform-origin:50% 100%}
.mole img.pic{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.mole img.hitpic{display:none}
.hole[data-s=hit] .mole img.hitpic{display:block}.hole[data-s=hit] .mole img.okpic{display:none}
.mole .dz{display:none;position:absolute;left:50%;top:-14%;width:50%;height:auto;margin-left:-25%;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hole[data-s=up] .mole .body{animation:wob 1.1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.hole[data-k=friend] .mole .body{animation:hop .6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
.hole.dent .mole img.pic{filter:drop-shadow(0 8px 6px rgba(0,0,0,.45)) brightness(1.15) saturate(1.2)}
.hole .puff{position:absolute;left:50%;bottom:6%;width:60%;margin-left:-30%;pointer-events:none;opacity:0}
.hole.miss .puff{animation:puff .4s ease-out}
@keyframes puff{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.4) translateY(-8px)}}
#hammer{position:fixed;left:0;top:0;width:112px;height:112px;z-index:40;pointer-events:none;opacity:0;transform-origin:88% 90%;will-change:transform,opacity;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}

/* ---------- ready card ---------- */
#ready{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none}
#ready.on{display:flex}
#ready .card{border-radius:22px;padding:14px 26px 12px;text-align:center;border:8px solid transparent;background:linear-gradient(180deg,rgba(255,247,226,.8),rgba(240,218,168,.72)),url(assets/kids/tex/paper.jpg) center/300px padding-box,url(assets/kids/tex/wood-dark.jpg) center/300px border-box;box-shadow:0 20px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(217,164,65,.9);animation:kkPanel .4s cubic-bezier(.2,1.3,.4,1)}
#ready h2{margin:0;font-size:36px;color:var(--kk-ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}
#ready .g{display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:700;color:#a84f10}
#ready .g img{width:56px;height:56px;filter:drop-shadow(0 4px 3px rgba(60,30,0,.35))}
#ready .w{font-size:18px;font-weight:600;color:var(--kk-ink2);margin-top:2px}

/* ---------- title hero ---------- */
#titleHero{position:relative;width:min(80vw,300px);height:210px;margin:6px 0}
#titleHero .hole{position:absolute;left:50%;bottom:0;--cw:210px;margin-left:-105px}
#titleHero .hole .mole{transform:translate(-50%,0);animation:peek 2.6s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translate(-50%,10%)}45%,60%{transform:translate(-50%,-4%)}}
#titleHero .tools{position:absolute;right:-10px;top:-10px;width:104px;height:104px;transform:rotate(14deg);animation:kkBob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
#titleHero .st{position:absolute;width:44px;height:44px;animation:kkBob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
@media (prefers-reduced-motion:reduce){#scene .cloud,#scene .stars,.fly,#decor .fl,#decor .bf,.hole[data-s=up] .mole .body,.hole[data-k=friend] .mole .body,#titleHero .hole .mole,#titleHero .tools,#titleHero .st{animation:none}}
</style>
</head>

<script>
(function () {
'use strict';
var KKs = window.KK, SDK = window.ArcadeSDK || null, h = KKs.h, img = KKs.img;
var $ = function (id) { return document.getElementById(id); };
var IMG = function (n) { return KKs.imgUrl(n); };
var MOLE = function (n) { return 'assets/kids/whack/' + n + '.webp'; };

/* ======================= what you can collect ======================= */
var HAMMERS = [
  { id: 'hammer', img: 'hammer', name: 'Wooden mallet', need: 0 }, { id: 'carrot', img: 'carrot', name: 'Carrot', need: 4 },
  { id: 'banana', img: 'banana', name: 'Banana', need: 9 }, { id: 'magic-wand', img: 'magic-wand', name: 'Magic wand', need: 15 },
  { id: 'teddy-bear', img: 'teddy-bear', name: 'Squeaky bear', need: 22 }, { id: 'baguette-bread', img: 'baguette-bread', name: 'Baguette', need: 30 }];
var PALS = [
  { id: 'seedling', img: 'seedling', name: 'Seedling', need: 1, x: 8, y: 97 }, { id: 'tulip', img: 'tulip', name: 'Tulip', need: 3, x: 92, y: 96 },
  { id: 'sunflower', img: 'sunflower', name: 'Sunflower', need: 5, x: 20, y: 99 }, { id: 'butterfly', img: 'butterfly', name: 'Butterfly', need: 7, x: 74, y: 40, bf: 1 },
  { id: 'lady-beetle', img: 'lady-beetle', name: 'Ladybird', need: 10, x: 84, y: 90 }, { id: 'honeybee', img: 'honeybee', name: 'Honey bee', need: 12, x: 30, y: 44, bf: 1 },
  { id: 'snail', img: 'snail', name: 'Snail', need: 14, x: 60, y: 99 }, { id: 'hibiscus', img: 'hibiscus', name: 'Flower', need: 17, x: 4, y: 90 },
  { id: 'mushroom', img: 'mushroom', name: 'Mushroom', need: 20, x: 46, y: 98 }, { id: 'hedgehog', img: 'hedgehog', name: 'Hedgehog', need: 24, x: 96, y: 99 },
  { id: 'rainbow', img: 'rainbow', name: 'Rainbow', need: 28, x: 50, y: 30, rb: 1 }, { id: 'four-leaf-clover', img: 'four-leaf-clover', name: 'Lucky clover', need: 33, x: 34, y: 96 }];
var ALBUM = HAMMERS.concat(PALS);
var P = KKs.profile('whack_kk', { album: ALBUM, dailyGoal: 3, dailyBonus: 3 });
var WORLDS = ['Golden Garden', 'Sunset Farm', 'Moonlight Meadow'];
var NLEV = 15;

/* ======================= levels: pure numbers, tested offline ======================= */
//<sched>
function levelCfg(n) {
  var world = n <= 5 ? 0 : n <= 10 ? 1 : 2, boss = n % 5 === 0;
  return {
    n: n, world: world, boss: boss,
    holes: n <= 2 ? 4 : n <= 6 ? 6 : 9, cols: n <= 6 ? 2 : 3,
    time: n <= 2 ? 25 : 30,
    stay: Math.max(760, Math.round(1560 - n * 52)),      // ms a mole stays up
    gap: Math.max(380, Math.round(860 - n * 30)),        // ms between pop-ups
    maxUp: n <= 2 ? 1 : n <= 6 ? 2 : 3,
    friend: n < 3 ? 0 : Math.min(0.2, 0.07 + (n - 3) * 0.011),
    helmet: n < 4 ? 0 : Math.min(0.28, 0.1 + (n - 4) * 0.018),
    gold: n >= 2, kingHp: boss ? 2 + n / 5 : 0
  };
}
function Sched(cfg, rnd) {
  this.c = cfg; this.rnd = rnd || Math.random; this.t = 0; this.next = 500; this.moles = []; this.spawned = 0; this.goldAt = cfg.gold ? (0.3 + this.rnd() * 0.4) * cfg.time * 1000 : -1; this.kingAt = cfg.boss ? cfg.time * 1000 * 0.3 : -1; this.last = -1; this.events = [];

  var k = e.key; if (!/^[1-9]$/.test(k)) return; var d = +k, idx;
  if (cfg.cols === 3) { var rows = Math.ceil(cfg.holes / 3), row = 3 - Math.ceil(d / 3), col = (d - 1) % 3; if (row < 3 - rows) return; idx = (row - (3 - rows)) * 3 + col; } else idx = d - 1;
  if (idx >= 0 && idx < cfg.holes) tapHole(idx);
});

/* ---------- the first-time coach: teach by doing, skip any time ---------- */
function startTutorial() {
  if (!S) return;
  var m = S.spawn('mole', 0, 1e9); if (!m) return; m.hold = true; tut = { stage: 'mole', hold: true };
  var r = cells[0].getBoundingClientRect();
  var co = KKs.ui.coach('Tap the mole!', { pic: 'pointer-down', top: Math.max(70, r.top - 110) + 'px', skip: function () { if (m) m.hold = false; endTut(); P.flag('tutMole', true); } });
  var fg = h('img', { class: 'kk-finger', src: IMG('pointer'), alt: '', style: { left: (r.left + r.width / 2) + 'px', top: (r.top + r.height * 0.25) + 'px' } }); document.body.appendChild(fg);
  tut.co = co; tut.fg = fg; tut.mole = m;
}
function startFriendCoach() {
  if (!S || P.flag('tutFriend') || cfg.n < 3) return;
  var m = S.spawn('friend', undefined, 2600); if (!m) return; tut = { stage: 'friend', hold: false, mole: m };
  var r = cells[m.h].getBoundingClientRect();
  tut.co = KKs.ui.coach("Don't tap friends!", { pic: 'rabbit-face', top: Math.max(70, r.top - 110) + 'px', skip: function () { endTut(); } }); P.flag('tutFriend', true);
  setTimeout(function () { if (tut && tut.stage === 'friend') endTut(); }, 3200);
}
function endTut() { if (!tut) return; if (tut.co) tut.co.close && tut.co.close(); if (tut.fg) tut.fg.remove(); tut = null; }

function endLevel() {
  state = 'over'; stopLoop(); endTut(); S.moles.forEach(function (m) { if (m.st !== 'hit') m.st = 'sink'; paint(m); });
  var stars = 0; cfg.goals.forEach(function (g) { if (whacks >= g) stars++; });
  var res = { gained: 0, first: false, newBest: false, unlocked: [], total: P.total() }, daily = null;
  if (!cheated) {
    res = P.finish(cur, stars, points);
    if (points > bestScore) { bestScore = points; try { localStorage.setItem('whackBest', String(bestScore)); } catch (e) {} }
    P.stat('whacks', whacks);
    if (stars > 0) daily = P.dailyWin();
    try {
      if (SDK && SDK.profile) {
        if (stars > 0) SDK.profile.award({ xp: 5 + stars * 3, reason: 'Level ' + cur });
        if (P.stat('whacks', 0) > 0) SDK.profile.achievement('first-whack', { title: 'First whack', desc: 'Whack a mole', tier: 'bronze' });
        if (stars === 3) SDK.profile.achievement('three-stars', { title: 'Triple star', desc: 'Earn three stars on a level', tier: 'silver' });
        if (stars > 0 && cfg.boss) SDK.profile.achievement('boss-' + cur, { title: 'Boss whacked', desc: 'Beat a boss level', tier: 'gold' });
        SDK.profile.quest('whack-stars', Math.min(1, P.total() / 45), { title: 'Collect 45 stars' });
      }
    } catch (e) {}
  }
  gs('over', { score: points, level: cur, stars: stars });
  KKs.sfx(stars > 0 ? 'win' : 'oops'); if (stars > 0) KKs.confetti();
  setTimeout(function () { showResult(stars, res, daily); }, 750);
}
function showResult(stars, res, daily) {
  var lines = ['Whacked ' + whacks + '   Goal ' + cfg.goals[0]];
  if (cheated) lines.push('Codes are on, so this level does not count.');
  else if (res.newBest && points > 0 && !res.first) lines.push('New best score!');
  if (daily && daily.just) lines.push('Daily goal done! +3 stars');
  var btn = [];
  var nextN = Math.min(NLEV, cur + 1), more = stars > 0 && cur < NLEV;
  if (more) btn.push({ label: 'Next level', cls: 'kk-go kk-big', pic: 'star', fn: function () { startLevel(nextN, { quick: true }); } });
  btn.push({ label: stars > 0 ? 'Play again' : 'Try again', cls: stars > 0 ? 'kk-blue' : 'kk-go kk-big', fn: function () { startLevel(cur, { quick: true }); } });
  btn.push({ label: 'Levels', cls: 'kk-purple', fn: showMap });
  if (stars > 0 && cur === NLEV) lines.push('You beat all 15 levels!');
  KKs.ui.result({ title: stars === 3 ? 'Perfect!' : stars > 0 ? 'Great job!' : 'So close!', ribbon: cfg.boss && stars > 0 ? 'Boss beaten!' : null, stars: stars, lines: lines, newItems: res.unlocked, buttons: btn });
  if (stars > 0) KKs.sfx('star');
}

/* ======================= arcade hooks ======================= */
var CODES = { BIGHAMMER: 'Big hammer: a whack also hits the moles next door', EXTRATIME: 'Extra time: rounds last 15 seconds longer', SLOWMOLES: 'Slow moles: they stay up much longer' };
function code(c) {
  c = String(c || '').toUpperCase(); if (!CODES[c]) return { ok: false };
  if (c === 'BIGHAMMER') cheats.big = true; if (c === 'EXTRATIME') { cheats.extra = true; if (state === 'play') timeLeft += 15; } if (c === 'SLOWMOLES') cheats.slow = true;
  cheated = true; $('codes').style.display = 'block'; return { ok: true, message: CODES[c] };
}
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: function () { startLevel(cur, { quick: true }); }, onExit: showTitle, onTutorial: function () { P.flag('tutMole', false); startLevel(1, { quick: true }); }, onHint: function () { return hintTxt; }, onCheat: code, cheats: [{ code: 'BIGHAMMER', effect: CODES.BIGHAMMER }, { code: 'EXTRATIME', effect: CODES.EXTRATIME }, { code: 'SLOWMOLES', effect: CODES.SLOWMOLES }] });
KKs.ui.topbar({ back: true });
KKs.preload(['star', 'hammer', 'rabbit-face', 'front-facing-baby-chick', 'crown', 'dizzy']);
setInterval(function () { if (state === 'play' && cfg && cfg.friend > 0 && !P.flag('tutFriend') && !tut && S && S.active() === 0) startFriendCoach(); }, 700);
// test hooks for the QA scripts
window.__whack = { get state() { return state; }, get cfg() { return cfg; }, get whacks() { return whacks; }, get S() { return S; }, LV: LV, P: P, start: startLevel, tap: tapHole, get timeLeft() { return timeLeft; }, set timeLeft(v) { timeLeft = v; } };
showTitle();
})();
</script>
