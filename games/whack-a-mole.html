<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% -20%,#a16207,#0f0f23 60%,#07070f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff}
.back{position:fixed;top:12px;left:14px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:800;z-index:10}
h1{font-size:26px;font-weight:900;letter-spacing:-1px}
.hud{display:flex;gap:10px;font-weight:800;font-size:15px;align-items:center}
.hud span{background:#1e293b;padding:8px 14px;border-radius:12px}
#comboChip{transition:transform .13s ease,opacity .2s;opacity:.55}
.mute{background:#1e293b;border:none;color:#fff;font-size:15px;padding:8px 12px;border-radius:12px;cursor:pointer;line-height:1}
#timebar{width:min(90vw,380px);height:10px;background:#1e293b;border-radius:999px;overflow:hidden}
#timefill{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#facc15);border-radius:999px;transition:width .2s linear}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(90vw,380px,calc(100dvh - 128px));touch-action:manipulation}
.hole{position:relative;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;cursor:pointer}
.ground{position:absolute;bottom:0;left:8%;right:8%;height:34%;border-radius:50%;background:radial-gradient(ellipse at center,#3f2a12 0%,#241708 70%,#120c04 100%);box-shadow:inset 0 10px 18px rgba(0,0,0,.7)}
.mole{position:absolute;bottom:8%;font-size:clamp(34px,11vw,52px);transform:translateY(110%);transition:transform .14s cubic-bezier(.34,1.56,.64,1);z-index:2;line-height:1}
.mole.up{transform:translateY(0)}
.mole.hit{animation:hit .25s ease}
.mole.gold{filter:drop-shadow(0 0 12px #facc15)}
.mole.fuse{transform:translateY(58%);animation:fuseShake .15s linear infinite;filter:drop-shadow(0 0 10px #ef4444)}
@keyframes fuseShake{0%,100%{translate:-2px 0}50%{translate:2px 0}}
@keyframes hit{0%{scale:1 1}40%{scale:1.3 .6;translate:0 30%}100%{scale:1 1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.popup{position:fixed;font-weight:900;font-size:22px;pointer-events:none;z-index:30;animation:popup .7s ease forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
@keyframes popup{0%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -46px}}
#score.pp{animation:ppop .18s ease}
@keyframes ppop{0%{scale:1}40%{scale:1.35}100%{scale:1}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,7,15,.82);backdrop-filter:blur(5px);z-index:20;text-align:center}
.ov h1{font-size:40px}
.btn{border:none;cursor:pointer;background:linear-gradient(90deg,#facc15,#fb923c);color:#1c1917;font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;box-shadow:0 8px 24px rgba(250,204,21,.35)}
.btn:active{transform:scale(.94)}
.best{color:#4ade80;font-weight:800}
#newBest{color:#facc15;font-weight:900;font-size:17px;text-shadow:0 0 14px rgba(250,204,21,.7);animation:pulse 1s ease infinite}
@keyframes pulse{50%{scale:1.12}}
.hidden{display:none}
</style>
</head>
<body>
<a class="back" href="../index.html">← Hub</a>
<h1>🔨 Whack-a-Mole</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>⏱ <b id="timeLeft">30</b>s</span><span id="comboChip">🔥×1</span><button class="mute" id="muteBtn" aria-label="Toggle sound">🔊</button></div>
<div id="timebar"><div id="timefill"></div></div>
<div id="grid"></div>
<canvas id="fx"></canvas>
<div class="ov" id="start">
  <h1>🔨 Whack-a-Mole</h1>
  <div style="color:#cbd5e1;font-size:15px;line-height:1.6">Whack moles for points!<br>⭐ Golden = +5 · 💣 Bomb = -3 (rumbles first!) · 👑 Crown = +10 (rare!)<br>Chain hits without escapes for 🔥 ×2 ×3<br>⚡ Whack within 350ms of popping up = +1</div>
  <button class="btn" id="playBtn">▶ Start (30s)</button>
</div>
<div class="ov hidden" id="over">
  <h1>Time's Up!</h1>
  <div id="newBest" class="hidden">🏆 NEW BEST!</div>
  <div style="font-size:18px">Score: <b id="finScore">0</b></div>
  <div style="font-size:16px">Best: <b class="best" id="finBest">0</b></div>
  <button class="btn" id="againBtn">Play Again</button>
</div>
<script>

const ROUND_TIME=30;
const $=id=>document.getElementById(id);
let score=0,best=+localStorage.getItem('whackBest')||0,timeLeft=ROUND_TIME,state='ready',spawnTimer=null,roundTimer=null,combo=0,shake=0,flashT=0;
let muted=localStorage.getItem('gamesMuted')==='1';
function refreshMute(){$('muteBtn').textContent=muted?'🔇':'🔊';}
$('muteBtn').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;localStorage.setItem('gamesMuted',muted?'1':'0');refreshMute();});
refreshMute();
const grid=$('grid'),holes=[];
for(let i=0;i<9;i++){
const h=document.createElement('div');h.className='hole';h._i=i;
h.innerHTML='<div class="ground"></div><div class="mole" data-state="down"></div>';
h.addEventListener('pointerdown',()=>whack(h));
grid.appendChild(h);holes.push(h);
}
let holeC=[];
function cacheHoles(){holeC=holes.map(h=>{const r=h.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,y2:r.top+r.height*.65};});}
const moleOf=h=>h.querySelector('.mole');
const mult=()=>Math.min(3,1+Math.floor(combo/5));
const chip=$('comboChip');
function updateCombo(){
const mul=mult();
chip.textContent='🔥×'+mul+(mul<3?' '+(combo%5)+'/5':' MAX');
chip.style.opacity=mul>1?1:.55;
if(mul>1){chip.style.transform='scale(1.3)';setTimeout(()=>chip.style.transform='scale(1)',130);}
}
let AC;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,d,type,v){if(!AC||muted)return;const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.16,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}
const SFXP={};['tap','pop','coin','hit','boom','jump','whoosh','win','lose','buzz','levelup','tick'].forEach(function(n){try{var a=new Audio('assets/sfx/'+n+'.wav');a.preload='auto';a.volume=0.5;SFXP[n]=a}catch(e){}});
function sfx(n){if(muted)return;var a=SFXP[n];if(!a)return;try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function snd(n){if(n==='hit')sfx('hit');
else if(n==='gold')sfx('coin');
else if(n==='crown')sfx('win');
else if(n==='bomb')sfx('boom');
else if(n==='miss')sfx('buzz');
else if(n==='combo')sfx('levelup');
else if(n==='end')sfx('win');}
const fx=$('fx'),fctx=fx.getContext('2d');
let FW=0,FH=0;
const parts=[],MAXP=200;
function resizeFx(){
const d=Math.min(window.devicePixelRatio||1,2);
FW=window.innerWidth;FH=window.innerHeight;
fx.width=Math.max(1,Math.round(FW*d));fx.height=Math.max(1,Math.round(FH*d));
fctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',()=>{resizeFx();cacheHoles();});resizeFx();cacheHoles();
function burst(x,y,color,n,pow){
for(let i=0;i<n;i++){
let p=null;
for(let j=0;j<parts.length;j++){if(parts[j].life<=0){p=parts[j];break;}}
if(!p){if(parts.length>=MAXP)break;p={};parts.push(p);}
const a=Math.random()*Math.PI*2,s=(60+Math.random()*240)*(pow||1);
p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s-120;p.life=1;p.r=2+Math.random()*4;p.color=color;
}
}
function partsAlive(){for(let i=0;i<parts.length;i++)if(parts[i].life>0)return true;return false;}
let lastT=0,fxIdle=false;
function loop(ts){
requestAnimationFrame(loop);
let dt=(ts-lastT)/1000;lastT=ts;
if(!(dt>0)||dt>.05)dt=.016;
if(document.hidden)return;
if(!partsAlive()&&shake<=0&&flashT<=0){if(!fxIdle){fxIdle=true;fctx.clearRect(0,0,FW,FH);}return;}
fxIdle=false;
flashT=Math.max(0,flashT-dt*2.8);
fctx.clearRect(0,0,FW,FH);
if(flashT>0){fctx.fillStyle='rgba(248,113,113,'+(flashT*.26)+')';fctx.fillRect(0,0,FW,FH);}
for(let i=0;i<parts.length;i++){
const p=parts[i];
if(p.life<=0)continue;
p.life-=dt*1.8;
if(p.life<=0)continue;
p.vy+=800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.color;
fctx.beginPath();fctx.arc(p.x,p.y,p.r*p.life+1,0,7);fctx.fill();
}
fctx.globalAlpha=1;
if(shake>0){
shake=Math.max(0,shake-dt*2.5);
grid.style.transform=shake>0?'translate('+((Math.random()-.5)*shake*16)+'px,'+((Math.random()-.5)*shake*12)+'px)':'';
}
}
requestAnimationFrame(loop);
function popScore(){
const s=$('score');s.classList.remove('pp');void s.offsetWidth;s.classList.add('pp');
}
function popup(txt,x,y,color){
const p=document.createElement('div');p.className='popup';p.textContent=txt;
p.style.left=(x-16)+'px';p.style.top=(y-34)+'px';p.style.color=color;
document.body.appendChild(p);setTimeout(()=>p.remove(),700);
}
function whack(h){
if(state!=='play')return;
initAudio();
const m=moleOf(h),hc=holeC[h._i],cx=hc.x,cy=hc.y;
if(m.dataset.state!=='up'){snd('miss');burst(cx,cy+16,'#94a3b8',5,.5);return;}
clearTimeout(m._despawn);clearTimeout(m._clean);clearTimeout(m._fuse);
m._gen=(m._gen||0)+1;const gen=m._gen;
m.dataset.state='down';m.classList.remove('up');
const type=m.dataset.type;m.dataset.type='';
m.classList.add('hit');
m._clean=setTimeout(()=>{if(gen===m._gen)m.classList.remove('hit');},260);
if(type==='bomb'){
combo=Math.floor(combo/2);score=Math.max(0,score-3);snd('bomb');shake=1;flashT=1;
burst(cx,cy,'#f87171',22,1.1);burst(cx,cy,'#fb923c',14,1.1);
popup('-3',cx,cy,'#f87171');
}else if(type==='crown'){
combo++;const mul=mult(),pts=10*mul;
score+=pts;snd('crown');
burst(cx,cy,'#facc15',24,1.5);burst(cx,cy,'#fde047',14,1);
popup('👑 +'+pts+(mul>1?' ×'+mul:''),cx,cy,'#facc15');
}else{
combo++;
const mul=mult(),pts=(type==='gold'?5:1)*mul;
score+=pts;
snd(type==='gold'?'gold':combo%5===0?'combo':'hit');
burst(cx,cy,type==='gold'?'#facc15':'#4ade80',type==='gold'?18:10,.8);
popup('+'+pts+(mul>1?' ×'+mul:''),cx,cy,type==='gold'?'#facc15':'#4ade80');
}
if(type!=='bomb'&&m._born&&performance.now()-m._born<350){score+=1;popup('⚡ +1',cx,cy-40,'#fde047');}
updateCombo();
$('score').textContent=score;
popScore();
}
function spawn(){
if(state!=='play')return;
if(document.hidden){spawnTimer=setTimeout(spawn,400);return;}
const free=holes.filter(h=>moleOf(h).dataset.state==='down');
if(!free.length){spawnTimer=setTimeout(spawn,180);return;}
const h=free[(Math.random()*free.length)|0],m=moleOf(h);
clearTimeout(m._despawn);clearTimeout(m._clean);
m._gen=(m._gen||0)+1;const gen=m._gen;
const r=Math.random();
m.dataset.type=r<.12?'bomb':r<.26?'gold':'normal';
if(m.dataset.type==='normal'&&Math.random()<.08)m.dataset.type='crown';
m.textContent=m.dataset.type==='bomb'?'💣':m.dataset.type==='gold'?'⭐':'🐹';
if(m.dataset.type==='crown'){m.textContent='👑';m.classList.add('gold');}
m.classList.toggle('gold',m.dataset.type==='gold');
m.classList.remove('hit','fuse');
clearTimeout(m._fuse);
const prog=1-timeLeft/ROUND_TIME;
const life=(520+Math.random()*480)*(1-prog*.5);
const arm=()=>{m._despawn=setTimeout(()=>{
if(gen!==m._gen||state!=='play'||m.dataset.state!=='up')return;
m.dataset.state='down';m.classList.remove('up');
if(m.dataset.type!=='bomb'){combo=0;updateCombo();const hc=holeC[h._i];burst(hc.x,hc.y2,'#94a3b8',7,.45);}
m.dataset.type='';
},life);};
if(m.dataset.type==='bomb'){
m.dataset.state='fuse';m.classList.add('fuse');
m._fuse=setTimeout(()=>{
if(gen!==m._gen||state!=='play'||m.dataset.state!=='fuse')return;
m.classList.remove('fuse');m.dataset.state='up';m.classList.add('up');arm();
},320);
}else{
m.dataset.state='up';m.classList.add('up');arm();
m._born=performance.now();
}
spawnTimer=setTimeout(spawn,Math.max(230,620*(1-prog*.55)));
}
function resetMoles(){
holes.forEach(h=>{const m=moleOf(h);clearTimeout(m._despawn);clearTimeout(m._clean);clearTimeout(m._fuse);m._gen=(m._gen||0)+1;m.dataset.state='down';m.dataset.type='';m.classList.remove('up','hit','fuse');});
}
function startGame(){
initAudio();
score=0;combo=0;timeLeft=ROUND_TIME;state='play';
$('score').textContent=0;$('timeLeft').textContent=timeLeft;$('timefill').style.width='100%';
$('start').classList.add('hidden');$('over').classList.add('hidden');
updateCombo();resetMoles();
clearTimeout(spawnTimer);clearInterval(roundTimer);
spawnTimer=setTimeout(spawn,500);
roundTimer=setInterval(()=>{
if(document.hidden)return;
timeLeft--;
$('timeLeft').textContent=Math.max(0,timeLeft);
$('timefill').style.width=(Math.max(0,timeLeft)/ROUND_TIME*100)+'%';
if(timeLeft<=0)endGame();
},1000);
}
function endGame(){
state='over';clearTimeout(spawnTimer);clearInterval(roundTimer);
resetMoles();snd('end');
const nb=score>best;
if(nb){best=score;localStorage.setItem('whackBest',best);}
$('finScore').textContent=score;$('finBest').textContent=best;
$('newBest').classList.toggle('hidden',!nb);
setTimeout(()=>$('over').classList.remove('hidden'),450);
}
document.getElementById('playBtn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});
document.getElementById('againBtn').addEventListener('pointerdown',e=>{e.stopPropagation();startGame();});
</script>
</body>
</html>
