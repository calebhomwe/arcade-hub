<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://calebhomwe.github.io/arcade/assets/arcade-sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd3ff">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="kit/kidskit.css">
<style>
body.kk{background:#7fd3ff}
/* ---------- the meadow: three worlds, all built from the same layers ---------- */
#scene{position:fixed;inset:0;--sky1:#6ecbff;--sky2:#d9f5ff;--hill1:#8be05d;--hill2:#62c649;--g1:#74d94f;--g2:#4cb43c;--tuft:#3f9f34;--dirt1:#a9744a;--dirt2:#6e4527;--hole1:#1d0f06;--hole2:#3b2210;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 30%,var(--sky2) 34%)}
#scene.w1{--sky1:#ff9a6b;--sky2:#ffe1b0;--hill1:#c3d95a;--hill2:#a1c443;--g1:#b0cf47;--g2:#86aa35;--tuft:#6f9428;--dirt1:#b07845;--dirt2:#71462a}
#scene.w2{--sky1:#1b1f5e;--sky2:#5a56b3;--hill1:#3d7f86;--hill2:#2c6570;--g1:#2f8a72;--g2:#1c5d55;--tuft:#3fae8a;--dirt1:#7f5a52;--dirt2:#4a2f33;--hole1:#0b0510;--hole2:#22112a}
#scene .ground{position:absolute;left:0;right:0;top:27%;bottom:0;background:linear-gradient(180deg,var(--g1),var(--g2))}
#scene .ground::before{content:'';position:absolute;inset:0;opacity:.35;background:radial-gradient(circle at 20% 30%,var(--tuft) 0 3px,transparent 4px) 0 0/46px 40px,radial-gradient(circle at 70% 70%,var(--tuft) 0 2.5px,transparent 3.5px) 0 0/58px 44px}
#scene .hills{position:absolute;left:0;right:0;top:15%;height:20%;width:100%}
#scene .sun{position:absolute;right:8%;top:calc(var(--kk-top) + 64px);width:96px;height:96px;opacity:.95}
#scene .moon{position:absolute;right:10%;top:calc(var(--kk-top) + 60px);width:84px;height:84px;display:none}
#scene.w2 .sun{display:none}#scene.w2 .moon{display:block}
#scene .cloud{position:absolute;width:120px;height:120px;opacity:.95;left:-140px;animation:drift 70s linear infinite}
#scene.w2 .cloud{filter:brightness(.55) saturate(.8)}
.c1{top:calc(var(--kk-top) + 96px)}.c2{top:calc(var(--kk-top) + 160px);animation-duration:110s!important;animation-delay:-40s!important;width:90px!important;height:90px!important}.c3{top:calc(var(--kk-top) + 40px);animation-duration:90s!important;animation-delay:-70s!important;width:100px!important;height:100px!important}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 300px))}}
#scene .stars{position:absolute;left:0;right:0;top:0;height:30%;display:none;animation:twinkle 3s ease-in-out infinite;background:radial-gradient(circle at 12% 20%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 34% 8%,#fff 0 2px,transparent 3px),radial-gradient(circle at 58% 24%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 81% 12%,#fff 0 2px,transparent 3px),radial-gradient(circle at 92% 30%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 46% 16%,#ffe9a8 0 2px,transparent 3px)}
#scene.w2 .stars{display:block}
@keyframes twinkle{0%,100%{opacity:.6}50%{opacity:1}}
.fly{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff6a8;box-shadow:0 0 12px 5px rgba(255,240,140,.7);display:none;animation:fly 5s ease-in-out infinite}
#scene.w2 .fly{display:block}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(24px,-30px);opacity:1}}
#decor{position:absolute;inset:0;pointer-events:none}
#decor img{position:absolute;transform:translate(-50%,-100%)}
#decor .fl{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:translate(-50%,-100%) rotate(-4deg)}50%{transform:translate(-50%,-100%) rotate(4deg)}}
#decor .bf{animation:flutter 7s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(-50%,-100%)}25%{transform:translate(-20%,-140%) rotate(8deg)}50%{transform:translate(-80%,-120%) rotate(-6deg)}75%{transform:translate(-40%,-160%)}}

/* ---------- top bar and goal ---------- */
#hud{position:fixed;left:var(--kk-l);right:var(--kk-r);top:calc(var(--kk-top) + 56px);z-index:25;display:none;flex-direction:column;gap:8px;pointer-events:none}
#hud.on{display:flex}
#hud .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
#goal{position:relative;height:30px;border-radius:15px;background:rgba(255,255,255,.55);box-shadow:inset 0 3px 5px rgba(60,30,120,.25),0 3px 0 rgba(60,30,120,.14)}
#goal i{position:absolute;left:0;top:0;bottom:0;border-radius:15px;width:0;background:linear-gradient(180deg,#ffe36b,#ffa800);box-shadow:inset 0 3px 0 rgba(255,255,255,.5);transition:width .18s ease-out}
#goal img{position:absolute;top:-5px;width:38px;height:38px;margin-left:-19px;filter:grayscale(1) brightness(1.3) opacity(.55);transition:transform .3s}
#goal img.got{filter:none;animation:kkBump .5s}
#time{min-width:96px}
#time.low{background:#ffe0e0;color:#c02020}#time.low b{animation:kkBump .5s infinite}
#combo{display:none}#combo.on{display:inline-flex}
#codes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kk-bot) + 4px);z-index:30;background:#ffd23f;color:#6b3b00;font-weight:700;font-size:14px;padding:3px 12px;border-radius:12px;letter-spacing:1px;display:none}

/* ---------- the field of holes ---------- */
#field{position:fixed;left:0;right:0;z-index:10;display:none;justify-content:center;align-items:center}
#field.on{display:flex}
#grid{display:grid;--cw:118px;grid-template-columns:repeat(var(--cols,3),var(--cw));gap:calc(var(--cw)*.02) calc(var(--cw)*.04);justify-content:center}
.hole{position:relative;width:var(--cw);height:calc(var(--cw)*.8333);touch-action:manipulation}
.hole svg.hb,.hole svg.hf{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hole .clip{position:absolute;left:0;right:0;top:-70%;height:154%;overflow:hidden}
.mole{position:absolute;left:50%;bottom:-5%;width:calc(var(--cw)*.74);height:calc(var(--cw)*.82);transform:translate(-50%,108%);transition:transform .2s cubic-bezier(.4,0,.6,1);will-change:transform}
.hole[data-s=rise] .mole,.hole[data-s=up] .mole{transform:translate(-50%,0);transition:transform .15s cubic-bezier(.3,1.7,.5,1)}
.hole[data-s=hit] .mole{transform:translate(-50%,14%) scale(1.06,.78);transition:transform .09s ease-out}
.hole[data-s=hit] .dz{display:block}
.mole .body{position:absolute;inset:0}
.mole svg,.mole img.pic{width:100%;height:100%;overflow:visible;display:block}
.mole .dz{display:none;position:absolute;left:50%;top:-8%;width:52%;height:auto;margin-left:-26%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hole[data-s=up] .mole .body{animation:wob 1.1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hole[data-k=friend] .mole .body{animation:hop .6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.mole .hat{transform-origin:50% 100%}
.hole.dent .hat{transform:translate(14px,-46px) rotate(38deg);opacity:0;transition:transform .35s ease-out,opacity .35s}
.face-hit{display:none}
.hole[data-s=hit] .face-ok{display:none}.hole[data-s=hit] .face-hit{display:inline}
.fur{fill:url(#furG)}.gold .fur{fill:url(#furGold)}
.hole.ping .clip{animation:ping .18s ease-out}
@keyframes ping{50%{transform:scale(1.08,.94)}}
.hole .puff{position:absolute;left:50%;bottom:8%;width:60%;margin-left:-30%;pointer-events:none;opacity:0}
.hole.miss .puff{animation:puff .4s ease-out}
@keyframes puff{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.4) translateY(-8px)}}
#hammer{position:fixed;left:0;top:0;width:112px;height:112px;z-index:40;pointer-events:none;opacity:0;transform-origin:88% 90%;will-change:transform,opacity}

/* ---------- ready banner ---------- */
#ready{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none}
#ready.on{display:flex}
#ready .card{background:#fff;border-radius:30px;padding:16px 26px;text-align:center;box-shadow:0 8px 0 rgba(90,50,160,.3),0 20px 30px rgba(0,0,0,.3);animation:kkPanel .4s cubic-bezier(.2,1.4,.4,1)}
#ready h2{margin:0;font-size:36px;color:var(--kk-ink)}
#ready .g{display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:700;color:#e0651a}
#ready .g img{width:56px;height:56px}
#ready .w{font-size:18px;font-weight:600;color:var(--kk-ink2);margin-top:2px}
#titleHero{position:relative;width:min(80vw,300px);height:210px;margin:6px 0}
#titleHero .hole{position:absolute;left:50%;bottom:0;--cw:210px;margin-left:-105px}
#titleHero .hole .mole{transform:translate(-50%,0);animation:peek 2.6s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translate(-50%,10%)}45%,60%{transform:translate(-50%,-6%)}}
#titleHero .tools{position:absolute;right:-6px;top:-4px;width:100px;height:100px;transform:rotate(14deg);animation:kkBob 2.6s ease-in-out infinite}
#titleHero .st{position:absolute;width:44px;height:44px;animation:kkBob 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#scene .cloud,#scene .stars,.fly,#decor .fl,#decor .bf,.hole[data-s=up] .mole .body,.hole[data-k=friend] .mole .body,#titleHero .hole .mole,#titleHero .tools,#titleHero .st{animation:none}}
</style>
</head>
<body class="kk">
<!-- shared gradients for the mole drawings -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="furG" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#b98460"/><stop offset=".55" stop-color="#7d5238"/><stop offset="1" stop-color="#4f3121"/></radialGradient>
  <radialGradient id="furGold" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#fff0a3"/><stop offset=".55" stop-color="#f6c53a"/><stop offset="1" stop-color="#c98a0b"/></radialGradient>
  <linearGradient id="hatG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f5a800"/></linearGradient>
  <radialGradient id="snoutG" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#e4b99a"/><stop offset="1" stop-color="#c08e6c"/></radialGradient>
  <linearGradient id="dirtG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--dirt1,#a9744a)"/><stop offset="1" stop-color="var(--dirt2,#6e4527)"/></linearGradient>
  <linearGradient id="rimF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4915f"/><stop offset=".5" stop-color="#a06c40"/><stop offset="1" stop-color="#6b4226"/></linearGradient>

<div id="scene" class="w0">
  <div class="stars"></div>
  <img class="sun" src="assets/kids/fx/sun.webp" alt="">
  <img class="moon" src="assets/kids/fx/full-moon.webp" alt="">

  <div class="ground"></div>

</div>
<div id="field"><div id="grid"></div></div>
<img id="hammer" src="assets/kids/fx/hammer.webp" alt="">
<div id="ready"><div class="card"><h2 id="rdT"></h2><div class="g"><img id="rdI" src="assets/kids/fx/hammer.webp" alt=""><span id="rdN"></span></div><div class="w" id="rdW"></div></div></div>

<script>
(function () {
'use strict';
var KKs = window.KK, SDK = window.ArcadeSDK || null, h = KKs.h, img = KKs.img;
var $ = function (id) { return document.getElementById(id); };
var IMG = function (n) { return KKs.imgUrl(n); };

/* ======================= what you can collect ======================= */
var HAMMERS = [
  { id: 'hammer', img: 'hammer', name: 'Wooden mallet', need: 0 }, { id: 'carrot', img: 'carrot', name: 'Carrot', need: 4 },
  { id: 'banana', img: 'banana', name: 'Banana', need: 9 }, { id: 'magic-wand', img: 'magic-wand', name: 'Magic wand', need: 15 },
  { id: 'teddy-bear', img: 'teddy-bear', name: 'Squeaky bear', need: 22 }, { id: 'baguette-bread', img: 'baguette-bread', name: 'Baguette', need: 30 }];
var PALS = [
  { id: 'seedling', img: 'seedling', name: 'Seedling', need: 1, x: 8, y: 97 }, { id: 'tulip', img: 'tulip', name: 'Tulip', need: 3, x: 92, y: 96 },
  { id: 'sunflower', img: 'sunflower', name: 'Sunflower', need: 5, x: 20, y: 99 }, { id: 'butterfly', img: 'butterfly', name: 'Butterfly', need: 7, x: 74, y: 40, bf: 1 },
  { id: 'lady-beetle', img: 'lady-beetle', name: 'Ladybird', need: 10, x: 84, y: 90 }, { id: 'honeybee', img: 'honeybee', name: 'Honey bee', need: 12, x: 30, y: 44, bf: 1 },
  { id: 'snail', img: 'snail', name: 'Snail', need: 14, x: 60, y: 99 }, { id: 'hibiscus', img: 'hibiscus', name: 'Flower', need: 17, x: 4, y: 90 },
  { id: 'mushroom', img: 'mushroom', name: 'Mushroom', need: 20, x: 46, y: 98 }, { id: 'hedgehog', img: 'hedgehog', name: 'Hedgehog', need: 24, x: 96, y: 99 },
  { id: 'rainbow', img: 'rainbow', name: 'Rainbow', need: 28, x: 50, y: 32, rb: 1 }, { id: 'four-leaf-clover', img: 'four-leaf-clover', name: 'Lucky clover', need: 33, x: 34, y: 96 }];
var ALBUM = HAMMERS.concat(PALS);
var P = KKs.profile('whack_kk', { album: ALBUM, dailyGoal: 3, dailyBonus: 3 });
var WORLDS = ['Sunny Garden', 'Sunset Farm', 'Moonlight Meadow'];
var NLEV = 15;

/* ======================= levels: pure numbers, tested offline ======================= */
//<sched>
function levelCfg(n) {
  var world = n <= 5 ? 0 : n <= 10 ? 1 : 2, boss = n % 5 === 0;
  return {
    n: n, world: world, boss: boss,
    holes: n <= 2 ? 4 : n <= 6 ? 6 : 9, cols: n <= 2 ? 2 : 3,
    time: n <= 2 ? 25 : 30,
    stay: Math.max(760, Math.round(1560 - n * 52)),      // ms a mole stays up
    gap: Math.max(380, Math.round(860 - n * 30)),        // ms between pop-ups
    maxUp: n <= 2 ? 1 : n <= 6 ? 2 : 3,
    friend: n < 3 ? 0 : Math.min(0.2, 0.07 + (n - 3) * 0.011),
    helmet: n < 4 ? 0 : Math.min(0.28, 0.1 + (n - 4) * 0.018),
    gold: n >= 2, kingHp: boss ? 2 + n / 5 : 0
  };
}
function Sched(cfg, rnd) {
  this.c = cfg; this.rnd = rnd || Math.random; this.t = 0; this.next = 500; this.moles = []; this.spawned = 0; this.goldAt = cfg.gold ? (0.3 + this.rnd() * 0.4) * cfg.time * 1000 : -1; this.kingAt = cfg.boss ? cfg.time * 1000 * 0.3 : -1; this.last = -1; this.events = [];
}
Sched.prototype.free = function () {
  var used = {}, i, out = []; this.moles.forEach(function (m) { used[m.h] = 1; });
  for (i = 0; i < this.c.holes; i++) if (!used[i] && i !== this.last) out.push(i);
  return out;
};
Sched.prototype.active = function () { return this.moles.filter(function (m) { return m.st === 'rise' || m.st === 'up'; }).length; };
Sched.prototype.spawn = function (kind, forceHole, stay) {
  var f = this.free(); if (forceHole != null) f = [forceHole]; if (!f.length) return null;
  var hIdx = f[Math.floor(this.rnd() * f.length)], c = this.c;
  var m = { h: hIdx, k: kind, st: 'rise', age: 0, stay: stay || c.stay * (0.85 + this.rnd() * 0.3), hp: kind === 'helmet' ? 2 : kind === 'king' ? c.kingHp : 1 };
  if (kind === 'gold') m.stay = c.stay * 1.25;
  if (kind === 'king') m.stay = Math.max(2600, c.stay * 2.6);
  this.moles.push(m); this.last = hIdx; if (kind !== 'friend') this.spawned++; this.events.push({ e: 'spawn', m: m }); return m;
};
Sched.prototype.update = function (dtMs, hold) {
  var c = this.c, self = this;
  this.t += dtMs;
  this.moles.forEach(function (m) {
    m.age += dtMs;
    if (m.st === 'rise' && m.age >= 160) { m.st = 'up'; m.age = 0; }
    else if (m.st === 'up' && m.age >= m.stay && !m.hold) { m.st = 'sink'; m.age = 0; self.events.push({ e: 'escape', m: m }); }
    else if (m.st === 'hit' && m.age >= 340) { m.st = 'sink'; m.age = 0; }
    else if (m.st === 'sink' && m.age >= 240) { m.st = 'gone'; self.events.push({ e: 'gone', m: m }); }
  });
  this.moles = this.moles.filter(function (m) { return m.st !== 'gone'; });
  if (hold) return;
  if (this.goldAt >= 0 && this.t >= this.goldAt && this.free().length) { if (this.spawn('gold')) this.goldAt = -1; }
  if (this.kingAt >= 0 && this.t >= this.kingAt && this.free().length) { var f = this.free(), ctr = Math.floor(c.holes / 2), hx = f.indexOf(ctr) >= 0 ? ctr : f[0]; if (this.spawn('king', hx)) this.kingAt = this.kingAt + c.time * 1000 * 0.4; }
  this.next -= dtMs;
  if (this.next <= 0 && this.active() < c.maxUp) {
    var r = this.rnd(), kind = r < c.friend ? 'friend' : r < c.friend + c.helmet ? 'helmet' : 'mole';
    if (this.spawn(kind)) this.next = c.gap * (0.7 + this.rnd() * 0.6);
    else this.next = 120;
  } else if (this.next <= 0) this.next = 60;
};
// goals: what fraction of the moles that pop up a player must whack (35 / 55 / 75 %), from a run with nobody playing
function goalsFor(cfg) {
  var tot = 0, RUNS = 24, seed = 12345;
  function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  for (var r = 0; r < RUNS; r++) { var s = new Sched(cfg, rng); for (var t = 0; t < cfg.time * 1000; t += 16) { s.update(16, false); s.events.length = 0; } tot += s.spawned; }
  var e = tot / RUNS, g1 = Math.max(3, Math.round(e * 0.32)), g2 = Math.max(g1 + 1, Math.round(e * 0.5)), g3 = Math.max(g2 + 1, Math.round(e * 0.68));
  return [g1, g2, g3];
}
//</sched>
var LV = [];
for (var i = 1; i <= NLEV; i++) { var lc = levelCfg(i); lc.goals = goalsFor(lc); LV.push(lc); }

/* ======================= drawing ======================= */
function moleSVG(kind) {
  var hat = kind === 'helmet' ? '<g class="hat"><path d="M14 40 Q14 8 50 8 Q86 8 86 40Z" fill="url(#hatG)" stroke="#c98500" stroke-width="1.6"/><rect x="8" y="37" width="84" height="8" rx="4" fill="#f5a800" stroke="#c98500" stroke-width="1.4"/><rect x="43" y="3" width="14" height="12" rx="4" fill="#ffd54a" stroke="#c98500" stroke-width="1.4"/><path d="M26 30 Q30 16 44 13" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".7"/></g>' : '';
  var nose = ''; for (var i = 0; i < 8; i++) nose += '<ellipse cx="50" cy="45" rx="2.7" ry="5.2" transform="rotate(' + (i * 45) + ' 50 52)" fill="#ff9dbb"/>';
  return '<svg viewBox="0 0 100 110" aria-hidden="true">' +
    '<path class="fur" d="M12 112 C10 80 26 62 50 62 C74 62 90 80 88 112Z"/>' +
    '<ellipse cx="50" cy="100" rx="21" ry="17" fill="#e9c9ae" opacity=".55"/>' +
    '<circle cx="17" cy="35" r="7" class="fur"/><circle cx="83" cy="35" r="7" class="fur"/><circle cx="17" cy="35" r="3.2" fill="#e58aa0"/><circle cx="83" cy="35" r="3.2" fill="#e58aa0"/>' +
    '<ellipse cx="50" cy="47" rx="37" ry="34" class="fur"/>' +
    '<ellipse cx="50" cy="60" rx="21" ry="15" fill="url(#snoutG)"/>' +
    nose + '<circle cx="50" cy="52" r="6.5" fill="#ff86ab" stroke="#e05a8a" stroke-width="1.2"/><circle cx="48" cy="50" r="2" fill="#fff" opacity=".7"/>' +

        if (stars > 0) SDK.profile.award({ xp: 5 + stars * 3, reason: 'Level ' + cur });
        if (P.stat('whacks', 0) > 0) SDK.profile.achievement('first-whack', { title: 'First whack', desc: 'Whack a mole', tier: 'bronze' });
        if (stars === 3) SDK.profile.achievement('three-stars', { title: 'Triple star', desc: 'Earn three stars on a level', tier: 'silver' });
        if (stars > 0 && cfg.boss) SDK.profile.achievement('boss-' + cur, { title: 'Boss whacked', desc: 'Beat a boss level', tier: 'gold' });
        SDK.profile.quest('whack-stars', Math.min(1, P.total() / 45), { title: 'Collect 45 stars' });
      }
    } catch (e) {}
  }
  gs('over', { score: points, level: cur, stars: stars });
  KKs.sfx(stars > 0 ? 'win' : 'oops'); if (stars > 0) KKs.confetti();
  setTimeout(function () { showResult(stars, res, daily); }, 750);
}
function showResult(stars, res, daily) {
  var lines = ['Whacked ' + whacks + '   Goal ' + cfg.goals[0]];
  if (cheated) lines.push('Codes are on, so this level does not count.');
  else if (res.newBest && points > 0 && !res.first) lines.push('New best score!');
  if (daily && daily.just) lines.push('Daily goal done! +3 stars');
  var btn = [];
  var nextN = Math.min(NLEV, cur + 1), more = stars > 0 && cur < NLEV;
  if (more) btn.push({ label: 'Next level', cls: 'kk-go kk-big', pic: 'star', fn: function () { startLevel(nextN, { quick: true }); } });
  btn.push({ label: stars > 0 ? 'Play again' : 'Try again', cls: stars > 0 ? 'kk-blue' : 'kk-go kk-big', fn: function () { startLevel(cur, { quick: true }); } });
  btn.push({ label: 'Levels', cls: 'kk-purple', fn: showMap });
  if (stars > 0 && cur === NLEV) lines.push('You beat all 15 levels!');
  KKs.ui.result({ title: stars === 3 ? 'Perfect!' : stars > 0 ? 'Great job!' : 'So close!', ribbon: cfg.boss && stars > 0 ? 'Boss beaten!' : null, stars: stars, lines: lines, newItems: res.unlocked, buttons: btn });
  if (res.unlocked && res.unlocked.length) { P.d.seen.albumN = P.d.seen.albumN || 0; }
  if (stars > 0) KKs.sfx('star');
}

/* ======================= arcade hooks ======================= */
var CODES = { BIGHAMMER: 'Big hammer: a whack also hits the moles next door', EXTRATIME: 'Extra time: rounds last 15 seconds longer', SLOWMOLES: 'Slow moles: they stay up much longer' };
function code(c) {
  c = String(c || '').toUpperCase(); if (!CODES[c]) return { ok: false };
  if (c === 'BIGHAMMER') cheats.big = true; if (c === 'EXTRATIME') { cheats.extra = true; if (state === 'play') timeLeft += 15; } if (c === 'SLOWMOLES') cheats.slow = true;
  cheated = true; $('codes').style.display = 'block'; return { ok: true, message: CODES[c] };
}
function restartAll() { startLevel(cur, { quick: true }); }
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: restartAll, onExit: showTitle, onTutorial: function () { P.flag('tutMole', false); startLevel(1, { quick: true }); }, onHint: function () { return hintTxt; }, onCheat: code, cheats: [{ code: 'BIGHAMMER', effect: CODES.BIGHAMMER }, { code: 'EXTRATIME', effect: CODES.EXTRATIME }, { code: 'SLOWMOLES', effect: CODES.SLOWMOLES }] });
KKs.ui.topbar({ back: true });
KKs.preload(['star', 'hammer', 'rabbit-face', 'front-facing-baby-chick', 'crown', 'dizzy']);
// a friend teaches itself on the first level that has friends
var _spawn = Sched.prototype.spawn;
document.addEventListener('DOMContentLoaded', function () {});
setInterval(function () { if (state === 'play' && cfg && cfg.friend > 0 && !P.flag('tutFriend') && !tut && S && S.active() === 0) startFriendCoach(); }, 700);
// test hooks for the QA scripts
window.__whack = { get state() { return state; }, get cfg() { return cfg; }, get whacks() { return whacks; }, get S() { return S; }, LV: LV, P: P, start: startLevel, tap: tapHole, get timeLeft() { return timeLeft; } };
showTitle();
})();
</script>
