  clearUI(); cur = Math.max(1, Math.min(NLEV, n | 0)); cfg = LV[cur - 1]; state = 'play'; clean = 0; helped = 0; wi = 0; pts = 0; newWords = [];
  cheated = !!(SDK && SDK.cheated); list = pickWords(cfg.words, cfg.len); lastWords = list.map(function (w) { return w[0]; });
  document.body.style.background = '#2a1a0c'; $('hud').classList.add('on'); $('board').classList.remove('kk-hide'); $('tools').classList.remove('kk-hide'); $('codes').style.display = cheated ? 'block' : 'none';
  var d = $('dots'); d.innerHTML = ''; list.forEach(function () { d.appendChild(h('i')); }); chLv.set('Level ' + cur); chLv.el.querySelector('img').src = IMG(cfg.len <= 4 ? 'pencil' : cfg.len <= 6 ? 'open-book' : 'graduation-cap');
  gs('play', { score: 0, level: cur }); P.touchDay(); if (LP) LP.session(); KKs.sfx('level'); buildWord();
  if (cur === 1 && !P.flag('tutWs')) setTimeout(startTutorial, 900);
}
function win() {
  state = 'over'; var stars = clean >= 4 ? 3 : clean >= 2 ? 2 : 1, score = pts, res = { unlocked: [], first: false }, daily = null; lock = true;
  if (!cheated) {
    res = P.finish(cur, stars, score); daily = P.dailyWin();
    try { localStorage.setItem('ws_best', String(P.d.hi || score)); } catch (e) {}
    try { if (SDK && SDK.profile) { SDK.profile.award({ xp: 5 + stars * 3, reason: 'Level ' + cur }); SDK.profile.achievement('first-word', { title: 'First word', desc: 'Spell a word', tier: 'bronze' }); if (stars === 3) SDK.profile.achievement('speller', { title: 'Super speller', desc: 'Three stars on a level', tier: 'silver' }); if (foundCount() >= 40) SDK.profile.achievement('word-collector', { title: 'Word collector', desc: 'Spell 40 words', tier: 'gold' }); SDK.profile.quest('ws-words', Math.min(1, foundCount() / 100), { title: 'Spell 100 different words' }); } } catch (e) {}
  }
  gs('over', { score: score, level: cur, stars: stars }); KKs.sfx('win'); KKs.confetti();
  setTimeout(function () { showResult(stars, res, daily); }, 700);
}
function foundCount() { return Object.keys(P.d.found).length; }
function showResult(stars, res, daily) {
  var lines = [clean + ' of ' + list.length + ' with no help']; if (newWords.length) lines.push(newWords.length + ' new word' + (newWords.length > 1 ? 's' : '') + ' in your book!'); if (cheated) lines.push('Codes are on, so this level does not count.'); if (daily && daily.just) lines.push('Daily goal done! +3 stars'); if (cur === NLEV) lines.push('You finished every level!');
  var btn = [], more = cur < NLEV; if (more) btn.push({ label: 'Next level', cls: 'kk-go kk-big', pic: 'star', fn: function () { startLevel(cur + 1); } });
  btn.push({ label: 'Play again', cls: more ? 'kk-blue' : 'kk-go kk-big', fn: function () { startLevel(cur); } }); btn.push({ label: 'Levels', cls: 'kk-purple', fn: showMap });
  var sc = KKs.ui.result({ title: stars === 3 ? 'Spelling star!' : stars === 2 ? 'Well done!' : 'You did it!', stars: stars, lines: lines, newItems: res.unlocked, buttons: btn });
  var row = h('div', { class: 'kk-row', style: { marginTop: '6px', gap: '2px' } }); list.forEach(function (w) { var i = img(w[1]); i.style.cssText = 'width:44px;height:44px'; row.appendChild(i); }); var p = sc.querySelector('.kk-panel'), ln = p.querySelectorAll('p'); if (ln[0]) ln[0].parentNode.insertBefore(row, ln[0].nextSibling);
  KKs.sfx('star');
}
/* ---------- helpers ---------- */
function clearHintGlow() { tiles.forEach(function (t) { t.el.classList.remove('hintd'); }); }
function hint() {
  if (state !== 'play' || !word) return state === 'title' ? 'Press Play, then spell the picture.' : 'Well done!';
  if (lock) return hintTxt;
  var s = nextEmpty(); if (s < 0) return hintTxt;
  // if a wrong letter sits in the way, send it back first
  for (var i = 0; i < word.w.length; i++) if (filled[i] && filled[i].ch !== word.w[i].toUpperCase()) { var bad = filled[i]; filled[i] = null; bad.slot = -1; moveTo(bad, L.tray[bad.home]); }
  s = nextEmpty(); var want = word.w[s].toUpperCase(), t = tiles.filter(function (q) { return q.slot < 0 && q.ch === want; })[0];
  if (t) { t.el.classList.add('hintd'); setTimeout(function () { t.el.classList.remove('hintd'); }, 2200); }
  return 'The next letter is ' + want + '. It is glowing.';
}
function doHint() {
  if (state !== 'play' || lock) return; hinted = true; var s = nextEmpty(); var msg = hint(); KKs.sfx('good');
  var t = tiles.filter(function (q) { return q.slot < 0 && s >= 0 && q.ch === word.w[s].toUpperCase(); })[0]; if (t) { t.slot = s; filled[s] = t; moveTo(t, L.slot[s]); t.el.classList.remove('hintd'); if (nextEmpty() < 0) check(); }
}
setInterval(function () { if (state === 'play' && !lock && !(SDK && SDK.paused)) { idleT++; if (idleT === 9) hint(); } }, 1000);
function shuffleTray() { if (state !== 'play' || lock) return; var free = tiles.filter(function (t) { return t.slot < 0; }), homes = KKs.shuffle(free.map(function (t) { return t.home; })); free.forEach(function (t, i) { t.home = homes[i]; }); placeAll(); KKs.sfx('whoosh'); }
$('shuf').appendChild(img('shuffle-tracks-button')); $('hintb').appendChild(img('magnifying-glass-tilted-left')); $('say').appendChild(img('speaker-high-volume'));
KKs.press($('shuf'), shuffleTray); KKs.press($('hintb'), doHint); KKs.press($('say'), function () { if (word) KKs.say(word.w, 0.7); });
$('card').addEventListener('pointerdown', function (e) { if (e.target.closest('#say')) return; if (word && state === 'play') KKs.say(word.w, 0.7); }, { passive: true });
document.addEventListener('keydown', function (e) {
  if (state === 'title' && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) { e.preventDefault(); $('playBtn') && $('playBtn').click(); return; }
  if (state !== 'play' || lock) return; var k = e.key;
  if (/^[a-zA-Z]$/.test(k)) { var up = k.toUpperCase(), t = tiles.filter(function (q) { return q.slot < 0 && q.ch === up; })[0]; if (t) tap(t); }
  else if (k === 'Backspace') { for (var i = word.w.length - 1; i >= 0; i--) if (filled[i]) { tap(filled[i]); break; } }
});
function startTutorial() {
  if (state !== 'play' || !tiles.length) return; var s = nextEmpty(); if (s !== 0) return; var t = tiles.filter(function (q) { return q.ch === word.w[0].toUpperCase(); })[0]; if (!t) return;
  var tp = L.tray[t.home]; tut = { co: KKs.ui.coach('Spell it! Tap the letters.', { pic: 'pointer-down', top: '112px', skip: function () { endTut(); P.flag('tutWs', true); } }) };
  tut.fg = h('img', { class: 'kk-finger', src: IMG('pointer'), alt: '', style: { left: (tp.x + 30) + 'px', top: (tp.y + 6) + 'px' } }); document.body.appendChild(tut.fg); P.flag('tutWs', true);
}
function endTut() { if (!tut) return; if (tut.co) tut.co.close(); if (tut.fg) tut.fg.remove(); tut = null; }

/* ======================= screens ======================= */
function clearUI() { document.querySelectorAll('.kk-title,.kk-map,.kk-album,.kk-scrim,.kk-coach,.kk-finger').forEach(function (e) { e.remove(); }); }
function heroEl() {
  var w = h('div', { id: 'titleHero' }), pc = h('div', { class: 'pc' }, [img('cat-face')]); w.appendChild(pc);
  [['C', 30, 120, -8], ['A', 108, 132, 3], ['T', 186, 120, 9]].forEach(function (t, i) { var e = h('div', { class: 'tl', text: t[0] }); e.style.cssText = 'left:' + t[1] + 'px;top:' + t[2] + 'px;transform:rotate(' + t[3] + 'deg);animation-delay:' + (-i * 0.8) + 's;--r:' + t[3] + 'deg'; w.appendChild(e); });
  return w;
}
function showTitle() {
  clearUI(); state = 'title'; word = null; lock = true; $('hud').classList.remove('on'); $('board').classList.add('kk-hide'); $('tools').classList.add('kk-hide'); $('slots').innerHTML = ''; $('tiles').innerHTML = ''; tiles = []; $('codes').style.display = 'none';
  var nxt = P.next(NLEV), fresh = P.cleared() === 0, extra = LP ? [{ cls: 'kk-blue', pic: 'clipboard', label: 'Grown-ups', fn: function () { LP.open(); } }] : [];
  KKs.ui.title(document.body, { title: 'Word Scramble', tagline: fresh ? 'Spell the picture!' : BANDNAMES[LV[nxt - 1].band] + ' - level ' + nxt, heroEl: heroEl(), profile: P, playLabel: fresh ? 'Play' : 'Level ' + nxt, onPlay: function () { startLevel(nxt); },
    onMap: showMap, onAlbum: showAlbum, albumLabel: 'My words', albumPic: 'books', onHelp: showHelp, extraIcons: extra, dot: (P.d.seen.albumN || 0) < foundCount() + P.unlockedIds().length ? '!' : '' });
  gs('title', { score: +localStorage.getItem('ws_best') || 0 });
}
function showMap() { KKs.ui.map(document.body, { profile: P, title: 'Levels', levels: LV.map(function (l) { return { n: l.n, boss: l.boss, banner: (l.n - 1) % 3 === 0 ? BANDNAMES[l.band] : null }; }), onPick: function (n) { startLevel(n); } }); }
function showAlbum() {
  P.d.seen.albumN = foundCount() + P.unlockedIds().length; P.save();
  var secs = ['3', '4', '5', '6', '7'].map(function (b) { return { title: BANDNAMES[b], caption: true, items: WORDS.filter(function (w) { return b === '7' ? w[0].length >= 7 : String(w[0].length) === b; }).map(function (w) { return { id: w[0], img: w[1], name: w[0] }; }), isOpen: function (it) { return !!P.d.found[it.id]; }, lockHint: 'Spell this word to find it!' }; });
  secs.push({ title: 'Letter tiles', slot: 'tiles', def: 'wood', items: TILES }); secs.push({ title: 'Prizes', items: PRIZES });
  KKs.ui.album(document.body, { profile: P, title: 'My words', sections: secs, onEquip: function () {}, onClose: function () { if (state === 'title') showTitle(); } });
  var t = document.querySelector('.kk-title'); if (t) t.remove();
}
function showHelp() { KKs.ui.help({ steps: [{ pic: 'cat-face', text: 'Look at the picture.' }, { pic: 'pointer', text: 'Tap the letters in order.' }, { pic: 'star', text: 'No help, more stars.' }] }); }

/* ======================= arcade hooks ======================= */
if (SDK) SDK.init({ pauseButton: 'tr', pauseKeys: 'p+esc', onRestart: function () { startLevel(cur); }, onExit: showTitle, onTutorial: function () { P.flag('tutWs', false); startLevel(1); }, onHint: hint });
KKs.ui.topbar({ back: true }); KKs.preload(['star', 'pointer', 'party-popper', 'shuffle-tracks-button']);
window.__ws = { get state() { return state; }, get word() { return word; }, get cfg() { return cfg; }, get tiles() { return tiles; }, LV: LV, P: P, start: startLevel, tap: tap, get wi() { return wi; }, WORDS: WORDS };
showTitle();
})();
