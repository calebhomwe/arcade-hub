<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>p298</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:1100px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var res = [], fails = 0;
function chk(n, ok, extra){ if(!ok) fails++; res.push((ok?'PASS ':'FAIL ')+n+(extra!==undefined?' ['+extra+']':'')); }
function sqi(t){ return (8 - parseInt(t[1],10)) * 8 + (t.charCodeAt(0) - 97); }

document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow, d = w.document;
  setTimeout(function(){
    try {
      var AC = w.AudioContext || w.webkitAudioContext;
      var n = { osc: 0, buf: 0 };
      var oO = AC.prototype.createOscillator, oB = AC.prototype.createBufferSource;
      AC.prototype.createOscillator = function(){ n.osc++; return oO.apply(this, arguments); };
      AC.prototype.createBufferSource = function(){ n.buf++; return oB.apply(this, arguments); };

      var slider = d.getElementById('juiceSlider');
      var wrap = d.getElementById('gameWrap');
      function setJuice(v){ slider.value = String(v); slider.dispatchEvent(new w.Event('input', {bubbles:true})); slider.dispatchEvent(new w.Event('change', {bubbles:true})); }
      function capture(){
        w.resetGame(); w.ChessMods.api.setBot(false);
        ['e2e4','d7d5'].forEach(function(t){ w.ChessMods.api.playMove(sqi(t.slice(0,2)), sqi(t.slice(2,4))); });
        var before = wrap.querySelectorAll('*').length;
        n.osc = 0; n.buf = 0;
        w.ChessMods.api.playMove(sqi('e4'), sqi('d5'));   // exd5, a capture
        return { dom: wrap.querySelectorAll('*').length - before, osc: n.osc, buf: n.buf };
      }

      // control: juice at full should produce sound and/or effect DOM
      setJuice(100);
      var hot = capture();
      chk('juice 100 produces audio', hot.osc + hot.buf > 0, 'osc=' + hot.osc + ' noise=' + hot.buf);

      // juice 0 must silence the mod layer entirely
      setJuice(0);
      var cold = capture();
      chk('juice 0 adds no mod overlay DOM', cold.dom <= 0, 'delta=' + cold.dom);
      // Core chess sounds are deliberately independent of the juice slider
      // (juice is visual). Juice 0 must not ADD anything on top of the core.
      chk('juice 0 adds no mod audio on top of the core sound', (cold.osc + cold.buf) <= (hot.osc + hot.buf),
          'cold=' + (cold.osc+cold.buf) + ' hot=' + (hot.osc+hot.buf));
      chk('core move sound still audible at juice 0', (cold.osc + cold.buf) > 0,
          'cold=' + (cold.osc+cold.buf));

      // mute must silence everything at any juice level
      setJuice(100);
      d.getElementById('btnMute').click();
      var muted = capture();
      chk('muted is fully silent at juice 100', muted.osc + muted.buf === 0, 'osc=' + muted.osc + ' noise=' + muted.buf);
      d.getElementById('btnMute').click();

      // and mute persists to localStorage under the shared hub key
      d.getElementById('btnMute').click();
      var stored = null; try { stored = w.localStorage.getItem('gamesMuted'); } catch(e){}
      chk('mute writes the shared gamesMuted key', stored === '1', stored);
      d.getElementById('btnMute').click();

      document.getElementById('out').textContent = res.join('\n');
      document.title = fails===0 ? 'P298PASS:'+res.length : 'P298FAIL:'+fails;
    } catch(e){
      document.getElementById('out').textContent = res.join('\n')+'\nTHREW '+e.message;
      document.title = 'THREW:'+e.message;
    }
  }, 900);
});
</script>
</body></html>
