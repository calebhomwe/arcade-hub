<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>p299</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:1100px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var res = [], fails = 0;
function chk(n, ok, extra){ if(!ok) fails++; res.push((ok?'PASS ':'FAIL ')+n+(extra!==undefined?' ['+extra+']':'')); }
function sqi(t){ return (8 - parseInt(t[1],10)) * 8 + (t.charCodeAt(0) - 97); }

document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow, d = w.document;
  setTimeout(function(){
    try {
      var slider = d.getElementById('juiceSlider');
      slider.value = '100';
      slider.dispatchEvent(new w.Event('input', {bubbles:true}));
      slider.dispatchEvent(new w.Event('change', {bubbles:true}));

      var wrap = d.getElementById('gameWrap');
      var baseline = wrap.querySelectorAll('*').length;

      // hammer the board with a long capture-heavy self-play burst
      w.resetGame(); w.ChessMods.api.setBot(false);
      var seq = 'e2e4 d7d5 e4d5 d8d5 b1c3 d5e5 f1e2 e5g5 c3b5 g5g2 e2f3 g2h1 b5c7 e8d8 c7a8 h1h2';
      var mv = seq.split(' '), played = 0;
      for (var i = 0; i < mv.length; i++) {
        if (w.ChessMods.api.playMove(sqi(mv[i].slice(0,2)), sqi(mv[i].slice(2,4)))) played++;
      }
      var peak = wrap.querySelectorAll('*').length;
      chk('burst actually played moves', played >= 12, played + ' moves');
      chk('overlay DOM stays bounded under a capture burst', peak - baseline < 400, 'delta=' + (peak - baseline));

      // draw() cost with a full effect load
      var t0 = w.performance.now();
      for (var k = 0; k < 60; k++) w.draw();
      var per = (w.performance.now() - t0) / 60;
      res.push('NOTE draw() averaged ' + per.toFixed(3) + 'ms headless - not a real frame-time measure (no compositor)');

      // sprite cache must be reused, not rebuilt every draw
      var reads = 0;
      if (w.pieceSpriteCache !== undefined) {
        chk('sprite cache is reachable', true);
      } else {
        // script-scoped: infer reuse from the second-pass draw cost instead
        var t1 = w.performance.now();
        for (var k2 = 0; k2 < 60; k2++) w.draw();
        var per2 = (w.performance.now() - t1) / 60;
        chk('repeat draws do not get slower (sprite cache holding)', per2 <= Math.max(per * 1.6, per + 0.5),
            'first=' + per.toFixed(3) + 'ms repeat=' + per2.toFixed(3) + 'ms');
      }

      // effects must drain back down rather than leak
      setTimeout(function(){
        var after = wrap.querySelectorAll('*').length;
        chk('overlay DOM drains after effects finish', after - baseline < 60, 'delta=' + (after - baseline));
        document.getElementById('out').textContent = res.join('\n');
        document.title = fails===0 ? 'P299PASS:'+res.length : 'P299FAIL:'+fails;
      }, 3000);
    } catch(e){
      document.getElementById('out').textContent = res.join('\n')+'\nTHREW '+e.message;
      document.title = 'THREW:'+e.message;
    }
  }, 900);
});
</script>
</body></html>
