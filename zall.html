<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>allcases</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:1100px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w=document.getElementById('f').contentWindow;
  setTimeout(function(){
    try{
      var r = w.__chessTest();
      var lines = [], pass = 0, fail = 0, failed = [];
      function walk(o){
        if (!o) return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        if (o.checks) {
          o.checks.forEach(function(c){
            if (c.ok) pass++; else { fail++; failed.push((o.case||'?') + ' :: ' + c.name + ' [' + c.detail + ']'); }
          });
        }
        if (o.cases) walk(o.cases);
        if (typeof o === 'object') for (var k in o) if (o[k] && typeof o[k] === 'object' && k !== 'checks') walk(o[k]);
      }
      walk(r);
      lines.push('pass=' + pass + ' fail=' + fail);
      failed.slice(0,25).forEach(function(f){ lines.push('FAIL ' + f); });
      document.getElementById('out').textContent = lines.join('\n');
      document.title = fail === 0 ? 'ALLCASES:' + pass : 'CASEFAIL:' + fail;
    }catch(e){
      document.getElementById('out').textContent = 'THREW ' + e.message;
      document.title = 'THREW:' + e.message;
    }
  }, 1500);
});
</script>
</body></html>
