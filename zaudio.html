<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audio</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:900px;height:800px;border:0"></iframe>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow;
  setTimeout(function(){
    var res = [], fails = 0;
    try {
      var AC = w.AudioContext || w.webkitAudioContext;
      var counts = { osc: 0, buf: 0 };
      var origOsc = AC.prototype.createOscillator, origBuf = AC.prototype.createBufferSource;
      AC.prototype.createOscillator = function(){ counts.osc++; return origOsc.apply(this, arguments); };
      AC.prototype.createBufferSource = function(){ counts.buf++; return origBuf.apply(this, arguments); };
      var expect = {
        sfxMove:      { osc: 1, buf: 1 },
        sfxCapture:   { osc: 1, buf: 2 },
        sfxCastle:    { osc: 2, buf: 2 },
        sfxCheck:     { osc: 2, buf: 0 },
        sfxPromote:   { osc: 3, buf: 0 },
        sfxCheckmate: { osc: 3, buf: 1 },
        sfxGameStart: { osc: 2, buf: 0 },
        sfxIllegal:   { osc: -1, buf: -1 }
      };
      for (var name in expect) {
        counts.osc = 0; counts.buf = 0;
        w[name]();
        var e = expect[name];
        var ok = (e.osc < 0) ? (counts.osc + counts.buf > 0) : (counts.osc === e.osc && counts.buf === e.buf);
        if (!ok) fails++;
        res.push((ok ? 'PASS ' : 'FAIL ') + name + ' osc=' + counts.osc + '/' + e.osc + ' noise=' + counts.buf + '/' + e.buf);
      }
      // muted must produce silence - toggle via the real button, `muted` is script-scoped
      w.document.getElementById('btnMute').click();
      counts.osc = 0; counts.buf = 0;
      for (var n2 in expect) w[n2]();
      var silent = counts.osc === 0 && counts.buf === 0;
      if (!silent) fails++;
      res.push((silent ? 'PASS ' : 'FAIL ') + 'muted is silent [osc=' + counts.osc + ' noise=' + counts.buf + ']');
      w.document.getElementById('btnMute').click();
      counts.osc = 0; counts.buf = 0;
      w.sfxMove();
      var unmuted = counts.osc + counts.buf > 0;
      if (!unmuted) fails++;
      res.push((unmuted ? 'PASS ' : 'FAIL ') + 'unmute restores sound');

      document.getElementById('out').textContent = res.join('\n');
      document.title = fails === 0 ? 'AUDIOPASS:' + res.length : 'AUDIOFAIL:' + fails;
    } catch(e) {
      document.getElementById('out').textContent = res.join('\n') + '\nTHREW ' + e.message;
      document.title = 'THREW:' + e.message;
    }
  }, 800);
});
</script>
</body></html>
