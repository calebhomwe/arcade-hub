<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>castle</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:1100px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var res = [], fails = 0;
function chk(n, ok, extra){ if(!ok) fails++; res.push((ok?'PASS ':'FAIL ')+n+(extra!==undefined?' ['+extra+']':'')); }
function sqi(t){ return (8 - parseInt(t[1],10)) * 8 + (t.charCodeAt(0) - 97); }

document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow, d = w.document;
  var cv = d.getElementById('board');

  function centerOf(sq){
    var rect = cv.getBoundingClientRect();
    var scaleX = cv.width / rect.width, scaleY = cv.height / rect.height;
    var p = w.ChessMods.api.sqXY(sq);
    return { x: rect.left + p.x / scaleX, y: rect.top + p.y / scaleY };
  }
  function tap(sq, ptype){
    var p = centerOf(sq);
    var opts = {bubbles:true, cancelable:true, clientX:p.x, clientY:p.y, button:0, pointerId:1, pointerType:(ptype||'mouse'), isPrimary:true};
    cv.dispatchEvent(new w.PointerEvent('pointerdown', opts));
    cv.dispatchEvent(new w.PointerEvent('pointerup', opts));
  }
  function drag(from, to){
    var a = centerOf(from), b = centerOf(to);
    var mk = function(t, p){ return new w.PointerEvent(t, {bubbles:true, cancelable:true, clientX:p.x, clientY:p.y, button:0, pointerId:1, pointerType:'mouse', isPrimary:true}); };
    cv.dispatchEvent(mk('pointerdown', a));
    cv.dispatchEvent(mk('pointermove', {x:(a.x+b.x)/2, y:(a.y+b.y)/2}));
    d.dispatchEvent(mk('pointermove', b));
    d.dispatchEvent(mk('pointerup', b));
  }
  function setup(seq){
    w.resetGame();
    w.ChessMods.api.setBot(false);
    var mv = seq.split(' ');
    for (var i=0;i<mv.length;i++) w.ChessMods.api.playMove(sqi(mv[i].slice(0,2)), sqi(mv[i].slice(2,4)));
    w.updateUI(); w.draw();
  }
  function castled(color){
    // white: king g1(62) rook f1(61); black: king g8(6) rook f8(5)
    var K = color==='w' ? 62 : 6, R = color==='w' ? 61 : 5;
    var b = w.ChessMods.api.board;
    return (b[K] & 7) === 1 && (b[R] & 7) === 3;
  }

  setTimeout(function(){
    try {
      var OPEN_W = 'e2e4 e7e5 g1f3 g8f6 f1c4 f8c5';
      var OPEN_B = 'e2e4 e7e5 g1f3 g8f6 f1c4 f8c5 e1g1';

      // 1. white kingside, tap king then target square
      setup(OPEN_W); tap(sqi('e1')); tap(sqi('g1'));
      chk('WHITE O-O by tapping king then g1', castled('w'));

      // 2. white kingside, tap king then the ROOK (chess.com allows this)
      setup(OPEN_W); tap(sqi('e1')); tap(sqi('h1'));
      chk('WHITE O-O by tapping king then rook', castled('w'));

      // 3. white kingside by dragging the king two squares
      setup(OPEN_W); drag(sqi('e1'), sqi('g1'));
      chk('WHITE O-O by dragging king to g1', castled('w'));

      // 4-6. same three for BLACK
      setup(OPEN_B); tap(sqi('e8')); tap(sqi('g8'));
      chk('BLACK O-O by tapping king then g8', castled('b'));

      setup(OPEN_B); tap(sqi('e8')); tap(sqi('h8'));
      chk('BLACK O-O by tapping king then rook', castled('b'));

      setup(OPEN_B); drag(sqi('e8'), sqi('g8'));
      chk('BLACK O-O by dragging king to g8', castled('b'));

      // 9-10. ROOK FIRST (a very common habit)
      setup(OPEN_W); tap(sqi('h1')); tap(sqi('e1'));
      chk('WHITE O-O by tapping rook then king', castled('w'));
      setup(OPEN_W); drag(sqi('h1'), sqi('e1'));
      chk('WHITE O-O by dragging rook onto king', castled('w'));

      setup(OPEN_W); drag(sqi('e1'), sqi('h1'));
      chk('WHITE O-O by dragging king onto rook', castled('w'));
      setup(OPEN_W); tap(sqi('h1')); tap(sqi('g1'));
      chk('WHITE O-O by tapping rook then g1', castled('w'));

      // 11-12. FLIPPED BOARD
      setup(OPEN_W); w.flipBoardForTest ? w.flipBoardForTest() : d.getElementById('btnFlip').click();
      tap(sqi('e1')); tap(sqi('g1'));
      chk('WHITE O-O on a FLIPPED board (tap)', castled('w'));
      d.getElementById('btnFlip').click();
      setup(OPEN_W); d.getElementById('btnFlip').click();
      drag(sqi('e1'), sqi('g1'));
      chk('WHITE O-O on a FLIPPED board (drag)', castled('w'));
      d.getElementById('btnFlip').click();

      // 13. TOUCH tap (phone)
      setup(OPEN_W); tap(sqi('e1'),'touch'); tap(sqi('g1'),'touch');
      chk('WHITE O-O by TOUCH tap', castled('w'));

      // 14. against the bot, which is how it is actually played
      setup(OPEN_W); w.ChessMods.api.setBot(true);
      tap(sqi('e1')); tap(sqi('g1'));
      chk('WHITE O-O with the BOT enabled', castled('w'));
      w.ChessMods.api.setBot(false);

      // 7-8. engine level: does playMove accept the castle directly?
      setup(OPEN_W);
      chk('engine accepts WHITE e1->g1 via API', w.ChessMods.api.playMove(sqi('e1'), sqi('g1')) && castled('w'));
      setup(OPEN_B);
      chk('engine accepts BLACK e8->g8 via API', w.ChessMods.api.playMove(sqi('e8'), sqi('g8')) && castled('b'));

      document.getElementById('out').textContent = res.join('\n');
      document.title = fails===0 ? 'CASTLEPASS:'+res.length : 'CASTLEFAIL:'+fails;
    } catch(e) {
      document.getElementById('out').textContent = res.join('\n')+'\nTHREW '+e.message+'\n'+e.stack;
      document.title = 'THREW:'+e.message;
    }
  }, 900);
});
</script>
</body></html>
