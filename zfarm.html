<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>farm</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/farm-harvest.html" style="width:480px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var res=[],fails=0;
function chk(n,ok,extra){ if(!ok)fails++; res.push((ok?'PASS ':'FAIL ')+n+(extra!==undefined?' ['+extra+']':'')); }
document.getElementById('f').addEventListener('load', function(){
  var w=document.getElementById('f').contentWindow, d=w.document;
  setTimeout(async function(){
    try{
      var src = await (await fetch('games/farm-harvest.html')).text();

      // pass 1: kit loaded and wired
      chk('49 juicekit script tag present', /<script src="kit\/juicekit\.js"><\/script>/.test(src));
      chk('49 Kit global available', typeof w.Kit === 'object' && typeof w.Kit.hit === 'function');
      chk('49 Kit.hit wired to the scoring event', src.indexOf('Kit.hit(c0.x, c0.y, Math.round(val))') >= 0);
      chk('49 Kit.click delegated to every button', src.indexOf('closest("button")') >= 0 && src.indexOf('Kit.click()') >= 0);
      chk('49 Kit.win on farm completion', src.indexOf('Kit.win("FARM COMPLETE!"') >= 0);

      // pass 2: shared mute key, capped FX
      chk('50 adopts the hub gamesMuted key', src.indexOf("localStorage.getItem('gamesMuted')") >= 0);
      chk('50 mirrors mute back to gamesMuted', src.indexOf("localStorage.setItem('gamesMuted'") >= 0);
      chk('50 no private mute key left in the toggles', src.indexOf('state.muted = !state.muted;') < 0,
          src.indexOf('state.muted = !state.muted;'));
      chk('50 FX pool is capped', /FXMAX/.test(src));

      // mute round-trip through the real button
      try { w.localStorage.setItem('gamesMuted','0'); } catch(e){}
      var mb = d.getElementById('muteBtn');
      var pre = null; try { pre = w.localStorage.getItem('gamesMuted'); } catch(e){}
      var iconPre = mb.textContent;
      mb.click();
      var after = null; try { after = w.localStorage.getItem('gamesMuted'); } catch(e){}
      res.push('DIAG pre=' + pre + ' iconPre=' + iconPre + ' iconPost=' + mb.textContent + ' after=' + after);
      chk('50 muting writes gamesMuted=1', after === '1', after);
      d.getElementById('muteBtn').click();
      var back = null; try { back = w.localStorage.getItem('gamesMuted'); } catch(e){}
      chk('50 unmuting writes gamesMuted=0', back === '0', back);

      // pass 3: layered harvest audio
      chk('51 combo layers a bright fifth', src.indexOf('beep(880 + Math.min(comboN, 8) * 55') >= 0);
      chk('51 big pulls get a low body thump', src.indexOf('beep(120, 0.14, "sine"') >= 0);

      // pass 4/5/6: polish, press feedback, hit targets, reduced motion
      chk('52 focus-visible rings defined', src.indexOf('.hub:focus-visible') >= 0);
      chk('53 press-scale on controls', src.indexOf('.btn:active,.iconBtn:active,.crop:active,.buyBtn:active') >= 0);
      chk('53 respects prefers-reduced-motion', src.indexOf('prefers-reduced-motion') >= 0);
      var hub = d.querySelector('.hub');
      chk('54 Hub link >= 44px tall', hub.getBoundingClientRect().height >= 44,
          hub.getBoundingClientRect().height.toFixed(0) + 'px');
      var ib = d.getElementById('muteBtn').getBoundingClientRect();
      chk('54 icon buttons >= 44px', ib.width >= 44 && ib.height >= 44, ib.width.toFixed(0)+'x'+ib.height.toFixed(0));

      // pass 6/7: refusing a plant must be VISIBLE, not just audible
      chk('54 unaffordable plant shakes the plot', src.indexOf('denyShake') >= 0);
      chk('55 unaffordable plant names the cost', src.indexOf('"Need " + fmt(c.cost)') >= 0);
      chk('55 suggests a crop you can actually afford', src.indexOf('you can afford') >= 0);

      // pass 8
      chk('56 new-best flourish wired', src.indexOf('"NEW BEST!"') >= 0);
      chk('56 best earned persists and renders', !!d.getElementById('startBest'));

      // still renders
      chk('game renders plots', d.querySelectorAll('#plotGrid *').length > 0,
          d.querySelectorAll('#plotGrid *').length + ' nodes');

      document.getElementById('out').textContent=res.join('\n');
      document.title = fails===0 ? 'FARMPASS:'+res.length : 'FARMFAIL:'+fails;
    }catch(e){
      document.getElementById('out').textContent=res.join('\n')+'\nTHREW '+e.message;
      document.title='THREW:'+e.message;
    }
  },900);
});
</script>
</body></html>
