<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>san</title></head>
<body style="margin:0;background:#111;color:#eee;font:12px monospace">
<iframe id="f" src="games/chess.html" style="width:1100px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var CASES = [
  { name: 'Scholar (mate)', uci: 'e2e4 e7e5 d1h5 b8c6 f1c4 g8f6 h5f7', want: '1.e4 e5 2.Qh5 Nc6 3.Bc4 Nf6 4.Qxf7#' },
  { name: 'Castling', uci: 'e2e4 e7e5 g1f3 g8f6 f1c4 f8c5 e1g1 e8g8', want: '1.e4 e5 2.Nf3 Nf6 3.Bc4 Bc5 4.O-O O-O' },
  { name: 'Pawn capture + check', uci: 'e2e4 d7d5 e4d5 d8d5 b1c3 d5e5', want: '1.e4 d5 2.exd5 Qxd5 3.Nc3 Qe5+' },
  { name: 'Knight disambiguation', uci: 'g1f3 e7e5 b1c3 d7d5 f3e5 g8f6 c3d5 f6d5', want: '1.Nf3 e5 2.Nc3 d5 3.Nxe5 Nf6 4.Nxd5 Nxd5' }
];
function sq(t){ return (8 - parseInt(t[1],10)) * 8 + (t.charCodeAt(0) - 97); }
document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow, d = w.document;
  setTimeout(function(){
    var res = [], fails = 0;
    try {
      for (var c = 0; c < CASES.length; c++) {
        w.resetGame(); w.botEnabled = false;
        var seq = CASES[c].uci.split(' '), ok = true;
        for (var i = 0; i < seq.length; i++) {
          if (!w.ChessMods.api.playMove(sq(seq[i].slice(0,2)), sq(seq[i].slice(2,4)))) { ok = false; res.push('ILLEGAL ' + CASES[c].name + ' @' + seq[i]); fails++; break; }
        }
        if (!ok) continue;
        w.updateUI();
        var rows = d.querySelectorAll('#moveList .ml-row'), got = [];
        for (var r = 0; r < rows.length; r++) {
          var sp = rows[r].querySelectorAll('span');
          got.push(sp[0].textContent + sp[1].textContent + (sp[2].textContent ? ' ' + sp[2].textContent : ''));
        }
        var g = got.join(' ');
        var pass = g === CASES[c].want;
        if (!pass) fails++;
        res.push((pass ? 'PASS ' : 'FAIL ') + CASES[c].name + '\n   got  ' + g + (pass ? '' : '\n   want ' + CASES[c].want));
      }
      document.getElementById('out').textContent = res.join('\n');
      document.title = fails === 0 ? 'SANPASS:' + CASES.length : 'SANFAIL:' + fails;
    } catch(e) { document.getElementById('out').textContent = res.join('\n') + '\nTHREW ' + e.message; document.title = 'THREW:' + e.message; }
  }, 800);
});
</script>
</body></html>
