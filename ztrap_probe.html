<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>trapprobe</title></head>
<body style="margin:0;background:#111;color:#eee;font:13px monospace">
<iframe id="f" src="games/chess.html" style="width:480px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow;
  setTimeout(function(){
    try {
      var res = w.__trapCheck();
      var bad = res.filter(function(r){ return r.played !== r.total; });
      document.getElementById('out').textContent = JSON.stringify(res, null, 1);
      document.title = bad.length === 0 ? 'ALLGOOD:' + res.length : 'BAD:' + bad.map(function(b){ return b.name + '@' + b.bad + '(' + b.played + '/' + b.total + ')'; }).join(';');
    } catch(e) { document.title = 'ERR:' + e.message; }
  }, 600);
});
</script>
</body></html>
